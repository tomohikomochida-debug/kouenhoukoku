<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="要点まとめ">
<meta name="theme-color" content="#214A37">
<title>要点まとめ｜庭乃持田園</title>
<style>
:root{
  --paper:#F6F5F0; --card:#FFFFFF; --leaf:#214A37; --leaf-soft:#E5EDE7; --ok:#2E7D55;
  --tape:#C77C30; --bark:#5B5750; --ink:#22231F; --line:#DCD9D0; --field:#FBFAF6; --danger:#B0533F;
  --radius:10px; --shadow:0 1px 0 rgba(34,35,31,.04), 0 8px 24px -16px rgba(34,35,31,.25);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif;-webkit-text-size-adjust:100%;line-height:1.6}
header{background:var(--leaf);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:20;padding-top:calc(12px + env(safe-area-inset-top))}
header .row{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;letter-spacing:.04em}
header .me{font-size:13px;background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:999px;padding:5px 12px;font-family:inherit}
.home-btn{display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;color:#fff;text-decoration:none;font-size:13px;font-weight:700;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);border-radius:999px;padding:5px 11px 5px 9px;white-space:nowrap;line-height:1.2}
.home-btn .hb-ic{font-size:15px;line-height:1}
@media (max-width:400px){ .home-btn{padding:5px 8px} .home-btn .hb-t{display:none} }
.info-bar{background:var(--tape);color:#fff;font-size:12.5px;text-align:center;padding:5px 12px}
.error-banner{display:none;background:var(--danger);color:#fff;padding:10px 16px;font-size:13px}
main{max-width:680px;margin:0 auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom))}
#result{scroll-margin-top:72px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:2px 0 8px;color:var(--leaf)}
.hint{font-size:12.5px;color:var(--bark);margin:4px 0 0}
.sec{font-size:13px;font-weight:700;color:var(--bark);margin:14px 0 6px}
.sec:first-child{margin-top:0}
textarea,input[type=text]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink)}
textarea{min-height:120px;resize:vertical;line-height:1.7}
textarea:focus,input:focus{outline:2px solid var(--leaf);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:15px;font-weight:700;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;min-height:46px;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;color:var(--ink);font-family:inherit}
.chip.on{background:var(--leaf-soft);border-color:var(--leaf);color:var(--leaf);font-weight:700}
.tag{display:inline-block;font-size:11.5px;border-radius:6px;padding:1px 7px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.tag.loc{background:var(--leaf-soft);color:var(--leaf)}
.tag.out{background:#FFF3D6;color:#7A5B12}
.tag.none{background:#EEE;color:var(--bark)}
/* 話す */
.mic-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0 4px}
.mic{width:116px;height:116px;border-radius:50%;border:0;background:var(--tape);color:#fff;font-size:44px;cursor:pointer;box-shadow:0 10px 24px -10px rgba(0,0,0,.45);font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.mic small{font-size:13px;font-weight:700;margin-top:6px}
.mic.rec{background:var(--danger);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(176,83,63,.45)}50%{box-shadow:0 0 0 16px rgba(176,83,63,0)}}
.mic-status{font-size:13px;color:var(--bark);min-height:20px;text-align:center}
.interim{color:var(--bark);font-size:14px;min-height:0;white-space:pre-wrap}
.guide{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.guide div{background:var(--field);border:1px dashed var(--line);border-radius:8px;padding:6px 9px;font-size:13px;color:var(--bark)}
.guide b{color:var(--ink)}
/* 結果 */
.res-head{display:flex;align-items:flex-start;gap:8px}
.kind{flex:none;font-size:12.5px;font-weight:700;border-radius:6px;padding:2px 8px;margin-top:3px;background:var(--leaf-soft);color:var(--leaf)}
.kind.k-困りごと{background:#F6DCDC;color:#9A3A3A}
.kind.k-お願い{background:#FFF3D6;color:#7A5B12}
.kind.k-相談{background:#E8ECF4;color:#3D4B66}
.headline{font-size:19px;font-weight:700;line-height:1.45}
ol.points{margin:6px 0 0;padding-left:22px}
ol.points li{margin:4px 0;font-size:15.5px}
dl.facts{display:grid;grid-template-columns:64px 1fr;gap:5px 8px;margin:0;font-size:14.5px}
dl.facts dt{color:var(--bark);font-size:13px;padding-top:1px}
dl.facts dd{margin:0}
.need{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.need:last-child{border-bottom:0}
.need .grow{flex:1;min-width:0}
.need .nm{font-weight:700}
.need .sub{font-size:12.5px;color:var(--bark)}
.missing{background:#FFF7E6;border:1px solid #F0DDB0;border-radius:10px;padding:10px 12px}
.missing h3{margin:0 0 6px;font-size:14px;color:#6B5212}
.q{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed #EAD7A6}
.q:first-of-type{border-top:0}
.q .t{flex:1;font-size:15px}
.word{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--field);border-radius:8px;padding:4px 9px;font-size:13.5px;margin:0 6px 6px 0;cursor:pointer;font-family:inherit;color:var(--ink)}
.word s{color:var(--bark)}
.fix{font-size:12.5px;color:var(--bark);margin-top:6px}
.res-head .edit{flex:none;margin-left:auto}
.ed-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.ed-row input{flex:1;min-width:0}
.card.editing{border-color:var(--leaf);outline:2px solid var(--leaf-soft)}
.card.editing input[type=date]{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);width:100%}
.card.editing dl.facts{grid-template-columns:52px 1fr;align-items:center}
.ed-kinds{display:flex;flex-wrap:wrap;gap:6px}
.msg{min-height:140px}
.route{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.route:last-child{border-bottom:0}
.route .ic{font-size:22px;line-height:1.2;flex:none}
.route .grow{flex:1;min-width:0}
.route .to{font-size:12px;font-weight:700;color:var(--bark)}
.route .what{font-weight:700;font-size:15px}
.route .acts{display:flex;flex-direction:column;gap:6px;align-items:stretch;flex:none}
.route .mini{border:1px solid var(--line);background:var(--field);border-radius:8px;font:inherit;font-size:12.5px;padding:3px 8px;cursor:pointer;color:var(--ink)}
.r-add{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.fl{display:block;font-size:13px;font-weight:700;color:var(--bark);margin:12px 0 4px}
.modal input[type=date]{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);width:100%}
.modal textarea.sm{min-height:76px}
.route .sub{font-size:13px;color:var(--bark)}
.route .btn{flex:none}
.route.done .btn{background:var(--leaf-soft);color:var(--leaf);border-color:var(--leaf-soft)}
.route{flex-wrap:wrap}
.route .rdate{width:auto;flex:none;font-size:14px;padding:6px 8px}
/* 履歴 */
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;border:0;background:var(--card);font:inherit;font-size:14px;padding:8px 0;cursor:pointer;color:var(--bark)}
.seg button.on{background:var(--leaf);color:#fff;font-weight:700}
.memo{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px;cursor:pointer;box-shadow:var(--shadow)}
.memo .mt{font-size:12.5px;color:var(--bark);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.memo .hl{font-size:16px;font-weight:700;margin-top:3px}
.memo.unread{border-left:5px solid var(--tape)}
.raw{font-size:13px;color:var(--bark);white-space:pre-wrap;background:var(--field);border-radius:8px;padding:10px}
.st{font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px}
.st.wait{background:#FFF3D6;color:#7A5B12}
.st.rep{background:#E8ECF4;color:#3D4B66}
.st.done{background:var(--leaf-soft);color:var(--leaf)}
.st.new{background:var(--danger);color:#fff}
.reply{background:#F1F4F8;border:1px solid #D5DDE8;border-radius:10px;padding:9px 11px;margin-top:8px}
.reply .who{font-size:12px;color:var(--bark);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.reply .tx{white-space:pre-wrap;font-size:15px;margin-top:2px}
.reply .act{font-size:12.5px;margin-top:4px;color:var(--leaf)}
.reply .act.ng{color:var(--danger)}
.reply.held{border-style:dashed;opacity:.8}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.actrow{display:flex;gap:8px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.actrow input[type=checkbox]{width:22px;height:22px;margin-top:2px;flex:none}
.actrow .grow{flex:1;min-width:0}
.actrow textarea{min-height:60px;font-size:15px;margin-top:4px}
.night{background:#EEF0F6;border:1px solid #D5DAE8;border-radius:8px;padding:8px 10px;font-size:13.5px;margin-top:10px;display:flex;gap:8px;align-items:center}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:680px;margin:0 auto;display:flex}
nav.tabs button{flex:1;border:0;background:none;font:inherit;font-size:11.5px;color:var(--bark);padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button .ic{font-size:21px;line-height:1.1}
nav.tabs button.on{color:var(--leaf);font-weight:700}
.badge{background:var(--danger);color:#fff;border-radius:999px;font-size:10.5px;padding:0 6px;margin-left:3px;vertical-align:2px}
.modal-bg{position:fixed;inset:0;background:rgba(34,35,31,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:var(--paper);width:100%;max-width:680px;max-height:94vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.modal h3{margin:0 0 6px;font-size:18px;color:var(--leaf)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.loading{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{color:var(--bark);text-align:center;padding:18px 10px;font-size:14px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>/* 前回の内容を出して、裏で最新を読んでいるあいだ、上に細い線を流す */html.syncing body::before{content:'';position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:3px;z-index:99999;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,196,64,.95),transparent) no-repeat;background-size:35% 100%;animation:appsync 1.1s ease-in-out infinite}@keyframes appsync{0%{background-position:-50% 0}100%{background-position:150% 0}}</style>
</head>
<body>
<div class="error-banner" id="errBanner"></div>
<header><div class="row"><a class="home-btn" href="index.html" title="アプリ一覧にもどる" aria-label="アプリ一覧（ホーム）にもどる"><span class="hb-ic">🏠</span><span class="hb-t">ホーム</span></a><h1>🗣 要点まとめ</h1><button class="me" id="meBtn" type="button">名前を選ぶ</button></div></header>
<div class="info-bar" id="infoBar" hidden></div>

<main>
  <section id="tab-speak">
    <div class="card">
      <div class="sec">だれに伝える？</div>
      <div class="chips" id="toChips"></div>

      <div class="mic-wrap" style="margin-top:14px">
        <button class="mic" id="micBtn" type="button" aria-label="話す"><span>🎤</span><small id="micLabel">話す</small></button>
        <div class="mic-status" id="micStatus">まとまらなくて大丈夫。思いついた順に、ぜんぶ話してください</div>
      </div>
      <div class="interim" id="interim"></div>

      <div class="sec">話した内容（直してもOK）</div>
      <textarea id="raw" placeholder="例：えーと、明日の上作延のやつなんですけど、ブロワーがなんか調子悪くて、あの、エンジンかかんないんで、2トンに積むやつ、別のがあれば…あと土のう袋も足りないかもです"></textarea>
      <div class="guide" aria-label="話すきっかけ">
        <div><b>なにが</b>あった？</div><div><b>なにが</b>ほしい？</div>
        <div><b>いつ・どこ</b>の話？</div><div><b>どうして</b>ほしい？</div>
      </div>
      <div class="row2" style="margin-top:12px">
        <button class="btn" id="clearBtn" type="button">消す</button>
        <button class="btn primary" id="goBtn" type="button" style="flex:2">✨ まとめる</button>
      </div>
    </div>
    <div id="result"></div>
  </section>

  <section id="tab-list" hidden>
    <div class="seg" id="listSeg">
      <button type="button" data-seg="mine" class="on">自分の</button>
      <button type="button" data-seg="all">みんなの</button>
      <button type="button" data-seg="wait" id="segWait" hidden>返事待ち</button>
    </div>
    <div id="memoList"></div>
  </section>
</main>

<nav class="tabs"><div class="in">
  <button type="button" data-tab="speak" class="on"><span class="ic">🎤</span>話してまとめる</button>
  <button type="button" data-tab="list"><span class="ic">📋</span>まとめた記録<span id="unreadBadge"></span></button>
</div></nav>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ 設定 ============ */
// 現場アプリGAS（段取り・道具管理・用語集・車両・取引先・要点まとめで共通の1本）
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzCkxdDCT3hnSEbtpcbQcvOcsehvX5pLUzZ8xFBIxQ40qvRmwmnixJ3q_vEr7X0v-vm7A/exec';
const MASTERS_URL = 'https://script.google.com/macros/s/AKfycbz2iP9eN-79vKTgOvfY6_Vd9rJZ9IMuz4ILkrxE79Muqq0pvTZAAhBG3cMXpZV6ZU1-/exec';   // 名簿・現場マスタ
const LS = { me: 'dandori_me', to: 'yoten_to', draft: 'yoten_draft', cache: 'yoten_cache', local: 'yoten_local_v1', read: 'yoten_read', pending: 'yoten_pending', result: 'yoten_result' };
const TO_LIST = ['親方へ', 'みんなへ', '自分用メモ'];
const NET_ERR = '電波を確認して、もう一度お試しください';
const WD = ['日', '月', '火', '水', '木', '金', '土'];

/* ============ 小道具 ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function rawGet(k) { try { const v = localStorage.getItem(k); if (v == null) return ''; try { const j = JSON.parse(v); return typeof j === 'string' ? j : ''; } catch (e) { return v; } } catch (e) { return ''; } }
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }
function showError(m) { const b = $('errBanner'); b.textContent = '⚠️ ' + m; b.style.display = 'block'; }
function info(m) { const b = $('infoBar'); b.textContent = m || ''; b.hidden = !m; }
const p2 = n => String(n).padStart(2, '0');
function ymd(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
function parseYmd(s) { const a = String(s).split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); }
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function nowStr() { const d = new Date(); return ymd(d) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); }
function md(s) { if (!/^\d{4}-\d{2}-\d{2}/.test(s || '')) return s || ''; const d = parseYmd(s.slice(0, 10)); return (d.getMonth() + 1) + '/' + d.getDate() + '(' + WD[d.getDay()] + ')'; }
const TODAY = ymd(new Date());
const arr = v => Array.isArray(v) ? v : (v == null || v === '' ? [] : (() => { try { const j = JSON.parse(v); return Array.isArray(j) ? j : [j]; } catch (e) { return [v]; } })());
async function getJSON(url, ms) {
  const ac = new AbortController(), tm = setTimeout(() => ac.abort(), ms || 20000);
  try { return await (await fetch(url, { cache: 'no-store', signal: ac.signal })).json(); } finally { clearTimeout(tm); }
}
async function postJSON(url, body, keepalive) { return (await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), keepalive: !!keepalive })).json(); }

/* ============ 言葉のゆれ ============ */
const SMALL = { 'ぁ': 'あ', 'ぃ': 'い', 'ぅ': 'う', 'ぇ': 'え', 'ぉ': 'お', 'っ': 'つ', 'ゃ': 'や', 'ゅ': 'ゆ', 'ょ': 'よ', 'ゎ': 'わ' };
function toHira(s) { return String(s || '').replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)); }
function norm(s) { return toHira(String(s || '').normalize('NFKC').toLowerCase()).replace(/[\s・･,，、。.\-－_/／（）()「」『』]/g, ''); }
function loose(s) { return norm(s).normalize('NFD').replace(/[゙゚]/g, '').normalize('NFC').replace(/[ぁぃぅぇぉっゃゅょゎ]/g, c => SMALL[c]).replace(/ー/g, ''); }
const splitAl = s => String(s || '').split(/[、,，]/).map(x => x.trim()).filter(Boolean);

/* ============ データ（用語集・道具管理・車両・取引先・名簿） ============ */
let WORDS = { terms: [], aliases: [] }, TOOLS = [], VEH = [], SUP = [], NICK = [], STAFF = [], SITES = [];
let MEMOS = null, REPLIES = [], ADMINS = ['親方'], REPLIERS = ['親方'], SERVER_NOW = '', SERVER_LIST = false;
const syncing = on => document.documentElement.classList.toggle('syncing', !!on);   // 裏で最新を読んでいる印
/** 前回読んだ用語集などがあれば、それですぐ動かし、最新は裏で取る。要点の一覧も同時に読み始める */
async function load() {

/* 送る・残す
   「LINEで送る」を押したら、記録にも自動で残す（押し忘れ防止）。送る画面でやめたときは残さない。
   一度残したあとに送る文を直して送り直したら、同じ記録を上書きする（二重にならない） */
function share() {
  if (!RESULT) return;
  const text = $('msg').value.trim(); if (!text) return toast('送る文が空です');
  if (!me()) return chooseName(true, share);   // 名前を選ぶタップの流れのまま送る画面を開く
  if (navigator.share) {
    navigator.share({ text }).then(() => save(true)).catch(e => { if (!e || e.name !== 'AbortError') { save(true); } });
  } else {
    save(true, true);   // LINEの画面に移る前に送り出す（ページを離れても届くように）
    location.href = 'https://line.me/R/msg/text/?' + encodeURIComponent(text);
  }
}
async function copyMsg() {

}
function memoOf(r) {
  return { to: r.to, kind: r.kind, headline: r.headline, points: JSON.stringify(r.points), needs: JSON.stringify(r.needs), vehicles: JSON.stringify(r.vehicles), site: r.site, when: r.when || r.whenNote || '', people: JSON.stringify(r.people), missing: JSON.stringify(r.missing), message: $('msg') ? $('msg').value : r.message, rawText: r.rawText,
    routes: JSON.stringify((r.routes || []).filter(x => x.done).map(x => { const L = routeLine(x); return { type: x.type, to: L.to, what: L.what, date: x.done }; })) };
}
let SAVING = false;

  const b = $('saveBtn'); if (!b || !RESULT) return;
  const changed = RESULT.savedMsg != null && ($('msg').value !== RESULT.savedMsg || !!RESULT.dirtyEdit);
  b.disabled = SAVING || (RESULT.savedMsg != null && !changed);
  b.textContent = SAVING ? '保存中…' : RESULT.savedMsg == null ? '📋 送らずに記録だけ残す' : changed ? '📋 直した文で記録を更新' : (RESULT.savedId ? '✓ 記録に残しました' : '✓ この端末に残しました');
}
async function save(auto, keepalive) {
  if (!RESULT || SAVING) return;
  if (!me()) return chooseName(true, () => save(auto));
  const msg = $('msg') ? $('msg').value : RESULT.message;
  const routesKey = (RESULT.routes || []).filter(x => x.done).length;
  if (RESULT.savedId && RESULT.savedMsg === msg && RESULT.savedRoutes === routesKey && !RESULT.dirtyEdit) { if (auto) toast('送りました（記録済み）'); return; }
  SAVING = true; saveBtnState();
  const memo = memoOf(RESULT);
  if (RESULT.savedId) memo.memoId = RESULT.savedId;
  // この端末の控え（電波がないときも残る）。同じまとめは1件にまとめる
  const local = lsGet(LS.local, []), lid = RESULT.localId || ('L' + Date.now());
  const entry = Object.assign({ memoId: lid, at: nowStr(), by: me(), local: true }, memo, { memoId: RESULT.savedId || lid, local: !RESULT.savedId });
  const i = local.findIndex(m => m.memoId === lid || (RESULT.savedId && m.memoId === RESULT.savedId));
  if (i >= 0) local.splice(i, 1);
  local.unshift(entry); lsSet(LS.local, local.slice(0, 30));
  RESULT.localId = RESULT.savedId || lid;
  try {
    const r = await postJSON(GAS_URL, { app: 'yoten', mode: 'save', memo, by: me() }, keepalive);
    if (!r.ok) throw new Error(r.error);
    entry.memoId = r.id; entry.local = false; lsSet(LS.local, local.slice(0, 30));
    RESULT.savedId = r.id; RESULT.localId = r.id; RESULT.savedMsg = msg; RESULT.savedRoutes = routesKey; RESULT.dirtyEdit = false;
    if (auto || !RESULT._quiet) toast(auto ? '送りました。記録にも残しました' : '記録に残しました'); lsSet(LS.draft, '');
    loadMemos();
  } catch (e) {
    RESULT.savedMsg = msg;
    toast((auto ? '送りました。' : '') + (/unknown mode/.test(e.message || '') ? 'この端末に残しました（共通GASの更新後はみんなと共有できます）' : 'この端末に残しました（' + NET_ERR + '）'));
  } finally { SAVING = false; saveBtnState(); keepResult(); }
}

/* ============ まとめた記録・返事 ============ */
let SEG = 'mine', OPEN_ID = '';
const LIST_CACHE = 'yoten_list_cache';
let memosLoading = null;   // 同じ人の一覧を同時に2回取りに行かない
function loadMemos() {
  const who = me();
  if (memosLoading && memosLoading.who === who && Date.now() - memosLoading.t < 800) return memosLoading.p;   // 開いた直後に重なった分だけまとめる
  const p = loadMemosNow(who).finally(() => { if (memosLoading && memosLoading.p === p) memosLoading = null; });
  memosLoading = { who, p, t: Date.now() };
  return p;
}
async function loadMemosNow(who) {
  if (!SERVER_LIST) {   // 前回の一覧があれば、まずそれを出す（名前ごとに分けて保存）
    const c = lsGet(LIST_CACHE, null);
    if (c && c.me === who && Array.isArray(c.memos)) {
      MEMOS = c.memos; REPLIES = c.replies || []; SERVER_NOW = c.now || nowStr(); SERVER_LIST = true;
      if (c.admins) ADMINS = c.admins; if (c.repliers) REPLIERS = c.repliers;
      $('segWait').hidden = !isReplier(); renderList();
    }
  }
  try {
    const r = await getJSON(GAS_URL + '?app=yoten&action=list&days=60&me=' + encodeURIComponent(who), 15000);
    if (!r.ok) throw new Error(r.error);
    MEMOS = r.memos || []; REPLIES = r.replies || []; SERVER_NOW = r.now || nowStr(); SERVER_LIST = true;
    if (r.admins) ADMINS = r.admins; if (r.repliers) REPLIERS = r.repliers;
    lsSet(LIST_CACHE, { me: who, memos: MEMOS, replies: REPLIES, now: SERVER_NOW, admins: r.admins, repliers: r.repliers });
  } catch (e) {
    const c = lsGet(LIST_CACHE, null);
    if (!(c && c.me === who && SERVER_LIST)) { MEMOS = null; REPLIES = []; SERVER_LIST = false; }
  }
  $('segWait').hidden = !(SERVER_LIST && isReplier());
  renderList();
}
const isAdmin = () => ADMINS.includes(me());
const isReplier = () => REPLIERS.includes(me()) || isAdmin();
const readSet = () => new Set(lsGet(LS.read, []));
const repliesOf = id => REPLIES.filter(r => r.memoId === id).sort((a, b) => String(a.at).localeCompare(String(b.at)));
const isHeld = r => String(r.showAt || '') > (SERVER_NOW || nowStr());
const canSeeReply = (r, m) => r.by === me() || m.by === me() || r.scope === 'みんな' || isReplier();
const replyUnread = r => r.by !== me() && !isHeld(r) && !String(r.readBy || '').split('、').includes(me());
function memoUnreadReplies(m) { return repliesOf(m.memoId).filter(r => canSeeReply(r, m) && (m.by === me() || r.scope === 'みんな') && replyUnread(r)); }
function listItems() {
  let list = SERVER_LIST ? MEMOS.slice() : lsGet(LS.local, []);
  if (SERVER_LIST) lsGet(LS.local, []).filter(m => m.local).forEach(m => list.unshift(m));   // まだ送れていない分
  if (SEG === 'mine') list = list.filter(m => m.by === me());
  else if (SEG === 'wait') list = list.filter(m => m.to !== '自分用メモ' && m.by !== me() && !m.status);
  else list = list.filter(m => m.to !== '自分用メモ' || m.by === me());
  return list;
}
function badgeCount() {
  if (!SERVER_LIST || !me()) return 0;
  const rd = readSet();
  const unreadMemos = (MEMOS || []).filter(m => m.by !== me() && !rd.has(m.memoId) && ((m.to === '親方へ' && isReplier()) || m.to === 'みんなへ')).length;
  const unreadReplies = (MEMOS || []).reduce((n, m) => n + memoUnreadReplies(m).length, 0);
  return unreadMemos + unreadReplies;
}
function statusTag(m) {
  if (m.local) return '<span class="tag none">この端末だけ</span>';
  if (m.status === '済') return '<span class="st done">✓ 済</span>';

}
function renderList() {

  const list = listItems(), rd = readSet();
  $('memoList').innerHTML = (SERVER_LIST ? '' : '<p class="hint" style="margin:0 0 8px">この端末に残した記録だけ表示しています。</p>') +
    (list.length ? list.map(m => {

        '<div class="hl">' + esc(m.headline) + '</div>' +

}
function replyHtml(r, m) {

async function openMemo(id) {

      if (e.target.closest('#reMic')) return startListen($('reTx'), $('reMic'), $('reLabel'), $('reStatus'));
      const sc = e.target.closest('[data-scope]'); if (sc) { keepReply(); RE.scope = sc.dataset.scope; return drawReply($('reTx').value); }
      const on = e.target.closest('[data-act-on]'); if (on) { RE.acts[Number(on.dataset.actOn)].on = on.checked; return; }
      const b = e.target.closest('button[data-act]'); if (!b) return;
      if (LISTENING) stopListen();
      if (b.dataset.act === 'cancel') return closeModal();
      keepReply();
      const text = $('reTx').value.trim();
      if (b.dataset.act === 'plan') {
        if (!text) return toast('先に返事を話してください');
        b.disabled = true; b.innerHTML = '<span class="loading" style="border-color:rgba(0,0,0,.2);border-top-color:var(--leaf)"></span> 考え中…';
        try { await planReply(text); } catch (err) { toast(err.message || NET_ERR); }
        return drawReply(text);
      }
      if (b.dataset.act === 'send') {
        if (!text) return toast('返事を話すか入力してください');
        b.disabled = true; b.innerHTML = '<span class="loading"></span> 送信中…';
        try {
          const r = await postJSON(GAS_URL, { app: 'yoten', mode: 'reply', memoId: RE.memo.memoId, text, scope: RE.scope, now: RE.now, done: RE.done, by: me(),
            actions: RE.acts.filter(a => a.on).map(a => ({ type: a.type, text: a.text, until: a.until, tool: a.tool, toolId: a.toolId, shop: a.shop, content: a.content })) });
          if (!r.ok) throw new Error(r.error);
          const ng = (r.results || []).filter(x => !x.ok);
          closeModal();
          toast((r.held ? '明日の朝' + SEND_AT + '時に届きます' : '返事を送りました') + (ng.length ? '（反映できなかったものがあります）' : ''));
          OPEN_ID = RE.memo.memoId; RE = null; loadMemos();
        } catch (err) { toast(/unknown mode/.test(err.message || '') ? '共通GASの更新後に使えます' : (err.message || NET_ERR)); b.disabled = false; b.textContent = '返事を送る'; }
      }
    });
  const done = $('reDone'); if (done) done.addEventListener('change', () => { RE.done = done.checked; });
  const now = $('reNow'); if (now) now.addEventListener('change', () => { RE.now = now.checked; });
}
function keepReply() { document.querySelectorAll('[data-act-tx]').forEach(t => { RE.acts[Number(t.dataset.actTx)].text = t.value; }); }
async function planReply(text) {   // AIに「反映の案」を出してもらい、道具はアプリ側で道具管理と照合する
  const m = RE.memo;
  const toolNames = TOOLS.map(t => (termById(t.termId) || {}).term).filter(Boolean);
  const r = await postJSON(GAS_URL, { app: 'yoten', mode: 'interpret', text, tools: toolNames.join('、'), suppliers: supText(),
    memo: { by: m.by, headline: m.headline, points: arr(m.points), needs: arr(m.needs) } });
  if (!r.ok) throw new Error(/unknown mode/.test(r.error || '') ? '共通GASの更新後に使えます' : (r.error || 'AIで案を出せませんでした'));
  RE.done = RE.done || !!r.done;
  RE.acts = (r.actions || []).map(a => {
    if (a.type === 'notice') return { type: 'notice', text: a.text || '', until: /^\d{4}-\d{2}-\d{2}$/.test(a.until || '') ? a.until : addDays(TODAY, 7), on: true };
    const w = matchWord(a.tool || '', toolWords(true)) || matchWord(a.tool || ''), term = w ? termById(w.termId) : null, tool = term ? toolOfTerm(term.termId) : null;
    return { type: 'repair', tool: term ? term.term : (a.tool || ''), toolId: tool ? tool.id : '', shop: a.shop || '', content: a.content || '', on: !!tool };
  });
  if (!RE.acts.length) toast('反映することは見つかりませんでした（返事だけ送れます）');
  if (RE.acts.some(a => a.type === 'notice')) RE.scope = RE.scope;   // お知らせはみんなに出る。返事の見せ方は選んだまま
}

/* ============ 名前・モーダル ============ */
let AFTER_NAME = null;
function chooseName(force, then) { if (me() && !force) { if (then) then(); return; } AFTER_NAME = then || null; drawName(); }
function drawName() {
  const typed = $('nmIn') ? $('nmIn').value : me();
  openModal('<h3>あなたの名前</h3><p class="hint" style="margin:4px 0 12px">最初の1回だけ選びます（日報・段取りアプリと同じ名前です）。</p>' +
    '<div class="chips" style="margin-bottom:12px">' + staffList().map(s => '<button type="button" class="chip" data-nm="' + esc(s) + '">' + esc(s) + '</button>').join('') + '</div>' +
    '<input type="text" id="nmIn" placeholder="一覧にないときは名前を入力" value="' + esc(typed) + '">' +
    '<div class="row2" style="margin-top:12px"><button class="btn" data-act="later">あとで</button><button class="btn primary" data-act="ok">決定</button></div>',
    e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.act === 'later') { AFTER_NAME = null; closeModal(); return; }
      const v = b.dataset.nm || (b.dataset.act === 'ok' ? $('nmIn').value.trim() : '');
      if (!v) { if (b.dataset.act === 'ok') toast('名前を選ぶか入力してください'); return; }
      lsSet(LS.me, v); $('meBtn').textContent = '👤 ' + v; closeModal(); renderList();
      const t = AFTER_NAME; AFTER_NAME = null; if (t) t();
    });
}
let modalHandler = null;
function openModal(html, handler) { $('modal').innerHTML = html; modalHandler = handler; $('modalBg').classList.add('show'); $('modal').scrollTop = 0; }
function closeModal() { if (LISTENING) stopListen(); $('modalBg').classList.remove('show'); $('modal').innerHTML = ''; modalHandler = null; }
$('modal').addEventListener('click', e => { if (modalHandler) modalHandler(e); });
$('modalBg').addEventListener('click', e => { if (e.target === $('modalBg')) closeModal(); });

/* ============ イベント ============ */
function switchTab(tab) {
  if (LISTENING) stopListen();
  document.querySelectorAll('nav.tabs button').forEach(x => x.classList.toggle('on', x.dataset.tab === tab));
  $('tab-speak').hidden = tab !== 'speak'; $('tab-list').hidden = tab !== 'list';
  window.scrollTo(0, 0); if (tab === 'list') { renderList(); loadMemos(); }
}
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
$('toChips').addEventListener('click', e => {
  const c = e.target.closest('[data-to]'); if (!c) return;
  TO = c.dataset.to; lsSet(LS.to, TO); drawTo();
  if (RESULT && RESULT.local) { RESULT.to = TO; RESULT.message = composeMessage(RESULT); renderResult(); }
  else if (RESULT) toast('宛先を変えたら、もう一度「まとめる」を押すと送る文が変わります');
});
$('micBtn').addEventListener('click', () => startListen($('raw'), $('micBtn'), $('micLabel'), $('micStatus')));
$('raw').addEventListener('input', () => lsSet(LS.draft, $('raw').value));
$('clearBtn').addEventListener('click', () => { if ($('raw').value && !confirm('話した内容を消しますか？')) return; if (LISTENING) stopListen(); $('raw').value = ''; lsSet(LS.draft, ''); RESULT = null; renderResult(); $('micLabel').textContent = '話す'; });
$('goBtn').addEventListener('click', go);
$('result').addEventListener('click', e => {
  const a = e.target.closest('[data-ans]'); if (a) return openAnswer(RESULT.missing[Number(a.dataset.ans)]);
  const w = e.target.closest('[data-term]'); if (w) return showTerm(w.dataset.term);
  if (e.target.closest('#copyBtn')) return copyMsg();
  if (e.target.closest('#shareBtn')) return share();
  if (e.target.closest('#saveBtn')) return save();
  if (e.target.closest('#moreBtn')) return openAnswer('');
  if (e.target.closest('#editBtn')) return startEdit();
  if (e.target.closest('#remakeBtn')) { if ($('msg').value !== RESULT.message && !confirm('送る文を、上のまとめから作り直します。\n自分で直した分は消えます。よろしいですか？')) return; RESULT.message = composeMessage(RESULT); $('msg').value = RESULT.message; saveBtnState(); keepResult(); return toast('送る文を作り直しました'); }
  const ek = e.target.closest('[data-ed-kind]'); if (ek) { document.querySelectorAll('[data-ed-kind]').forEach(b => b.classList.toggle('on', b === ek)); return; }
  const ea = e.target.closest('[data-ed-add]'); if (ea) return edAdd(ea.dataset.edAdd);
  const ed = e.target.closest('[data-ed-del]'); if (ed) { ed.closest('.ed-row').remove(); return; }
  const et = e.target.closest('[data-ed-act]'); if (et) return finishEdit(et.dataset.edAct === 'ok');
  const rt = e.target.closest('[data-route]'); if (rt) return doRoute(Number(rt.dataset.route), rt);
  const re = e.target.closest('[data-redit]'); if (re) return openRouteEdit(Number(re.dataset.redit));
  const ra = e.target.closest('[data-radd]'); if (ra) return openRouteEdit(-1, ra.dataset.radd);
});
$('result').addEventListener('change', e => {
  const d = e.target.closest('[data-rdate]'); if (d) routeDateChanged(d);
});
$('listSeg').addEventListener('click', e => { const b = e.target.closest('[data-seg]'); if (!b) return; SEG = b.dataset.seg; document.querySelectorAll('#listSeg button').forEach(x => x.classList.toggle('on', x === b)); renderList(); });
$('memoList').addEventListener('click', e => {
  const d = e.target.closest('[data-del]'); if (d) { e.stopPropagation(); return deleteMemo(d.dataset.del); }
  const u = e.target.closest('[data-reuse]'); if (u) { e.stopPropagation(); return reuseMemo(u.dataset.reuse); }
  const rp = e.target.closest('[data-reply]'); if (rp) { e.stopPropagation(); return openReply(rp.dataset.reply); }
  const dn = e.target.closest('[data-done]'); if (dn) { e.stopPropagation(); return setDone(dn.dataset.done, dn.dataset.v === '1'); }
  const m = e.target.closest('[data-memo]'); if (m) return openMemo(m.dataset.memo);
});
$('meBtn').addEventListener('click', () => chooseName(true));

(function init() {
  if (me()) $('meBtn').textContent = '👤 ' + me();
  drawTo();
  $('raw').value = lsGet(LS.draft, '') || '';
  if (!LIVE) $('micStatus').textContent = 'まとまらなくて大丈夫。🎤を押して、キーボードのマイクで話してください';
  const q = new URLSearchParams(location.search);
  const fromDandori = q.get('from') === 'dandori' && !!$('raw').value.trim();
  if (fromDandori) { TO = '親方へ'; drawTo(); }
  if (q.get('tab') === 'list' || q.get('memo')) { if (q.get('memo')) OPEN_ID = q.get('memo'); if (q.get('seg')) { SEG = q.get('seg'); document.querySelectorAll('#listSeg button').forEach(x => x.classList.toggle('on', x.dataset.seg === SEG)); } switchTab('list'); }
  load().then(() => {
    if (fromDandori) return go();
    const p = lsGet(LS.pending, null), k = lsGet(LS.result, null);
    if (p && (!k || p.at > k.at)) resumePending();   // まとめ中のほうが新しければ、そちらを受け取る
    else restoreResult();
  });   // 用語集などを読んでから、前の結果を戻す
})();
</script>
