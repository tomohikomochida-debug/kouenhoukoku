<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="道具管理">
<meta name="theme-color" content="#214A37">
<title>道具管理｜庭乃持田園</title>
<style>
:root{
  --paper:#F6F5F0; --card:#FFFFFF; --leaf:#214A37; --leaf-soft:#E5EDE7; --ok:#2E7D55;
  --tape:#C77C30; --bark:#5B5750; --ink:#22231F; --line:#DCD9D0; --field:#FBFAF6; --danger:#B0533F;
  --radius:10px; --shadow:0 1px 0 rgba(34,35,31,.04), 0 8px 24px -16px rgba(34,35,31,.25);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif;
  -webkit-text-size-adjust:100%;line-height:1.6}
.tnum{font-variant-numeric:tabular-nums}
header{background:var(--leaf);color:#fff;padding:12px 16px calc(12px);position:sticky;top:0;z-index:20;
  padding-top:calc(12px + env(safe-area-inset-top))}
header .row{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;letter-spacing:.04em}
header .me{font-size:13px;background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:999px;padding:5px 12px}
.demo-bar{background:var(--tape);color:#fff;font-size:12.5px;text-align:center;padding:5px 12px}
main{max-width:680px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
.error-banner{display:none;background:var(--danger);color:#fff;padding:10px 16px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:4px 0 10px;color:var(--leaf)}
.hint{font-size:12.5px;color:var(--bark);margin:4px 0 0}
label.lbl{display:block;font-size:13px;font-weight:600;color:var(--bark);margin:0 0 6px}
input[type=text],input[type=search],textarea,select{width:100%;font:inherit;font-size:16px;padding:11px 12px;
  border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--leaf);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:15px;font-weight:600;
  border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 16px;min-height:46px;cursor:pointer}
.btn.primary{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13.5px}
.row2{display:flex;gap:8px}
.row2>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;color:var(--ink);font-family:inherit}
.chip.on{background:var(--leaf-soft);border-color:var(--leaf);color:var(--leaf);font-weight:700}
.tag{display:inline-block;font-size:11.5px;border-radius:6px;padding:1px 7px;margin-left:4px;vertical-align:1px}
.tag.mis{background:#F6E7D8;color:#8A4F17}
.tag.wait{background:#EEE;color:var(--bark)}
.tag.loc{background:var(--leaf-soft);color:var(--leaf)}
.tag.out{background:#F4DED8;color:var(--danger)}
.searchbox{display:flex;gap:8px}
.searchbox input{flex:1}
.mic{width:50px;min-width:50px;padding:0;font-size:20px}
.tool{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:8px;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.tool .ph{width:60px;height:60px;border-radius:8px;background:var(--leaf-soft);flex:none;display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden}
.tool .ph img{width:100%;height:100%;object-fit:cover}
.tool .nm{font-weight:700;font-size:15.5px}
.tool .nm small{font-weight:400;color:var(--bark);font-size:13px}
.tool .sub{font-size:12.5px;color:var(--bark)}
.sec-title{font-size:13px;font-weight:700;color:var(--bark);margin:14px 2px 8px}
.maybe{border-left:4px solid var(--tape);padding-left:10px}
.empty{color:var(--bark);text-align:center;padding:22px 10px;font-size:14px}
.photo-box{border:2px dashed var(--line);border-radius:10px;min-height:150px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--field);margin-bottom:8px}
.photo-box img{max-width:100%;max-height:260px;display:block}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:52px;height:46px;font-size:22px}
.qty .n{font-size:22px;font-weight:700;min-width:40px;text-align:center}
.step{display:flex;gap:10px;margin-bottom:14px}
.step .no{flex:none;width:26px;height:26px;border-radius:50%;background:var(--tape);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.step .bd{flex:1;min-width:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:30;
  padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:680px;margin:0 auto;display:flex}
nav.tabs button{flex:1;border:0;background:none;font:inherit;font-size:11.5px;color:var(--bark);padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative}
nav.tabs button .ic{font-size:21px;line-height:1.1}
nav.tabs button.on{color:var(--leaf);font-weight:700}
nav.tabs .badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--danger);color:#fff;font-size:10.5px;border-radius:999px;padding:0 6px;min-width:18px}
.modal-bg{position:fixed;inset:0;background:rgba(34,35,31,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:var(--paper);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.modal h3{margin:0 0 12px;font-size:17px;color:var(--leaf)}
.detail-ph{width:100%;max-height:300px;object-fit:contain;border-radius:10px;background:var(--leaf-soft);display:block;margin-bottom:12px}
.big-ph{height:160px;border-radius:10px;background:var(--leaf-soft);display:flex;align-items:center;justify-content:center;font-size:60px;margin-bottom:12px}
dl.kv{display:grid;grid-template-columns:88px 1fr;gap:6px 10px;margin:0 0 12px;font-size:14px}
dl.kv dt{color:var(--bark)}
dl.kv dd{margin:0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.loading{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.btn:not(.primary):not(.ok) .loading{border-color:var(--line);border-top-color:var(--leaf)}
@keyframes spin{to{transform:rotate(360deg)}}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;border:0;background:var(--card);font:inherit;font-size:13.5px;padding:9px 4px;cursor:pointer;color:var(--bark)}
.seg button.on{background:var(--leaf);color:#fff;font-weight:700}
.miss-box{background:#FBF1E6;border:1px solid #EBCFAE;border-radius:10px;padding:12px;margin-bottom:12px;font-size:14px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.home-btn{display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;color:#fff;text-decoration:none;font-family:inherit;font-size:13px;font-weight:700;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);border-radius:999px;padding:5px 11px 5px 9px;white-space:nowrap;line-height:1.2}
.home-btn:active{background:rgba(255,255,255,.28)}
.home-btn .hb-ic{font-size:15px;line-height:1}
@media (max-width:400px){ .home-btn{padding:5px 8px} .home-btn .hb-t{display:none} }
</style>
</head>
<body>
<div class="error-banner" id="errBanner"></div>
<header><div class="row"><a class="home-btn" href="index.html" title="アプリ一覧にもどる" aria-label="アプリ一覧（ホーム）にもどる"><span class="hb-ic">🏠</span><span class="hb-t">ホーム</span></a><h1>🧰 道具管理</h1><button class="me" id="meBtn" type="button">名前を選ぶ</button></div></header>
<div class="demo-bar" id="demoBar" hidden>お試しモード：データはこのスマホの中だけに保存されます（AI判定は簡易版）。名前・呼び方は用語集アプリと共有</div>

<main>
  <!-- 探す -->
  <section id="tab-search">
    <div class="card">
      <h2>道具を探す</h2>
      <div class="searchbox">
        <input type="search" id="q" placeholder="名前・呼び方・聞いた言葉" autocomplete="off" enterkeyhint="search">
        <button class="btn mic" type="button" data-mic="q" aria-label="音声で入力">🎤</button>
      </div>
      <p class="hint" id="micHint" hidden>キーボードのマイク🎤を押して話してください</p>
      <p class="hint">聞き間違えた言葉や「柄の長い木づち」のような説明でも探せます。</p>
    </div>
    <div id="results"></div>
  </section>

  <!-- 登録 -->
  <section id="tab-reg" hidden>
    <div class="card">
      <h2>道具を登録する</h2>
      <div class="step"><div class="no">1</div><div class="bd">
        <label class="lbl">保管場所</label>
        <div class="chips" id="locChips"></div>
        <input type="text" id="locNew" placeholder="一覧にない場所を入力（例：2F-C-3段目）" style="margin-top:8px" hidden>
        <p class="hint">棚のQRラベルを読むと、ここが自動で入ります。</p>
      </div></div>
      <div class="step"><div class="no">2</div><div class="bd">
        <label class="lbl">写真</label>
        <div class="photo-box" id="photoBox"><span class="hint">道具を1枚撮ってください</span></div>
        <div class="row2">
          <button class="btn" type="button" id="camBtn">📷 撮影</button>
          <button class="btn" type="button" id="libBtn">🖼 選ぶ</button>
        </div>
        <input type="file" id="camFile" accept="image/*" capture="environment" hidden>
        <input type="file" id="libFile" accept="image/*" hidden>
      </div></div>
      <div class="step"><div class="no">3</div><div class="bd">
        <label class="lbl">名前（普段の呼び方でOK）</label>
        <div class="searchbox">
          <input type="text" id="regName" placeholder="例：パチン、バリカン、かけや" autocomplete="off">
          <button class="btn mic" type="button" data-mic="regName" aria-label="音声で入力">🎤</button>
        </div>
      </div></div>
      <div class="step"><div class="no">4</div><div class="bd">
        <label class="lbl">数量</label>
        <div class="qty"><button class="btn" type="button" id="qMinus">－</button><span class="n tnum" id="qN">1</span><button class="btn" type="button" id="qPlus">＋</button></div>
      </div></div>
      <button class="btn primary block" type="button" id="regNext" disabled>確認する</button>
      <p class="hint" style="text-align:center">AIが写真と名前から、登録済みの道具と同じかを確かめます。</p>
    </div>
  </section>

  <!-- 辞典 -->
  <section id="tab-dict" hidden>
    <div class="seg" id="dictSeg">
      <button type="button" class="on" data-v="kana">名前順</button>
      <button type="button" data-v="loc">場所ごと</button>
      <button type="button" data-v="mis">間違えやすい言葉</button>
    </div>
    <div id="dictList"></div>
  </section>

  <!-- 確認（管理者） -->
  <section id="tab-review" hidden>
    <div class="sec-title">新しく登録された道具（未確認）</div>
    <div id="revTools"></div>
    <div class="sec-title">承認待ちの呼び方</div>
    <div id="revAliases"></div>
  </section>
</main>

<nav class="tabs"><div class="in">
  <button type="button" data-tab="search" class="on"><span class="ic">🔍</span>探す</button>
  <button type="button" data-tab="reg"><span class="ic">＋</span>登録</button>
  <button type="button" data-tab="dict"><span class="ic">📖</span>呼び方辞典</button>
  <button type="button" data-tab="review" id="tabReview" hidden><span class="ic">✔</span>確認<span class="badge" id="revBadge" hidden>0</span></button>
</div></nav>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ 設定 ============ */
// 現場アプリGAS（段取り・道具管理・用語集で共通の1本）のURL。空のままだと「お試しモード」（このスマホの中だけで動く）
// 道具（保管場所・数量・写真）は app=dougu、言葉（名前・呼び方＝言葉のマスタ）は app=yougo で同じURLに問い合わせる
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzCkxdDCT3hnSEbtpcbQcvOcsehvX5pLUzZ8xFBIxQ40qvRmwmnixJ3q_vEr7X0v-vm7A/exec';
const YOUGO_URL = GAS_URL;
const YOUGO_PAGE = 'yougo.html';
// 名簿（スタッフ）を取る日報GAS
const MASTERS_URL = 'https://script.google.com/macros/s/AKfycbz2iP9eN-79vKTgOvfY6_Vd9rJZ9IMuz4ILkrxE79Muqq0pvTZAAhBG3cMXpZV6ZU1-/exec';
const DEMO = !GAS_URL || !YOUGO_URL;
// words は用語集アプリのお試しデータと同じ場所（同じサイト上なら2つのアプリで共有される）
const LS = { me: 'dougu_me', admin: 'dougu_admin', draft: 'dougu_draft', tools: 'dougu_demo_v3', words: 'yougo_demo_v1', cache: 'dougu_cache' };
const NET_ERR = '電波を確認して、もう一度お試しください';
const TOOL_CATS = ['道具', '資材'];

/* ============ 小道具 ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400); }
function showError(msg) { const b = $('errBanner'); b.textContent = '⚠️ ' + msg; b.style.display = 'block'; }
window.addEventListener('error', e => showError('画面の処理でエラー：' + (e.message || '')));
function now() { const d = new Date(), p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); }

/* ============ 文字のゆれ・音の近さ（用語集アプリと同じ仕組み） ============ */
const SMALL = { 'ぁ': 'あ', 'ぃ': 'い', 'ぅ': 'う', 'ぇ': 'え', 'ぉ': 'お', 'っ': 'つ', 'ゃ': 'や', 'ゅ': 'ゆ', 'ょ': 'よ', 'ゎ': 'わ' };
function toHira(s) { return String(s || '').replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)); }
function isKana(s) { return /^[ぁ-ゖァ-ーー\s]+$/.test(String(s || '')); }
function norm(s) { return toHira(String(s || '').normalize('NFKC').toLowerCase()).replace(/[\s・･,，、。.\-－_/／（）()「」『』]/g, ''); }
function loose(s) { return norm(s).normalize('NFD').replace(/[゙゚]/g, '').normalize('NFC').replace(/[ぁぃぅぇぉっゃゅょゎ]/g, c => SMALL[c]).replace(/ー/g, ''); }
function lev(a, b) {
  if (a === b) return 0; const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j), cur = new Array(n + 1);
  for (let i = 1; i <= m; i++) { cur[0] = i; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); [prev, cur] = [cur, prev]; }
  return prev[n];
}

/* ============ お試し用データ（用語集の「道具」「資材」の言葉と、道具マスタ） ============ */
const SEED_WORDS = {
  terms: [["Y0153","剪定鋏","せんていばさみ","道具","片手で使う小型の鋏、太めの枝も切れる。","","","T0001"],
    ["Y0154","木鋏","きばさみ","道具","輪の持ち手の鋏、細かい枝や葉の整え用。","","","T0002"],
    ["Y0155","芽切鋏","めきりばさみ","道具","刃先の細い小さな鋏、芽摘み・松の手入れ用。","","","T0003"],
    ["Y0156","刈込鋏","かりこみばさみ","道具","両手で使う刃の長い鋏、生垣・玉物の刈込み。","","","T0004"],
    ["Y0157","剪定鋸","せんていのこぎり","道具","枝を切る細身のノコギリ、腰に下げる。","","","T0005"],
    ["Y0158","両刃鋸","りょうばのこぎり","道具","刃が両側にある大工用ノコギリ、丸太や竹を切る。","","","T0006"],
    ["Y0159","高枝切鋏","たかえだきりばさみ","道具","柄の長い鋏、脚立が届かない高い枝用。","","","T0007"],
    ["Y0160","高枝鋸","たかえだのこぎり","道具","伸縮する長い柄の先にノコギリ。","","","T0008"],
    ["Y0161","草刈鎌","くさかりがま","道具","草を刈る片手の鎌。","","","T0009"],
    ["Y0162","ヘッジトリマー","へっじとりまー","道具","生垣の刈込み用、エンジン式の長い刃。","","","T0010"],
    ["Y0163","チェーンソー","ちぇーんそー","道具","エンジン式の木を切る機械、伐採・玉切り。","","","T0011"],
    ["Y0164","トップハンドルソー","とっぷはんどるそー","道具","片手で扱える小型のチェーンソー、木の上の作業用。","","","T0012"],
    ["Y0165","刈払機","かりばらいき","道具","肩に掛けて回転刃で草を刈る機械。","","","T0013"],
    ["Y0166","ブロワー","ぶろわー","道具","風で落ち葉や刈りカスを吹き飛ばす機械。","","","T0014"],
    ["Y0167","動力噴霧器","どうりょくふんむき","道具","エンジンで薬剤を散布する機械、ホース付き。","","","T0015"],
    ["Y0168","背負い式噴霧器","せおいしきふんむき","道具","背中に背負って手で薬剤を撒くタンク。","","","T0016"],
    ["Y0169","唐鍬","とうぐわ","道具","刃が厚く重い鍬、根切り・抜根・固い土の掘り起こし。","","","T0017"],
    ["Y0170","ツルハシ","つるはし","道具","両側がとがった掘削用具、石混じりの土を砕く。","","","T0018"],
    ["Y0171","剣先スコップ","けんさきすこっぷ","道具","先がとがったスコップ、植え穴掘り用。","","","T0019"],
    ["Y0172","角スコップ","かくすこっぷ","道具","先が平らなスコップ、土やゴミをすくう。","","","T0020"],
    ["Y0173","移植ゴテ","いしょくごて","道具","片手で使う小さなスコップ、草花の植え付け。","","","T0021"],
    ["Y0174","レーキ","れーき","道具","鉄の爪が並んだ道具、土をならす・石を集める。","","","T0022"],
    ["Y0175","熊手","くまで","道具","落ち葉をかき集める扇形の道具。","","","T0023"],

// tools＝道具マスタ（termId で用語集とつながる）、terms・aliases＝用語集の言葉
let DB = { tools: [], terms: [], aliases: [], locations: [] };
let TOOLS = [];   // 表示用：道具マスタに用語集の名前・読み・意味を合わせたもの
const termById = id => DB.terms.find(t => String(t.termId) === String(id));
const termByName = n => DB.terms.find(t => norm(t.term) === norm(n));
const aliasesOf = termId => DB.aliases.filter(a => String(a.termId) === String(termId));
const toolById = id => TOOLS.find(t => String(t.id) === String(id));
function commonOf(termId) {
  const a = aliasesOf(termId).find(x => x.type === '社内呼び' && x.state === '承認済');
  return a ? a.alias : '';
}
function buildTools() {
  TOOLS = DB.tools.map(t => {
    const w = termById(t.termId) || {};
    return Object.assign({}, t, { qty: Number(t.qty) || 0, name: w.term || '（用語集に名前がありません）', kana: w.kana || '', feature: w.meaning || '', category: w.category || '', commonName: commonOf(t.termId) });
  });
}

/* ---- 通信：道具は道具管理GAS、言葉は用語集GAS ---- */
const api = {
  async load() {
    if (DEMO) { const w = demoWords(); return { ok: true, tools: demoTools(), terms: w.terms, aliases: w.aliases, locations: [] }; }
    const [a, b] = await Promise.all([
      fetch(GAS_URL + '?app=dougu&action=data', { cache: 'no-store' }).then(r => r.json()),
      fetch(YOUGO_URL + '?app=yougo&action=data', { cache: 'no-store' }).then(r => r.json())
    ]);
    if (!a.ok) throw new Error(a.error || '道具データを読めません');
    if (!b.ok) throw new Error(b.error || '用語集を読めません');
    return { ok: true, tools: a.tools || [], locations: a.locations || [], terms: b.terms || [], aliases: b.aliases || [] };
  },
  async post(target, body) {   // target: 'dougu'（道具管理GAS）／'yougo'（用語集GAS）
    if (DEMO) return demoPost(target, body);
    const r = await fetch(target === 'yougo' ? YOUGO_URL : GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ app: target }, body)) });
    return r.json();
  }
};
function demoPost(target, b) {
  const T = DB.tools, W = DB.terms, A = DB.aliases;
  if (target === 'yougo') {
    switch (b.mode) {
      case 'aiSearch': {
        const words = norm(b.query).match(/[一-鿿]{2,}|[ぁ-ゖ]{3,}/g) || [];
        const res = W.filter(t => !b.categories || b.categories.includes(t.category)).map(t => ({ t, s: words.filter(w => norm(t.meaning).includes(w)).length }))
          .filter(x => x.s > 0).sort((x, y) => y.s - x.s).slice(0, 3).map(x => ({ id: x.t.termId, reason: '特徴が近い（簡易判定）' }));
        return { ok: true, results: res };
      }
      case 'addTerm': {
        const dup = W.find(t => t.term === b.term.term);
        if (dup) return { ok: false, error: '「' + b.term.term + '」はすでに登録されています', termId: dup.termId };
        const max = W.reduce((m, t) => Math.max(m, Number(String(t.termId).replace(/\D/g, '')) || 0), 0);
        const id = 'Y' + String(max + 1).padStart(4, '0');
        W.push(Object.assign({ termId: id, kana: isKana(b.term.term) ? toHira(b.term.term) : '', related: '', toolId: '', photoUrl: '', usage: '', source: '社内', reviewState: '未確認', addedBy: b.by, updatedAt: now() }, b.term));
        (b.aliases || []).forEach(a => demoPost('yougo', { mode: 'addAlias', alias: a.alias, termId: id, type: a.type, by: b.by, state: a.state }));
        demoSave(); return { ok: true, termId: id };
      }
      case 'addAlias': {
        if (A.some(a => a.termId === b.termId && a.alias === b.alias)) return { ok: true, duplicate: true };
        A.push({ alias: b.alias, kana: b.kana || (isKana(b.alias) ? toHira(b.alias) : ''), termId: b.termId, type: b.type || '別名', state: b.state || '承認待ち', addedBy: b.by || '', addedAt: now() });
        demoSave(); return { ok: true };
      }
      case 'review': {
        if (b.kind === 'term') { const t = W.find(x => x.termId === b.key); if (t) t.reviewState = b.action === 'approve' ? '確認済' : '未確認'; }
        else { const i = A.findIndex(a => a.termId === b.key.termId && a.alias === b.key.alias); if (i >= 0) { if (b.action === 'approve') A[i].state = '承認済'; else A.splice(i, 1); } }
        demoSave(); return { ok: true };
      }
    }
  } else {
    switch (b.mode) {
      case 'identify': {
        const top = searchTools(b.text || '')[0];
        const m = top && top.score >= 90 ? top.tool : null;
        return { ok: true, data: { matchId: m ? m.id : null, matchConfidence: m ? .8 : 0, name: m ? m.name : (b.text || ''), kana: isKana(b.text) ? toHira(b.text) : '', commonName: b.text || '', feature: '', why: m ? '呼び方が一致' : 'お試しモードの簡易判定' } };
      }
      case 'addTool': {
        const max = T.reduce((m, t) => Math.max(m, Number(String(t.id).replace(/\D/g, '')) || 0), 0);
        const id = 'T' + String(max + 1).padStart(4, '0');
        T.push({ id, termId: b.tool.termId, location: b.tool.location, qty: Number(b.tool.qty) || 1, photoUrl: b.image ? 'data:image/jpeg;base64,' + b.image : '', status: '倉庫', statusSite: '', registeredBy: b.by, reviewState: '未確認', createdAt: now(), updatedAt: now() });
        demoSave(); return { ok: true, id };
      }
      case 'updateTool': {
        const t = T.find(x => x.id === b.id); if (!t) return { ok: false, error: '道具が見つかりません' };
        const p = Object.assign({}, b.patch);
        if (p.addQty) { p.qty = (Number(t.qty) || 0) + Number(p.addQty); delete p.addQty; }
        if (p.image) { p.photoUrl = 'data:image/jpeg;base64,' + p.image; delete p.image; }
        Object.assign(t, p, { updatedAt: now() }); demoSave(); return { ok: true, id: b.id, qty: t.qty };
      }
      case 'review': { const t = T.find(x => x.id === b.key); if (t) t.reviewState = b.action === 'approve' ? '確認済' : '未確認'; demoSave(); return { ok: true }; }
    }
  }
  return { ok: false, error: 'unknown mode' };
}

async function load() {
  try {
    const r = await api.load();
    DB = { tools: r.tools, terms: r.terms, aliases: r.aliases, locations: r.locations || [] };
    if (!DEMO) lsSet(LS.cache, DB);
  } catch (e) {
    const c = lsGet(LS.cache, null);
    if (c) { DB = c; toast('前回のデータを表示しています（' + NET_ERR + '）'); }
    else showError('道具データを読み込めませんでした。' + NET_ERR);
  }
  buildTools();
  renderAll();
}

/* ============ 検索 ============ */
function searchTools(qRaw) {
  const q = norm(qRaw), ql = loose(qRaw);
  if (!q) return [];
  const out = [];
  TOOLS.forEach(t => {
    const terms = [{ s: t.name, why: '正式名' }, { s: t.kana, why: '読み' }];
    aliasesOf(t.termId).forEach(a => { terms.push({ s: a.alias, why: a.type, alias: a }); if (a.kana) terms.push({ s: a.kana, why: a.type, alias: a }); });
    let best = { score: 0 };
    const set = (score, why, alias) => { if (score > best.score) best = { score, why, alias }; };
    terms.forEach(term => {
      const n = norm(term.s), l = loose(term.s);
      if (!n) return;
      if (n === q) set(100, term.why, term.alias);
      else if (l && l === ql) set(92, term.why, term.alias);
      else if (q.length >= 2 && n.startsWith(q)) set(82, term.why, term.alias);
      else if (q.length >= 3 && n.includes(q)) set(72, term.why, term.alias);
      else if (n.length >= 2 && q.includes(n)) set(n.length >= 3 ? 64 : 56, term.why, term.alias);   // 「パチン持ってきて」など（2文字は候補どまり）
      else if (isKana(term.s) && ql.length >= 3 && l.length >= 3) {                                 // 音の近さ（聞き間違い）
        const d = lev(ql, l);
        if (d === 1) set(52, '音が近い', term.alias);
        else if (d === 2 && Math.min(ql.length, l.length) >= 5) set(42, '音が近い', term.alias);
      }
    });
    if (best.score < 40 && (q.length >= 3 || /[一-鿿]/.test(q)) && norm(t.feature).includes(q)) set(35, '特徴');
    if (best.score > 0) out.push(Object.assign({ tool: t }, best));
  });
  return out.sort((a, b) => b.score - a.score || String(a.tool.kana).localeCompare(String(b.tool.kana), 'ja'));
}

function shrink(file, cb) {   // 写真を縮小して base64 に（通信量とAIの負担を減らす）
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    const max = DEMO ? 480 : 1000, sc = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const dataUrl = c.toDataURL('image/jpeg', DEMO ? .7 : .82);
    URL.revokeObjectURL(url);
    cb({ dataUrl, b64: dataUrl.split(',')[1] });
  };

}

    const g = {};
    TOOLS.forEach(t => (g[t.location || '場所未設定'] = g[t.location || '場所未設定'] || []).push(t));
    box.innerHTML = Object.keys(g).sort((a, b) => a.localeCompare(b, 'ja', { numeric: true })).map(k => '<div class="sec-title">📍 ' + esc(k) + '（' + g[k].length + '）</div>' + g[k].map(t => toolRow(t)).join('')).join('');
  } else {
    const rows = [];
    DB.aliases.filter(a => a.type === '聞き間違い').forEach(a => TOOLS.filter(t => t.termId === a.termId).forEach(t => rows.push({ a, t })));
    box.innerHTML = '<p class="hint" style="margin:0 2px 10px">新人さんが聞き間違えやすい言葉です。</p>' + (rows.length ? rows.map(({ a, t }) =>
      '<button type="button" class="tool" data-tool="' + esc(t.id) + '"><div class="ph">' + phHtml(t) + '</div><div><div class="nm">「' + esc(a.alias) + '」<small> → </small>' + esc(t.name) + '</div>' +
      '<div class="sub">正しくは「' + esc(t.commonName || t.name) + '」' + (a.state !== '承認済' ? '<span class="tag wait">承認待ち</span>' : '') + '</div></div></button>').join('') : '<div class="empty">まだありません</div>');
  }
}

/* ============ 確認（管理者） ============ */
function renderReview() {
  const tools = TOOLS.filter(t => t.reviewState === '未確認');
  const toolTerms = new Set(DB.tools.map(t => t.termId));
  const als = DB.aliases.filter(a => a.state !== '承認済' && toolTerms.has(a.termId));
  const n = tools.length + als.length;
  $('revBadge').textContent = n; $('revBadge').hidden = !n;
  $('revTools').innerHTML = tools.length ? tools.map(t => '<div class="card" style="padding:10px">' + toolRow(t, '登録：' + (t.registeredBy || '')) +
    '<div class="row2"><button class="btn sm" data-tool="' + esc(t.id) + '">開いて直す</button><button class="btn sm ok" data-rev-tool="' + esc(t.id) + '">✓ 確認済にする</button></div></div>').join('')
    : '<div class="empty">ありません</div>';
  $('revAliases').innerHTML = als.length ? als.map((a, i) => {
    const w = termById(a.termId) || {};
    return '<div class="card" style="padding:12px"><div style="font-size:15px"><b>「' + esc(a.alias) + '」</b> → ' + esc(w.term) + '<span class="tag ' + (a.type === '聞き間違い' ? 'mis' : 'wait') + '">' + esc(a.type) + '</span></div>' +
      '<div class="hint">追加：' + esc(a.addedBy) + '　' + esc(a.addedAt) + '</div>' +
      '<div class="row2" style="margin-top:8px"><button class="btn sm danger" data-rev-al="' + i + '" data-ac="reject">✗ 却下</button><button class="btn sm ok" data-rev-al="' + i + '" data-ac="approve">✓ 承認</button></div></div>';
  }).join('') : '<div class="empty">ありません</div>';
  renderReview._als = als;
}
async function approveTool(id) {
  const t = toolById(id); if (!t) return;
  const ok = await post('dougu', { mode: 'review', key: id, action: 'approve' }, '確認済にしました');
  const w = termById(t.termId);
  if (ok && w && w.reviewState === '未確認') await post('yougo', { mode: 'review', kind: 'term', key: w.termId, action: 'approve' });   // 一緒に登録した言葉も確認済に
}

/* ============ 名前・管理者 ============ */
const isAdmin = () => !!lsGet(LS.admin, false);
const FALLBACK_STAFF = [];
/* 名前：①このアプリで選んだ名前 ②日報アプリで選んだ名前（同じサイトなら自動で引き継ぐ） */
function rawGet(k) { try { const v = localStorage.getItem(k); if (v == null) return ''; try { const j = JSON.parse(v); return typeof j === 'string' ? j : ''; } catch (e) { return v; } } catch (e) { return ''; } }
const me = () => lsGet(LS.me, '') || rawGet('nippou_author');
let STAFF_LIST = null, NAME_OPEN = false, AFTER_NAME = null;
function staffList() {
  if (STAFF_LIST && STAFF_LIST.length) return STAFF_LIST;
  const m = lsGet('nippou_masters', null); if (m && m.staff && m.staff.length) return m.staff;   // 日報アプリが覚えている名簿
  return lsGet(LS.me + '_staff', null) || FALLBACK_STAFF;
}
async function fetchStaff() {   // 名簿は裏で取る（10秒で打ち切り）。取れたら開いている名前画面を描き直す
  const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 10000);
  try {
    const r = await (await fetch(MASTERS_URL + '?action=masters', { cache: 'no-store', signal: ac.signal })).json();
    const s = (r.staff || []).map(x => typeof x === 'string' ? x : (x.name || x.staff || '')).filter(Boolean);
    if (s.length) { STAFF_LIST = s; lsSet(LS.me + '_staff', s); if (NAME_OPEN && $('nmIn')) drawName(); if (typeof onStaff === 'function') onStaff(); }
  } catch (e) { /* 名簿が取れなくても手入力で進める */ } finally { clearTimeout(tm); }
}
function chooseName(force, then) {
  if (me() && !force) { if (then) then(); return; }
  AFTER_NAME = then || null; NAME_OPEN = true; drawName();
}
function drawName() {
  const typed = $('nmIn') ? $('nmIn').value : me();
  openModal('<h3>あなたの名前</h3><p class="hint" style="margin:4px 0 12px">最初の1回だけ選びます。登録した人として記録されます。</p>' +
    '<div class="chips" style="margin-bottom:12px">' + staffList().map(s => '<button type="button" class="chip" data-nm="' + esc(s) + '">' + esc(s) + '</button>').join('') + '</div>' +
    '<input type="text" id="nmIn" placeholder="一覧にないときは名前を入力" value="' + esc(typed) + '">' +
    '<div class="row2" style="margin-top:12px"><button class="btn" data-act="later">あとで</button><button class="btn primary" data-act="ok">決定</button></div>',
    e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.act === 'later') { NAME_OPEN = false; AFTER_NAME = null; closeModal(); return; }
      const v = b.dataset.nm || (b.dataset.act === 'ok' ? $('nmIn').value.trim() : '');
      if (!v) { if (b.dataset.act === 'ok') toast('名前を選ぶか入力してください'); return; }
      lsSet(LS.me, v); $('meBtn').textContent = '👤 ' + v; NAME_OPEN = false; closeModal();
      const t = AFTER_NAME; AFTER_NAME = null; if (t) t();
    });
}

/* ============ モーダル・音声 ============ */
let modalHandler = null, modalLocked = false;
function openModal(html, handler, locked) { $('modal').innerHTML = html; modalHandler = handler; modalLocked = !!locked; $('modalBg').classList.add('show'); $('modal').scrollTop = 0; bindMics($('modal')); }
function closeModal() { $('modalBg').classList.remove('show'); $('modal').innerHTML = ''; modalHandler = null; }
$('modal').addEventListener('click', e => { if (modalHandler) modalHandler(e); });
$('modalBg').addEventListener('click', e => { if (e.target === $('modalBg') && !modalLocked) closeModal(); });
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function bindMics(root) {
  root.querySelectorAll('[data-mic]').forEach(b => {
    if (b._bound) return; b._bound = true;
    b.addEventListener('click', () => {
      const inp = $(b.dataset.mic);
      if (!SR || IOS) { inp.focus(); $('micHint').hidden = false; toast('キーボードのマイク🎤を押して話してください'); return; }
      const rec = new SR(); rec.lang = 'ja-JP'; rec.interimResults = false;
      b.textContent = '⏺'; rec.onend = () => { b.textContent = '🎤'; };
      rec.onresult = ev => { inp.value = ev.results[0][0].transcript.replace(/[。、]$/, ''); inp.dispatchEvent(new Event('input', { bubbles: true })); };
      rec.onerror = () => toast('うまく聞き取れませんでした');
      rec.start();
    });
  });
}

/* ============ 画面切り替え・描画 ============ */
function showTab(name) {
  ['search', 'reg', 'dict', 'review'].forEach(n => { $('tab-' + n).hidden = n !== name; });
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  window.scrollTo(0, 0);
  if (name === 'reg') chooseName();
}
function renderAll() { renderLocChips(); renderDict(); renderReview(); if ($('q').value.trim()) doSearch(); updateRegBtn(); }

/* ============ イベント ============ */
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
let qTimer;
$('q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(doSearch, 350); });
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(qTimer); doSearch(); $('q').blur(); } });
document.body.addEventListener('click', e => {
  if (e.target.closest('#modal')) return;
  const tb = e.target.closest('[data-tool]'); if (tb) return openTool(tb.dataset.tool, !!e.target.closest('#results'));
  const rt = e.target.closest('[data-rev-tool]'); if (rt) return approveTool(rt.dataset.revTool);
  const ra = e.target.closest('[data-rev-al]');
  if (ra) { const a = renderReview._als[Number(ra.dataset.revAl)]; if (a) post('yougo', { mode: 'review', kind: 'alias', key: { termId: a.termId, alias: a.alias }, action: ra.dataset.ac }, ra.dataset.ac === 'approve' ? '承認しました' : '却下しました'); return; }
  const lc = e.target.closest('[data-loc]');
  if (lc) {
    if (lc.dataset.loc === '__new') { $('locNew').hidden = false; $('locNew').focus(); return; }
    reg.loc = lc.dataset.loc; $('locNew').hidden = true; $('locNew').value = ''; renderLocChips(); saveDraft(); updateRegBtn();
  }
});
$('locNew').addEventListener('input', () => { reg.loc = $('locNew').value.trim(); document.querySelectorAll('#locChips .chip').forEach(c => c.classList.remove('on')); saveDraft(); updateRegBtn(); });
$('locNew').addEventListener('change', () => { if (reg.loc) { $('locNew').hidden = true; $('locNew').value = ''; renderLocChips(); } });
$('regName').addEventListener('input', () => { reg.name = $('regName').value.trim(); saveDraft(); updateRegBtn(); });
$('camBtn').addEventListener('click', () => pickPhoto(true, setRegPhoto));
$('libBtn').addEventListener('click', () => pickPhoto(false, setRegPhoto));
$('qMinus').addEventListener('click', () => { reg.qty = Math.max(1, reg.qty - 1); $('qN').textContent = reg.qty; saveDraft(); });
$('qPlus').addEventListener('click', () => { reg.qty++; $('qN').textContent = reg.qty; saveDraft(); });
$('regNext').addEventListener('click', regConfirm);
$('dictSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; dictView = b.dataset.v; document.querySelectorAll('#dictSeg button').forEach(x => x.classList.toggle('on', x === b)); renderDict(); });
$('meBtn').addEventListener('click', () => chooseName(true));

/* ============ 起動 ============ */
(function init() {
  const p = new URLSearchParams(location.search);
  if (p.get('admin') === '1') lsSet(LS.admin, true);
  if (p.get('admin') === '0') lsSet(LS.admin, false);
  $('tabReview').hidden = !isAdmin();
  $('demoBar').hidden = !DEMO;
  if (me()) $('meBtn').textContent = '👤 ' + me();
  const d = lsGet(LS.draft, null);
  if (d) { reg.loc = d.loc || ''; reg.name = d.name || ''; reg.qty = d.qty || 1; $('regName').value = reg.name; $('qN').textContent = reg.qty; }
  if (p.get('loc')) { reg.loc = p.get('loc'); saveDraft(); showTab('reg'); }   // 棚のQRラベル：dougu.html?loc=1F-A-2段
  if (p.get('q')) $('q').value = p.get('q');
  if (p.get('add')) {   // 段取りアプリの「未登録 → 登録する」から：名前を入れた状態で登録を開く
    reg.name = p.get('add'); $('regName').value = reg.name; saveDraft(); showTab('reg');
    setTimeout(() => toast('「' + reg.name + '」を登録します。保管場所を選んで、写真を撮ってください'), 300);
  }
  bindMics(document);
  load();
  fetchStaff();
})();

</script>
</body>
