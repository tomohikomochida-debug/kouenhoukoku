<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#214A37">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="タイムカード">
<title>タイムカード ｜ 庭乃持田園</title>
<style>
  :root{
    --paper:#F6F5F0; --card:#FFFFFF; --leaf:#214A37; --leaf-soft:#E5EDE7;
    --bark:#5B5750; --ink:#22231F; --tape:#C77C30; --line:#DCD9D0; --line-soft:#ECEAE3;
    --ok:#2E7D55; --danger:#B0533F; --danger-soft:#F6E3DE; --warn:#8E6412; --warn-soft:#F6ECD6;
    --rest:#6B5440; --rest-soft:#EFE7DF; --field:#FBFAF6; --radius:10px; --focus:#2F6FB0;
    --shadow:0 1px 0 rgba(34,35,31,.04), 0 8px 24px -16px rgba(34,35,31,.25);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);
    font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif;
    line-height:1.6;-webkit-text-size-adjust:100%;font-size:15px}
  button,select,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .num{font-variant-numeric:tabular-nums}
  [hidden]{display:none!important}

  header{position:sticky;top:0;z-index:30;background:var(--leaf);color:#fff;
    padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;
    box-shadow:0 2px 12px -6px rgba(0,0,0,.4)}
  .brand{display:flex;align-items:baseline;gap:10px;min-width:0}
  .brand a{color:#fff;text-decoration:none;font-size:13px;letter-spacing:.14em;opacity:.75;white-space:nowrap}
  .brand h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.02em;white-space:nowrap}
  .whoami{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
    border-radius:999px;padding:5px 12px;color:#fff;font-size:14px;white-space:nowrap}
  .whoami small{opacity:.75;font-size:12px}

  .tabs{position:sticky;top:calc(50px + env(safe-area-inset-top,0px));z-index:25;background:var(--paper);border-bottom:1px solid var(--line);
    display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tabs .in{display:flex;max-width:980px;margin:0 auto;min-width:max-content;padding:0 8px}
  .tabs button{background:none;border:none;font-size:14px;font-weight:700;color:var(--bark);padding:12px 12px;border-bottom:3px solid transparent;white-space:nowrap}
  .tabs button[aria-current="true"]{color:var(--leaf);border-bottom-color:var(--leaf)}

  main{max-width:980px;margin:0 auto;padding:14px 16px calc(80px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
  main.narrow{max-width:680px}
  .error-banner{background:var(--danger);color:#fff;padding:10px 16px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .error-banner button{background:#fff;color:var(--danger);border:none;border-radius:8px;padding:5px 12px;font-weight:700}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
  .panel h2{font-size:16px;margin:0}
  .muted{color:var(--bark)}
  .small{font-size:13px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .grow{flex:1 1 200px;min-width:0}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;font-size:14px;font-weight:600}
  .btn:hover{border-color:var(--leaf)}
  .btn.primary{background:var(--leaf);color:#fff;border-color:transparent}
  .btn.danger{background:var(--danger);color:#fff;border-color:transparent}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .linkbtn{background:none;border:none;color:var(--leaf);text-decoration:underline;padding:0;font-weight:600}
  .pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12.5px;border:1px solid var(--line);background:var(--paper);white-space:nowrap}
  .pill.ok{background:var(--leaf-soft);border-color:transparent}
  .pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
  .pill.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
  .pill.rest{background:var(--rest-soft);color:var(--rest);border-color:transparent}
  .pill.done{opacity:.55}
  .banner{border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
  .banner.danger{background:var(--danger-soft);color:var(--danger)}
  .banner.warn{background:var(--warn-soft);color:var(--warn)}
  .banner.ok{background:var(--leaf-soft)}
  .loading{padding:30px;text-align:center;color:var(--bark)}
  /* 裏で最新を読んでいるあいだ、上に細い線を流す */
  body.syncing header::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent) no-repeat;background-size:35% 100%;animation:sync 1.1s ease-in-out infinite}
  @keyframes sync{0%{background-position:-50% 0}100%{background-position:150% 0}}

  /* 打刻 */
  .clock{text-align:center;display:flex;flex-direction:column;gap:2px}
  .clock .date{color:var(--bark);font-size:14px}
  .clock .time{font-size:56px;font-weight:700;letter-spacing:.02em;line-height:1.1}
  .status{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
  .punch{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .punch button{border:none;border-radius:16px;padding:24px 8px;font-size:24px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
  .punch .in{background:var(--leaf);color:#fff}
  .punch .out{background:var(--rest);color:#fff}
  .punch button small{font-size:13px;font-weight:400;opacity:.9}
  .punch button:disabled{opacity:.35;cursor:not-allowed}
  .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
  label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--bark);font-weight:600;min-width:0}
  label.f input,label.f select,label.f textarea,.inp{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 11px;font-size:16px;color:var(--ink);min-width:0;width:100%;font-weight:400}

  /* 月の一覧 */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
  .stat{background:var(--paper);border-radius:10px;padding:8px 10px}
  .stat .k{font-size:12px;color:var(--bark)}
  .stat .v{font-size:20px;font-weight:700}
  .stat .v small{font-size:12px;font-weight:400;color:var(--bark);margin-left:2px}
  .days{display:flex;flex-direction:column}
  .day{display:grid;grid-template-columns:92px 1fr auto;gap:4px 10px;align-items:center;padding:10px 4px;border:none;border-top:1px solid var(--line-soft);background:none;text-align:left;width:100%}
  .day:first-child{border-top:none}
  .day:not(:disabled):hover{background:var(--paper)}
  .day:disabled{cursor:default;color:inherit}
  .day .d{font-weight:700;font-size:14px}
  .day .d.sun{color:var(--danger)} .day .d.sat{color:var(--focus)}
  .day .t{min-width:0}
  .day .h{font-weight:700;text-align:right}
  .day .chips{grid-column:2 / 4;display:flex;gap:4px;flex-wrap:wrap}
  .day.off .t{color:var(--bark)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff;align-self:flex-start;max-width:100%}
  .seg button{border:none;background:none;font-size:14px;font-weight:700;color:var(--bark);padding:8px 14px}
  .seg button[aria-current="true"]{background:var(--leaf);color:#fff}

  /* 表 */
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line-soft);text-align:right;white-space:nowrap}
  th{background:var(--paper);font-weight:700;font-size:12.5px;color:var(--bark)}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
  th:first-child{background:var(--paper)}
  tr:last-child td{border-bottom:none}
  tbody tr.click{cursor:pointer}
  tbody tr.click:hover td{background:var(--paper)}
  td.l{text-align:left;white-space:normal;min-width:120px}
  td input,td select{font-size:14px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--field);min-width:0}
  .flaglist{display:flex;flex-direction:column;gap:6px}
  .flagitem{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-radius:10px;background:var(--paper)}
  pre.csv{margin:0;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12px;line-height:1.5;overflow-x:auto;white-space:pre}
  .pnav{display:flex;align-items:center;gap:8px}
  .pnav b{font-size:16px;min-width:5em;text-align:center}

  /* カレンダー（年間休日・出勤） */
  .yeargrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
  .month{border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0;scroll-margin-top:120px}
  .month h3{margin:0;font-size:14px;text-align:center;padding:6px;background:var(--paper)}
  .mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,1.3fr);gap:1px;background:var(--line);border-top:1px solid var(--line)}
  .mgrid .hd{font-size:11px;text-align:center;color:var(--bark);padding:3px 0;background:var(--card)}
  .cd{position:relative;height:44px;border:none;background:var(--card);padding:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink);min-width:0}
  .cd .dn{position:absolute;top:2px;left:3px;font-size:10px;color:var(--bark)}
  .cd .dv{font-variant-numeric:tabular-nums;white-space:nowrap}
  .cd .dv.sm{font-size:10px;letter-spacing:-.02em}
  .cd .dv.xs{font-size:8.5px;letter-spacing:-.04em}
  .cd.off{background:var(--danger-soft)}
  .cd.off .dv{color:var(--danger);font-weight:700}
  .cd .hn{position:absolute;bottom:1px;left:1px;right:1px;font-size:9px;color:var(--bark);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cd .hn.tag{color:var(--rest);font-weight:700}
  .cd.wk{font-weight:700;font-size:11.5px;background:var(--paper)}
  .cd:disabled{cursor:default;color:var(--ink)}
  .cd:not(:disabled):hover{box-shadow:inset 0 0 0 2px var(--leaf)}
  .cd.changed{box-shadow:inset 0 0 0 2px var(--tape)}
  .cd.att{background:var(--leaf-soft)} .cd.att .dv{font-weight:700}
  .cd.yu{background:var(--rest-soft)} .cd.yu .dv{color:var(--rest);font-weight:700}
  .cd.ab{background:var(--paper)} .cd.ab .dv{color:var(--bark);font-weight:700}
  .cd.und{outline:1.5px dashed var(--rest);outline-offset:-4px}
  .cd.ng{background:var(--card);box-shadow:inset 0 0 0 2px var(--danger)} .cd.ng .dv{color:var(--danger);font-weight:700}
  .cd.fut .dv{color:var(--bark)}
  .cd.pre{background:var(--paper)}
  .cd.plan{opacity:.8;background-image:repeating-linear-gradient(135deg,transparent 0 5px,var(--card) 5px 7px)}
  .cd .fl,.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn)}
  .cd .fl{position:absolute;top:3px;right:3px}
  .cd .cm{position:absolute;top:2px;right:2px;font-size:8px;color:var(--rest)}

  /* シート */
  .sheet{position:fixed;inset:0;background:rgba(10,14,11,.45);display:flex;align-items:flex-end;justify-content:center;z-index:60;padding:16px}
  .sheet .box{background:var(--card);border-radius:16px;max-width:560px;width:100%;max-height:calc(100% - 16px);overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  @media (min-width:640px){.sheet{align-items:center}}
  .sheet h3{margin:0;font-size:17px}
  .err{color:var(--danger);font-size:13px}
  .leavebtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .leavebtns.two{grid-template-columns:repeat(2,1fr)}
  .lbtn{border:1px solid var(--line);background:var(--rest-soft);color:var(--rest);border-radius:12px;padding:14px 4px;font-size:16px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
  .lbtn small{font-size:12px;font-weight:400}
  .lbtn.on{background:var(--rest);color:#fff;border-color:transparent}
  .lbtn.ab{background:var(--paper);color:var(--bark)}
  .lbtn.ab.on{background:var(--bark);color:#fff}

  /* ログイン */
  .login{max-width:380px;margin:20px auto;width:100%}
  .names{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
  .names button{padding:14px 6px;font-size:16px;font-weight:700;border:1px solid var(--line);border-radius:10px;background:var(--card)}
  .pinview{display:flex;justify-content:center;gap:14px;padding:8px 0}
  .pinview span{width:16px;height:16px;border-radius:50%;border:2px solid var(--bark)}
  .pinview span.on{background:var(--ink);border-color:var(--ink)}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .pad button{padding:14px 0;font-size:22px;border-radius:12px;border:1px solid var(--line);background:var(--paper)}
  .qrbox{display:flex;flex-direction:column;align-items:center;gap:8px}
  .qrbox svg{width:220px;height:220px;max-width:100%}
  .code{font-size:32px;font-weight:700;letter-spacing:.2em}

  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;
    background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}
  .toast.err{background:var(--danger)}
  @media (max-width:420px){.clock .time{font-size:46px}.day{grid-template-columns:80px 1fr auto}}

  /* 印刷（年間休日カレンダー A4縦1枚・出勤簿） */
  #print{display:none}
  @media print{
    @page{size:A4 portrait;margin:8mm}
    body{background:#fff}
    header,.tabs,main,#banner,#layer,.toast{display:none!important}
    #print{display:block;color:#000;font-size:9pt}
    .pr-title{font-size:13pt;font-weight:700;margin:0 0 2mm}
    .pr-year{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5mm}
    .pr-m h4{margin:0;text-align:center;font-size:9pt;border:1px solid #000;border-bottom:none;padding:.6mm 0}
    .pr-m table{width:100%;border-collapse:collapse;table-layout:fixed}
    .pr-m td,.pr-m th{border:1px solid #000;padding:0 .5mm;height:7mm;font-size:7pt;text-align:center;vertical-align:middle;position:static;background:#fff}
    .pr-m th{height:4mm;font-size:6.5pt}
    .pr-m td .n{display:block;text-align:left;font-size:5.5pt;line-height:1}
    .pr-m td.off{color:#c00;font-weight:700}
    .pr-m td .h{display:block;font-size:4.5pt;line-height:1;white-space:nowrap;overflow:hidden}
    .pr-sum{width:100%;border-collapse:collapse;margin-top:3mm}
    .pr-sum th,.pr-sum td{border:1px solid #000;padding:.8mm 1.2mm;font-size:8pt;text-align:right;position:static;background:#fff;white-space:nowrap}
    .pr-sum th:first-child,.pr-sum td:first-child{text-align:left}
    .pr-page{page-break-after:always}
    .pr-page:last-child{page-break-after:auto}
    .pr-att{width:100%;border-collapse:collapse;margin-top:2mm}
    .pr-att th,.pr-att td{border:1px solid #000;padding:.6mm 1.2mm;font-size:8pt;text-align:left;position:static;background:#fff;white-space:nowrap}
    .pr-att td.r{text-align:right}
    .pr-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:1mm}
  }
</style>
</head>
<body>
<header>
  <div class="brand"><a href="index.html">庭乃持田園</a><h1>タイムカード</h1></div>
  <button class="whoami" id="whoami" data-act="menu" hidden></button>
</header>
<nav class="tabs" id="tabs" hidden><div class="in" id="tabsIn"></div></nav>
<div class="error-banner" id="banner" hidden></div>
<main id="main" class="narrow"><div class="loading">読み込み中…</div></main>
<div id="layer"></div>
<div class="toast" id="toast" role="status"></div>
<div id="print"></div>

<script>
'use strict';
/* ===================== 設定 ===================== */
// 現場アプリの GAS（app=timecard。本体は gas/timecard_app.gs）
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzCkxdDCT3hnSEbtpcbQcvOcsehvX5pLUzZ8xFBIxQ40qvRmwmnixJ3q_vEr7X0v-vm7A/exec';
// 現場名の候補は日報のマスタから読む
const NIPPOU_GAS_URL = 'https://script.google.com/macros/s/AKfycbz2iP9eN-79vKTgOvfY6_Vd9rJZ9IMuz4ILkrxE79Muqq0pvTZAAhBG3cMXpZV6ZU1-/exec';
const LS = { token:'tc_token', me:'tc_me', names:'tc_names', queue:'tc_queue', bio:'tc_bio', site:'tc_site', bioAsked:'tc_bio_asked', cache:'tc_cache' };
const KINDS = ['出勤','休日出勤','休み','振休','代休','雨天中止（半日）','雨天中止（全日）','公休'];
const REASONS = ['打ち忘れ','電池切れ','電波なし','時刻の間違い','暗証番号忘れ','その他'];
const ROLE_LABEL = { boss:'親方', office:'事務担当', staff:'スタッフ', none:'打刻なし' };
const LEGAL_DAY = 480, LEGAL_WEEK = 2400;

/* ===================== 小道具 ===================== */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toMin = s => { if (!s) return null; const [h,m] = String(s).split(':').map(Number); return h*60+m; };
const hm = m => `${Math.floor(m/60)}:${pad(Math.round(m)%60)}`;
const h1 = m => (Math.round(m/6)/10).toFixed(1);
const D = s => new Date(s+'T00:00:00Z');
const isoD = d => d.toISOString().slice(0,10);
const wd = s => D(s).getUTCDay();
const addDays = (s,n) => { const d = D(s); d.setUTCDate(d.getUTCDate()+n); return isoD(d); };
const weekStart = s => addDays(s, -((wd(s)+6)%7));
const datesIn = (a,b) => { const o=[]; for (let s=a; s<=b; s=addDays(s,1)) o.push(s); return o; };
const WD = '日月火水木金土';
const dlabel = s => `${Number(s.slice(5,7))}/${Number(s.slice(8))}（${WD[wd(s)]}）`;
const short2 = s => `${Number(s.slice(5,7))}/${Number(s.slice(8))}`;
const lastDay = (y,m) => new Date(Date.UTC(y,m,0)).getUTCDate();
const ym = (y,m) => `${y}-${pad(m)}`;
const JST = new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
const jstParts = (t=new Date()) => { const s = JST.format(t); return { date:s.slice(0,10), time:s.slice(11,16) }; };
const today = () => jstParts().date;
const nowHM = () => jstParts().time;
const fyOf = s => { const y=+s.slice(0,4), m=+s.slice(5,7); return m>=4 ? y : y-1; };
const fyStart = fy => `${fy}-04-01`, fyEnd = fy => `${fy+1}-03-31`;
const fyDates = fy => datesIn(fyStart(fy), fyEnd(fy));
const MONTHS = fy => Array.from({length:12}, (_,i) => ({ y: i<9 ? fy : fy+1, m: (i+3)%12+1 }));
// 20日締め：期間 'YYYY-MM' は前月21日〜当月20日
const periodOf = s => { const y=+s.slice(0,4), m=+s.slice(5,7), d=+s.slice(8,10); if (d<=20) return s.slice(0,7); return m===12 ? `${y+1}-01` : ym(y,m+1); };
const periodRange = p => { const y=+p.slice(0,4), m=+p.slice(5,7); const py = m===1 ? y-1 : y, pm = m===1 ? 12 : m-1; return { from:`${ym(py,pm)}-21`, to:`${p}-20`, label:`${m}月分` }; };
const shiftPeriod = (p,n) => { let y=+p.slice(0,4), m=+p.slice(5,7)+n; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return ym(y,m); };
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
const lsGet = (k, d=null) => { try { const v = localStorage.getItem(k); return v===null ? d : JSON.parse(v); } catch(e){ return d; } };
const lsSet = (k, v) => { try { if (v===null || v===undefined) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const gasReady = () => GAS_URL.indexOf('PASTE_') !== 0;
const device = () => (navigator.userAgent.match(/iPhone|iPad|Android[^;)]*|Windows|Macintosh/)||['端末'])[0];

/* ===================== 状態 ===================== */
const S = {
  token: lsGet(LS.token), me: lsGet(LS.me), staff: [], days: {}, cal: {}, calExists: {}, hol: {}, closings: {}, settings: { start:'07:30', end:'17:10', break:'100' },
  calRests: [], loaded: null, view: '', recMode: 'cal', period: periodOf(today()), fy: fyOf(today()), detail: null,
  yaStaff: null, yaMonth: today().slice(0,7), day: null, edit: null, confirm: null, menu: false, code: null,
  calEdit: null, reflect: null, history: null, staffEdit: null, setEdit: null, login: { step:'names', who:null, pin:'', pin1:'', code:'', err:'' },
  queue: lsGet(LS.queue, []).map(x => { delete x.waiting; return x; }), sites: [], busy: false, pinAsk: null,
};
const K = (id,s) => `${id}|${s}`;
const byId = id => S.staff.find(x => x.id === id) || (S.me && S.me.id === id ? S.me : null);
const isAdmin = () => !!(S.me && (S.me.role === 'boss' || S.me.role === 'office'));
const isBoss = () => !!(S.me && S.me.role === 'boss');
const isHourly = id => (byId(id) || {}).pay === 'hourly';
const getDay = (id,s) => S.days[K(id,s)];
const hasContent = d => !!(d && (d.kind || d.in || d.out));
const isClosed = s => { const c = S.closings[periodOf(s)]; return !!(c && c.status === 'closed'); };
const canEdit = id => isAdmin() || (S.me && id === S.me.id);
const punchStaff = () => S.staff.filter(s => s.active && s.punch);
/** その期間に記録がある人は、在籍を外していても出す */
const staffInPeriod = pr => S.staff.filter(s => s.active || datesIn(pr.from, pr.to).some(x => hasContent(getDay(s.id, x))));

/* ===================== 勤務時間の計算 ===================== */
const SET = () => { const st = toMin(S.settings.start), en = toMin(S.settings.end), br = Number(S.settings.break)||0; return { start:st, end:en, brk:br, shotei: Math.max(0, en-st-br) }; };
const isOff = s => { const c = S.cal[fyOf(s)]; return c ? c.has(s) : (wd(s)===0 || !!S.hol[s]); };
const dayType = s => isOff(s) ? (wd(s)===0 ? '法定休日' : '所定休日') : '出勤日';
function workMin(d){
  if (!d || !d.in || !d.out) return 0;
  let a = toMin(d.in), b = toMin(d.out); if (b < a) b += 1440;
  return Math.max(0, b - a - (d.brk === '' || d.brk === undefined ? SET().brk : Number(d.brk)||0));
}
function nightMin(d){
  if (!d || !d.in || !d.out) return 0;
  let a = toMin(d.in), b = toMin(d.out); if (b < a) b += 1440;
  const ov = (c,e) => Math.max(0, Math.min(b,e) - Math.max(a,c));
  return ov(0,300) + ov(1320,1740) + ov(2760,3180);
}
function shoteiMin(id, s, w){
  if (isHourly(id)) return w > 0 && dayType(s) !== '法定休日' ? Math.min(SET().shotei, LEGAL_DAY) : 0;
  return dayType(s) === '出勤日' ? SET().shotei : 0;
}
function weekLimit(id, ws){
  if (isHourly(id)) return LEGAL_WEEK;
  let t = 0; for (let i=0;i<7;i++){ const s = addDays(ws,i); if (dayType(s)==='出勤日') t += SET().shotei; }
  return Math.max(LEGAL_WEEK, t);
}
/** 1日ごとの内訳（1日 → 1週の順で時間外を数える） */
function breakdown(id, s){
  const d = getDay(id,s), w = workMin(d);
  const r = { w, night: Math.min(w, nightMin(d)), shotei:0, hoteinai:0, ot:0, holiday:0 };
  if (!w) return r;
  if (dayType(s) === '法定休日'){ r.holiday = w; return r; }
  const dailyLimit = Math.max(LEGAL_DAY, isHourly(id) ? 0 : shoteiMin(id,s,w));
  const within = Math.min(w, dailyLimit), sp = Math.min(w, shoteiMin(id,s,w));
  r.ot = w - within; r.shotei = Math.min(sp, within); r.hoteinai = within - r.shotei;
  const ws = weekStart(s); let cum = 0;
  for (let x = ws; x < s; x = addDays(x,1)){
    const ww = workMin(getDay(id,x)); if (!ww || dayType(x)==='法定休日') continue;
    cum += Math.min(ww, Math.max(LEGAL_DAY, isHourly(id) ? 0 : shoteiMin(id,x,ww)));
  }
  const L = weekLimit(id, ws);
  const over = Math.max(0, cum + within - Math.max(L, cum));
  if (over > 0){ const a = Math.min(over, r.hoteinai); r.hoteinai -= a; r.shotei -= Math.min(over - a, r.shotei); r.ot += over; }
  return r;
}
const isRest = d => !!d && d.kind === '休み';
const restPart = d => d && d.half==='am' ? '午前' : d && d.half==='pm' ? '午後' : '';
const payWord = d => d.pay==='paid' ? '有休' : d.pay==='unpaid' ? '欠勤' : '確認中';
const kindLabel = (d, id) => !d ? '' : isRest(d) ? (isHourly(id) ? `${restPart(d)}休み${d.pay==='paid'?'（有休）':''}` : `${restPart(d)}休み（${payWord(d)}）`) : (d.kind || '');
/** 対象期間（1年）の総枠を超えた時間（1年単位の変形労働制の3段階目） */
function fyExcess(id, fy){
  const st = byId(id); if (!st || isHourly(id)) return { total:0, limit:0, excess:0 };
  let a = fyStart(fy); if (st.join && st.join > a) a = st.join; if (S.settings.useFrom && S.settings.useFrom > a) a = S.settings.useFrom;
  const b = fyEnd(fy); if (a > b) return { total:0, limit:0, excess:0 };
  let total = 0; for (const s of datesIn(a,b)){ const r = breakdown(id,s); total += r.shotei + r.hoteinai; }
  const limit = LEGAL_WEEK * datesIn(a,b).length / 7;
  return { total, limit, excess: Math.max(0, total - limit) };
}
function summarize(id, from, to){
  const t = { days:0, total:0, shotei:0, hoteinai:0, jikangai:0, kyujitsu:0, shinya:0, late:0, kekkin:0, yukyu:0, furi:0, daikyu:0, open:0, fyAdd:0, fyPremiumOnly:0 };
  const st = byId(id); const set = SET();
  for (const s of datesIn(from,to)){
    const d = getDay(id,s);
    if (openFlag(flags(id,s,d), d)) t.open += 1;
    if (!d) continue;
    const kind = d.kind || '出勤';
    if (kind==='休み'){ if (d.pay==='paid') t.yukyu += d.half ? .5 : 1; else if (d.pay==='unpaid' && !d.half && !isHourly(id)) t.kekkin += 1; }
    if (kind==='振休') t.furi += 1;
    if (kind==='代休') t.daikyu += 1;
    const r = breakdown(id,s);
    if (r.w > 0){
      t.days += 1; t.total += r.w; t.shinya += r.night; t.shotei += r.shotei; t.hoteinai += r.hoteinai; t.jikangai += r.ot; t.kyujitsu += r.holiday;
      const lateOk = !isHourly(id) && (kind==='出勤' || (kind==='休み' && d.half && d.pay==='unpaid'));
      const crossed = toMin(d.out) < toMin(d.in);
      if (lateOk && dayType(s)==='出勤日') t.late += Math.max(0, toMin(d.in)-set.start) + (crossed ? 0 : Math.max(0, set.end - toMin(d.out)));
    }
  }
  // 対象期間の最後（3/31）を含む締め（3/21〜4/20）で、総枠を超えた分を時間外に足す
  if (st && !isHourly(id) && from.slice(8) === '21' && to.slice(8) === '20' && fyOf(from) !== fyOf(to)){
    const endFy = fyOf(from);
    { const x = fyExcess(id, endFy); if (x.excess > 0){ const mv = Math.min(x.excess, t.hoteinai); t.fyAdd = mv; t.fyPremiumOnly = x.excess - mv; t.jikangai += mv; t.hoteinai -= mv; } }
  }
  return t;
}

/* ===================== 特記 ===================== */
function flags(id, s, d){
  const st = byId(id) || {}; const f = []; const td = today();
  if (!hasContent(d)){
    if (s < td && s >= (S.settings.useFrom || '') && dayType(s)==='出勤日' && st.punch && !isHourly(id) && !(st.join && s < st.join) && !(d && d.checked)) f.push({t:'記録なし', lv:'danger'});
    return f;
  }
  if (d.src==='あとから') f.push({t:'あとから入力', lv:'warn'});
  if (d.src==='代理') f.push({t:'代理入力', lv:'warn'});
  if (d.src==='修正') f.push({t:'修正あり', lv:'warn'});
  if (isRest(d) && d.leaveBy && !isHourly(id)) f.push({t:`${restPart(d)}休みの登録（${d.leaveBy === st.disp ? '本人' : d.leaveBy}）`, lv:'warn'});
  if (isRest(d) && d.half && !d.in && !d.out && s < td && dayType(s)==='出勤日' && !isHourly(id)) f.push({t:'半日休みの日に打刻なし', lv:'danger'});
  if (isRest(d) && !d.pay && !isHourly(id)) f.push({t:'有休か欠勤か確認中', lv:'danger', must:true});
  if (d.in && !d.out && s < td) f.push({t:'退勤なし', lv:'danger'});
  if (d.out && !d.in) f.push({t:'出勤なし', lv:'danger'});
  if ((Number(d.lag)||0) >= 10) f.push({t:`送信遅れ ${d.lag}分`, lv:'warn'});
  if (d.in && d.src==='打刻' && !d.gps) f.push({t:'位置なし', lv:'warn'});
  if (d.bio==='unverified') f.push({t:'本人確認なし', lv:'warn'});
  return f;
}
const openFlag = (fl, d) => fl.some(f => f.must) || (fl.length > 0 && !(d && d.checked));

/* ===================== 通信 ===================== */
function fetchT(url, opts, ms){ const ac = new AbortController(); const tm = setTimeout(() => ac.abort(), ms||30000);
  return fetch(url, Object.assign({}, opts||{}, {signal:ac.signal})).finally(() => clearTimeout(tm)); }
async function api(action, body={}, ms){
  if (!gasReady()) throw new Error('GAS の URL がまだ設定されていません（timecard.html の GAS_URL）');
  let res;
  try { res = await fetchT(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({ app: 'timecard', action, token: S.token }, body)) }, ms); }
  catch(e){ const x = new Error('つながりませんでした。電波のよい所でもう一度試してください'); x.network = true; throw x; }
  let d; try { d = await res.json(); } catch(e){ throw new Error('サーバーの返事が読めませんでした'); }
  if (!d.ok){ const x = new Error(d.error || 'エラーが起きました'); x.code = d.code; if (d.code === 'auth') logoutLocal(); throw x; }
  return d;
}
function showBanner(msg, retry){
  const b = $('#banner');
  if (!msg){ b.hidden = true; b.innerHTML = ''; return; }
  b.hidden = false; b.innerHTML = `<span class="grow">${esc(msg)}</span>${retry ? '<button data-act="retry">もう一度</button>' : ''}`;
}
function toast(msg, err){ const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : ''); clearTimeout(toast.t); toast.t = setTimeout(() => t.className = 'toast', err ? 4000 : 2600); }

/* ===================== 読み込み ===================== */
function neededRange(){
  const pr = periodRange(S.period);
  const fyA = fyStart(Math.min(S.fy, fyOf(pr.from)));
  let from = fyA < pr.from ? fyA : pr.from;
  let to = fyEnd(S.fy) > pr.to ? fyEnd(S.fy) : pr.to;
  return { from: addDays(from, -7), to };
}
/* 前回読んだデータを端末に残しておき、開いたらすぐそれを出す（裏で最新に入れかえる） */
function applyData(d){
  S.days = {};
  (d.days || []).forEach(x => { S.days[K(x.staffId, x.date)] = x; });
  S.cal = {}; S.calExists = {}; Object.keys(d.cal || {}).forEach(fy => { S.cal[fy] = new Set(d.cal[fy].off); S.calExists[fy] = !!d.cal[fy].exists; });
  S.hol = d.holidays || {}; S.closings = d.closings || {}; S.settings = d.settings || S.settings;
  S.staff = d.staff || [];
  if (d.calRests) S.calRests = d.calRests;
}
function cacheGet(){ const c = lsGet(LS.cache); return c && S.me && c.staffId === S.me.id && c.d ? c : null; }
function cachePut(patch){
  if (!S.me) return;
  const c = Object.assign(cacheGet() || { staffId: S.me.id }, patch, { at: Date.now() });
  try { localStorage.setItem(LS.cache, JSON.stringify(c)); } catch(e){ try { localStorage.removeItem(LS.cache); } catch(x){} }
}
function loadCache(){
  const c = cacheGet(), r = neededRange();
  if (!c || !c.range || c.range.from > r.from || c.range.to < r.to) return false;
  applyData(Object.assign({}, c.d, { calRests: c.calRests || [] }));
  S.loaded = c.range; S.stale = true;
  return true;
}
let loadSeq = 0;
async function loadData(force){
  const r = neededRange();
  if (!force && S.loaded && S.loaded.from <= r.from && S.loaded.to >= r.to) return;
  const seq = ++loadSeq;
  S.busy = true; render();
  try {
    const d = await api('data', { from: r.from, to: r.to }, 45000);
    if (seq !== loadSeq) return;
    if (d.me && S.me && d.me.id === S.me.id){ S.me = Object.assign({}, S.me, d.me); lsSet(LS.me, S.me); }
    const pend = Object.values(S.days).filter(x => x.pending);
    applyData(d);
    pend.forEach(x => { const k = K(x.staffId, x.date); if (S.queue.some(q => q.staffId === x.staffId)) S.days[k] = Object.assign({}, S.days[k] || {}, x); });
    S.loaded = r; S.stale = false; showBanner('');
    const keep = Object.assign({}, d); delete keep.me; delete keep.calRests;
    cachePut({ range: r, d: keep });
    loadCalRests(r);
  } catch(e){
    if (seq !== loadSeq) return;
    if (e.code === 'auth'){ S.busy = false; render(); loadNames(); return; }
    showBanner((S.loaded ? '最新のデータを読み込めませんでした（前に読んだ内容を出しています）：' : 'データを読み込めませんでした：') + e.message, true);
  }
  if (seq === loadSeq){ S.busy = false; render(); }
}
async function loadCalRests(r){
  try {
    const d = await api('calRests', { from: r.from, to: r.to }, 45000);
    S.calRests = d.calRests || [];
    cachePut({ calRests: S.calRests });
    if (d.calWarning) toast(d.calWarning, true);
    render();
  } catch(e){ /* カレンダーが読めなくても、ほかはそのまま使える */ }
}
function putDay(x){ if (!x || !x.staffId) return; S.days[K(x.staffId, x.date)] = x; }
async function loadSites(){
  const flat = m => { const out = []; Object.values((m && m.siteGroups) || {}).forEach(g => { if (Array.isArray(g)) out.push(...g); else Object.values(g||{}).forEach(a => out.push(...(a||[]))); }); return out; };
  S.sites = flat(lsGet('nippou_masters'));
  try { const r = await fetchT(NIPPOU_GAS_URL + '?action=masters', {}, 15000); const m = await r.json(); if (m && m.siteGroups){ S.sites = flat(m); lsSet('nippou_masters', { staff:m.staff, siteGroups:m.siteGroups }); } } catch(e){}
  S.sites = ['事務所', ...new Set(S.sites.filter(Boolean))];
}

/* ===================== 生体認証（顔認証・指紋認証） ===================== */
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/') + '==='.slice((s.length+3)%4)), c => c.charCodeAt(0));
const rand = n => crypto.getRandomValues(new Uint8Array(n));
const bioInfo = () => { const b = lsGet(LS.bio); return b && S.me && b.staff === S.me.id ? b : null; };
async function bioAvailable(){ try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch(e){ return false; } }
async function bioRegister(){
  try {
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: rand(32), rp: { name: '庭乃持田園 タイムカード' },
      user: { id: new TextEncoder().encode(S.me.id), name: S.me.disp, displayName: S.me.name },
      pubKeyCredParams: [{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection: { authenticatorAttachment:'platform', userVerification:'required', residentKey:'discouraged' },
      timeout: 60000, attestation: 'none' } });
    lsSet(LS.bio, { id: b64u(cred.rawId), staff: S.me.id, at: Date.now() });
    toast('顔認証・指紋認証を登録しました'); return true;
  } catch(e){ toast('登録できませんでした。もう一度試すか、暗証番号で使ってください', true); return false; }
}
async function bioCheck(){
  const b = bioInfo(); if (!b) return 'none';
  try {
    await navigator.credentials.get({ publicKey: { challenge: rand(32), allowCredentials: [{ type:'public-key', id: unb64u(b.id) }], userVerification:'required', timeout:60000 } });
    return 'bio';
  } catch(e){ return 'fail'; }
}
/** 生体認証 → だめなら暗証番号。打刻の前に呼ぶ */
async function confirmMe(){
  const r = await bioCheck();
  if (r === 'bio' || r === 'none') return r;
  return new Promise(resolve => { S.pinAsk = { pin:'', err:'', resolve }; render(); });
}

/* ===================== 打刻 ===================== */
function getPos(){
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    let done = false; const fin = v => { if (!done){ done = true; res(v); } };
    setTimeout(() => fin(null), 7000);
    navigator.geolocation.getCurrentPosition(p => fin({ lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6), acc: Math.round(p.coords.accuracy) }), () => fin(null), { enableHighAccuracy:true, timeout:6500, maximumAge:60000 });
  });
}
async function doPunch(type){
  S.confirm = null;
  const bio = await confirmMe();
  if (bio === 'cancel') { render(); return; }
  const pressedAt = Date.now();
  const site = ($('#site') && $('#site').value.trim()) || '';
  const kind = ($('#kind') && $('#kind').value) || '出勤';
  if (site) lsSet(LS.site, site);
  toast('記録しています…');
  // 押した時刻で、まず端末に残して画面に出す（位置を待つあいだにアプリを閉じても消えない）
  const item = { staffId: S.me.id, clientId: uuid(), type, pressedAt, site, kind, bio, device: device(), lat: '', lng: '', acc: '' };
  S.queue.push(item); lsSet(LS.queue, S.queue);
  const t = jstParts(new Date(pressedAt));
  const k = K(S.me.id, t.date), old = S.days[k] || { staffId:S.me.id, date:t.date, kind, brk:S.settings.break };
  S.days[k] = Object.assign({}, old, type==='in' ? { in:t.time } : { out:t.time }, { site: site || old.site, src: old.src || '打刻', pending:true });
  render();
  item.waiting = true;
  const pos = await getPos();
  if (pos){ Object.assign(item, { lat: pos.lat, lng: pos.lng, acc: pos.acc }); if (S.days[k]) S.days[k].gps = true; }
  delete item.waiting; lsSet(LS.queue, S.queue);
  await flushQueue(true);
}
let flushing = false;
async function flushQueue(fromPunch){
  if (flushing || !S.token || !S.me) return;
  const mine = () => S.queue.filter(x => (!x.staffId || x.staffId === S.me.id) && !x.waiting);
  if (!mine().length) return;
  flushing = true;
  let sent = 0;
  while (S.token && S.me && mine().length){
    const it = mine()[0];
    const drop = () => { S.queue.splice(S.queue.indexOf(it), 1); lsSet(LS.queue, S.queue); };
    try {
      const r = await api('punch', it, 25000);
      putDay(r.day); drop(); sent++;
      if (fromPunch) toast(`${it.type==='in'?'出勤':'退勤'} ${jstParts(new Date(it.pressedAt)).time} を記録しました`);
    } catch(e){
      if (e.code === 'closed' || e.code === 'invalid'){ drop(); toast(e.message, true); continue; }
      if (e.network){ if (fromPunch) toast('電波がないので端末に保存しました。つながったら送ります'); }
      else toast('打刻は端末に保存してあります。あとで自動で送ります（' + e.message + '）', true);
      break;
    }
  }
  flushing = false;
  if (sent && !fromPunch) toast(`保存していた打刻 ${sent}件を送りました`);
  render();
}

/* ---------- ログイン ---------- */
function loginView(){
  const L = S.login;
  const dots = n => `<div class="pinview">${[0,1,2,3].map(i => `<span class="${i < n ? 'on' : ''}"></span>`).join('')}</div>`;
  const keypad = act => `<div class="pad">${['1','2','3','4','5','6','7','8','9','戻る','0','消す'].map(k => `<button data-act="${act}" data-arg="${k}">${k}</button>`).join('')}</div>`;
  const err = L.err ? `<div class="err" style="text-align:center">${esc(L.err)}</div>` : '';
  if (L.step === 'code'){
    return `<section class="panel login"><h2>登録コードで始める</h2>
      <div class="small muted">担当から受け取った6桁の登録コードを入れてください。</div>
      <input class="inp num" id="codeIn" inputmode="numeric" maxlength="6" value="${esc(L.code)}" placeholder="6桁の数字" style="font-size:24px;letter-spacing:.2em;text-align:center">
      ${err}<div class="row"><button class="btn" data-act="lstep" data-arg="names">戻る</button><span class="grow"></span><button class="btn primary" data-act="codeNext">次へ</button></div></section>`;
  }
  if (L.step === 'newpin' || L.step === 'newpin2'){
    const n = L.step === 'newpin' ? L.pin.length : L.pin.length;
    return `<section class="panel login"><h2>${L.step === 'newpin' ? '暗証番号を決めてください' : 'もう一度入れてください'}</h2>
      <div class="small muted">4桁の数字です。顔認証・指紋認証がうまくいかないときの予備に使います。誰にも教えないでください。</div>
      ${dots(n)}${err}${keypad('npk')}</section>`;
  }
  if (L.step === 'pin'){
    const s = (lsGet(LS.names, []) || []).find(x => x.id === L.who) || {};
    return `<section class="panel login"><h2>${esc(s.disp || s.name || '')} さんの暗証番号</h2>${dots(L.pin.length)}${err}${keypad('pk')}</section>`;
  }
  const names = lsGet(LS.names, []) || [];
  return `<section class="panel login"><h2>名前を選んでください</h2>

    ${err}
    <div class="row"><span class="grow small muted">はじめての人は、担当から登録コードをもらってください。</span><button class="btn" data-act="lstep" data-arg="code">登録コードで始める</button></div>
  </section>`;
}
async function loadNames(){ try { const d = await api('names'); lsSet(LS.names, d.names); render(); } catch(e){ S.login.err = e.message; render(); } }
async function loginKey(k, mode){
  const L = S.login;
  if (k === '戻る'){ L.step = mode === 'pk' ? 'names' : (L.step === 'newpin2' ? 'newpin' : 'code'); L.pin = ''; L.err = ''; render(); return; }
  if (k === '消す'){ L.pin = L.pin.slice(0,-1); render(); return; }
  if (L.pin.length >= 4) return;
  L.pin += k; L.err = ''; render();
  if (L.pin.length < 4) return;
  if (mode === 'pk'){
    try { const d = await api('login', { staffId: L.who, pin: L.pin, device: device() }); afterLogin(d); }
    catch(e){ L.pin = ''; L.err = e.message; render(); }
  } else if (L.step === 'newpin'){ L.pin1 = L.pin; L.pin = ''; L.step = 'newpin2'; render(); }
  else {
    if (L.pin !== L.pin1){ L.pin = ''; L.pin1 = ''; L.step = 'newpin'; L.err = '2回の番号が違いました。もう一度決めてください'; render(); return; }
    try { const d = await api('enroll', { code: L.code, pin: L.pin, device: device() }); history.replaceState(null, '', location.pathname); afterLogin(d); }
    catch(e){ L.pin = ''; L.pin1 = ''; L.step = 'code'; L.err = e.message; render(); }
  }
}
async function afterLogin(d){
  S.token = d.token; S.me = d.me; lsSet(LS.token, S.token); lsSet(LS.me, S.me);
  S.login = { step:'names', who:null, pin:'', pin1:'', code:'', err:'' };
  S.view = S.me.punch ? 'punch' : 'all';
  toast('ログインしました');
  render();
  await loadData(true);
  if (!bioInfo() && await bioAvailable()) { S.bioOffer = true; render(); }
}

const NONWORK = { '休み':'yu', '振休':'off', '代休':'off', '公休':'off', '雨天中止（全日）':'yu' };
function calRestFor(id, s){ return S.calRests.find(r => r.staffId === id && r.date === s); }
function attendCell(id, s){
  const st = byId(id) || {}, d = getDay(id,s), off = isOff(s), hol = S.hol[s], w = workMin(d), td = today();
  let cls = '', txt = '', tag = '';
  const half = d && isRest(d) && d.half;
  if (st.join && s < st.join) cls = 'pre';
  else if (d && d.kind && NONWORK[d.kind] && !w && !(half && d.in)){
    cls = (isRest(d) ? (d.pay==='paid' ? 'yu' : (d.pay==='unpaid' || isHourly(id)) ? 'ab' : 'yu und') : NONWORK[d.kind]) + (s > td ? ' plan' : '');
    txt = d.kind==='雨天中止（全日）' ? '雨天' : half ? (d.half==='pm' ? '午後休' : '午前休') : isRest(d) ? (d.pay==='paid' ? '有休' : (d.pay==='unpaid' && !isHourly(id)) ? '欠勤' : '休み') : d.kind;
  }
  else if (s > td){ cls = 'fut'; txt = off ? '休' : ''; }
  else if (d && d.in && !d.out){ if (s === td){ cls = 'att'; txt = '出勤中'; } else { cls = 'ng'; txt = '退勤なし'; } }
  else if (w){ cls = 'att'; txt = hm(w); }
  else if (off){ cls = 'off'; txt = '休'; }
  else if (s < td && s >= (S.settings.useFrom || '') && !isHourly(id) && !(d && d.checked)){ cls = 'ng'; txt = 'なし'; }
  if (half && (w || d.in)) tag = d.half==='pm' ? '午後休' : '午前休';
  const fl = openFlag(flags(id,s,d), d) && (s <= td || isRest(d));
  const pr = periodRange(periodOf(s));
  const editable = canEdit(id) && !isClosed(s) && !(st.join && s < st.join);
  const cr = calRestFor(id, s);
  const sub = tag || hol;
  return `<button class="cd ${cls}" data-act="day" data-arg="${esc(id)}|${s}" ${editable ? '' : 'disabled'} aria-label="${dlabel(s)} ${txt || '記録なし'}${tag ? ' ' + tag : ''}${fl ? ' 特記あり' : ''}">
    <span class="dn">${Number(s.slice(8))}</span><span class="dv ${txt.length >= 4 ? 'xs' : txt.length >= 3 ? 'sm' : ''}">${txt}</span>${sub ? `<span class="hn ${tag ? 'tag' : ''}">${esc(sub)}</span>` : ''}${fl ? '<span class="fl"></span>' : (cr && !isRest(d) ? '<span class="cm">予定</span>' : '')}</button>`;
}
function attendBlock(id, y, m){
  const st = byId(id) || {}, key = ym(y,m), last = `${key}-${pad(lastDay(y,m))}`, td = today();
  let cells = ['月','火','水','木','金','土','日','週計'].map(x => `<div class="hd">${x}</div>`).join('');
  for (let ws = weekStart(`${key}-01`); ws <= last; ws = addDays(ws,7)){
    for (let i=0;i<7;i++){ const s = addDays(ws,i); cells += s.slice(0,7) === key ? attendCell(id,s) : '<div class="cd blank"></div>'; }
    const sun = addDays(ws,6); let wk = '-';
    if (sun.slice(0,7) === key && ws <= td){ let mins = 0; for (let i=0;i<7;i++){ const s = addDays(ws,i); if (!(st.join && s < st.join)) mins += workMin(getDay(id,s)); } wk = hm(mins); }
    cells += `<div class="cd wk num">${wk}</div>`;
  }
  return `<div class="month" id="am-${key}"><h3>${y}年 ${m}月</h3><div class="mgrid">${cells}</div></div>`;
}
function attendView(id, admin){

  });

      <span class="pill"><span class="dot"></span>特記あり</span>
    </div>
    <div class="small muted">日付をタップすると、休みの登録（休みたい先の日もできます）と、時刻のあとから入力・修正ができます。週計は実際に働いた時間の合計です。</div>

/* ---------- 年間休日カレンダー ---------- */
function calOffSet(fy){ return S.calEdit && S.calEdit.fy === fy ? S.calEdit.off : (S.cal[fy] || new Set(fyDates(fy).filter(s => wd(s)===0 || S.hol[s]))); }
function calStats(fy){
  const off = calOffSet(fy), range = fyDates(fy), inFy = s => s >= range[0] && s <= range.at(-1), daily = SET().shotei;
  const isO = s => off.has(s);
  const months = MONTHS(fy).map(({y,m}) => { const ds = datesIn(`${ym(y,m)}-01`, `${ym(y,m)}-${pad(lastDay(y,m))}`); const o = ds.filter(isO).length, w = ds.length - o; return { y, m, cal:ds.length, off:o, work:w, mins:w*daily, avg: Math.ceil(w*daily/ds.length*7) }; });
  const tot = months.reduce((a,x) => ({ cal:a.cal+x.cal, off:a.off+x.off, work:a.work+x.work, mins:a.mins+x.mins }), { cal:0, off:0, work:0, mins:0 });
  tot.avg = Math.ceil(tot.mins/tot.cal*7);
  const weeks = []; for (let ws = weekStart(range[0]); ws <= range.at(-1); ws = addDays(ws,7)){ let h = 0; for (let i=0;i<7;i++){ const s = addDays(ws,i); if (inFy(s) && !isO(s)) h += daily; } weeks.push({ ws, h }); }
  let streak = 0, max48 = 0; const q = {}; for (const w of weeks){ if (w.h > 48*60){ streak++; max48 = Math.max(max48, streak); const qi = Math.floor(((+w.ws.slice(5,7)+8)%12)/3); q[qi] = (q[qi]||0)+1; } else streak = 0; }
  let run = 0, maxRun = 0; for (const s of range){ if (isO(s)) run = 0; else { run++; maxRun = Math.max(maxRun, run); } }
  const limit = LEGAL_WEEK * range.length / 7, maxWeek = Math.max(...weeks.map(w => w.h));
  const checks = [
    { k:'年間の労働日数', v:`${tot.work}日`, rule:'280日以内', ok: tot.work <= 280 },
    { k:'年間の総労働時間', v:`${hm(tot.mins)}`, rule:`${hm(Math.floor(limit))}以内`, ok: tot.mins <= limit },
    { k:'いちばん長い週', v:`${hm(maxWeek)}`, rule:'52時間以内', ok: maxWeek <= 52*60 },
    { k:'48時間を超える週', v: max48 ? `最長${max48}週連続` : 'なし', rule:'連続3週以内・3か月で3回以内', ok: max48 <= 3 && Object.values(q).every(n => n <= 3) },
    { k:'連続して働く日数', v:`最長${maxRun}日`, rule:'6日以内', ok: maxRun <= 6 },
  ];
  return { months, tot, checks, inFy, isO, daily };
}
function monthBlock(fy, y, m, st, edit){
  const key = ym(y,m), last = `${key}-${pad(lastDay(y,m))}`, base = S.cal[fy];
  let cells = ['月','火','水','木','金','土','日','週計'].map(x => `<div class="hd">${x}</div>`).join('');
  for (let ws = weekStart(`${key}-01`); ws <= last; ws = addDays(ws,7)){
    for (let i=0;i<7;i++){
      const s = addDays(ws,i);
      if (s.slice(0,7) !== key){ cells += '<div class="cd blank"></div>'; continue; }
      const off = st.isO(s), hol = S.hol[s], changed = base && base.has(s) !== off;
      cells += `<button class="cd ${off?'off':''} ${changed?'changed':''}" data-act="calday" data-arg="${s}" ${edit?'':'disabled'} aria-label="${dlabel(s)} ${off?'休み':'出勤'}${hol?' '+esc(hol):''}">
        <span class="dn">${Number(s.slice(8))}</span><span class="dv">${off?'休':hm(st.daily)}</span>${hol?`<span class="hn">${esc(hol)}</span>`:''}</button>`;
    }
    const sun = addDays(ws,6); let wk = '-';
    if (sun.slice(0,7) === key){ let h = 0; for (let i=0;i<7;i++){ const s = addDays(ws,i); if (st.inFy(s) && !st.isO(s)) h += st.daily; } wk = hm(h); }
    cells += `<div class="cd wk num">${wk}</div>`;
  }
  return `<div class="month"><h3>${y}年 ${m}月</h3><div class="mgrid">${cells}</div></div>`;
}

/* ===================== 印刷 ===================== */
function printYearCal(){
  const fy = S.fy, st = calStats(fy);
  const month = ({y,m}) => {
    const key = ym(y,m), last = `${key}-${pad(lastDay(y,m))}`;
    let rows = '';
    for (let ws = weekStart(`${key}-01`); ws <= last; ws = addDays(ws,7)){
      let tr = '';
      for (let i=0;i<7;i++){ const s = addDays(ws,i); if (s.slice(0,7) !== key){ tr += '<td></td>'; continue; }
        const off = st.isO(s), hol = S.hol[s];
        tr += `<td class="${off?'off':''}"><span class="n">${Number(s.slice(8))}</span>${off?'休':hm(st.daily)}${hol?`<span class="h">${esc(hol)}</span>`:''}</td>`; }
      const sun = addDays(ws,6); let h = 0; for (let i=0;i<7;i++){ const s = addDays(ws,i); if (st.inFy(s) && !st.isO(s)) h += st.daily; }
      tr += `<td>${sun.slice(0,7) === key ? hm(h) : '-'}</td>`;
      rows += `<tr>${tr}</tr>`;
    }
    return `<div class="pr-m"><h4>${y}年 ${m}月</h4><table><tr>${['月','火','水','木','金','土','日','週計'].map(x => `<th>${x}</th>`).join('')}</tr>${rows}</table></div>`;
  };
  const sr = (l, f, t) => `<tr><td>${l}</td>${st.months.map(x => `<td>${f(x)}</td>`).join('')}<td>${t}</td></tr>`;
  $('#print').innerHTML = `<div class="pr-title">${fy}年度 年間休日カレンダー　庭乃持田園有限会社　<span style="font-size:9pt;font-weight:400">（${fy}/4/1〜${fy+1}/3/31・1年単位の変形労働制）</span></div>
    <div class="pr-year">${MONTHS(fy).map(month).join('')}</div>
    <table class="pr-sum"><tr><th>月</th>${st.months.map(x => `<th>${x.m}月</th>`).join('')}<th>合計</th></tr>
    ${sr('暦日数', x => x.cal, st.tot.cal)}${sr('休日日数', x => x.off, st.tot.off)}${sr('労働日数', x => x.work, st.tot.work)}${sr('総労働時間', x => hm(x.mins), hm(st.tot.mins))}${sr('週平均', x => hm(x.avg), hm(st.tot.avg))}</table>`;
  setTimeout(() => window.print(), 50);
}

/* ===================== 操作 ===================== */
async function run(fn){ try { await fn(); } catch(e){ toast(e.message, true); } render(); }
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, arg = el.dataset.arg;
  const bg = { daybg:'day', editbg:'edit', menubg:'menu', codebg:'code' };
  if (bg[act]){ if (e.target === el){ S[bg[act]] = act === 'menubg' ? false : null; S.pinChange = false; render(); } return; }
  switch (act){
    case 'retry': showBanner(''); S.loaded = null; loadData(true); return;
    case 'tab': S.view = arg; S.confirm = null; if (arg === 'mine' && S.recMode === 'cal') S.scrollMonth = today().slice(0,7); if (arg === 'settings'){ S.staffEdit = null; S.setEdit = null; } render(); window.scrollTo(0,0); return;
    case 'menu': S.menu = true; render(); return;
    case 'menuclose': S.menu = false; S.pinChange = false; render(); return;
    case 'logout': run(async () => { try { await api('logout'); } catch(e){} S.menu = false; logoutLocal(); }); return;
    case 'bioOn': S.menu = false; if (await bioAvailable()) await bioRegister(); else toast('この端末では顔認証・指紋認証が使えません', true); render(); return;
    case 'bioOff': lsSet(LS.bio, null); S.menu = false; toast('この端末の顔認証・指紋認証をやめました'); render(); return;
    case 'bioYes': S.bioOffer = false; lsSet(LS.bioAsked, true); await bioRegister(); render(); return;
    case 'bioLater': S.bioOffer = false; lsSet(LS.bioAsked, true); render(); return;
    case 'pinChange': S.pinChange = true; render(); return;
    case 'pinChangeGo': run(async () => { await api('changePin', { oldPin: $('#pc-old').value, pin: $('#pc-new').value }); S.pinChange = false; S.menu = false; toast('暗証番号を変えました'); }); return;
    // ログイン
    case 'lstep': S.login.step = arg; S.login.err = ''; S.login.pin = ''; render(); return;
    case 'pick': S.login.who = arg; S.login.step = 'pin'; S.login.pin = ''; S.login.err = ''; render(); return;
    case 'pk': loginKey(arg, 'pk'); return;
    case 'npk': loginKey(arg, 'npk'); return;
    case 'codeNext': { const c = ($('#codeIn').value || '').replace(/\D/g,''); if (c.length !== 6){ S.login.err = '6桁の数字を入れてください'; render(); return; } S.login.code = c; S.login.step = 'newpin'; S.login.pin = ''; S.login.err = ''; render(); return; }
    case 'pak': {
      const P = S.pinAsk; if (!P) return;
      if (arg === 'やめる'){ S.pinAsk = null; P.resolve('cancel'); render(); return; }
      if (arg === '消す'){ P.pin = P.pin.slice(0,-1); render(); return; }
      if (P.pin.length >= 4) return; P.pin += arg; P.err = ''; render();
      if (P.pin.length === 4){
        try { await api('verifyPin', { pin: P.pin }, 15000); S.pinAsk = null; P.resolve('pin'); }
        catch(e){ if (e.network){ S.pinAsk = null; P.resolve('unverified'); toast('電波がないので、本人確認なしで記録します', true); } else { P.pin = ''; P.err = e.message; } }
        render();
      }
      return;
    }
    // 打刻
    case 'punch': {
      const d = getDay(S.me.id, today()) || {};
      if ((arg === 'in' && d.in) || (arg === 'out' && d.out)){ S.confirm = arg; render(); return; }
      doPunch(arg); return;
    }
    case 'punchGo': doPunch(arg); return;
    case 'cancel': S.confirm = null; render(); return;
    case 'flush': flushQueue(false); return;
    // 記録
    case 'recmode': S.recMode = arg; if (arg === 'cal') S.scrollMonth = today().slice(0,7); render(); return;
    case 'period': S.period = shiftPeriod(S.period, Number(arg)); S.confirm = null; await loadData(false); render(); return;
    case 'fy': S.fy = Number(arg); S.calEdit = null; S.reflect = null; await loadData(false); render(); return;
    case 'reload': S.loaded = null; loadData(true); return;
    case 'detail': S.detail = arg; S.view = 'detail'; S.recMode = 'cal'; window.scrollTo(0,0); S.scrollMonth = today().slice(0,7); render(); return;
    case 'day': S.day = arg; render(); return;
    case 'dayclose': S.day = null; render(); return;
    case 'totime': S.edit = { key: S.day }; S.day = null; render(); return;
    case 'edit': S.edit = { key: arg }; render(); return;
    case 'editclose': S.edit = null; render(); return;
    case 'editsave': {
      const [id, s] = S.edit.key.split('|'); const v = k => ($('#'+k) || {}).value || '';
      const form = { staffId:id, date:s, kind:v('e-kind'), in:v('e-in'), out:v('e-out'), brk:v('e-brk'), site:v('e-site'), reason:v('e-reason'), memo:v('e-memo') };
      S.edit.form = form; S.edit.saving = true; S.edit.err = ''; render();
      try {
        const r = await api('saveDay', form);
        putDay(r.day); S.edit = null; S.history = null; toast(r.calWarning || '保存しました。修正履歴に残りました', !!r.calWarning);
      } catch(e){ S.edit.saving = false; S.edit.err = e.message; }
      render(); return;
    }
    case 'leave': {
      const [id, s] = S.day.split('|');
      run(async () => {
        const r = await api('rest', { staffId:id, date:s, mode:arg }); putDay(r.day); S.history = null;
        if (arg === 'cancel' || !isAdmin()) S.day = null;
        toast(r.calWarning ? r.calWarning : (arg === 'cancel' ? '休みの登録を取り消しました。出勤調整カレンダーからも消しました' : `休みを登録しました。出勤調整カレンダーに「${r.calTitle}」を入れました${isAdmin() && !isHourly(id) ? '。有休か欠勤かを選んでください' : ''}`), !!r.calWarning);
      });
      return;
    }
    case 'pay': { const [id, s, p] = arg.split('|'); run(async () => { const r = await api('pay', { staffId:id, date:s, pay:p }); putDay(r.day); S.day = null; S.history = null; toast(`${(byId(id)||{}).disp} ${short2(s)} を${p==='paid' ? '有休' : p==='unpaid' ? '欠勤' : 'ふつうの休み'}にしました`); }); return; }
    case 'check': { const [id, s] = arg.split('|'); run(async () => { const r = await api('check', { staffId:id, date:s }); putDay(r.day); toast('確認済みにしました'); }); return; }
    case 'showAllOpen': S.showAllOpen = !S.showAllOpen; render(); return;
    case 'checkAll': if (S.confirm !== 'checkAll'){ S.confirm = 'checkAll'; toast('もう一度押すと、まとめて確認済みにします'); setTimeout(() => { if (S.confirm === 'checkAll'){ S.confirm = null; } }, 5000); return; }
      run(async () => { const r = await api('checkMany', { items: S.softOpen || [] }, 60000); r.days.forEach(putDay); S.confirm = null; toast(`${r.days.length}件を確認済みにしました`); }); return;
    case 'close': S.confirm = 'close'; render(); return;
    case 'doclose': run(async () => { const r = await api('close', { period:S.period }); S.closings = r.closings; S.confirm = null; S.history = null; toast(`${periodRange(S.period).label}を締めました`); }); return;
    case 'unclose': run(async () => { const r = await api('unclose', { period:S.period }); S.closings = r.closings; S.history = null; toast('締めを解除しました。履歴に残りました'); }); return;
    case 'ya': S.yaStaff = arg; render(); return;
    case 'yam': S.yaMonth = arg; render(); return;
    case 'printAtt': printAttendance(arg); return;
    // 年間休日カレンダー
    case 'calday': {
      if (!isAdmin()) return;
      const fy = S.fy;
      if (!S.calEdit || S.calEdit.fy !== fy){ const base = new Set(calOffSet(fy)); S.calEdit = { fy, off: new Set(base), dirty:false, count(){ const b = S.cal[this.fy] || new Set(); let n = 0; fyDates(this.fy).forEach(s => { if (b.has(s) !== this.off.has(s)) n++; }); return n; } }; }
      const o = S.calEdit.off; o.has(arg) ? o.delete(arg) : o.add(arg);
      S.calEdit.dirty = S.calEdit.count() > 0; S.reflect = null; render(); return;
    }
    case 'calReset': S.calEdit = null; render(); return;
    case 'calSave': run(async () => {
      const fy = S.fy, off = [...calOffSet(fy)].sort();
      const r = await api('calSave', { fy, off }); S.cal[fy] = new Set(r.off); S.calExists[fy] = true; S.calEdit = null; S.reflect = null; S.history = null; toast(`${fy}年度の休日カレンダーを保存しました`);
    }); return;
    case 'reflectCheck': run(async () => { const r = await api('calReflect', { fy:S.fy, dryRun:true }, 60000); S.reflect = Object.assign({ fy:S.fy }, r); }); return;
    case 'reflectGo': run(async () => { const r = await api('calReflect', { fy:S.fy }, 120000); S.reflect = Object.assign({ fy:S.fy, done:true }, r); S.history = null; toast('出勤調整カレンダーに反映しました'); }); return;
    case 'printCal': printYearCal(); return;
    // 履歴・CSV
    case 'histReload': S.history = null; render(); return;
    case 'csvDl': {
      const blob = new Blob(['﻿' + buildCSV(S.period)], { type:'text/csv' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = csvName(S.period); document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast('CSVを保存しました'); return;
    }
    case 'csvCopy': {
      const fallback = () => { const r = document.createRange(); r.selectNodeContents($('#csv')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('選択しました。コピーしてください'); };
      try { navigator.clipboard.writeText(buildCSV(S.period)).then(() => toast('コピーしました'), fallback); } catch(e){ fallback(); }
      return;
    }
    // 設定
    case 'staffAdd': S.staffEdit.push({ id:'', name:'', disp:'', freeeNo:'', setting:'', pay:'monthly', role:'staff', punch:true, join:'', active:true }); render(); return;
    case 'staffSave': run(async () => { const r = await api('staffSave', { staff: S.staffEdit }); S.staff = r.staff; S.staffEdit = null; toast('スタッフを保存しました'); }); return;
    case 'setSave': run(async () => { const r = await api('settingsSave', { settings: { start: $('#setStart').value, end: $('#setEnd').value, break: $('#setBreak').value, useFrom: $('#setFrom').value } }); S.settings = r.settings; S.setEdit = null; toast('勤務時間を保存しました'); }); return;
    case 'code': S.code = { staffId: arg }; render(); return;
    case 'codeclose': S.code = null; render(); return;
    case 'codeIssue': {
      S.code.loading = true; S.code.error = ''; render();
      try { const r = await api('issueCode', { staffId: S.code.staffId, kind: arg }); Object.assign(S.code, r, { loading:false }); }
      catch(e){ S.code.loading = false; S.code.error = e.message; }
      render(); return;
    }
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.sf !== undefined && S.staffEdit){ const i = Number(t.dataset.sf), k = t.dataset.k; S.staffEdit[i][k] = t.type === 'checkbox' ? t.checked : t.value; }
  if (['setStart','setEnd','setBreak','setFrom'].includes(t.id)){ S.setEdit = { start: $('#setStart').value, end: $('#setEnd').value, break: $('#setBreak').value, useFrom: $('#setFrom').value }; }
  if (t.id === 'codeIn') S.login.code = t.value;
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.sf !== undefined && S.staffEdit){ const i = Number(t.dataset.sf), k = t.dataset.k; S.staffEdit[i][k] = t.type === 'checkbox' ? t.checked : t.value; }
});
window.addEventListener('online', () => { render(); flushQueue(false); });
window.addEventListener('offline', () => render());
setInterval(() => { const c = $('#clock'); if (c) c.textContent = nowHM(); }, 5000);
setInterval(() => { if (navigator.onLine) flushQueue(false); }, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.token){ flushQueue(false); if (S.view === 'punch') render(); } });

/* ===================== 起動 ===================== */
(async function boot(){
  const m = location.hash.match(/enroll=([A-Za-z0-9]{6,40})/);
  if (m){ S.login = { step:'newpin', who:null, pin:'', pin1:'', code:m[1], err:'' }; S.token = null; S.me = null; }
  render();
  if (!gasReady()) return;
  loadSites();
  if (S.token && S.me){
    // 前回の内容ですぐ画面を出し、最新は裏で取りに行く（サーバーへの問い合わせは1回）
    S.view = S.me.punch ? 'punch' : 'all';
    loadCache();
    render();
    flushQueue(false);
    await loadData(true);
    if (!S.token) return;
    if (!bioInfo() && !lsGet(LS.bioAsked) && await bioAvailable()){ S.bioOffer = true; render(); }
  } else {
    loadNames();
  }
})();
</script>
</body>
</html>
