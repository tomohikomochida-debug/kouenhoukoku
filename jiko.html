<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="事故報告">
<meta name="theme-color" content="#214A37">
<title>事故報告｜庭乃持田園</title>
<style>
:root{
  --paper:#F6F5F0; --card:#FFFFFF; --leaf:#214A37; --leaf-soft:#E5EDE7; --ok:#2E7D55;
  --tape:#C77C30; --bark:#5B5750; --ink:#22231F; --line:#DCD9D0; --field:#FBFAF6; --danger:#B0533F; --danger-soft:#FBE3DE;
  --radius:10px; --shadow:0 1px 0 rgba(34,35,31,.04), 0 8px 24px -16px rgba(34,35,31,.25);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif;-webkit-text-size-adjust:100%;line-height:1.6}
header{background:var(--leaf);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:20;padding-top:calc(12px + env(safe-area-inset-top))}
header .row{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .me{font-size:13px;background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:999px;padding:5px 12px;font-family:inherit;cursor:pointer}
header .gear{font-size:18px;background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:999px;width:34px;height:34px;cursor:pointer}
.home-btn{display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;color:#fff;text-decoration:none;font-family:inherit;font-size:13px;font-weight:700;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);border-radius:999px;padding:5px 11px 5px 9px;white-space:nowrap;line-height:1.2;cursor:pointer}
.home-btn .hb-ic{font-size:15px;line-height:1}
@media (max-width:400px){ .home-btn{padding:5px 8px} .home-btn .hb-t{display:none} }
.netbar{background:var(--tape);color:#fff;font-size:12.5px;text-align:center;padding:5px 12px}
.error-banner{display:none;background:var(--danger);color:#fff;padding:10px 16px;font-size:13px}
main{max-width:680px;margin:0 auto;padding:14px 16px calc(100px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.card.warn{border-left:6px solid var(--danger)}
h2{font-size:15.5px;margin:2px 0 10px;color:var(--leaf)}
h3{font-size:14px;margin:14px 0 6px;color:var(--bark)}
.hint{font-size:12.5px;color:var(--bark);margin:4px 0 0}
label.lbl{display:block;font-size:13px;font-weight:700;color:var(--bark);margin:12px 0 6px}
label.lbl:first-child{margin-top:0}
label.lbl .req{color:var(--danger);font-size:11.5px;margin-left:4px}
input[type=text],input[type=tel],input[type=email],input[type=search],input[type=date],input[type=time],input[type=number],input[type=password],textarea,select{width:100%;font:inherit;font-size:16px;padding:10px 12px;
  border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink)}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--leaf);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:15px;font-weight:700;
  border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;min-height:46px;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.line-danger{color:var(--danger);border-color:var(--danger)}
.btn.tape{background:var(--tape);color:#fff;border-color:var(--tape)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:default}
.row2{display:flex;gap:8px}
.row2>*{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:8px 14px;font-size:14.5px;cursor:pointer;color:var(--ink);font-family:inherit;line-height:1.3}
.chip.on{background:var(--leaf);border-color:var(--leaf);color:#fff;font-weight:700}
.chip.big{padding:12px 16px;font-size:15.5px;flex:1;min-width:130px;border-radius:12px;text-align:center}
.chip small{display:block;font-size:11.5px;font-weight:400;opacity:.85}
.q{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}
.q:first-of-type{border-top:0;padding-top:0;margin-top:0}
.q .qt{font-weight:700;font-size:14.5px;margin-bottom:8px}
.q .qt .no{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--tape);color:#fff;font-size:12.5px;align-items:center;justify-content:center;margin-right:6px}
.note{background:#FFF8E6;border:1px solid #F0DDB0;border-left:6px solid #D9A21B;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:13.5px}
.note.red{background:var(--danger-soft);border-color:#EDC2B7;border-left-color:var(--danger)}
.note.green{background:#EEF4EF;border-color:#CFE0D3;border-left-color:var(--ok)}
.note b{display:block;margin-bottom:2px}
.tag{display:inline-block;font-size:11.5px;border-radius:6px;padding:1px 7px;margin:0 4px 2px 0;background:#EEE;color:var(--bark);vertical-align:1px;white-space:nowrap}
.tag.car{background:#E3ECF7;color:#2B5287}.tag.work{background:#EEF4EF;color:var(--leaf)}
.tag.red{background:var(--danger-soft);color:var(--danger);font-weight:700}
.tag.stage{background:var(--leaf-soft);color:var(--leaf);font-weight:700}
.tag.done{background:#EEE;color:#777}
.tag.wait{background:#FFF1D6;color:#8A5A00;font-weight:700}
.sos{display:block;width:100%;border:0;border-radius:16px;background:var(--danger);color:#fff;font:inherit;font-size:21px;font-weight:800;padding:22px 16px;cursor:pointer;box-shadow:0 10px 24px -12px rgba(176,83,63,.8);letter-spacing:.05em}
.sos small{display:block;font-size:13px;font-weight:500;opacity:.9;letter-spacing:0;margin-top:2px}
.item{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
.item .t{font-weight:700;font-size:15px}
.item .s{font-size:12.5px;color:var(--bark)}
.item.stale{border-left:5px solid #D9A21B}
.item.draft{border-left:5px solid var(--tape)}
.empty{color:var(--bark);text-align:center;padding:20px 10px;font-size:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:680px;margin:0 auto;display:flex}
nav.tabs button{flex:1;border:0;background:none;font:inherit;font-size:11.5px;color:var(--bark);padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative}
nav.tabs button .ic{font-size:21px;line-height:1.1}
nav.tabs button.on{color:var(--leaf);font-weight:700}
nav.tabs .badge{position:absolute;top:3px;left:calc(50% + 8px);background:var(--danger);color:#fff;font-size:10.5px;border-radius:999px;padding:0 6px;min-width:18px}
.bottombar{position:fixed;left:0;right:0;bottom:0;background:rgba(246,245,240,.97);border-top:1px solid var(--line);z-index:31;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bottombar .in{max-width:680px;margin:0 auto;display:flex;gap:8px;align-items:center}
.bottombar .st{flex:1;font-size:12px;color:var(--bark);line-height:1.35}
.modal-bg{position:fixed;inset:0;background:rgba(34,35,31,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:var(--paper);width:100%;max-width:680px;max-height:94vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.modal h3{margin:0 0 12px;font-size:17px;color:var(--leaf)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;max-width:92%;text-align:center}
.toast.show{opacity:1}
.loading{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px}
.btn:not(.primary):not(.danger):not(.tape) .loading{border-color:var(--line);border-top-color:var(--leaf)}
@keyframes spin{to{transform:rotate(360deg)}}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;border:0;background:var(--card);font:inherit;font-size:13.5px;padding:9px 4px;cursor:pointer;color:var(--bark)}
.seg button.on{background:var(--leaf);color:#fff;font-weight:700}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps .ck{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:transparent}
.steps li.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.done .bd>b{text-decoration:line-through;color:var(--bark)}
.steps .bd{flex:1;min-width:0}
.steps .bd b{font-size:15.5px}
.steps .bd .hint{margin-top:2px}
.steps .act{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.script{background:#fff;border:2px solid var(--leaf);border-radius:12px;padding:12px 14px;font-size:17px;font-weight:700;color:var(--leaf);margin:6px 0}
.slots{display:grid;grid-template-columns:1fr;gap:10px}
.slot{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--field)}
.slot.miss{border-color:#E7B9AC;background:#FDF3F0}
.slot .hd{display:flex;align-items:center;gap:6px}
.slot .hd b{flex:1;font-size:14.5px}
.slot .hd .need{font-size:11.5px;color:var(--danger);font-weight:700}
.slot .hd .okk{font-size:12px;color:var(--ok);font-weight:700}
.slot .hint{margin:2px 0 6px}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.th{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;background:var(--leaf-soft);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--bark);border:1px solid var(--line);cursor:pointer;padding:0}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .badge{position:absolute;left:3px;bottom:3px;font-size:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;padding:0 4px}
.th .x{position:absolute;right:2px;top:2px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:13px;line-height:24px;cursor:pointer}
.th.off{opacity:.35}
.kv{display:grid;grid-template-columns:108px 1fr;gap:5px 10px;font-size:14px;margin:0}
.kv dt{color:var(--bark)}
.kv dd{margin:0;white-space:pre-wrap;word-break:break-word}
.secline{font-size:12.5px;font-weight:700;color:#fff;background:var(--leaf);border-radius:6px;padding:3px 10px;margin:14px 0 8px;display:inline-block}
.prog{display:flex;gap:3px;margin:6px 0 4px}
.prog i{flex:1;height:7px;border-radius:4px;background:var(--line)}
.prog i.on{background:var(--leaf)}
.prog i.cur{background:var(--tape)}
.log{border-top:1px solid var(--line);padding:8px 0;font-size:14px}
.log .m{font-size:12px;color:var(--bark)}
.log .x{float:right;border:0;background:none;color:var(--bark);cursor:pointer;font-size:14px}
.checklist .ci{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px}
.checklist .ci:first-child{border-top:0}
.checklist .ci button{flex:none;width:28px;height:28px;border-radius:7px;border:2px solid var(--line);background:#fff;cursor:pointer;color:transparent;font-size:14px}
.checklist .ci.done button{background:var(--ok);border-color:var(--ok);color:#fff}
.checklist .ci span{flex:1}
.checklist .ci small{color:var(--bark)}
.wit{display:flex;gap:6px;margin-bottom:6px}
.wit input{flex:1}
.bigsum{font-size:18px;line-height:1.7}
.bigsum dt{font-size:13px;color:var(--bark);margin-top:8px}
.bigsum dd{margin:0;font-weight:700}
.sketch-wrap{background:#fff;border:1px solid var(--line);border-radius:10px;touch-action:none;overflow:hidden}
.sketch-wrap canvas{display:block;width:100%;height:auto;touch-action:none}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.dot{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.dot.on{box-shadow:0 0 0 3px var(--tape)}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin:16px 0 4px}
.bars div{flex:1;background:var(--leaf-soft);border-radius:4px 4px 0 0;position:relative;min-height:2px}
.bars div span{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:11px;color:var(--bark)}
.barx{display:flex;gap:6px;font-size:11px;color:var(--bark)}
.barx span{flex:1;text-align:center}
.hy{border-top:1px solid var(--line);padding:10px 0}
.hy:first-child{border-top:0}
.hy .t{font-size:14.5px;white-space:pre-wrap}
.hy .m{font-size:12px;color:var(--bark)}
.hy .cm{background:#EEF4EF;border-radius:8px;padding:6px 10px;font-size:13.5px;margin-top:6px}
.pend{font-size:12.5px;background:#FFF1D6;color:#8A5A00;border-radius:8px;padding:6px 10px;margin-bottom:10px}
.pdfprev{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.pdfprev canvas{width:100%;height:auto;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="error-banner" id="errBanner"></div>
<header><div class="row">
  <a class="home-btn" id="homeBtn" href="index.html" title="アプリ一覧にもどる"><span class="hb-ic">🏠</span><span class="hb-t">ホーム</span></a>
  <h1 id="title">🚨 事故報告</h1>
  <button class="gear" id="gearBtn" type="button" title="設定" hidden>⚙</button>
  <button class="me" id="meBtn" type="button" hidden></button>
</div></header>
<div class="netbar" id="netbar" hidden>電波がありません。入力はこの端末に保存され、電波が戻ったら送ります</div>
<main id="main"><div class="empty"><span class="loading" style="border-top-color:var(--leaf)"></span> 読み込んでいます…</div></main>
<nav class="tabs" id="tabs" hidden><div class="in">
  <button type="button" data-tab="home" class="on"><span class="ic">🚨</span>事故報告</button>
  <button type="button" data-tab="hiyari"><span class="ic">⚠️</span>ヒヤリハット</button>
  <button type="button" data-tab="list"><span class="ic">📊</span>一覧・進捗<span class="badge" id="listBadge" hidden></span></button>
</div></nav>
<div class="bottombar" id="bottombar" hidden><div class="in" id="bottomIn"></div></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileLib" accept="image/*" multiple hidden>

<script>
/* =========================================================
   事故報告（jiko.html）
   ・本人確認はタイムカードと同じログイン（名前＋4桁の暗証番号）。役割（親方・事務担当・スタッフ）もタイムカードのまま
   ・入力はこの端末に自動で保存（電波がなくても書ける）→「送る」で送信。電波がないときは戻ったら自動で送る
   ・サーバー：現場アプリGAS（app=jiko）。データは「事故報告データ（社外秘）」スプレッドシートと「社内アプリ ＞ 事故報告」フォルダ
   ========================================================= */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzCkxdDCT3hnSEbtpcbQcvOcsehvX5pLUzZ8xFBIxQ40qvRmwmnixJ3q_vEr7X0v-vm7A/exec';
const COMPANY_DEFAULT = { name: '庭乃持田園有限会社', address: '神奈川県川崎市高津区向ケ丘94-2', phone: '' };

/* ---------------- 選択肢 ---------------- */
const PURPOSES = ['現場へ移動', '処分場へ搬出', '資材の仕入れ', '帰社', 'その他'];
const LOAD_KINDS = ['剪定枝', '伐採材', '刈草', '土砂', '資材', '機械'];
const CAR_SCENES = ['交差点', '駐車場・敷地内', 'バック中', '追突した', '追突された', '車線変更', '狭い道ですれ違い', '右左折', 'その他'];
const PLACE_TYPES = ['公道', '私有地（処分場・駐車場の中など）', '現場の中'];
const WEATHERS = ['晴れ', 'くもり', '雨', '雪', '強風'];
const ROADS = ['乾いている', 'ぬれている', '凍結', '未舗装'];
const TASKS = ['剪定', '伐採', '草刈り', '刈込', '植栽', '運搬・積込', '清掃', 'その他'];
const MACHINES = ['チェーンソー', '刈払機', 'ブロワー', 'ヘッジトリマー', '高所作業車', 'ユンボ', 'ユニック', 'はしご・脚立', '手道具だけ'];
const SAFETY = ['カラーコーン', '誘導員', '飛散防止ネット', '声かけ・合図', '立入禁止の表示', '特になし'];
const OWNER_TYPES = ['市・道路管理者', '電力会社', '電話会社', 'お客さん（現場）', '近所の家・会社', 'その他'];
const ROUSAI_TYPES = ['切り傷', '転落・転倒', '飛来・落下物', '挟まれ', '蜂刺され', '熱中症', '腰痛', '打撲・骨折', 'その他'];
const HY_ACT = ['剪定', '伐採', '草刈り', '刈込', '運搬・積込', '運転', '高所作業', 'その他'];
const HY_KINDS = ['転落・転倒', '飛来・落下', '切れ・こすれ', '挟まれ', '車両・接触', '飛び石', '蜂・虫・動物', '熱中症', '電線・感電', 'その他'];
const STAGES_DEF = ['報告受付', '保険会社へ第一報', '詳細の確認・清書', '詳細報告書を提出', '相手へ連絡済', '対応中', '示談交渉中', '解決', '完了'];
const ROUSAI_STAGES = ['受診', '書類提出', '休業補償の申請', '職場復帰'];
const LICENSES = [['普通', 1], ['準中型（5t限定）', 2], ['準中型', 3], ['中型（8t限定）', 4], ['中型', 5], ['大型', 6]];
const licRank = n => (LICENSES.find(l => l[0] === n) || [0, 0])[1];
const SLOT_JA = { scene: '全景', own_far: '自社の損傷（引き）', own_near: '自社の損傷（寄り）', their_far: '相手側（引き）', their_near: '相手側（寄り）', detail: '損傷の詳細', plate: '相手のナンバー',
  around: '周辺の状況', load: '積荷の状態', docs: '相手の書類', injury: 'けがの状況', sketch: '略図', machine: '使っていた機械', other: 'そのほか', hiyari: 'ヒヤリハット' };

/* ---------------- 小道具 ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const nowTime = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const nowStr = () => today() + ' ' + nowTime();
const jaDate = s => { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? (+m[1]) + '年' + (+m[2]) + '月' + (+m[3]) + '日' : (s || ''); };
const mdDate = s => { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? (+m[2]) + '/' + (+m[3]) : (s || ''); };
const daysSince = s => { const t = Date.parse(String(s || '').replace(' ', 'T')); return isNaN(t) ? 0 : Math.floor((Date.now() - t) / 86400000); };
const rid = () => Math.random().toString(36).slice(2, 6);
const newId = p => { const d = new Date(); return p + '-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + '-' + rid(); };
const getP = (o, p) => p.split('.').reduce((a, k) => a == null ? undefined : a[k], o);
const setP = (o, p, v) => { const ks = p.split('.'); let a = o; for (let i = 0; i < ks.length - 1; i++) { if (a[ks[i]] == null || typeof a[ks[i]] !== 'object') a[ks[i]] = {}; a = a[ks[i]]; } a[ks[ks.length - 1]] = v; };
const clone = o => JSON.parse(JSON.stringify(o || {}));
const lsGet = (k, d = null) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
function toast(t, ms = 2400) { const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), ms); }
function showErr(t) { const b = $('#errBanner'); if (!t) { b.style.display = 'none'; return; } b.textContent = '⚠ ' + t; b.style.display = 'block'; clearTimeout(showErr.t); showErr.t = setTimeout(() => b.style.display = 'none', 9000); }
window.addEventListener('error', e => showErr('画面でエラーが起きました：' + (e.message || '')));
window.addEventListener('unhandledrejection', e => showErr('エラー：' + ((e.reason && e.reason.message) || e.reason || '')));
function fetchT(url, opt, ms = 30000) { const ac = new AbortController(); const t = setTimeout(() => ac.abort(), ms); return fetch(url, Object.assign({}, opt, { signal: ac.signal })).finally(() => clearTimeout(t)); }
async function post(body, ms) {
  let r; try { r = await fetchT(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }, ms); }
  catch (e) { throw new Error(e.name === 'AbortError' ? '時間がかかりすぎました。電波の良い所でもう一度' : '送れませんでした（電波を確かめてください）'); }
  return r.json();
}
async function api(mode, body = {}, ms = 45000) {
  const j = await post(Object.assign({ app: 'jiko', mode, token: S.token }, body), ms);
  if (!j.ok && j.code === 'auth') { lsSet('tc_token', null); S.token = ''; renderLogin(j.error); throw new Error(j.error || 'ログインし直してください'); }
  return j;
}
const blobToB64 = b => new Promise((ok, ng) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = () => ng(r.error); r.readAsDataURL(b); });
const b64ToBlob = (d, m) => { const bin = atob(d), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type: m || 'image/jpeg' }); };

/* ---------------- この端末の保存（IndexedDB。使えないときは画面を閉じるまで） ---------------- */
const MEM = { kv: {}, photos: {} };
const DB = {
  p: null,
  open() { if (this.p) return this.p; this.p = new Promise(ok => { try { const r = indexedDB.open('jiko', 1); r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('kv'); d.createObjectStore('photos', { keyPath: 'photoId' }); }; r.onsuccess = () => ok(r.result); r.onerror = () => ok(null); } catch (e) { ok(null); } }); return this.p; },
  async tx(store, mode, fn) { const d = await this.open(); if (!d) return null; return new Promise((ok, ng) => { const t = d.transaction(store, mode), s = t.objectStore(store); let res; const q = fn(s); if (q) q.onsuccess = () => res = q.result; t.oncomplete = () => ok(res); t.onerror = () => ng(t.error); }); },
  async get(k) { const d = await this.open(); return d ? this.tx('kv', 'readonly', s => s.get(k)) : MEM.kv[k]; },
  async set(k, v) { const d = await this.open(); if (!d) { MEM.kv[k] = v; return; } return this.tx('kv', 'readwrite', s => s.put(v, k)); },
  async pget(id) { const d = await this.open(); return d ? this.tx('photos', 'readonly', s => s.get(id)) : MEM.photos[id]; },
  async pput(o) { const d = await this.open(); if (!d) { MEM.photos[o.photoId] = o; return; } return this.tx('photos', 'readwrite', s => s.put(o)); },
  async pall() { const d = await this.open(); return d ? (await this.tx('photos', 'readonly', s => s.getAll())) || [] : Object.values(MEM.photos); },
  async pdel(id) { const d = await this.open(); if (!d) { delete MEM.photos[id]; return; } return this.tx('photos', 'readwrite', s => s.delete(id)); },
};

/* =========================================================
   読み込み・送信（電波がなければ端末に残して、戻ったら送る）
   ========================================================= */
function applyInit(j) {
  S.me = j.me; S.staff = j.staff || []; S.sites = j.sites || []; S.suppliers = j.suppliers || []; S.vehicles = j.vehicles || [];
  S.settings = j.settings || S.settings; S.cases = j.cases || []; S.hiyari = j.hiyari || [];
}
async function boot() {
  S.drafts = (await DB.get('drafts')) || {}; S.hyOut = (await DB.get('hyOut')) || [];
  S.localPhotos = await DB.pall();
  const cache = lsGet('jiko_cache', null);
  if (cache && cache.me) { applyInit(cache); S.loaded = true; route(); }
  await refresh(!S.loaded);
  sync();
}
async function refresh(first) {
  try {
    const j = await api('init', {}, 45000);
    if (!j.ok) throw new Error(j.error || '読み込めませんでした');
    applyInit(j); S.loaded = true;
    try { lsSet('jiko_cache', Object.assign({}, j, { at: Date.now() })); } catch (e) {}
    if (first) route(); else if (!document.activeElement || !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) render();
    updateBadges();
  } catch (e) {
    if (!S.loaded) $('#main').innerHTML = `<div class="card"><h2>読み込めませんでした</h2><p class="hint">${esc(e.message)}</p><button class="btn primary" onclick="refresh(true)">もう一度</button></div>`;
    else if (navigator.onLine) showErr(e.message);
  }
}
function route() {
  const q = new URLSearchParams(location.search), cid = q.get('case');
  if (cid) { history.replaceState(null, '', location.pathname); S.tab = 'list'; go({ name: 'case', id: cid }); return; }
  if (q.get('tab')) { S.tab = q.get('tab'); history.replaceState(null, '', location.pathname); }
  render();
}
function updateBadges() {
  const n = isBoss() ? S.cases.filter(c => c.state !== '完了' && (!c.stage || c.stage === '報告受付')).length : 0;
  const b = $('#listBadge'); b.hidden = !n; b.textContent = n;
}
async function saveDrafts() { await DB.set('drafts', S.drafts); }
function pendingCount() {
  return Object.values(S.drafts).filter(d => d.submitted).length + S.localPhotos.filter(p => !p.sent && photoReady(p)).length + S.hyOut.length;
}
function photoReady(p) {
  if (p.caseId.startsWith('H-')) return !S.hyOut.some(h => h.item.id === p.caseId) || true;
  const d = S.drafts[p.caseId];
  return !!caseById(p.caseId) || !!(d && d.submitted);
}
let syncing = false;
async function sync() {
  if (syncing || !S.token) return;
  if (!navigator.onLine) { updateNet(); return; }
  syncing = true; let changed = false, failed = '';
  try {
    for (const d of Object.values(S.drafts)) {
      if (!d.submitted) continue;
      const j = await api('save', { case: { id: d.id, data: d.data, boss: d.boss }, base: d.base || '' }, 60000);
      if (j.ok || j.conflict) {
        upsertCase(j.case); delete S.drafts[d.id]; await saveDrafts(); changed = true;
        if (j.conflict) toast(j.error, 5000);
      } else { failed = j.error; break; }
    }
    const hy = S.hyOut.slice();
    for (const h of hy) {
      const j = await api(h.mode || 'hiyari', h.body, 30000);
      if (j.ok) { S.hyOut = S.hyOut.filter(x => x !== h); await DB.set('hyOut', S.hyOut); changed = true; } else { failed = j.error; break; }
    }
    for (const p of S.localPhotos.filter(x => !x.sent)) {
      if (!photoReady(p)) continue;
      const meta = { photoId: p.photoId, caseId: p.caseId, slot: p.slot, caption: p.caption || '', takenAt: p.takenAt, lat: p.lat, lng: p.lng };
      const body = { photo: meta, data: await blobToB64(p.blob) };
      if (p.raw && p.raw.size <= 12 * 1024 * 1024) { body.raw = await blobToB64(p.raw); body.rawMime = p.rawMime || p.raw.type || 'image/jpeg'; }
      const j = await api('photo', body, 180000);
      if (j.ok) {
        p.sent = true; p.raw = null; await DB.pput(p); changed = true;
        const c = caseById(p.caseId);
        if (c && c.photos && !c.photos.some(x => x.photoId === p.photoId)) c.photos.push({ photoId: p.photoId, slot: p.slot, caption: p.caption, takenAt: p.takenAt, by: S.me.disp, inPdf: p.slot !== 'sketch', share: ['scene', 'around'].includes(p.slot) });
      } else { failed = j.error; break; }
    }
  } catch (e) { failed = e.message; }
  syncing = false; updateNet();
  if (failed && navigator.onLine) showErr('送れなかったものがあります：' + failed);
  if (changed) { await refresh(false); }
  if (pendingCount() && navigator.onLine && !failed) setTimeout(sync, 3000);
}
function upsertCase(v) { if (!v) return; const i = S.cases.findIndex(c => c.id === v.id); if (i >= 0) S.cases[i] = v; else S.cases.unshift(v); }
function updateNet() {
  $('#netbar').hidden = navigator.onLine;
  const n = pendingCount(), el = document.getElementById('pendBox');
  if (el) { el.hidden = !n; el.innerHTML = n ? `📤 まだ送れていないものが <b>${n}件</b> あります。${navigator.onLine ? '<button class="btn sm" onclick="sync()" style="margin-left:6px">今すぐ送る</button>' : '電波が戻ったら自動で送ります'}` : ''; }
}
window.addEventListener('online', () => { updateNet(); sync(); });
window.addEventListener('offline', updateNet);
setInterval(() => { if (pendingCount()) sync(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.loaded) { sync(); if (!S.view) refresh(false); } });

      ${li('photo', '写真を撮って報告を書く', '全景（引き）→ 損傷（寄り）→ ナンバー → 周りの様子。下のボタンから')}
    </ul></div>
    ${vs.length ? `<div class="card"><h2>🚛 車が動かないとき（ロードサービス）</h2>${vs.map(v => { const x = st.vehicles[v.id]; const tel = (x.road || x.insurerPhone || '').replace(/[^\d+]/g, ''); return `<div class="row2" style="align-items:center;margin-bottom:6px"><span>${esc(v.name)} <small class="hint">${esc(v.plate || '')}</small></span><a class="btn sm" style="flex:0 0 auto" href="tel:${esc(tel)}">📞 ${x.road ? 'ロードサービス' : '保険会社'}</a></div>`; }).join('')}</div>` : ''}

}

function blankData() {
  return { kind: '', party: '', who: '', damage: {}, date: today(), time: nowTime(), weather: '', road: '', place: {}, car: { load: {} }, work: {}, driverId: S.me.id, driver: S.me.disp,
    memberIds: [], members: [], witnesses: [], other: {}, story: '', ownDamage: '', theirDamage: '', theirInjury: {}, rousai: {}, police: {}, ambulance: '' };
}
async function startDraft(fromSteps, preset) {
  const id = (preset && preset._id) || newId('J');
  const data = Object.assign(blankData(), preset || {}); delete data._id;
  S.drafts[id] = { id, data, boss: null, base: '', submitted: false, updated: nowStr() };
  await saveDrafts();
  if (fromSteps) history.replaceState({ v: { name: 'form', id } }, ''), S.view = { name: 'form', id }, render(), window.scrollTo(0, 0);
  else go({ name: 'form', id });
  getGeo(true);
}
async function editCase(id) {
  const c = caseById(id); if (!c) return;
  const ex = Object.values(S.drafts).find(d => d.id === id);
  if (!ex) { S.drafts[id] = { id, data: clone(c.data), boss: isBoss() ? clone(c.boss) : null, base: c.updatedAt, submitted: false, updated: nowStr() }; await saveDrafts(); }
  go({ name: 'form', id });
}
let draftTimer = null;
function touchDraft() { const d = curDraft(); if (!d) return; d.updated = nowStr(); clearTimeout(draftTimer); draftTimer = setTimeout(saveDrafts, 350); }
function curDraft() { return S.view && S.view.name === 'form' ? S.drafts[S.view.id] : null; }

/* --- 部品 --- */
function chip(path, val, label, o = {}) {
  const d = curDraft().data, cur = getP(d, path);
  const on = o.multi ? Array.isArray(cur) && cur.includes(val) : (o.bool ? !!cur : cur === val);
  return `<button type="button" class="chip${o.big ? ' big' : ''}${on ? ' on' : ''}" data-chip="${esc(path)}" data-v="${esc(val)}"${o.multi ? ' data-multi="1"' : ''}${o.bool ? ' data-bool="1"' : ''}${o.excl ? ` data-excl="${esc(o.excl)}"` : ''}>${label}</button>`;
}
const chips = (path, list, o = {}) => `<div class="chips">${list.map(v => chip(path, v, esc(v), o)).join('')}</div>`;
const inp = (path, ph = '', type = 'text', o = {}) => { const v = getP(curDraft().data, path); return `<input type="${type}" data-k="${esc(path)}" value="${esc(v == null ? '' : v)}" placeholder="${esc(ph)}"${o.list ? ` list="${o.list}"` : ''}${o.mode ? ` inputmode="${o.mode}"` : ''}${o.re ? ' data-re="1"' : ''}>`; };
const area = (path, ph = '', rows = 4) => `<textarea data-k="${esc(path)}" rows="${rows}" placeholder="${esc(ph)}">${esc(getP(curDraft().data, path) || '')}</textarea>`;
const lbl = (t, req) => `<label class="lbl">${t}${req ? '<span class="req">必須</span>' : ''}</label>`;

function slotsFor(d) {
  const dm = d.damage || {}, car = d.kind === 'car', out = [];
  const add = (slot, need, hint) => out.push({ slot, need, hint });
  add('scene', true, '事故の場所がわかるように、離れて全体を撮る');
  if (dm.ownThing) { add('own_far', true, car ? '自社の車の、ぶつけた側を離れて' : '壊れた自社の機械・道具を離れて'); add('own_near', false, 'へこみ・傷を近くで。複数枚OK'); }
  if (dm.theirThing || d.party === 'other') { add('their_far', true, car ? '相手の車・当たった物を離れて。ほぼ無傷でも、無傷の状態を撮っておく（後で「壊れた」と言われたときの証拠）' : '壊した物を離れて'); add('their_near', false, '当たった所を近くで'); add('detail', false, 'へこみ・割れの詳しい所。物差しや手を添えると大きさが伝わる'); }
  if (car && d.party === 'other') add('plate', true, '相手の車のナンバーがはっきり読めるように');
  if (car) add('around', true, '信号・標識・道幅・見通し・ブレーキ跡など');
  if (car && (d.car || {}).loadOn === '荷物あり') add('load', false, '荷台の積み方・シート掛け');
  if (!car && d.kind === 'work') add('machine', false, '使っていた機械・道具');
  if (car && d.party === 'other') add('docs', false, '相手の免許証・車検証・保険証券。相手の了承がある場合だけ');
  if (dm.theirPerson || dm.ownPerson) add('injury', false, '撮ってもよいか聞ける雰囲気のときだけ。無理に撮らない');
  add('other', false, 'そのほか残しておきたいもの');
  return out;
}
function photosOf(caseId, slot) {
  const loc = S.localPhotos.filter(p => p.caseId === caseId && !p.removed && (!slot || p.slot === slot));
  const c = caseById(caseId), srv = c && c.photos ? c.photos.filter(p => (!slot || p.slot === slot) && !loc.some(l => l.photoId === p.photoId)) : [];
  return loc.map(p => ({ photoId: p.photoId, slot: p.slot, caption: p.caption, local: true, sent: p.sent, takenAt: p.takenAt })).concat(srv.map(p => Object.assign({ srv: true }, p)));
}

  const noPh = slotsFor(d).filter(s => s.need && !photosOf(dr.id, s.slot).length).map(s => SLOT_JA[s.slot]);
  if (noPh.length && !confirm('撮っていない写真があります：' + noPh.join('・') + '\nこのまま送りますか？（あとから足せます）')) return;
  dr.submitted = true; dr.updated = nowStr(); await saveDrafts();

/* --- 位置 --- */
let lastGeo = null;
function getGeo(silent, setAddr) {
  if (!navigator.geolocation) { if (!silent) toast('この端末では位置がとれません'); return; }
  if (!silent) toast('位置を調べています…');
  navigator.geolocation.getCurrentPosition(async pos => {
    lastGeo = { lat: +pos.coords.latitude.toFixed(6), lng: +pos.coords.longitude.toFixed(6), acc: pos.coords.accuracy };
    const dr = curDraft(); if (!dr) return;
    const pl = dr.data.place || (dr.data.place = {});
    if (silent && pl.lat) return;
    Object.assign(pl, lastGeo); touchDraft();
    if ((setAddr || !pl.address) && navigator.onLine) {
      try { const j = await api('address', { lat: pl.lat, lng: pl.lng }, 15000); if (j.ok && j.address && (setAddr || !pl.address)) { pl.address = j.address; touchDraft(); } } catch (e) {}
    }
    if (curDraft() === dr) renderForm();
    if (!silent) toast(pl.address ? '場所を入れました。違っていたら直してください' : '位置を記録しました。住所を手で入れてください');
  }, () => { if (!silent) toast('位置がとれませんでした。住所を手で入れてください', 3500); }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
}

async function resizeImage(file, max = 1600, q = 0.85) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, ng) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ng(new Error('画像を開けません')); i.src = url; });
    const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), w = Math.round(img.naturalWidth * r), h = Math.round(img.naturalHeight * r);
    const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
    return await new Promise(ok => c.toBlob(ok, 'image/jpeg', q));
  } finally { URL.revokeObjectURL(url); }
}
async function addPhoto(file, slot, caseId, fromCam) {
  const blob = await resizeImage(file);
  const takenAt = fromCam ? nowStr() : (() => { const d = new Date(file.lastModified || Date.now()); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); })();
  const p = { photoId: 'P' + Date.now().toString(36) + rid(), caseId, slot, caption: '', takenAt, lat: fromCam && lastGeo ? lastGeo.lat : '', lng: fromCam && lastGeo ? lastGeo.lng : '',
    blob, raw: file.size <= 12 * 1024 * 1024 ? file : null, rawMime: file.type || 'image/jpeg', sent: false, at: nowStr() };
  await DB.pput(p); S.localPhotos.push(p);
  return p;
}
const urlCache = new Map();

}
async function photoUrl(id) {

}

    <div id="aiOut-${path.replace(/\./g, '-')}"></div>
    ${used ? `<div class="note green" style="margin-top:6px">🤖 AIでまとめた文を使っています <button type="button" class="btn sm" data-airevert="${path}" style="margin-left:6px">元の文に戻す</button></div>` : ''}`;

function aiContext(d) {

    [dm.ownThing && '自社の物', dm.theirThing && '相手の物', dm.ownPerson && '自社の人のけが', dm.theirPerson && '相手の人のけが'].filter(Boolean).join('・'),
    d.date, d.time, d.place && d.place.address, c.purpose, c.from && c.to ? c.from + '→' + c.to : '', c.vehicle, c.scene, w.site, w.task, d.driver ? '当事者：' + d.driver : ''].filter(Boolean).join('／');

    if (!j.ok) throw new Error(j.error);

/* --- 略図 --- */
function openSketch() {
  const dr = curDraft();
  const W = 1200, H = 800, strokes = [];
  let color = '#22231F', width = 6, stamp = '';
  $('#modal').dataset.lock = '1';
  openModal(`<h3>✏️ 位置関係の略図</h3>
    <div class="tools">${['#22231F', '#C0392B', '#2B5287'].map(c => `<button type="button" class="dot${c === color ? ' on' : ''}" data-col="${c}" style="background:${c}"></button>`).join('')}
      <button type="button" class="btn sm" data-w="3">細</button><button type="button" class="btn sm" data-w="6">中</button><button type="button" class="btn sm" data-w="12">太</button></div>
    <div class="tools">${['自社', '相手', '→', '信号', '電柱', '止まれ'].map(t => `<button type="button" class="chip" data-stamp="${t}">${t}</button>`).join('')}<span class="hint" style="align-self:center">文字を選んで、置く所をタップ</span></div>
    <div class="sketch-wrap"><canvas id="skC" width="${W}" height="${H}"></canvas></div>
    <div class="row2" style="margin-top:10px"><button type="button" class="btn sm" id="skUndo">↶ 1つ戻す</button><button type="button" class="btn sm" id="skClear">全部消す</button></div>
    <div class="row2" style="margin-top:10px"><button type="button" class="btn" id="skCancel">やめる</button><button type="button" class="btn primary" id="skSave">この略図にする</button></div>`);
  const cv = $('#skC'), x = cv.getContext('2d');
  const draw = () => {
    x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
    x.strokeStyle = '#EEE'; x.lineWidth = 1; for (let i = 50; i < W; i += 50) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, H); x.stroke(); } for (let j = 50; j < H; j += 50) { x.beginPath(); x.moveTo(0, j); x.lineTo(W, j); x.stroke(); }
    strokes.forEach(s => {
      if (s.t) { x.fillStyle = s.c; x.font = `bold 40px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(s.t, s.x, s.y); return; }
      x.strokeStyle = s.c; x.lineWidth = s.w; x.lineCap = 'round'; x.lineJoin = 'round'; x.beginPath(); s.p.forEach((pt, i) => i ? x.lineTo(pt[0], pt[1]) : x.moveTo(pt[0], pt[1])); if (s.p.length === 1) x.lineTo(s.p[0][0] + .1, s.p[0][1]); x.stroke();
    });
  };
  draw();
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; };
  let cur = null;
  cv.addEventListener('pointerdown', e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); const p = pos(e); if (stamp) { strokes.push({ t: stamp, x: p[0], y: p[1], c: color }); stamp = ''; document.querySelectorAll('[data-stamp]').forEach(b => b.classList.remove('on')); draw(); return; } cur = { c: color, w: width, p: [p] }; strokes.push(cur); draw(); });
  cv.addEventListener('pointermove', e => { if (!cur) return; e.preventDefault(); cur.p.push(pos(e)); draw(); });
  ['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, () => cur = null));
  document.querySelectorAll('[data-col]').forEach(b => b.onclick = () => { color = b.dataset.col; document.querySelectorAll('[data-col]').forEach(z => z.classList.toggle('on', z === b)); });
  document.querySelectorAll('[data-w]').forEach(b => b.onclick = () => width = +b.dataset.w);
  document.querySelectorAll('[data-stamp]').forEach(b => b.onclick = () => { stamp = stamp === b.dataset.stamp ? '' : b.dataset.stamp; document.querySelectorAll('[data-stamp]').forEach(z => z.classList.toggle('on', z.dataset.stamp === stamp)); });
  $('#skUndo').onclick = () => { strokes.pop(); draw(); };
  $('#skClear').onclick = () => { if (strokes.length && confirm('全部消しますか？')) { strokes.length = 0; draw(); } };
  const close = () => { delete $('#modal').dataset.lock; closeModal(); };
  $('#skCancel').onclick = close;
  $('#skSave').onclick = async () => {
    if (!strokes.length) { toast('何も描かれていません'); return; }
    const blob = await new Promise(ok => cv.toBlob(ok, 'image/jpeg', 0.9));
    for (const p of S.localPhotos.filter(p => p.caseId === dr.id && p.slot === 'sketch' && !p.sent)) { await DB.pdel(p.photoId); }
    S.localPhotos = S.localPhotos.filter(p => !(p.caseId === dr.id && p.slot === 'sketch' && !p.sent));
    const c = caseById(dr.id); if (c && c.photos) c.photos = c.photos.filter(p => p.slot !== 'sketch');
    S.localPhotos.filter(p => p.caseId === dr.id && p.slot === 'sketch').forEach(p => p.removed = true);
    const p = { photoId: 'P' + Date.now().toString(36) + rid(), caseId: dr.id, slot: 'sketch', caption: '位置関係の略図', takenAt: nowStr(), lat: '', lng: '', blob, raw: null, sent: false, at: nowStr() };
    await DB.pput(p); S.localPhotos.push(p);
    close(); renderForm(); sync();
  };
}

async function saveBoss(c, edit, quiet) {
  if (!navigator.onLine) { toast('電波があるときに保存してください'); return; }
  const b = $('#bossSave'); if (b) { b.disabled = true; b.innerHTML = '<span class="loading"></span> 保存しています'; }
  try {
    const j = await api('save', { case: { id: c.id, data: c.data, boss: edit }, base: c.updatedAt });
    if (!j.ok) { if (j.conflict) { upsertCase(j.case); renderCase(c.id); } throw new Error(j.error); }
    upsertCase(j.case); renderCase(c.id); updateBadges(); toast(quiet ? '記録しました' : '保存しました');
  } catch (e) { toast(e.message, 4500); if (b) { b.disabled = false; b.textContent = '保存'; } }
}

function hyChart() {
  const months = []; const d = new Date(); for (let i = 5; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); months.push(x.getFullYear() + '-' + pad(x.getMonth() + 1)); }
  const cnt = months.map(m => S.hiyari.filter(h => String(h.date).startsWith(m)).length), max = Math.max(1, ...cnt);
  const kinds = {}; S.hiyari.filter(h => String(h.date) >= months[0]).forEach(h => kinds[h.kind || 'その他'] = (kinds[h.kind || 'その他'] || 0) + 1);
  const top = Object.entries(kinds).sort((a, b) => b[1] - a[1]).slice(0, 5);
  return `<div class="card"><h2>月ごとの件数（6か月）</h2><div class="bars">${cnt.map(n => `<div style="height:${Math.round(n / max * 100)}%;background:${n ? 'var(--leaf)' : 'var(--leaf-soft)'}"><span>${n || ''}</span></div>`).join('')}</div>
    <div class="barx">${months.map(m => `<span>${+m.slice(5)}月</span>`).join('')}</div>
    ${top.length ? `<h3>多い種類</h3><div class="chips">${top.map(([k, n]) => `<span class="tag">${esc(k)} ${n}件</span>`).join('')}</div><p class="hint">朝礼・安全教育の話題にどうぞ</p>` : ''}</div>`;
}

        $('#hyAiOut').innerHTML = `<div class="note green"><b>🤖 AIのまとめ</b><div style="white-space:pre-wrap;background:#fff;border-radius:8px;padding:8px 10px;margin:4px 0">${esc(j.headline ? j.headline + '\n' + j.text : j.text)}</div>
          <div class="row2"><button type="button" class="btn sm primary" id="hyAiUse">この文を使う</button><button type="button" class="btn sm" id="hyAiNo">使わない</button></div></div>`;
        $('#hyAiUse').onclick = () => { keep(); item.textRaw = item.textRaw || t; item.text = j.text; draw(); };
        $('#hyAiNo').onclick = () => { $('#hyAiOut').innerHTML = ''; };
      } catch (e) { toast(e.message, 4000); }
      b.disabled = false; b.textContent = '🤖 AIでまとめる';
    };
    $('#hyCancel').onclick = async () => { for (const id of item.photoIds) await DB.pdel(id); S.localPhotos = S.localPhotos.filter(p => p.caseId !== item.id); closeModal(); };
    $('#hySend').onclick = async () => {
      keep();
      if (!item.kind && !item.text.trim()) { toast('「何が起きそうだった？」を選ぶか書いてください'); return; }
      S.hyOut.push({ mode: 'hiyari', body: { item: Object.assign({}, item) } }); await DB.set('hyOut', S.hyOut);
      closeModal(); renderHiyari(); toast(navigator.onLine ? '送りました。ありがとうございます' : '電波が戻ったら送ります'); sync();
    };
    loadThumbs();
  };
  draw();
}
async function hyAction(act, id) {
  const x = S.hiyari.find(h => h.id === id); if (!x) return;
  if (act === 'comment') {
    openModal(`<h3>💬 コメント</h3><textarea id="hcText" rows="3">${esc(x.comment || '')}</textarea><div class="row2" style="margin-top:10px"><button class="btn" onclick="closeModal()">やめる</button><button class="btn primary" id="hcOk">保存</button></div>`);
    $('#hcOk').onclick = async () => { const t = $('#hcText').value.trim(); closeModal(); try { const j = await api('hiyariBoss', { id, comment: t }); if (!j.ok) throw new Error(j.error); x.comment = t; x.commentBy = S.me.disp; renderHiyari(); } catch (e) { toast(e.message); } };
  } else if (act === 'done') {
    const nv = x.status === '対策済み' ? '' : '対策済み';

  } else if (act === 'del') {
    if (!confirm('このヒヤリハットを消しますか？')) return;
    try { const j = await api('hiyari', { item: { id }, remove: true }); if (!j.ok) throw new Error(j.error); S.hiyari = S.hiyari.filter(h => h.id !== id); renderHiyari(); } catch (e) { toast(e.message); }
  } else if (act === 'toCase') {
    if (!confirm('このヒヤリハットの内容で、事故報告を書き始めますか？')) return;
    const cid = newId('J');
    const preset = { _id: cid, kind: x.activity === '運転' ? 'car' : 'work', date: x.date || today(), time: x.time || nowTime(), place: { address: x.site || '' }, story: [x.kind, x.text].filter(Boolean).join('：'), fromHiyari: x.id };
    if (preset.kind === 'work') preset.work = { site: x.site || '' };
    S.hyOut.push({ mode: 'hiyari', body: { item: Object.assign({}, x, { caseId: cid }) } }); await DB.set('hyOut', S.hyOut);
    S.tab = 'home'; startDraft(false, preset); sync();
  }
}

/* =========================================================
   保険会社提出用PDF（A4縦：事故報告書＋写真台帳）
   ・社内向けの情報（親方メモ・経過記録・お金・再発防止）は載せない
   ・常に最新の内容で作り直す（書類には作成日だけ。修正の跡は残さない）
   ========================================================= */
const FONT = "'Hiragino Kaku Gothic ProN','Hiragino Sans','Noto Sans JP','Yu Gothic',Meiryo,sans-serif";
function loadScript(src) { return new Promise((ok, ng) => { if (document.querySelector(`script[src="${src}"]`)) return ok(); const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ng(new Error('部品を読み込めませんでした（電波を確かめてください）')); document.head.appendChild(s); }); }
function openPdf(c) {
  const ps = photosOf(c.id).filter(p => p.slot !== 'sketch'), st = S.settings || {}, full = st.full || {}, comp = Object.assign({}, COMPANY_DEFAULT, full.company || st.company || {});
  const d = c.data || {}, ins = (c.boss || {}).insurerCall || {};
  const vIns = d.kind === 'car' ? ((full.vehicles || {})[(d.car || {}).vehicleId] || {}) : ((full.insurance || {}).work || {});
  const sel = {}; ps.forEach(p => sel[p.photoId] = p.inPdf !== false);
  openModal(`<h3>📄 保険会社に出す事故報告書</h3>
    <label class="lbl">宛先（保険会社）</label><input type="text" id="pdTo" value="${esc(ins.insurer || defaultInsurer(c))}">
    <div class="row2"><div><label class="lbl">事故受付番号</label><input type="text" id="pdNo" value="${esc(ins.receiptNo || '')}"></div><div><label class="lbl">証券番号</label><input type="text" id="pdPol" value="${esc(vIns.policy || '')}"></div></div>
    <div class="row2"><div><label class="lbl">報告者</label><input type="text" id="pdBy" value="${esc(S.me.disp)}"></div><div><label class="lbl">電話</label><input type="tel" id="pdTel" value="${esc(comp.phone || '')}"></div></div>
    <label class="lbl">載せる写真（タップで外す・戻す）</label>
    <div class="thumbs" id="pdThumbs">${ps.map(p => thumbHtml(Object.assign({}, p, { inPdf: sel[p.photoId] }), { pdf: 1, label: 1 })).join('') || '<span class="hint">写真がありません</span>'}</div>
    <p class="hint">載せない情報：親方メモ・経過記録・お金・再発防止・社内の共有設定</p>
    <div class="row2" style="margin-top:12px"><button class="btn" id="pdPrev">見本を見る</button><button class="btn primary" id="pdMake">PDFを作る</button></div>
    <div id="pdProg" class="hint"></div><div class="pdfprev" id="pdPrevBox"></div>
    <button class="btn block" style="margin-top:10px" onclick="closeModal()">閉じる</button>`);
  loadThumbs();
  document.querySelectorAll('#pdThumbs .th').forEach(el => el.onclick = () => {
    const id = el.dataset.pid; sel[id] = !sel[id]; el.classList.toggle('off', !sel[id]);
    const cp = (c.photos || []).find(x => x.photoId === id); if (cp) cp.inPdf = sel[id];
    api('photoMeta', { photoId: id, inPdf: sel[id] }).catch(() => {});
  });
  const opts = () => ({ to: $('#pdTo').value.trim(), receiptNo: $('#pdNo').value.trim(), policy: $('#pdPol').value.trim(), by: $('#pdBy').value.trim(), tel: $('#pdTel').value.trim(), company: comp, photos: ps.filter(p => sel[p.photoId]) });
  const prog = t => { const e = $('#pdProg'); if (e) e.textContent = t || ''; };
  $('#pdPrev').onclick = async () => {
    try { prog('見本を作っています…'); const pages = await buildPdfPages(c, opts(), prog); const box = $('#pdPrevBox'); box.innerHTML = ''; pages.forEach(p => box.appendChild(p)); prog(pages.length + 'ページ'); }
    catch (e) { prog(''); toast(e.message, 4000); }
  };
  $('#pdMake').onclick = async () => {
    try {
      prog('準備しています…');
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
      const pages = await buildPdfPages(c, opts(), prog);
      const pdf = new window.jspdf.jsPDF({ orientation: 'p', unit: 'mm', format: 'a4', compress: true });
      pages.forEach((cv, i) => { prog(`PDFにしています… ${i + 1} / ${pages.length}`); if (i) pdf.addPage(); pdf.addImage(cv.toDataURL('image/jpeg', 0.88), 'JPEG', 0, 0, 210, 297, undefined, 'FAST'); });
      const name = `事故報告書_${c.no || ''}_${String(d.date || '').replace(/-/g, '')}.pdf`;
      const file = new File([pdf.output('blob')], name, { type: 'application/pdf' });
      prog('できました。送り先を選んでください');
      await shareFile(file);
      if (!(c.boss || {}).pdfSentAt) {
        if (confirm('保険会社に提出しましたか？\n「OK」で「詳細報告書を提出」に進めます')) {
          const edit = clone(c.boss || {}); edit.pdfSentAt = today();
          if (STAGES_DEF.indexOf(edit.stage || '報告受付') < 3) edit.stage = '詳細報告書を提出';
          closeModal(); await saveBoss(c, edit, true);
          api('log', { caseId: c.id, text: '詳細報告書（PDF）を ' + (opts().to || '保険会社') + ' に提出', showParty: true, kind: '親方' }).then(j => { if (j.ok) { upsertCase(j.case); if (S.view && S.view.id === c.id) renderCase(c.id); } }).catch(() => {});
        }
      }
    } catch (e) { prog(''); toast('PDFを作れませんでした：' + (e.message || e), 4500); }
  };
}
async function shareFile(f) {
  if (navigator.canShare && navigator.canShare({ files: [f] })) { try { await navigator.share({ files: [f], title: f.name }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
}
const PW = 1240, PH = 1754, MG = 84, LH = 34, FS = 23;
function wrapText(x, text, maxW) {
  const out = [];
  String(text == null ? '' : text).split('\n').forEach(par => {
    if (par === '') { out.push(''); return; }
    let line = '';
    for (const ch of Array.from(par)) {
      if (x.measureText(line + ch).width > maxW && line) {
        if (/^[、。，．）」』！？・ー]$/.test(ch)) { line += ch; out.push(line); line = ''; continue; }   // 句読点を行頭に置かない
        out.push(line); line = ch;
      } else line += ch;
    }
    out.push(line);
  });
  return out;
}
async function buildPdfPages(c, o, prog) {
  const d = c.data || {}, pages = [];
  let cv, x, y;
  const newPage = () => { cv = document.createElement('canvas'); cv.width = PW; cv.height = PH; x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, PW, PH); x.textBaseline = 'alphabetic'; x.fillStyle = '#111'; y = MG; pages.push(cv); };
  const font = (s, b) => x.font = `${b ? 'bold ' : ''}${s}px ${FONT}`;
  const text = (t, tx, ty, s = FS, o2 = {}) => { font(s, o2.bold); x.fillStyle = o2.color || '#111'; x.textAlign = o2.align || 'left'; x.fillText(t, tx, ty); x.textAlign = 'left'; };
  const bottom = PH - MG - 40;
  const ensure = hgt => { if (y + hgt > bottom) { newPage(); text('事故報告書（つづき）　報告番号 ' + (c.no || ''), MG, y + 24, 20, { color: '#555' }); y += 50; } };
  const LABW = 250, W = PW - MG * 2;
  const section = t => { ensure(LH * 2 + 20); y += 16; x.fillStyle = '#214A37'; x.fillRect(MG, y, W, 42); text(t, MG + 14, y + 30, 23, { bold: true, color: '#fff' }); y += 42; };
  const row = (k, v) => {
    font(FS); const lines = wrapText(x, v, W - LABW - 40), hgt = Math.max(1, lines.length) * LH + 16;
    if (y + hgt > bottom && lines.length > 3) {   // 長い文は途中で次のページへ
      let i = 0;
      while (i < lines.length) {
        const fit = Math.max(1, Math.floor((bottom - y - 16) / LH)), part = lines.slice(i, i + fit);
        drawRow(i ? k + '（つづき）' : k, part); i += fit; if (i < lines.length) ensure(LH * 3);
      }
      return;
    }
    ensure(hgt); drawRow(k, lines);
  };
  const drawRow = (k, lines) => {
    const hgt = Math.max(1, lines.length) * LH + 16;
    x.fillStyle = '#F1F4F1'; x.fillRect(MG, y, LABW, hgt); x.strokeStyle = '#9AA59C'; x.lineWidth = 1.5; x.strokeRect(MG, y, W, hgt); x.beginPath(); x.moveTo(MG + LABW, y); x.lineTo(MG + LABW, y + hgt); x.stroke();
    font(21, true); x.fillStyle = '#333'; wrapText(x, k, LABW - 20).forEach((l, i) => x.fillText(l, MG + 12, y + 32 + i * LH));
    font(FS); x.fillStyle = '#111'; lines.forEach((l, i) => x.fillText(l, MG + LABW + 14, y + 32 + i * LH));
    y += hgt;
  };

  /* 1ページ目の頭 */
  newPage();
  text('作成日　' + jaDate(today()), PW - MG, y + 22, 21, { align: 'right' });
  y += 40;
  text('事 故 報 告 書', PW / 2, y + 52, 52, { bold: true, align: 'center' }); y += 96;
  if (o.to) { text(o.to + '　御中', MG, y + 30, 30, { bold: true }); x.strokeStyle = '#111'; x.lineWidth = 2; x.beginPath(); x.moveTo(MG, y + 42); x.lineTo(MG + Math.min(620, x.measureText(o.to + '　御中').width + 10), y + 42); x.stroke(); }
  const comp = o.company || {};
  const rb = [comp.name, comp.address, o.tel || comp.phone ? 'TEL ' + (o.tel || comp.phone) : '', o.by ? '報告者　' + o.by : ''].filter(Boolean);
  rb.forEach((l, i) => text(l, PW - MG, y + 26 + i * 32, 21, { align: 'right', bold: i === 0 }));
  y += Math.max(70, rb.length * 32 + 20);
  const ids = [['報告番号', c.no || ''], o.receiptNo ? ['事故受付番号', o.receiptNo] : null, o.policy ? ['証券番号', o.policy] : null].filter(Boolean);
  ids.forEach(([k, v]) => row(k, v));
  y += 6;
  text('下記のとおり、事故の状況をご報告いたします。', MG, y + 34, 22); y += 50;

  reportRows(d).forEach(([t, rows]) => { section(t); rows.forEach(([k, v]) => row(k, v)); });
  if (d.story) { section('事故の経緯'); row('経緯', d.story); }

  /* 略図 */
  const sk = photosOf(c.id, 'sketch')[0];
  if (sk) {
    try {
      prog && prog('略図を読み込んでいます…');
      const img = await blobToImg(await photoBlob(sk.photoId));
      const bw = W, bh = Math.min(620, bw * img.naturalHeight / img.naturalWidth);
      section('位置関係の略図'); ensure(bh + 20);
      x.strokeStyle = '#9AA59C'; x.lineWidth = 1.5; x.strokeRect(MG, y, bw, bh + 16); fit(x, img, MG + 8, y + 8, bw - 16, bh); y += bh + 16;
    } catch (e) {}
  }

  /* 写真台帳（1ページに2枚） */
  const ph = o.photos || [];
  for (let i = 0; i < ph.length; i += 2) {
    newPage();
    text('写真台帳　報告番号 ' + (c.no || '') + '　（' + jaDate(d.date) + '）', MG, y + 26, 24, { bold: true }); y += 52;
    const slotH = (bottom - y) / 2;
    for (let k = 0; k < 2 && i + k < ph.length; k++) {
      const p = ph[i + k], top = y + slotH * k, imgH = slotH - 110;
      prog && prog(`写真を読み込んでいます… ${i + k + 1} / ${ph.length}`);
      x.strokeStyle = '#9AA59C'; x.lineWidth = 1.5; x.strokeRect(MG, top, W, slotH - 20);
      try { const img = await blobToImg(await photoBlob(p.photoId)); fit(x, img, MG + 10, top + 10, W - 20, imgH); }
      catch (e) { text('写真を読み込めませんでした', PW / 2, top + imgH / 2, 22, { align: 'center', color: '#999' }); }
      const ty = top + imgH + 30;
      text('No.' + (i + k + 1) + '　' + (SLOT_JA[p.slot] || '写真'), MG + 14, ty + 14, 23, { bold: true });
      text('撮影 ' + (p.takenAt || ''), PW - MG - 14, ty + 14, 20, { align: 'right', color: '#444' });
      if (p.caption) { font(21); text(wrapText(x, p.caption, W - 30)[0], MG + 14, ty + 50, 21, { color: '#222' }); }
    }
  }
  /* ページ番号 */
  pages.forEach((p, i) => { const g = p.getContext('2d'); g.font = `20px ${FONT}`; g.fillStyle = '#666'; g.textAlign = 'center'; g.fillText((i + 1) + ' / ' + pages.length, PW / 2, PH - 44); });
  return pages;
}
function blobToImg(b) { return new Promise((ok, ng) => { const u = URL.createObjectURL(b), i = new Image(); i.onload = () => ok(i); i.onerror = () => ng(new Error('画像')); i.src = u; }); }
function fit(x, img, bx, by, bw, bh) { const r = Math.min(bw / img.naturalWidth, bh / img.naturalHeight), w = img.naturalWidth * r, h = img.naturalHeight * r; x.drawImage(img, bx + (bw - w) / 2, by + (bh - h) / 2, w, h); }

/* ---------------- はじめ ---------------- */
updateNet();
if (S.token) boot(); else renderLogin();
</script>
