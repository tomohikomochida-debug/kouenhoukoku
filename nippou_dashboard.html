<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日報ダッシュボード ｜ 庭乃持田園</title>
<style>
:root{--paper:#F6F5F0;--card:#fff;--leaf:#214A37;--leaf2:#2E7D55;--soft:#E5EDE7;--bark:#5B5750;--ink:#22231F;--tape:#C77C30;--line:#DCD9D0;--field:#FBFAF6;--warn:#C0492F}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif;line-height:1.6}
.tnum{font-variant-numeric:tabular-nums}
header{background:var(--leaf);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header .mk{font-size:12px;letter-spacing:.14em;opacity:.75}header h1{margin:0;font-size:18px}
.fysel{margin-left:auto;font-size:14px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 14px;color:#fff;font-family:inherit;cursor:pointer}
.fysel option{color:#000}
main{max-width:920px;margin:0 auto;padding:18px 14px 60px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 8px 24px -18px rgba(0,0,0,.3)}
.kpi .n{font-size:28px;font-weight:800;color:var(--leaf);line-height:1.1}
.kpi .l{font-size:12px;color:var(--bark);font-weight:600;margin-top:2px}
.tabs{display:flex;gap:6px;margin:22px 0 14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-size:14px;cursor:pointer;font-family:inherit}
.tab.on{background:var(--leaf);color:#fff;border-color:var(--leaf);font-weight:700}
.panel{display:none}.panel.on{display:block}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 8px 24px -18px rgba(0,0,0,.3)}
.box h2{margin:0 0 14px;font-size:15px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar .nm{width:165px;font-size:13px;text-align:right;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{flex:1;background:var(--soft);border-radius:6px;overflow:hidden;height:22px}
.bar .fill{height:100%;background:var(--leaf2);border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:12px;font-weight:700;min-width:36px}
.bar.alt .fill{background:var(--tape)}
.period{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--bark);margin:14px 0 0;flex-wrap:wrap}
.period input{font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-family:inherit;background:var(--field)}
.period button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 12px;cursor:pointer;font-family:inherit;font-size:13px}
.period .quick{display:flex;gap:6px;flex-wrap:wrap}
.period .quick button.on{background:var(--leaf);color:#fff;border-color:var(--leaf);font-weight:700}
.bar.clk-bar{cursor:pointer}
.bar.clk-bar:hover .fill{filter:brightness(1.12)}
.bar.clk-bar:hover .nm{color:var(--leaf);font-weight:700}
.cal-head{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.cal-head button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 14px;cursor:pointer;font-family:inherit;font-size:14px}
.cal-head .m{font-size:16px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:11px;color:var(--bark);text-align:center;font-weight:700;padding:2px}
.cell{background:var(--field);border:1px solid var(--line);border-radius:7px;min-height:64px;padding:5px;font-size:11px;min-width:0;overflow:hidden}
.cell .d{font-weight:700;color:var(--bark)}
.cell .ev{background:var(--soft);border-radius:4px;padding:2px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px}
.cell .ev.clk,.cell .ev.more{cursor:pointer}
.cell .ev.clk:hover,.cell .ev.more:hover{background:var(--leaf2);color:#fff}
.cell .ev.more{color:var(--leaf);font-weight:700;background:#fff;border:1px dashed var(--line)}
.cell .nk{color:var(--leaf);font-weight:700}
.cell.empty{background:transparent;border:none}
.search-bar{display:flex;gap:8px;margin-bottom:14px}
.search-bar input{flex:1;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-family:inherit;background:var(--field)}
.res{font-size:14px}.res .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.res .yr{color:var(--bark)}.res .v{font-weight:700;color:var(--leaf);font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--bark);margin-top:10px;margin-bottom:14px}
.mcard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--field)}
.mhead{font-weight:800;font-size:15px;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.mcount{font-size:12px;font-weight:700;color:#fff;background:var(--warn);border-radius:999px;padding:2px 10px}
.mday{display:flex;gap:10px;font-size:13px;padding:3px 0;border-top:1px dashed var(--line)}
.mday .md{font-variant-numeric:tabular-nums;color:var(--bark);width:92px;flex-shrink:0}
.mday .ms{color:var(--ink)}
.ok{font-size:14px;color:var(--leaf2);font-weight:700;padding:8px 0}
.loading{text-align:center;color:var(--bark);padding:40px;font-size:14px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
.modal-bg.show{display:flex}
.modal-card{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:22px;position:relative;box-shadow:0 20px 60px -20px rgba(0,0,0,.5)}
.modal-x{position:absolute;top:10px;right:12px;border:none;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--bark)}
.d-head{border-bottom:2px solid var(--leaf);padding-bottom:10px;margin-bottom:12px}
.d-date{font-size:13px;color:var(--bark)}
.d-site{font-size:20px;font-weight:800;color:var(--leaf)}
.d-sub{font-size:13px;color:var(--bark);margin-top:2px}
.d-grid{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:10px}
.d-fld{margin-bottom:12px}
.d-grid .d-fld{margin-bottom:0;min-width:54px}
.d-lbl{font-size:11px;color:var(--bark);font-weight:700;margin-bottom:1px}
.d-val{font-size:14px;white-space:pre-wrap;word-break:break-word}
.d-val a{color:var(--leaf2)}
.dl-title{font-size:15px;font-weight:800;margin:0 0 12px}
.dl-row{padding:11px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.dl-row:hover{background:var(--soft)}
.sh-sec{margin-bottom:16px}
.sh-h{font-size:12px;font-weight:800;color:var(--leaf);border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:6px}
.cmsel{font-size:13px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;font-family:inherit;background:#fff;font-weight:400}
.res .row.clk-site{cursor:pointer;border-radius:8px;padding:8px;margin:0 -8px}
.res .row.clk-site:hover{background:var(--soft)}
.dl-row .dls{font-weight:700}
.dl-row .dlm{font-size:12px;color:var(--bark)}
@media(max-width:680px){.cards{grid-template-columns:repeat(2,1fr)}.bar .nm{width:110px}}
</style></head><body>
<header><span class="mk">庭乃持田園</span><h1>日報ダッシュボード</h1>
  <select class="fysel" id="fySel"></select></header>
<main>
  <div class="cards" id="kpis"></div>
  <div class="period">
    <span class="quick">
      <button data-q="all" class="on">年度全体</button>
      <button data-q="thismonth">今月</button>
      <button data-q="lastmonth">先月</button>
    </span>
    <span>期間 <input type="date" id="pFrom"> 〜 <input type="date" id="pTo"></span>
  </div>
  <div class="tabs">
    <button class="tab on" data-p="rank">現場別 人工</button>
    <button class="tab" data-p="month">月別 推移</button>
    <button class="tab" data-p="cat">種類別</button>
    <button class="tab" data-p="cal">カレンダー</button>
    <button class="tab" data-p="missing">未記入チェック</button>
    <button class="tab" data-p="search">過去をさがす</button>
  </div>
  <div class="panel on" id="rank"><div class="box"><h2 id="rankH">現場別 延べ人工</h2><div id="rankBars"></div></div></div>
  <div class="panel" id="month"><div class="box"><h2 id="monthH">月別 延べ人工</h2><div id="monthBars"></div></div></div>
  <div class="panel" id="cat"><div class="box"><h2 id="catH">種類別 延べ人工</h2><div id="catBars"></div></div></div>
  <div class="panel" id="cal"><div class="box">
    <div class="cal-head"><button id="prev">◀</button><span class="m" id="calM"></span><button id="next">▶</button></div>
    <div class="cal" id="calGrid"></div>
    <div class="note">現場名をタップすると、その日報の中身が開きます。「他◯件」もタップで一覧が出ます。</div>
  </div></div>
  <div class="panel" id="missing"><div class="box">
    <h2>日報の未記入チェック</h2>
    <div class="note">ほかの人の日報に名前が載っている（その日いっしょに働いた）のに、本人の日報が無い日を出します。未記入が多い人ほど上に出ます。</div>
    <div id="missList"><div class="loading">計算中…</div></div>
  </div></div>
  <div class="panel" id="search"><div class="box">
    <h2>過去をさがす（全年度・アーカイブ含む）</h2>
    <div class="search-bar"><input id="q" placeholder="現場名を入力（例：かしの木台）"></div>
    <div class="res" id="res"></div>
    <div class="note">どの年度の現場でも、年度ごとの人工を確認できます。</div>
  </div></div>
</main>
<div class="modal-bg" id="modalBg"><div class="modal-card"><button class="modal-x" id="modalX">×</button><div id="modalBody"></div></div></div>

  const total=Math.round(use.reduce((s,x)=>s+x.ninku,0)*100)/100;
  const h=`<div class="dl-title">${site}（${use.length}件・計${total}人工）</div>`+
    use.map(r=>`<div class="dl-row" data-rid="${r.rid}"><span class="dls">${r.date}</span><span class="dlm">${esc(r.author)}・人工${r.ninku}</span></div>`).join('');
  showModal(h);
}
function drawCal(){
  const [y,m]=calYM.split('-').map(Number);
  document.getElementById('calM').textContent=`${y}年 ${m}月`;
  const first=new Date(y,m-1,1).getDay(), dim=new Date(y,m,0).getDate();
  const byDay={};cur.filter(x=>x.date.slice(0,7)===calYM).forEach(x=>{(byDay[x.date.slice(0,10)]=byDay[x.date.slice(0,10)]||[]).push(x)});
  let h=['日','月','火','水','木','金','土'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<first;i++)h+='<div class="cell empty"></div>';
  for(let d=1;d<=dim;d++){const ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const ev=byDay[ds]||[];
    const _ba={}; ev.forEach(x=>{const a=x.author||'?';_ba[a]=(_ba[a]||0)+x.ninku;});
    const tot=Math.round(Object.values(_ba).reduce((s,v)=>s+Math.min(v,1),0)*100)/100;
    h+=`<div class="cell"><div class="d">${d}${tot?` <span class="nk">${tot}</span>`:''}</div>`+
       ev.slice(0,3).map(x=>`<div class="ev clk" data-rid="${x.rid}" title="${x.site} ${x.ninku}">${x.site}</div>`).join('')+
       (ev.length>3?`<div class="ev more" data-date="${ds}">他${ev.length-3}件</div>`:'')+`</div>`;}
  document.getElementById('calGrid').innerHTML=h;}
let lastSiteRecs=[];
function findRec(rid){ return cur.find(x=>String(x.rid)===String(rid)) || lastSiteRecs.find(x=>String(x.rid)===String(rid)); }
async function openSiteHistory(site){
  showModal('<div class="loading">読み込み中…</div>');
  let recs=[], smStart=null;
  try{ const res=await fetch(GAS_URL+'?action=sitehistory&site='+encodeURIComponent(site)); const d=await res.json(); recs=d.records||[]; smStart=d.startMonth||null; }catch(e){}
  if(!recs.length){
    const yrs=search[site]||{};
    showModal(`<div class="dl-title">${site}</div>`+(Object.keys(yrs).length?Object.entries(yrs).sort((a,b)=>b[0]-a[0]).map(([y,v])=>`<div class="dl-row"><span class="dls">${y}年度</span><span class="dlm">${Math.round(v*10)/10}人工</span></div>`).join(''):'<div class="note">データが取得できませんでした。</div>'));
    return;
  }
  lastSiteRecs=recs;
  const r1=v=>Math.round(v*10)/10;
  const total=r1(recs.reduce((s,x)=>s+x.ninku,0));
  const oldest=recs.slice().sort((a,b)=>a.date<b.date?-1:1)[0];
  const defStart=smStart || (+oldest.date.split('-')[1]);
  const byM={}; recs.forEach(r=>{byM[r.date.slice(0,7)]=(byM[r.date.slice(0,7)]||0)+r.ninku;});
  const mRows=Object.entries(byM).sort((a,b)=>a[0]<b[0]?1:-1).map(([ym,v])=>`<div class="mday"><span class="md">${ym}</span><span class="ms">${r1(v)}人工</span></div>`).join('');
  const list=recs.slice().sort((a,b)=>a.date<b.date?1:-1).map(r=>`<div class="dl-row" data-rid="${r.rid}"><span class="dls">${r.date}</span><span class="dlm">${esc(r.author)}・人工${r.ninku}</span></div>`).join('');
  const monthOpts=Array.from({length:12},(_,i)=>i+1).map(m=>`<option value="${m}" ${m===defStart?'selected':''}>${m}月</option>`).join('');
  showModal(`<div class="dl-title">${site}（全${recs.length}件・計${total}人工）</div>`+
    `<div class="sh-sec"><div class="sh-h">契約年ごと（開始月から1年）　開始月 <select id="cmStart" class="cmsel">${monthOpts}</select></div><div id="contractRows"></div></div>`+
    `<div class="sh-sec"><div class="sh-h">月ごと</div>${mRows}</div>`+
    `<div class="sh-sec"><div class="sh-h">日報（タップで中身）</div>${list}</div>`);
  renderContract(defStart);
}
function renderContract(startMonth){
  const recs=lastSiteRecs; const r1=v=>Math.round(v*10)/10;
  const buckets={};
  recs.forEach(r=>{const p=r.date.split('-');const y=+p[0],m=+p[1];const cy=(m>=startMonth)?y:y-1; buckets[cy]=(buckets[cy]||0)+r.ninku;});
  const rows=Object.entries(buckets).sort((a,b)=>b[0]-a[0]).map(([y,v])=>{
    const sy=+y; const endMonth=startMonth===1?12:startMonth-1; const endYear=startMonth===1?sy:sy+1;
    return `<div class="dl-row"><span class="dls">${sy}/${startMonth} 〜 ${endYear}/${endMonth}</span><span class="dlm">${r1(v)}人工</span></div>`;
  }).join('');
  const el=document.getElementById('contractRows'); if(el) el.innerHTML=rows||'<div class="note">データなし</div>';
}
function fld(label,val){ return (val!==''&&val!=null)?`<div class="d-fld"><div class="d-lbl">${label}</div><div class="d-val">${esc(val)}</div></div>`:''; }
function detailHTML(r){
  let photos='';
  if(r.photo){ const us=String(r.photo).split('\n').filter(Boolean);
    if(us.length) photos=`<div class="d-fld"><div class="d-lbl">写真</div><div class="d-val">`+us.map((u,i)=>`<a href="${u}" target="_blank">写真${i+1}を開く</a>`).join('　')+`</div></div>`; }
  return `<div class="d-head"><div class="d-date">${esc(r.date)}</div><div class="d-site">${esc(r.site)||'(現場名なし)'}</div>`+
    `<div class="d-sub">${esc(r.author)}　${esc(r.cat)}${r.con?'／'+esc(r.con):''}</div></div>`+
    `<div class="d-grid">`+fld('開始',r.start)+fld('終了',r.end)+fld('時間',r.hours?r.hours+'h':'')+fld('人工',r.ninku)+fld('天候',r.weather)+`</div>`+
    fld('業務内容',r.work)+fld('作業人員',r.members)+fld('途中合流',r.joiners)+fld('応援',r.helpers)+
    fld('使用車両',r.vehicles)+fld('使用機械',r.machines)+fld('要望・クレーム',r.claim)+fld('状態',r.state)+
    fld('今日できたこと',r.done)+fld('所感・学び',r.learn)+photos;
}
function openDetail(rid){ const r=findRec(rid); if(!r)return; showModal(detailHTML(r)); }
function openDayList(ds){
  const list=cur.filter(x=>x.date.slice(0,10)===ds);
  const h=`<div class="dl-title">${ds} の日報（${list.length}件）</div>`+
    list.map(r=>`<div class="dl-row" data-rid="${r.rid}"><span class="dls">${esc(r.site)||'(現場名なし)'}</span><span class="dlm">${esc(r.author)}・人工${r.ninku}</span></div>`).join('');
  showModal(h);
}
function showModal(html){ document.getElementById('modalBody').innerHTML=html; document.getElementById('modalBg').classList.add('show'); }
function closeModal(){ document.getElementById('modalBg').classList.remove('show'); }
function computeMissing(records){
  const byDate={};
  records.forEach(r=>{
    const d=(r.date||'').slice(0,10); if(!d)return;
    if(!byDate[d]) byDate[d]={written:new Set(),present:new Set(),whoSite:{}};
    if(r.author){ byDate[d].written.add(r.author); byDate[d].present.add(r.author); }
    (r.members||'').split('・').forEach(m=>{m=m.trim(); if(m){ byDate[d].present.add(m); (byDate[d].whoSite[m]=byDate[d].whoSite[m]||new Set()).add(r.site);} });
  });
  const EXCLUDE=new Set(['親方','持田','持田智彦']);
  const miss={};
  Object.keys(byDate).sort().reverse().forEach(d=>{
    const o=byDate[d];
    o.present.forEach(p=>{ if(EXCLUDE.has(p))return; if(!o.written.has(p)){ (miss[p]=miss[p]||[]).push({date:d,sites:[...(o.whoSite[p]||[])]}); } });
  });
  return miss;
}
function renderMissing(records){
  const miss=computeMissing(records);
  const people=Object.keys(miss).sort((a,b)=>miss[b].length-miss[a].length);
  const el=document.getElementById('missList');
  if(!people.length){ el.innerHTML='<div class="ok">未記入の日はありません。みんなちゃんと書いています。</div>'; return; }
  el.innerHTML=people.map(p=>{const days=miss[p];
    return `<div class="mcard"><div class="mhead">${p}<span class="mcount">未記入 ${days.length}日</span></div>`+
      days.map(x=>`<div class="mday"><span class="md">${x.date}</span><span class="ms">${x.sites.filter(Boolean).join('・')||'(現場不明)'}</span></div>`).join('')+`</div>`;
  }).join('');
}
function render(){
  const view=filterPeriod(cur);
  const totalNinku=Math.round(sum(view,x=>x.ninku)*10)/10;
  const sites=new Set(view.filter(x=>x.site).map(x=>x.site)).size;
  const days=new Set(view.map(x=>x.date.slice(0,10))).size;
  document.getElementById('kpis').innerHTML=[['総人工',totalNinku],['現場数',sites],['稼働日数',days],['日報数',view.length]]
    .map(([l,n])=>`<div class="kpi"><div class="n tnum">${n}</div><div class="l">${l}</div></div>`).join('');
  bars(document.getElementById('rankBars'),aggBy(view,x=>x.site).slice(0,12),false,true);
  bars(document.getElementById('monthBars'),aggBy(view,x=>x.date.slice(0,7)).sort((a,b)=>a[0]<b[0]?-1:1),false,false);
  bars(document.getElementById('catBars'),aggBy(view,x=>x.cat),true,false);
  const lbl=(curFY!=null?curFY+'年度 ':'');
  document.getElementById('rankH').textContent=lbl+'現場別 延べ人工';
  document.getElementById('monthH').textContent=lbl+'月別 延べ人工';
  document.getElementById('catH').textContent=lbl+'種類別 延べ人工';
  const _t=new Date(); const _tym=_t.getFullYear()+'-'+String(_t.getMonth()+1).padStart(2,'0');
  const _tfy=(_t.getMonth()+1<4)?_t.getFullYear()-1:_t.getFullYear();
  if(curFY===_tfy) calYM=_tym;
  else if(cur.length) calYM=cur.map(x=>x.date.slice(0,7)).sort().reverse()[0];
  else calYM=`${curFY}-04`;
  drawCal(); renderMissing(view);
}
function bindOnce(){
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
    document.getElementById(t.dataset.p).classList.add('on');});
  document.getElementById('prev').onclick=()=>{let[y,m]=calYM.split('-').map(Number);m--;if(m<1){m=12;y--}calYM=`${y}-${String(m).padStart(2,'0')}`;drawCal()};
  document.getElementById('next').onclick=()=>{let[y,m]=calYM.split('-').map(Number);m++;if(m>12){m=1;y++}calYM=`${y}-${String(m).padStart(2,'0')}`;drawCal()};
  document.getElementById('calGrid').onclick=e=>{const c=e.target.closest('.ev'); if(!c)return;
    if(c.classList.contains('more')) openDayList(c.dataset.date);
    else if(c.dataset.rid) openDetail(c.dataset.rid);};
  document.getElementById('modalBody').onclick=e=>{const c=e.target.closest('.dl-row'); if(c&&c.dataset.rid) openDetail(c.dataset.rid);};
  document.getElementById('modalBody').addEventListener('change',e=>{ if(e.target.id==='cmStart') renderContract(Number(e.target.value)); });
  document.getElementById('modalX').onclick=closeModal;
  document.getElementById('modalBg').onclick=e=>{ if(e.target.id==='modalBg') closeModal(); };
  document.getElementById('q').oninput=e=>{const q=e.target.value.trim();const res=document.getElementById('res');
    if(!q){res.innerHTML='';return}
    const hits=Object.keys(search).filter(s=>s&&s.includes(q)).slice(0,10);
    if(!hits.length){res.innerHTML='<div class="note">該当なし</div>';return}
    res.innerHTML=hits.map(s=>{const yrs=search[s];const total=Math.round(Object.values(yrs).reduce((a,b)=>a+b,0)*10)/10;
      const detail=Object.entries(yrs).sort((a,b)=>b[0]-a[0]).map(([y,v])=>`<span class="yr">${y}年度 ${Math.round(v*10)/10}</span>`).join('　');
      return `<div class="row clk-site" data-site="${s}"><div><b>${s}</b><br><span class="yr" style="font-size:12px">${detail}</span></div><div class="v">計${total}</div></div>`}).join('')};
  document.getElementById('res').onclick=e=>{const r=e.target.closest('.clk-site'); if(r&&r.dataset.site) openSiteHistory(r.dataset.site);};
  document.getElementById('fySel').onchange=e=>fetchYear(Number(e.target.value));
  document.getElementById('rankBars').onclick=e=>{const b=e.target.closest('.clk-bar'); if(b&&b.dataset.key) openSiteList(b.dataset.key);};
  document.getElementById('pFrom').onchange=()=>{clearQuick();render();};
  document.getElementById('pTo').onchange=()=>{clearQuick();render();};
  document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>setQuick(b.dataset.q));
}
function setRange(y,m){
  const f=`${y}-${String(m+1).padStart(2,'0')}-01`;
  const last=new Date(y,m+1,0).getDate();
  const t=`${y}-${String(m+1).padStart(2,'0')}-${String(last).padStart(2,'0')}`;
  document.getElementById('pFrom').value=f; document.getElementById('pTo').value=t;
}
function setQuick(q){
  document.querySelectorAll('.quick button').forEach(b=>b.classList.toggle('on',b.dataset.q===q));
  const t=new Date();
  if(q==='all'){ document.getElementById('pFrom').value=''; document.getElementById('pTo').value=''; }
  else if(q==='thismonth'){ setRange(t.getFullYear(),t.getMonth()); }
  else if(q==='lastmonth'){ let y=t.getFullYear(),m=t.getMonth()-1; if(m<0){m=11;y--;} setRange(y,m); }
  render();
}
function clearQuick(){ document.querySelectorAll('.quick button').forEach(b=>b.classList.remove('on')); }
function resetPeriod(){ document.getElementById('pFrom').value=''; document.getElementById('pTo').value=''; document.querySelectorAll('.quick button').forEach(b=>b.classList.toggle('on',b.dataset.q==='all')); }
function fillYearSelect(){ document.getElementById('fySel').innerHTML=years.map(y=>`<option value="${y}" ${y===curFY?'selected':''}>${y}年度（${y}年4月〜）</option>`).join(''); }
async function fetchYear(fy){
  try{ const res=await fetch(GAS_URL+'?action=dashboard&fy='+fy); const d=await res.json();
    if(d&&d.cur){ cur=d.cur; curFY=d.fy; resetPeriod(); render(); } }
  catch(e){ alert('この年度の読み込みに失敗しました。電波の良い所でもう一度お試しください。'); }
}
async function boot(){
  let d=null;
  try{ const res=await fetch(GAS_URL+'?action=dashboard'); d=await res.json(); }catch(e){ console.warn('GAS取得に失敗。埋め込みデータを表示します。',e); }
  if(d&&d.cur){ cur=d.cur; search=d.search||{}; years=(d.years||[]).filter(y=>y!=null&&!isNaN(y)); curFY=d.fy; }
  else { cur=FALLBACK.cur; search=FALLBACK.search||{};
    years=[...new Set(Object.values(search).flatMap(o=>Object.keys(o).map(Number)))].sort((a,b)=>b-a);
    curFY=years.length?years[0]:2026; }
  if(!years.length) years=[curFY];
  fillYearSelect(); bindOnce(); resetPeriod(); render();
}
boot();
</script></body></html>
