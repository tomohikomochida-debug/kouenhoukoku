<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="用語集">
<meta name="theme-color" content="#214A37">
<title>植木屋の用語集｜庭乃持田園</title>
<style>
:root{
  --paper:#F6F5F0; --card:#FFFFFF; --leaf:#214A37; --leaf-soft:#E5EDE7; --ok:#2E7D55;
  --tape:#C77C30; --bark:#5B5750; --ink:#22231F; --line:#DCD9D0; --field:#FBFAF6; --danger:#B0533F;
  --radius:10px; --shadow:0 1px 0 rgba(34,35,31,.04), 0 8px 24px -16px rgba(34,35,31,.25);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif;-webkit-text-size-adjust:100%;line-height:1.6}
header{background:var(--leaf);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:20;padding-top:calc(12px + env(safe-area-inset-top))}
header .row{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;letter-spacing:.04em}
header .me{font-size:13px;background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:999px;padding:5px 12px}
.demo-bar{background:var(--tape);color:#fff;font-size:12.5px;text-align:center;padding:5px 12px}
main{max-width:680px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
.error-banner{display:none;background:var(--danger);color:#fff;padding:10px 16px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:4px 0 10px;color:var(--leaf)}
.hint{font-size:12.5px;color:var(--bark);margin:4px 0 0}
label.lbl{display:block;font-size:13px;font-weight:600;color:var(--bark);margin:12px 0 6px}
input[type=text],input[type=search],textarea,select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink)}
textarea{min-height:72px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--leaf);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:15px;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 16px;min-height:46px;cursor:pointer}
.btn.primary{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:default}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;color:var(--ink);font-family:inherit}
.chip.on{background:var(--leaf-soft);border-color:var(--leaf);color:var(--leaf);font-weight:700}
.chip .n{color:var(--bark);font-size:12px;margin-left:4px}
.tag{display:inline-block;font-size:11.5px;border-radius:6px;padding:1px 7px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.tag.cat{background:var(--leaf-soft);color:var(--leaf)}
.tag.mis{background:#F6E7D8;color:#8A4F17}
.tag.wait{background:#EEE;color:var(--bark)}
.tag.draft{background:#FFF3D6;color:#7A5B12}
.searchbox{display:flex;gap:8px}.searchbox input{flex:1}
.mic{width:50px;min-width:50px;padding:0;font-size:20px}
.term{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;cursor:pointer}
.term .nm{font-weight:700;font-size:16px}
.term .nm small{font-weight:400;color:var(--bark);font-size:12.5px;margin-left:4px}
.term .mn{font-size:13.5px;color:var(--ink);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.term .why{font-size:12px;color:var(--tape);margin-top:2px}
.sec-title{font-size:13px;font-weight:700;color:var(--bark);margin:14px 2px 8px}
.maybe{border-left:4px solid var(--tape);padding-left:10px}
.empty{color:var(--bark);text-align:center;padding:22px 10px;font-size:14px}
.word-day{background:var(--leaf);color:#fff;border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer}
.word-day .lab{font-size:12px;opacity:.85}
.word-day .w{font-size:22px;font-weight:700;margin:2px 0}
.word-day .w small{font-size:13px;font-weight:400;opacity:.85;margin-left:6px}
.word-day .m{font-size:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:680px;margin:0 auto;display:flex}
nav.tabs button{flex:1;border:0;background:none;font:inherit;font-size:11.5px;color:var(--bark);padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative}
nav.tabs button .ic{font-size:21px;line-height:1.1}
nav.tabs button.on{color:var(--leaf);font-weight:700}
nav.tabs .badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--danger);color:#fff;font-size:10.5px;border-radius:999px;padding:0 6px;min-width:18px}
.modal-bg{position:fixed;inset:0;background:rgba(34,35,31,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:var(--paper);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.modal h3{margin:0;font-size:22px;color:var(--leaf)}
.modal .kana{color:var(--bark);font-size:14px;margin-bottom:10px}
.meaning{font-size:16px;line-height:1.75;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.usage{font-size:14.5px;color:var(--bark);margin:6px 2px 12px}
.miss-box{background:#FBF1E6;border:1px solid #EBCFAE;border-radius:10px;padding:12px;margin-bottom:12px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.loading{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--leaf);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px}
.btn.primary .loading{border-color:rgba(255,255,255,.5);border-top-color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="error-banner" id="errBanner"></div>
<header><div class="row"><h1>📗 植木屋の用語集</h1><button class="me" id="meBtn" type="button">名前を選ぶ</button></div></header>
<div class="demo-bar" id="demoBar" hidden>お試しモード：追加した言葉はこのスマホの中だけに保存されます</div>

<main>
  <section id="tab-search">
    <div class="card">
      <div class="searchbox">
        <input type="search" id="q" placeholder="聞いた言葉をそのまま入力" autocomplete="off" enterkeyhint="search">
        <button class="btn mic" type="button" data-mic="q" aria-label="音声で入力">🎤</button>
      </div>
      <p class="hint">うろ覚えや聞き間違いでも大丈夫。「枝を縛る」のような説明でも探せます。</p>
    </div>
    <div id="results"></div>
    <div id="home"></div>
  </section>

  <section id="tab-cat" hidden>
    <div class="chips" id="catChips" style="margin-bottom:12px"></div>
    <div id="catList"></div>
  </section>

  <section id="tab-add" hidden>
    <div class="card">
      <h2>言葉を追加する</h2>
      <p class="hint" style="margin-bottom:4px">社内の言い方や、載っていない言葉を足してください。管理者が確認してから正式になります。</p>
      <label class="lbl">言葉</label>
      <div class="searchbox"><input type="text" id="aTerm" placeholder="例：しおる" autocomplete="off"><button class="btn mic" type="button" data-mic="aTerm">🎤</button></div>
      <div id="aDup"></div>
      <label class="lbl">読み（ひらがな）</label>
      <input type="text" id="aKana" placeholder="例：しおる">
      <label class="lbl">分類</label>
      <select id="aCat"></select>
      <label class="lbl">意味（やさしい言葉で）</label>
      <textarea id="aMean" placeholder="例：枝を縄で幹の方へ寄せて束ねること"></textarea>
      <button class="btn sm" type="button" id="aAi" style="margin-top:6px">🤖 AIに意味の下書きを頼む</button>
      <label class="lbl">現場での使い方（例）</label>
      <input type="text" id="aUse" placeholder="例：「積む前に枝をしおっておいて」">
      <label class="lbl">ほかの呼び方（あれば・読点で区切る）</label>
      <input type="text" id="aAlias" placeholder="例：しおり、枝折り">
      <label class="lbl">出どころ</label>
      <div class="chips" id="aSrc"><button type="button" class="chip on" data-src="社内">社内の言い方</button><button type="button" class="chip" data-src="業界">業界の用語</button></div>
      <button class="btn primary block" type="button" id="aSave" style="margin-top:16px">確認して追加</button>
    </div>
  </section>

  <section id="tab-review" hidden>
    <div class="sec-title">スタッフが追加した言葉（未確認）</div>
    <div id="revNew"></div>
    <div class="sec-title">承認待ちの呼び方</div>
    <div id="revAliases"></div>
    <div class="sec-title">下書きの言葉（意味を確認して「確認済」に）</div>
    <div class="chips" id="revCats" style="margin-bottom:10px"></div>
    <div id="revDraft"></div>
    <div class="card" id="importCard" hidden>
      <h2>初期データの取り込み</h2>
      <p class="hint">このアプリに入っている下書きの言葉（<span id="seedN"></span>語）を、用語集のスプレッドシートに取り込みます。何度押しても二重にはなりません。</p>
      <button class="btn block" type="button" id="importBtn" style="margin-top:10px">下書きの用語をシートに取り込む</button>
    </div>
  </section>
</main>

<nav class="tabs"><div class="in">
  <button type="button" data-tab="search" class="on"><span class="ic">🔍</span>探す</button>
  <button type="button" data-tab="cat"><span class="ic">📚</span>分類</button>
  <button type="button" data-tab="add"><span class="ic">＋</span>追加</button>
  <button type="button" data-tab="review" id="tabReview" hidden><span class="ic">✔</span>確認<span class="badge" id="revBadge" hidden>0</span></button>
</div></nav>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ 設定 ============ */
// 現場アプリGAS（段取り・道具管理・用語集で共通の1本）のURL。空のままだと「お試しモード」
const GAS_URL = '';
const MASTERS_URL = 'https://script.google.com/macros/s/AKfycbz2iP9eN-79vKTgOvfY6_Vd9rJZ9IMuz4ILkrxE79Muqq0pvTZAAhBG3cMXpZV6ZU1-/exec';
const DOUGU_PAGE = 'dougu.html';
const DEMO = !GAS_URL;
const LS = { me: 'yougo_me', admin: 'yougo_admin', demo: 'yougo_demo_v1', cache: 'yougo_cache', draft: 'yougo_draft' };
const NET_ERR = '電波を確認して、もう一度お試しください';
const CATS = ['剪定・手入れ', '枝・芽の名前', '樹形・仕立て', '植栽・移植', '支柱・結束', '樹木の部位・規格', '季節の作業・土と肥料', '病害虫', '庭づくり（石・水・配置）', '現場の言葉', '道具', '資材', '社内用語'];
const ALIAS_TYPES = ['社内呼び', '別名', '略称', '聞き間違い'];

/* ============ 小道具 ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400); }
function showError(m) { const b = $('errBanner'); b.textContent = '⚠️ ' + m; b.style.display = 'block'; }
window.addEventListener('error', e => showError('画面の処理でエラー：' + (e.message || '')));
function now() { const d = new Date(), p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); }

/* ============ 文字のゆれ・音の近さ（道具管理アプリと同じ仕組み） ============ */
const SMALL = { 'ぁ': 'あ', 'ぃ': 'い', 'ぅ': 'う', 'ぇ': 'え', 'ぉ': 'お', 'っ': 'つ', 'ゃ': 'や', 'ゅ': 'ゆ', 'ょ': 'よ', 'ゎ': 'わ' };
function toHira(s) { return String(s || '').replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)); }
function isKana(s) { return /^[ぁ-ゖァ-ーー\s]+$/.test(String(s || '')); }
function norm(s) { return toHira(String(s || '').normalize('NFKC').toLowerCase()).replace(/[\s・･,，、。.\-－_/／（）()「」『』]/g, ''); }
function loose(s) { return norm(s).normalize('NFD').replace(/[゙゚]/g, '').normalize('NFC').replace(/[ぁぃぅぇぉっゃゅょゎ]/g, c => SMALL[c]).replace(/ー/g, ''); }
function lev(a, b) {
  if (a === b) return 0; const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j), cur = new Array(n + 1);
  for (let i = 1; i <= m; i++) { cur[0] = i; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); [prev, cur] = [cur, prev]; }
  return prev[n];
}
// 動詞の語尾ゆれ（しおる／しおって／しおり 等）を吸収するため、3文字以上の語は語幹でも比べる
function stem(s) { return s.length >= 3 ? s.replace(/(って|った|ます|ない|る|り|て|た|く|き|け)$/, '') : s; }

/* ============ データ ============ */
const SEED = {
  terms: [["Y0001", "剪定", "せんてい", "剪定・手入れ", "枝を切って木の形や大きさを整え、木を健康に保つ作業。", "「今日は高津公園のケヤキの剪定」", "透かし剪定・刈り込み", ""],
    ["Y0002", "透かし剪定", "すかしせんてい", "剪定・手入れ", "混み合った枝を付け根から間引き、木の形は残したまま風通しと日当たりを良くする剪定。", "「この木は透かしで軽くして」", "大透かし・中透かし・小透かし・忌み枝", ""],
    ["Y0003", "大透かし", "おおすかし", "剪定・手入れ", "木の骨組みになる太い枝（主枝）の一部を、分かれ目から抜く透かし。大きく軽くなる。", "", "透かし剪定・主枝", ""],
    ["Y0004", "中透かし", "ちゅうすかし", "剪定・手入れ", "主枝から出た二番目の太さの枝（副主枝）を、分かれ目から間引く透かし。", "", "透かし剪定", ""],
    ["Y0005", "小透かし", "こすかし", "剪定・手入れ", "枝先の細かい枝を間引いて、木の外側を軽く整える透かし。", "「今年は小透かし程度でいい」", "透かし剪定", ""],
    ["Y0006", "枝おろし", "えだおろし", "剪定・手入れ", "太い枝を付け根から切り落とすこと。下の枝を落として木の下をすっきりさせるときにも言う。", "「下枝を2本おろして」", "二段切り・枝下高", ""],
    ["Y0007", "切り返し", "きりかえし", "剪定・手入れ", "長く伸びた枝を、途中の分かれ目にある短い枝の所で切って、枝先を内側に戻す剪定。木をひと回り小さくできる。", "", "切り詰め", ""],
    ["Y0008", "切り詰め", "きりつめ", "剪定・手入れ", "枝を途中で切って短くすること。そこから新しい芽を出させて枝を作り直す。", "", "切り返し・ぶつ切り", ""],
    ["Y0009", "刈り込み", "かりこみ", "剪定・手入れ", "刈込鋏やバリカンで、生垣や玉物の表面を切りそろえること。", "「生垣は刈り込みで面をそろえて」", "刈込鋏・ヘッジトリマー・生垣・玉物", ""],
    ["Y0010", "二段切り", "にだんぎり", "剪定・手入れ", "太い枝を切るとき、先に少し先の所で枝を落としてから付け根で切り直す切り方。重みで樹皮が裂けるのを防ぐ。", "「太いから二段で切って」", "枝おろし", ""],
    ["Y0011", "ぶつ切り", "ぶつぎり", "剪定・手入れ", "枝分かれを考えずに枝や幹の途中で切ること。こぶや胴吹きの原因になり、見た目も悪いので基本は避ける。", "", "切り詰め・剪定こぶ・胴吹き", ""],
    ["Y0012", "剪定こぶ", "せんていこぶ", "剪定・手入れ", "同じ場所で何度も切り詰めたせいで、枝先にできたこぶ状のふくらみ。", "", "ぶつ切り", ""],
    ["Y0013", "芯止め", "しんどめ", "剪定・手入れ", "木のてっぺんの幹（芯）を切って、それ以上高くならないようにすること。", "「この高さで芯を止めて」", "芯", ""],
    ["Y0014", "枝しおり", "えだしおり", "剪定・手入れ", "掘り取りや運搬の前に、広がった枝を縄で幹の方へ寄せて束ねておくこと。枝が折れず、作業や積み込みがしやすくなる。", "「積む前に枝をしおっておいて」", "掘り取り・移植・シュロ縄", ""],
    ["Y0015", "マルキ", "まるき", "剪定・手入れ", "切った枝などを束ねて縄で結ぶこと。またはその束（地域や会社によって言い方が違う）。", "「枝はマルキにしてトラックへ」", "発生材", ""],
    ["Y0016", "みどり摘み", "みどりつみ", "剪定・手入れ", "春に松の新しい芽（みどり）を手で摘んで、伸びる長さや数をそろえる作業。", "「5月は松のみどり摘み」", "もみあげ・芽摘み", ""],
    ["Y0017", "もみあげ", "もみあげ", "剪定・手入れ", "秋から冬にかけて、松の古い葉を手でむしり取る作業。中まで光と風が入る。", "「冬は松のもみあげ」", "みどり摘み", ""],
    ["Y0018", "芽摘み", "めつみ", "剪定・手入れ", "伸び始めた新芽を指や鋏で摘んで、枝の伸びすぎを抑えること。", "", "みどり摘み・芽切鋏", ""],
    ["Y0019", "伐採", "ばっさい", "剪定・手入れ", "木を根元近くで切り倒すこと。", "「枯れたサクラを伐採」", "抜根・玉切り", ""],
    ["Y0020", "抜根", "ばっこん", "剪定・手入れ", "木の根を掘り起こして取り除くこと。", "「抜根してから植える」", "伐採・唐鍬", ""],

function seedDemo() {

    terms: SEED.terms.map(r => ({ termId: r[0], term: r[1], kana: r[2], category: r[3], meaning: r[4], usage: r[5], related: r[6], toolId: r[7], source: '業界', photoUrl: '', reviewState: '下書き', addedBy: 'Claude下書き', updatedAt: now() })),
    aliases: SEED.aliases.map(a => ({ alias: a[0], kana: a[1], termId: a[2], type: a[3], state: '承認済', addedBy: 'Claude下書き', addedAt: now() }))
  };
}
const api = {
  async get() {
    if (DEMO) {
      let d = lsGet(LS.demo, null);
      if (!d) d = seedDemo();
      else {   // 道具管理アプリが先に開かれた場合など、初期の言葉が欠けていたら足す
        const s = seedDemo(), haveT = new Set(d.terms.map(t => t.termId)), haveA = new Set(d.aliases.map(a => a.termId + '|' + a.alias));
        s.terms.forEach(t => { if (!haveT.has(t.termId)) d.terms.push(t); });
        s.aliases.forEach(a => { if (!haveA.has(a.termId + '|' + a.alias)) d.aliases.push(a); });
      }
      lsSet(LS.demo, d);
      return Object.assign({ ok: true }, d);
    }
    return (await fetch(GAS_URL + '?app=yougo&action=data', { cache: 'no-store' })).json();
  },
  async post(body) {
    if (DEMO) return demoPost(body);
    return (await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ app: 'yougo' }, body)) })).json();
  }
};
function demoSave() { lsSet(LS.demo, DB) || toast('端末の保存容量がいっぱいです'); }
function demoPost(b) {
  const T = DB.terms, A = DB.aliases;
  switch (b.mode) {
    case 'aiSearch': {
      // お試し：意味の文に含まれる言葉で簡易的に探す
      const words = norm(b.query).match(/[一-鿿]{2,}|[ぁ-ゖ]{3,}/g) || [];
      const res = T.map(t => ({ t, s: words.filter(w => norm(t.meaning).includes(w)).length })).filter(x => x.s > 0)
        .sort((a, b) => b.s - a.s).slice(0, 3).map(x => ({ id: x.t.termId, reason: '意味の説明が近い（簡易判定）' }));
      return { ok: true, results: res };
    }
    case 'explain': return { ok: true, data: { kana: isKana(b.word) ? toHira(b.word) : '', category: '社内用語', meaning: '', usage: '' }, note: 'お試しモードではAIの下書きは使えません' };
    case 'addTerm': {
      if (T.some(t => t.term === b.term.term)) return { ok: false, error: '「' + b.term.term + '」はすでに登録されています' };
      const max = T.reduce((m, t) => Math.max(m, Number(String(t.termId).replace(/\D/g, '')) || 0), 0);
      const id = 'Y' + String(max + 1).padStart(4, '0');
      T.push(Object.assign({ termId: id, kana: isKana(b.term.term) ? toHira(b.term.term) : '', related: '', toolId: '', photoUrl: '', reviewState: '未確認', addedBy: b.by, updatedAt: now() }, b.term));
      (b.aliases || []).forEach(a => demoPost({ mode: 'addAlias', alias: a.alias, termId: id, type: a.type, by: b.by, state: a.state }));
      demoSave(); return { ok: true, termId: id };
    }
    case 'updateTerm': { const t = T.find(x => x.termId === b.id); if (!t) return { ok: false, error: '用語が見つかりません' }; Object.assign(t, b.patch, { updatedAt: now() }); demoSave(); return { ok: true }; }
    case 'addAlias': {
      if (A.some(a => a.termId === b.termId && a.alias === b.alias)) return { ok: true, duplicate: true };
      A.push({ alias: b.alias, kana: b.kana || (isKana(b.alias) ? toHira(b.alias) : ''), termId: b.termId, type: ALIAS_TYPES.includes(b.type) ? b.type : '別名', state: b.state || '承認待ち', addedBy: b.by || '', addedAt: now() });
      demoSave(); return { ok: true };
    }
    case 'review': {
      if (b.kind === 'term') { const t = T.find(x => x.termId === b.key); if (t) t.reviewState = b.action === 'approve' ? '確認済' : '未確認'; }
      else { const i = A.findIndex(a => a.termId === b.key.termId && a.alias === b.key.alias); if (i >= 0) { if (b.action === 'approve') A[i].state = '承認済'; else A.splice(i, 1); } }
      demoSave(); return { ok: true };
    }
  }
  return { ok: false, error: 'unknown mode' };
}

const termById = id => DB.terms.find(t => String(t.termId) === String(id));
const termByName = n => DB.terms.find(t => t.term === n);
const aliasesOf = id => DB.aliases.filter(a => String(a.termId) === String(id));

/* ============ 検索 ============ */
function searchTerms(qRaw) {
  const q = norm(qRaw), ql = loose(qRaw), qs = stem(q);
  if (!q) return [];
  const out = [];
  DB.terms.forEach(t => {
    const terms = [{ s: t.term, why: '' }, { s: t.kana, why: '読み' }];
    aliasesOf(t.termId).forEach(a => { terms.push({ s: a.alias, why: a.type, alias: a }); if (a.kana) terms.push({ s: a.kana, why: a.type, alias: a }); });
    let best = { score: 0 };
    const set = (score, why, alias) => { if (score > best.score) best = { score, why, alias }; };
    terms.forEach(term => {
      const n = norm(term.s), l = loose(term.s);
      if (!n) return;
      const label = term.alias ? '「' + term.alias.alias + '」（' + term.why + '）' : term.why;
      if (n === q) set(100, label, term.alias);
      else if (l && l === ql) set(92, label ? label + '・音が同じ' : '音が同じ', term.alias);
      else if (qs.length >= 2 && stem(n) === qs) set(90, label ? label + '・言い方ちがい' : '言い方ちがい', term.alias);
      else if (q.length >= 2 && n.startsWith(q)) set(82, label, term.alias);
      else if (q.length >= 3 && n.includes(q)) set(72, label, term.alias);
      else if (n.length >= 2 && q.includes(n)) set(n.length >= 3 ? 64 : 56, label, term.alias);
      else if (isKana(term.s) && ql.length >= 3 && l.length >= 3) {
        const d = lev(ql, l);
        if (d === 1) set(52, '音が近い', term.alias);
        else if (d === 2 && Math.min(ql.length, l.length) >= 5) set(42, '音が近い', term.alias);
      }
    });
    if (best.score < 40 && q.length >= 2) {
      const deep = q.length >= 3 || /[\u4e00-\u9fff]/.test(q);   // 2文字のひらがなは意味の文に偶然含まれやすいので除く
      if (deep && norm(t.meaning).includes(q)) set(36, '意味の中に出てくる');
      else if (deep && norm(t.usage).includes(q)) set(32, '使い方の例に出てくる');
    }
    if (best.score > 0) out.push(Object.assign({ term: t }, best));
  });
  return out.sort((a, b) => b.score - a.score || String(a.term.kana).localeCompare(String(b.term.kana), 'ja'));
}
let lastMiss = '', aiCache = {};
function doSearch() {
  const qv = $('q').value.trim(), box = $('results');
  $('home').hidden = !!qv;
  if (!qv) { box.innerHTML = ''; lastMiss = ''; return; }
  const hits = searchTerms(qv), found = hits.filter(h => h.score >= 60), maybe = hits.filter(h => h.score < 60);
  lastMiss = found.length ? '' : qv;
  let h = found.map(x => termRow(x.term, x.why)).join('');
  if (maybe.length) h += '<div class="sec-title">もしかして</div><div class="maybe">' + maybe.slice(0, 6).map(x => termRow(x.term, x.why)).join('') + '</div>';
  if (!found.length) h += '<div id="aiBox"><div class="empty">「' + esc(qv) + '」に近い言葉を <b>AI</b> で探しています… <span class="loading"></span></div></div>';
  box.innerHTML = h;
  if (!found.length) aiSearch(qv, maybe.map(x => x.term.termId));
}
async function aiSearch(qv, already) {
  try {
    const r = aiCache[qv] || await api.post({ mode: 'aiSearch', query: qv }); aiCache[qv] = r;
    if ($('q').value.trim() !== qv) return;
    const box = $('aiBox'); if (!box) return;
    if (!r.ok) throw new Error(r.error);
    const res = (r.results || []).filter(x => !already.includes(x.id) && termById(x.id));
    box.innerHTML = res.length ? '<div class="sec-title">AIの候補</div><div class="maybe">' + res.map(x => termRow(termById(x.id), x.reason)).join('') + '</div>'
      : (already.length ? '' : '<div class="empty">見つかりませんでした。<br>先輩に意味を聞いたら「＋追加」から登録してください。</div>');
  } catch (e) { const box = $('aiBox'); if (box) box.innerHTML = '<div class="empty">AIで探せませんでした（' + esc(e.message || NET_ERR) + '）</div>'; }
}
function stateTag(t) { return t.reviewState === '下書き' ? '<span class="tag draft">下書き</span>' : t.reviewState === '未確認' ? '<span class="tag wait">未確認</span>' : ''; }
function termRow(t, why) {
  return '<button type="button" class="term" data-term="' + esc(t.termId) + '"><div class="nm">' + esc(t.term) + '<small>' + esc(t.kana) + '</small><span class="tag cat">' + esc(t.category) + '</span>' + stateTag(t) + '</div>' +
    '<div class="mn">' + esc(t.meaning || '（意味はまだ書かれていません）') + '</div>' + (why ? '<div class="why">' + esc(why) + '</div>' : '') + '</button>';
}

/* ============ 用語の詳細 ============ */
function openTerm(id, fromSearch) {
  const t = termById(id); if (!t) return;
  const al = aliasesOf(id);
  const missQ = fromSearch && lastMiss && norm(lastMiss) !== norm(t.term) && !al.some(a => norm(a.alias) === norm(lastMiss)) ? lastMiss : '';
  let h = '';
  if (missQ) h += '<div class="miss-box">「<b>' + esc(missQ) + '</b>」で探してこの言葉を開きました。この言い方を登録しますか？' +
    '<div class="row2" style="margin-top:10px"><button class="btn sm" data-add-miss="聞き間違い">聞き間違いとして</button><button class="btn sm" data-add-miss="別名">呼び方として</button></div></div>';
  h += '<h3>' + esc(t.term) + '</h3><div class="kana">' + esc(t.kana) + '<span class="tag cat">' + esc(t.category) + '</span>' + stateTag(t) + '</div>';
  h += '<div class="meaning">' + esc(t.meaning || '（意味はまだ書かれていません）') + '</div>';
  if (t.usage) h += '<div class="usage">💬 ' + esc(t.usage) + '</div>';
  h += '<div class="sec-title">ほかの呼び方</div><div class="chips">' + (al.length ? al.map(a => '<span class="chip" style="cursor:default">' + esc(a.alias) +
    (a.type === '聞き間違い' ? '<span class="tag mis">聞き間違い</span>' : a.type === '社内呼び' ? '<span class="tag cat">社内</span>' : '') +
    (a.state !== '承認済' ? '<span class="tag wait">承認待ち</span>' : '') + '</span>').join('') : '<span class="hint">まだありません</span>') + '</div>';
  const rel = String(t.related || '').split('・').map(s => s.trim()).filter(Boolean).map(termByName).filter(Boolean);
  if (rel.length) h += '<div class="sec-title">関係する言葉</div><div class="chips">' + rel.map(r => '<button type="button" class="chip" data-rel="' + esc(r.termId) + '">' + esc(r.term) + '</button>').join('') + '</div>';
  if (t.category === '道具' || t.category === '資材') h += '<a class="btn block" style="margin-top:14px;text-decoration:none" href="' + DOUGU_PAGE + '?q=' + encodeURIComponent(t.term) + '">🧰 道具管理で保管場所・写真を見る</a>';
  h += '<p class="hint" style="margin-top:12px">出どころ：' + esc(t.source || '') + (t.addedBy ? '　登録：' + esc(t.addedBy) : '') + '</p>';
  h += '<div class="row2" style="margin-top:12px"><button class="btn" data-act="alias">＋呼び方</button>' + (isAdmin() ? '<button class="btn" data-act="edit">✎ 直す</button>' : '') + '</div>';
  if (isAdmin() && t.reviewState !== '確認済') h += '<button class="btn ok block" style="margin-top:8px" data-act="approve">✓ 確認済にする</button>';
  h += '<button class="btn block" style="margin-top:8px" data-act="close">閉じる</button>';
  openModal(h, async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.addMiss) { await post({ mode: 'addAlias', alias: missQ, termId: id, type: b.dataset.addMiss, by: me(), state: isAdmin() ? '承認済' : '承認待ち' }, '登録しました'); lastMiss = ''; return openTerm(id); }
    if (b.dataset.rel) return openTerm(b.dataset.rel);
    if (b.dataset.act === 'alias') return openAliasForm(id);
    if (b.dataset.act === 'edit') return openEditForm(id);
    if (b.dataset.act === 'approve') { await post({ mode: 'review', kind: 'term', key: id, action: 'approve' }, '確認済にしました'); return openTerm(id); }
    if (b.dataset.act === 'close') closeModal();
  });
}
function openAliasForm(id) {
  const t = termById(id);
  openModal('<h3 style="font-size:18px">呼び方を追加</h3><p class="hint" style="margin:6px 0 10px">「' + esc(t.term) + '」を、社内や現場で何と言っていますか？</p>' +
    '<div class="searchbox"><input type="text" id="alIn" placeholder="例：しおる" autocomplete="off"><button class="btn mic" type="button" data-mic="alIn">🎤</button></div>' +
    '<label class="lbl">種類</label><div class="chips" id="alType">' + ALIAS_TYPES.map((x, i) => '<button type="button" class="chip' + (i === 0 ? ' on' : '') + '" data-ty="' + x + '">' + x + '</button>').join('') + '</div>' +
    '<div class="row2" style="margin-top:16px"><button class="btn" data-act="back">戻る</button><button class="btn primary" data-act="save">追加する</button></div>',
    async e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.ty) { document.querySelectorAll('#alType .chip').forEach(c => c.classList.toggle('on', c === b)); return; }
      if (b.dataset.act === 'back') return openTerm(id);

        b.disabled = true;
        await post({ mode: 'addAlias', alias: v, termId: id, type: (document.querySelector('#alType .chip.on') || {}).dataset.ty, by: me(), state: isAdmin() ? '承認済' : '承認待ち' }, isAdmin() ? '追加しました' : '追加しました（管理者の承認待ち）');

}
function openEditForm(id) {
  const t = termById(id);
  openModal('<h3 style="font-size:18px">「' + esc(t.term) + '」を直す</h3>' +
    '<label class="lbl">読み</label><input type="text" id="eKana" value="' + esc(t.kana) + '">' +
    '<label class="lbl">分類</label><select id="eCat">' + CATS.map(c => '<option' + (c === t.category ? ' selected' : '') + '>' + c + '</option>').join('') + '</select>' +
    '<label class="lbl">意味</label><textarea id="eMean">' + esc(t.meaning) + '</textarea>' +

    '<label style="display:flex;gap:8px;align-items:center;margin:14px 0 4px;font-size:14px"><input type="checkbox" id="eOk" checked style="width:20px;height:20px">確認済にする</label>' +
    '<div class="row2" style="margin-top:12px"><button class="btn" data-act="back">戻る</button><button class="btn primary" data-act="save">保存する</button></div>',

/* ============ 追加 ============ */
let aSrc = '社内';
function checkDup() {
  const v = $('aTerm').value.trim();
  if (!v) { $('aDup').innerHTML = ''; return; }
  if (isKana(v) && !$('aKana').dataset.touched) $('aKana').value = toHira(v);
  const hits = searchTerms(v).filter(h => h.score >= 52).slice(0, 3);
  $('aDup').innerHTML = hits.length ? '<p class="hint" style="color:var(--danger);margin-top:8px">似た言葉がすでにあります。同じ意味なら、その言葉の「＋呼び方」で足してください。</p>' + hits.map(x => termRow(x.term, x.why)).join('') : '';
}
async function addAi() {
  const v = $('aTerm').value.trim(); if (!v) return toast('先に言葉を入れてください');
  const b = $('aAi'); b.disabled = true; b.innerHTML = '<span class="loading"></span> 考え中…';
  try {
    const r = await api.post({ mode: 'explain', word: v });
    if (!r.ok) throw new Error(r.error);
    if (r.note) toast(r.note);
    const d = r.data || {};
    if (d.kana && !$('aKana').value) $('aKana').value = d.kana;
    if (d.category) $('aCat').value = d.category;
    if (d.meaning) $('aMean').value = d.meaning;
    if (d.usage && !$('aUse').value) $('aUse').value = d.usage;
    if (d.meaning) toast('AIの下書きです。合っているか必ず確かめてください');
  } catch (e) { toast(e.message || NET_ERR); }
  finally { b.disabled = false; b.textContent = '🤖 AIに意味の下書きを頼む'; }
}
function addConfirm() {
  const term = $('aTerm').value.trim(), mean = $('aMean').value.trim();
  if (!term) return toast('言葉を入れてください');
  if (!mean) return toast('意味を入れてください（分からなければ先輩に聞いて）');
  const t = { term, kana: $('aKana').value.trim() || (isKana(term) ? toHira(term) : ''), category: $('aCat').value, meaning: mean, usage: $('aUse').value.trim(), source: aSrc, reviewState: isAdmin() ? '確認済' : '未確認' };
  const aliases = $('aAlias').value.split(/[、,，\s]+/).map(s => s.trim()).filter(s => s && s !== term).map(s => ({ alias: s, type: aSrc === '社内' ? '社内呼び' : '別名', state: '承認済' }));
  openModal('<h3 style="font-size:20px">' + esc(term) + '</h3><div class="kana">' + esc(t.kana) + '<span class="tag cat">' + esc(t.category) + '</span></div><div class="meaning">' + esc(mean) + '</div>' +
    (t.usage ? '<div class="usage">💬 ' + esc(t.usage) + '</div>' : '') + (aliases.length ? '<p class="hint">ほかの呼び方：' + esc(aliases.map(a => a.alias).join('、')) + '</p>' : '') +
    '<p class="hint">出どころ：' + esc(aSrc) + (isAdmin() ? '' : '　→ 管理者の確認後に正式になります') + '</p>' +
    '<div class="row2" style="margin-top:14px"><button class="btn" data-act="back">直す</button><button class="btn primary" data-act="save">追加する</button></div>',
    async e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.act === 'back') return closeModal();
      if (b.dataset.act === 'save') {
        b.disabled = true;
        const ok = await post({ mode: 'addTerm', term: t, aliases, by: me() }, '追加しました');
        if (ok) { closeModal(); ['aTerm', 'aKana', 'aMean', 'aUse', 'aAlias'].forEach(i => { $(i).value = ''; }); delete $('aKana').dataset.touched; $('aDup').innerHTML = ''; lsSet(LS.draft, null); }
        else b.disabled = false;
      }
    });
}

async function post(body, okMsg) {
  try {
    const r = await api.post(body);
    if (!r.ok) throw new Error(r.error || '保存に失敗しました');
    if (okMsg) toast(okMsg);
    if (!DEMO) await load(); else renderAll();
    return true;
  } catch (e) { toast(String(e.message || '').includes('Failed to fetch') ? NET_ERR : (e.message || NET_ERR)); return false; }
}

/* ============ ホーム（今日の言葉）・分類 ============ */
function renderHome() {
  if (!DB.terms.length) { $('home').innerHTML = ''; return; }
  const d = new Date(), seed = d.getFullYear() * 400 + d.getMonth() * 31 + d.getDate();
  const pool = DB.terms.filter(t => t.meaning && t.category !== '道具' && t.category !== '資材');
  const pick = k => pool[(seed * 7 + k * 13) % pool.length];
  const w = pick(0);
  let h = '<div class="word-day" data-term="' + esc(w.termId) + '"><div class="lab">📅 今日の言葉</div><div class="w">' + esc(w.term) + '<small>' + esc(w.kana) + '</small></div><div class="m">' + esc(w.meaning) + '</div></div>';
  h += '<div class="sec-title">新人さんがまず覚えたい言葉</div>' + [1, 2, 3].map(k => termRow(pick(k))).join('');
  const mis = DB.aliases.filter(a => a.type === '聞き間違い' && termById(a.termId)).slice(0, 4);
  if (mis.length) h += '<div class="sec-title">聞き間違えやすい言葉</div>' + mis.map(a => { const t = termById(a.termId); return '<button type="button" class="term" data-term="' + esc(t.termId) + '"><div class="nm">「' + esc(a.alias) + '」<small>→</small> ' + esc(t.term) + '</div><div class="mn">' + esc(t.meaning) + '</div></button>'; }).join('');
  $('home').innerHTML = h;
}
let curCat = '';
function renderCats() {
  const cnt = {}; DB.terms.forEach(t => { cnt[t.category] = (cnt[t.category] || 0) + 1; });
  const list = CATS.filter(c => cnt[c]).concat(Object.keys(cnt).filter(c => !CATS.includes(c)));
  if (curCat !== '__mis' && (!curCat || !cnt[curCat])) curCat = list[0] || '';
  $('catChips').innerHTML = list.map(c => '<button type="button" class="chip' + (c === curCat ? ' on' : '') + '" data-cat="' + esc(c) + '">' + esc(c) + '<span class="n">' + cnt[c] + '</span></button>').join('') +
    '<button type="button" class="chip' + (curCat === '__mis' ? ' on' : '') + '" data-cat="__mis">聞き間違えやすい言葉</button>';
  if (curCat === '__mis') {
    const mis = DB.aliases.filter(a => a.type === '聞き間違い' && termById(a.termId));
    $('catList').innerHTML = mis.length ? mis.map(a => { const t = termById(a.termId); return '<button type="button" class="term" data-term="' + esc(t.termId) + '"><div class="nm">「' + esc(a.alias) + '」<small>→</small> ' + esc(t.term) + '</div><div class="mn">' + esc(t.meaning) + '</div></button>'; }).join('') : '<div class="empty">まだありません</div>';
  } else {
    $('catList').innerHTML = DB.terms.filter(t => t.category === curCat).sort((a, b) => String(a.kana).localeCompare(String(b.kana), 'ja')).map(t => termRow(t)).join('');
  }
}

/* ============ 確認（管理者） ============ */
let revCat = '';
function renderReview() {
  const nw = DB.terms.filter(t => t.reviewState === '未確認');
  const als = DB.aliases.filter(a => a.state !== '承認済' && termById(a.termId));
  const drafts = DB.terms.filter(t => t.reviewState === '下書き');
  $('revBadge').textContent = nw.length + als.length; $('revBadge').hidden = !(nw.length + als.length);
  $('revNew').innerHTML = nw.length ? nw.map(t => termRow(t, '登録：' + (t.addedBy || ''))).join('') : '<div class="empty">ありません</div>';
  $('revAliases').innerHTML = als.length ? als.map((a, i) => { const t = termById(a.termId); return '<div class="card" style="padding:12px"><div style="font-size:15px"><b>「' + esc(a.alias) + '」</b> → ' + esc(t.term) + '<span class="tag ' + (a.type === '聞き間違い' ? 'mis' : 'wait') + '">' + esc(a.type) + '</span></div><div class="hint">追加：' + esc(a.addedBy) + '　' + esc(a.addedAt) + '</div>' +
    '<div class="row2" style="margin-top:8px"><button class="btn sm danger" data-rev-al="' + i + '" data-ac="reject">✗ 却下</button><button class="btn sm ok" data-rev-al="' + i + '" data-ac="approve">✓ 承認</button></div></div>'; }).join('') : '<div class="empty">ありません</div>';
  renderReview._als = als;
  const dc = {}; drafts.forEach(t => { dc[t.category] = (dc[t.category] || 0) + 1; });
  const cats = CATS.filter(c => dc[c]);
  if (!revCat || !dc[revCat]) revCat = cats[0] || '';
  $('revCats').innerHTML = cats.map(c => '<button type="button" class="chip' + (c === revCat ? ' on' : '') + '" data-revcat="' + esc(c) + '">' + esc(c) + '<span class="n">' + dc[c] + '</span></button>').join('');
  $('revDraft').innerHTML = drafts.length ? drafts.filter(t => t.category === revCat).map(t => termRow(t)).join('') : '<div class="empty">下書きはすべて確認済です</div>';
  $('importCard').hidden = DEMO; $('seedN').textContent = SEED.terms.length;
}
async function importSeed() {
  const b = $('importBtn'); b.disabled = true; b.innerHTML = '<span class="loading"></span> 取り込み中…';
  try {
    const d = seedDemo();
    const r = await api.post({ mode: 'import', terms: d.terms, aliases: d.aliases });
    if (!r.ok) throw new Error(r.error);

  } catch (e) { toast(e.message || NET_ERR); }

/* ============ 名前・管理者・モーダル・音声 ============ */
const me = () => lsGet(LS.me, '');
const isAdmin = () => !!lsGet(LS.admin, false);
async function chooseName(force) {
  if (me() && !force) return;
  let staff = [];
  try { const r = await fetch(MASTERS_URL + '?action=masters', { cache: 'no-store' }).then(x => x.json()); staff = (r.staff || []).map(s => typeof s === 'string' ? s : (s.name || s.staff || '')).filter(Boolean); } catch (e) { }
  openModal('<h3 style="font-size:18px">あなたの名前</h3><p class="hint" style="margin:6px 0 12px">最初の1回だけ選びます。言葉を追加した人として記録されます。</p>' +
    (staff.length ? '<div class="chips" style="margin-bottom:12px">' + staff.map(s => '<button type="button" class="chip" data-nm="' + esc(s) + '">' + esc(s) + '</button>').join('') + '</div>' : '') +
    '<input type="text" id="nmIn" placeholder="名前を入力" value="' + esc(me()) + '"><button class="btn primary block" style="margin-top:12px" data-act="ok">決定</button>',
    e => {
      const b = e.target.closest('button'); if (!b) return;
      const v = b.dataset.nm || (b.dataset.act === 'ok' ? $('nmIn').value.trim() : '');
      if (!v) return b.dataset.act === 'ok' && toast('名前を選ぶか入力してください');
      lsSet(LS.me, v); $('meBtn').textContent = '👤 ' + v; closeModal();
    }, true);
}
let modalHandler = null, modalLocked = false;
function openModal(html, handler, locked) { $('modal').innerHTML = html; modalHandler = handler; modalLocked = !!locked; $('modalBg').classList.add('show'); $('modal').scrollTop = 0; bindMics($('modal')); }
function closeModal() { $('modalBg').classList.remove('show'); $('modal').innerHTML = ''; modalHandler = null; }
$('modal').addEventListener('click', e => { if (modalHandler) modalHandler(e); });
$('modalBg').addEventListener('click', e => { if (e.target === $('modalBg') && !modalLocked) closeModal(); });
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function bindMics(root) {
  root.querySelectorAll('[data-mic]').forEach(b => {
    if (b._bound) return; b._bound = true;
    b.addEventListener('click', () => {
      const inp = $(b.dataset.mic);
      if (!SR || IOS) { inp.focus(); toast('キーボードのマイク🎤を押して話してください'); return; }
      const rec = new SR(); rec.lang = 'ja-JP'; b.textContent = '⏺'; rec.onend = () => { b.textContent = '🎤'; };
      rec.onresult = ev => { inp.value = ev.results[0][0].transcript.replace(/[。、]$/, ''); inp.dispatchEvent(new Event('input', { bubbles: true })); };
      rec.onerror = () => toast('うまく聞き取れませんでした'); rec.start();
    });
  });
}

/* ============ 画面 ============ */
function showTab(name) {
  ['search', 'cat', 'add', 'review'].forEach(n => { $('tab-' + n).hidden = n !== name; });

  if (name === 'add') chooseName();
}
function renderAll() { renderHome(); renderCats(); renderReview(); if ($('q').value.trim()) doSearch(); }

document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
let qTimer;
$('q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(doSearch, 300); });
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(qTimer); doSearch(); $('q').blur(); } });
document.body.addEventListener('click', e => {

  const ra = e.target.closest('[data-rev-al]'); if (ra) { const a = renderReview._als[Number(ra.dataset.revAl)]; if (a) post({ mode: 'review', kind: 'alias', key: { termId: a.termId, alias: a.alias }, action: ra.dataset.ac }, ra.dataset.ac === 'approve' ? '承認しました' : '却下しました'); return; }
  const sc = e.target.closest('[data-src]'); if (sc) { aSrc = sc.dataset.src; document.querySelectorAll('#aSrc .chip').forEach(c => c.classList.toggle('on', c === sc)); }
});
$('aTerm').addEventListener('input', () => { clearTimeout(checkDup._t); checkDup._t = setTimeout(checkDup, 300); });
$('aKana').addEventListener('input', () => { $('aKana').dataset.touched = '1'; });
$('aAi').addEventListener('click', addAi);
$('aSave').addEventListener('click', addConfirm);
$('importBtn').addEventListener('click', importSeed);
$('meBtn').addEventListener('click', () => chooseName(true));
['aTerm', 'aKana', 'aMean', 'aUse', 'aAlias'].forEach(i => $(i).addEventListener('input', () => lsSet(LS.draft, { aTerm: $('aTerm').value, aKana: $('aKana').value, aMean: $('aMean').value, aUse: $('aUse').value, aAlias: $('aAlias').value })));

(function init() {

  if (p.get('admin') === '1') lsSet(LS.admin, true);
  if (p.get('admin') === '0') lsSet(LS.admin, false);
  $('tabReview').hidden = !isAdmin(); $('demoBar').hidden = !DEMO;
  if (me()) $('meBtn').textContent = '👤 ' + me();
  $('aCat').innerHTML = CATS.map(c => '<option' + (c === '社内用語' ? ' selected' : '') + '>' + c + '</option>').join('');
