<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>公園作業記録 — 求積＆出来形ツール（試作）</title>
<style>
  :root{
    --bg:#10141a; --panel:#171d26; --panel2:#1f2733; --line:#2b3543;
    --ink:#e8edf3; --mut:#8a97a8;
    --acc:#3ddc97; --warn:#ffb454; --bad:#ff6b6b; --blue:#5aa9ff;
    --mono:"SFMono-Regular",ui-monospace,"DejaVu Sans Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
    -webkit-text-size-adjust:100%;overscroll-behavior:none;}
  .app{display:grid;grid-template-columns:300px 1fr 320px;grid-template-rows:48px 1fr;
    height:100vh;width:100vw}
  header{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px;
    background:linear-gradient(180deg,#1b2330,#141a23);border-bottom:1px solid var(--line)}
  header .logo{font-weight:800;letter-spacing:.5px}
  header .logo b{color:var(--acc)}
  header .meta{color:var(--mut);font-size:12px}
  header .sp{flex:1}
  header input.park{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    border-radius:7px;padding:6px 10px;font-size:13px;width:180px}
  .col{overflow-y:auto;padding:14px;border-right:1px solid var(--line)}
  .col.r{border-right:none;border-left:1px solid var(--line)}
  .sec{margin-bottom:18px}
  .sec h3{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);
    margin:0 0 8px;font-weight:700}
  .btn{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);
    color:var(--ink);border-radius:8px;padding:9px 11px;font-size:13px;cursor:pointer;margin-bottom:7px;
    transition:.12s}
  .btn:hover{border-color:var(--acc)}
  .btn.on{background:var(--acc);color:#08110b;border-color:var(--acc);font-weight:700}
  .btn small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
  .btn.on small{color:#0a3a26}
  .row{display:flex;gap:7px}
  .row .btn{margin-bottom:7px}
  label.fld{display:block;font-size:11px;color:var(--mut);margin:8px 0 3px}
  select,input.txt{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    border-radius:7px;padding:8px;font-size:13px}
  .mini{display:flex;gap:6px;flex-wrap:wrap}
  .mini button{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    border-radius:6px;padding:6px 4px;font-size:11px;cursor:pointer}
  .mini button:hover{border-color:var(--blue)}
  canvas{display:block;background:#0b0e13;cursor:crosshair;touch-action:none}
  .stage{position:relative;overflow:hidden}
  .hint{position:absolute;left:10px;top:10px;background:rgba(14,18,24,.5);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
    border:1px solid rgba(130,150,170,.22);padding:6px 10px;border-radius:8px;font-size:11px;color:var(--ink);max-width:52%;line-height:1.45;cursor:pointer}
  .hint b{color:var(--acc)}
  .scalebadge{position:absolute;right:12px;bottom:12px;background:rgba(10,14,20,.85);
    border:1px solid var(--line);padding:6px 10px;border-radius:8px;font-size:12px;font-family:var(--mono)}
  .scalebadge.no{color:var(--warn);border-color:var(--warn)}
  .draftbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:none;gap:8px;
    background:rgba(10,14,20,.92);border:1px solid var(--line);padding:8px;border-radius:12px;box-shadow:0 6px 24px #0008}
  .draftbar.on{display:flex}
  .draftbar button{border:1px solid var(--line);background:var(--panel2);color:var(--ink);
    border-radius:9px;padding:11px 16px;font-size:15px;font-weight:700;cursor:pointer;touch-action:manipulation}
  .draftbar button.ok{background:var(--acc);color:#08110b;border-color:var(--acc)}
  .draftbar button:disabled{opacity:.4;cursor:default}
  .draftbar button:active{transform:scale(.96)}
  .tot{font-family:var(--mono);font-size:20px;font-weight:700}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--mut);font-weight:600;font-size:10px;letter-spacing:.5px;text-transform:uppercase}
  td.num,th.num{text-align:right;font-family:var(--mono)}
  .swatch{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
  .pill{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:20px;
    padding:2px 9px;font-size:11px;color:var(--mut);font-family:var(--mono)}
  .danger{color:var(--bad)}
  .ghost{background:none;border:1px dashed var(--line);color:var(--mut)}
  .legend{font-size:11px;color:var(--mut);line-height:1.7}
  .empty{color:var(--mut);font-size:12px;padding:8px;text-align:center;border:1px dashed var(--line);border-radius:8px}
  .feat{font-size:12px;border-bottom:1px solid var(--line);padding:6px 2px;display:flex;align-items:center;gap:6px;cursor:pointer}
  .feat:hover{background:var(--panel2)}
  .feat .x{margin-left:auto;color:var(--mut)}
  .feat .x:hover{color:var(--bad)}
  .feat.sel{background:var(--panel2);outline:1px solid var(--acc)}
  @media(max-width:1200px){
    html,body{height:auto;min-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
    .app{display:flex;flex-direction:column;height:auto;min-height:100dvh;width:100vw}
    header{position:sticky;top:0;z-index:5;flex:0 0 auto;flex-wrap:wrap;height:auto;min-height:48px;gap:8px;padding:8px 12px}
    header .park{flex:1 1 120px;width:auto;min-width:96px}
    .stage{order:1;flex:0 0 58vh;height:58vh}
    .col{order:2;flex:0 0 auto;max-height:none;overflow:visible;border:none;border-top:1px solid var(--line)}
    .col.r{order:3;border-left:none}
  }
  @media(max-width:640px){
    header{gap:6px;padding:6px 10px;min-height:0}
    header .logo{font-size:13px}
    header .meta{display:none}            /* 長い注記・委託ラベルはスマホでは隠す */
    header .park{flex:1 1 90px;min-width:80px;font-size:13px;padding:5px 7px}
    .blbl{display:none}                    /* 戻る/進むはアイコンのみ */
    #undoBtn,#redoBtn{padding:5px 9px;font-size:16px;margin-right:4px;line-height:1}
    .stage{flex:0 0 62vh;height:62vh}
    .hint{font-size:11px;max-width:62vw;padding:7px 9px}
    .draftbar{bottom:10px;padding:6px;gap:6px}
    .draftbar button{padding:9px 12px;font-size:14px}
  }
  .modal{position:fixed;inset:0;background:rgba(5,8,12,.88);display:none;z-index:50;padding:24px;overflow:auto}
  .modal.on{display:block}
  .modal .card{max-width:960px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px}
  .modal h2{margin:0 0 2px;font-size:18px}
  .modal .close{float:right;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
  .modal .close:hover{border-color:var(--bad);color:var(--bad)}
  .modal .toolbar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
  .modal .toolbar button{background:var(--acc);color:#08110b;border:none;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer}
  .modal .toolbar button.alt{background:var(--panel2);color:var(--ink);border:1px solid var(--line);font-weight:600}
  .block{margin:14px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .block .bh{padding:8px 12px;font-weight:700;background:var(--panel2);display:flex;align-items:center;gap:8px}
  .block .bh .a{margin-left:auto;font-family:var(--mono);color:var(--acc)}
  .block table{width:100%}
  .block table tr:last-child td{font-weight:700}
  .grand{margin-top:18px;border-top:2px solid var(--acc);padding-top:10px}
  /* 折りたたみセクション */
  .sec.collapsible > h3{cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px}
  .sec.collapsible > h3 .chev{margin-left:auto;font-size:11px;color:var(--mut);transition:transform .15s}
  .sec.collapsed > h3 .chev{transform:rotate(-90deg)}
  .sec.collapsed .secbody{display:none}
  .sec .st{font-size:11px;color:var(--acc);font-weight:600}
  /* 地図上の浮動コントロール（移動・ズーム） */
  .mapctl{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px;z-index:4}
  .mapctl button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);
    background:rgba(14,18,24,.82);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
    color:var(--ink);font-size:18px;font-weight:700;cursor:pointer;touch-action:manipulation;box-shadow:0 3px 12px #0006}
  .mapctl button:active{transform:scale(.94)}
  .mapctl button.on{background:var(--acc);color:#08110b;border-color:var(--acc)}
  /* 除外（穴）ボタン：橙系で目立たせる */
  .btn.holebtn{border-color:#ff8c0099;color:#ffb066;background:linear-gradient(0deg,#ff8c0014,#ff8c0014),var(--panel2)}
  .btn.holebtn:hover{border-color:#ff8c00}
  .btn.holebtn.on{background:#ff8c00;color:#1a0e00;border-color:#ff8c00;font-weight:700}
  .btn.holebtn.on small{color:#3a1f00}
  /* 印刷／PDF保存用 */
  #printArea{display:none}
  @media print{
    @page{size:A4 portrait;margin:12mm}
    body *{visibility:hidden}
    #printArea,#printArea *{visibility:visible}
    #printArea{display:block;position:absolute;left:0;top:0;width:100%;color:#000;font-family:sans-serif}
    #printArea img{max-width:100%;border:1px solid #999}
    #printArea h1{font-size:16px;margin:0 0 4px}
    #printArea .ph{font-size:12px;color:#333;margin-bottom:8px}
    #printArea table{width:100%;border-collapse:collapse;font-size:11px;margin:6px 0}
    #printArea th,#printArea td{border:1px solid #999;padding:3px 6px;text-align:left}
    #printArea td.num,#printArea th.num{text-align:right}
    #printArea h2.trh{font-size:14px;margin:16px 0 4px;border-bottom:2px solid #2f9e57;padding-bottom:3px;page-break-before:always}
    #printArea .trnote{font-size:10px;color:#333;margin-bottom:8px}
    #printArea .tri{page-break-inside:avoid;margin:8px 0 14px;border:1px solid #ccc;border-radius:4px;padding:8px}
    #printArea .tri .tl{font-weight:bold;font-size:12px;margin-bottom:6px}
    #printArea img.trimg{display:block;border:1px solid #bbb;margin-bottom:6px}
    #printArea table.trtab{width:auto;min-width:70%;font-size:10px}
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div id="printArea"></div>
<div class="app">
  <header>
    <div class="logo">公園作業記録 <b>/</b> 求積＆出来形</div>
    <input class="park" id="parkName" placeholder="公園名（例：久地さくら緑地）">
    <input class="park" id="contractName" value="高津区北部" placeholder="委託名（例：高津区北部）" style="width:160px">
    <span class="meta" id="contractMeta">業務委託</span>
    <span class="sp"></span>
    <button id="undoBtn" title="元に戻す (Ctrl+Z)" style="background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:6px 10px;font-size:13px;cursor:pointer;margin-right:6px">↶<span class="blbl"> 戻る</span></button>
    <button id="redoBtn" title="やり直す (Ctrl+Y)" style="background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:6px 10px;font-size:13px;cursor:pointer;margin-right:10px">↷<span class="blbl"> 進む</span></button>
    <span class="meta">試作版 — データは端末内のみ・JSONで保存/集計</span>
  </header>

  <!-- LEFT: tools -->
  <div class="col">
    <div class="sec collapsible" id="secMap">
      <h3>図面 <span class="st" id="mapSt"></span><span class="chev">▾</span></h3>
      <div class="secbody">
        <button class="btn" id="loadImg">公園図面を読み込む<small>PNG / JPG（背景にする）</small></button>
        <input type="file" id="imgFile" accept="image/*" hidden>
        <div class="mini">
          <button id="zoomIn">＋拡大</button><button id="zoomOut">－縮小</button><button id="fit">全体表示</button>
        </div>
      </div>
    </div>

    <div class="sec collapsible" id="secCal">
      <h3>① 縮尺合わせ <span class="st" id="calSt"></span><span class="chev">▾</span></h3>
      <div class="secbody">
        <button class="btn" id="toolCal" data-tool="cal">縮尺を設定（2点クリック）<small>図面上の既知距離を測る</small></button>
        <label class="fld">その2点の実距離（m）</label>
        <input class="txt" id="calDist" type="number" value="10" step="0.1">
      </div>
    </div>

    <div class="sec">
      <h3>② 工種を選ぶ</h3>
      <label class="fld">大分類</label>
      <select id="catSel"></select>
      <label class="fld">細別</label>
      <select id="kindSel"></select>
      <label class="fld" id="rankLbl" style="display:none">規格（幹周ランク）</label>
      <select id="rankSel" style="display:none"></select>
      <label class="fld" id="dimLbl" style="display:none">寸法（m）<span id="dimNote" style="color:var(--mut)"></span></label>
      <div id="dimRow" style="display:none;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px">
        <span id="lenWrap" style="display:none">長さ <input id="lenInput" type="number" value="2.0" step="0.1" style="width:62px"></span>
        <span id="depWrap" style="display:none">奥行 <input id="depInput" type="number" value="0.8" step="0.1" style="width:62px"></span>
        <span id="htWrap">高さ <input id="htInput" type="number" value="1.0" step="0.1" style="width:62px"></span>
      </div>
      <div id="rankLegend" style="display:none;margin-top:8px"></div>
    </div>

    <div class="sec">
      <h3>③ 記録モード <span class="st" style="color:var(--mut);font-weight:400">工種で自動選択</span></h3>
      <button class="btn on" id="toolArea" data-tool="area">面積（㎡）<small>外周をタップ→「✓確定」か始点をタップ</small></button>
      <button class="btn" id="toolTree" data-tool="tree">樹木（本）<small>クリックで1本配置</small></button>
      <button class="btn" id="toolSelect" data-tool="select">選択・編集・削除<small>クリックで選択／頂点ドラッグ移動・辺の○で追加・頂点ダブルタップで削除</small></button>
      <button class="btn" id="toolPan" data-tool="pan">✋ 地図を移動<small>地図右上の✋でも切替できます</small></button>
    </div>

    <div class="sec">
      <h3>凡例（地図上）</h3>
      <button class="btn on" id="legendToggle">凡例を表示<small>記号＋工種＋集計数を地図に表示・ドラッグで移動</small></button>
      <button class="btn ghost" id="legendReset">位置を右下に戻す</button>
    </div>

    <div class="sec">
      <h3>保存 / 読込</h3>
      <button class="btn ghost" id="saveJson">この公園を保存（.json）</button>
      <button class="btn" id="reportExport">報告書用に書き出す（.json）<small>数量＋注記図＋求積図を1ファイルに（PCで報告書Excelへ）</small></button>
      <button class="btn ghost" id="openJson">公園データを開く（.json）</button>
      <input type="file" id="jsonFile" accept="application/json" hidden>
      <button class="btn ghost" id="exportPng">注記図を画像で書き出す</button>
      <label class="fld">指示番号（実績の管理用）</label>
      <input id="orderNo" placeholder="例：5082000633-3" style="width:100%">
      <label class="fld">実施年月日</label>
      <input id="workDate" type="date" style="width:100%">
      <button class="btn" id="printPdf">🖨 印刷／PDFで保存<small>実績用：地図＋集計を1枚に</small></button>
      <button class="btn ghost danger" id="clearAll">全消去</button>
    </div>
  </div>

  <!-- CENTER: canvas -->
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="mapctl" id="mapctl">
      <button id="mPan" title="地図を移動（タップで切替）">✋</button>
      <button id="mIn" title="拡大">＋</button>
      <button id="mOut" title="縮小">－</button>
      <button id="mFit" title="全体表示">⤢</button>
    </div>
    <div class="hint" id="hint"></div>
    <div class="scalebadge no" id="scaleBadge">縮尺：未設定</div>
    <div class="draftbar" id="draftbar">
      <button id="dbFinish" class="ok">✓ 確定</button>
      <button id="dbUndo">↶ 1点戻す</button>
      <button id="dbCancel">✕ やめる</button>
    </div>
  </div>

  <!-- RIGHT: aggregation -->
  <div class="col r">
    <div class="sec">
      <h3>この公園の集計（出来形）</h3>
      <div id="aggArea"></div>
    </div>
    <div class="sec">
      <h3>求積表（選択中の面積・三斜法）</h3>
      <div id="sansha"></div>
      <button class="btn ghost" id="showAll" style="margin-top:8px">全面積の算出根拠を画面表示</button>
      <button class="btn ghost" id="xlsxBtn">Excelで求積表を書き出す（別シート展開）</button>
    </div>
    <div class="sec">
      <h3>本数集計</h3>
      <div id="aggTree"></div>
    </div>
    <div class="sec">
      <h3>その他（手入力）</h3>
      <div class="legend">巣撤去（個）・発生材運搬/処分（t）など、図面に置かないものはここで加算。</div>
      <div id="manualRows"></div>
      <div class="row" style="margin-top:6px">
        <select id="manKind" style="flex:2"></select>
        <input class="txt" id="manQty" type="number" placeholder="数量" style="flex:1">
        <button class="btn" id="manAdd" style="width:auto;margin:0;padding:8px 12px">追加</button>
      </div>
    </div>
    <div class="sec">
      <h3>登録単価ベース概算（参考）</h3>
      <div class="tot" id="costTotal">¥0</div>
      <div class="legend">仕様書「登録単価」記載分のみ自動計上。未登録の規格は0円表示（単価は別途）。</div>
    </div>
    <div class="sec">
      <h3>多公園の集計</h3>
      <button class="btn ghost" id="aggMulti">複数の.jsonをまとめて集計</button>
      <input type="file" id="multiFile" accept="application/json" multiple hidden>
      <div id="multiOut" class="legend"></div>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="card">
    <button class="close" id="modalClose">閉じる ✕</button>
    <h2>面積 算出根拠（三斜求積法）</h2>
    <div class="legend" id="modalSub"></div>
    <div class="toolbar">
      <button id="mXlsx">Excelで書き出す</button>
      <button class="alt" id="mCsv">CSVで書き出す</button>
      <button class="alt" id="mCopy">表をコピー</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>
<script>
/* ---------- 工種マスタ（高津区 地区標準単価・2025.12） ---------- */
const BANDS = ["30cm未満","30〜60cm","60〜90cm","90〜120cm","120〜150cm","150〜180cm","180〜210cm","210〜240cm","240〜270cm","270〜300cm"];
/* 受注中の委託は委託名（ヘッダー欄）で管理。工種はここに集約し、将来増えたら追記する。
   単価は高津区の地区標準（単価地区高津区・歩2025.12単2025.12）。price/prices 未記載は単価不明＝概算0。 */
const MASTER = {
  "中低木刈込工":{unit:"㎡",mode:"area",kinds:{
    "低木刈込":{price:195}, "中木刈込":{price:295,height:true,calc:'trim'} }},
  "除草工":{unit:"㎡",mode:"area",kinds:{
    "機械除草Ⅰ（肩掛式）":{price:46}, "集草":{price:23}, "積込・運搬":{price:24},
    "刈草小運搬（15m以上50m未満）":{price:35} }},

/* ---------- 座標変換 ---------- */
function toImg(px,py){return {x:(px-view.ox)/view.zoom,y:(py-view.oy)/view.zoom};}
function evtPos(e){const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return {x:t.clientX-r.left,y:t.clientY-r.top};}

/* ---------- 幾何 ---------- */
function shoelace(pts){let a=0;for(let i=0;i<pts.length;i++){const p=pts[i],q=pts[(i+1)%pts.length];a+=p.x*q.y-q.x*p.y;}return Math.abs(a)/2;}
function areaM2(pts){if(!state.scale)return null;return shoelace(pts)*state.scale*state.scale;}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function perimeterM(pts){if(!state.scale)return 0;let s=0;for(let i=0;i<pts.length;i++)s+=dist(pts[i],pts[(i+1)%pts.length]);return s*state.scale;} // 閉路（多角形の周長）
function lengthM(pts){if(!state.scale)return 0;let s=0;for(let i=0;i<pts.length-1;i++)s+=dist(pts[i],pts[i+1]);return s*state.scale;}        // 開いた折れ線の長さ
function distToSeg(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,L2=dx*dx+dy*dy;if(L2===0)return dist(p,a);let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/L2;t=Math.max(0,Math.min(1,t));return dist(p,{x:a.x+t*dx,y:a.y+t*dy});}
function distToPoly(p,pts,closed){let m=Infinity;const n=pts.length;for(let i=0;i<(closed?n:n-1);i++){m=Math.min(m,distToSeg(p,pts[i],pts[(i+1)%n]));}return m;}
// 刈込（投影＋側面）の合計面積：footprint + 周長×高さ。fは {pts, height}
function trimAreaM2(f){const fp=areaM2(f.pts);if(fp==null)return null;return fp + perimeterM(f.pts)*(f.height||0);}
// 管理柵（線×高さ）の面積：長さ×高さ
function lineAreaM2(f){return lengthM(f.pts)*(f.height||0);}
// 除外エリア（穴）の合計面積
function holesAreaM2(f){if(!state.scale||!f.holes||!f.holes.length)return 0;let a=0;f.holes.forEach(h=>{if(h.length>=3)a+=shoelace(h);});return a*state.scale*state.scale;}
// 外周−穴 の正味投影面積
function netFootprintM2(f){const o=areaM2(f.pts);if(o==null)return null;return Math.max(0,o-holesAreaM2(f));}
// featureの計上面積（㎡）を再計算
function recalcAreaFeature(f){
  if(f.type==='box'){const fp=f.L*f.D;f.area=(f.sides===false)?fp:(fp+2*(f.H||0)*(f.L+f.D));}  // 低木=投影のみ／中木=投影+側面4面
  else if(f.type==='line'){f.length=lengthM(f.pts);f.area=lineAreaM2(f);}
  else if(f.type==='area'){f.footprint=netFootprintM2(f);
    const k=f.slopeK||1, side=(f.calc==='trim')?perimeterM(f.pts)*(f.height||0):0;
    f.area=(f.footprint==null)?null:f.footprint*k+side;}   // 投影×斜面係数＋（中木は側面）。穴は投影段階で控除済
}
// 除草工か（自動控除の対象＝ベース面積）
function isWeeding(f){return f.type==='area'&&f.cat==='除草工';}
// 除草の内側にある“刈込（中低木刈込工）”＝地面を占有するので除草から自動控除する対象。
// ※つる性植物除去・低木内除草清掃は刈込の上に重なる作業なので控除しない（引きすぎ防止）。
function autoDeductList(f){
  const out=[]; if(!state.scale||f.type!=='area')return out;
  state.features.forEach(g=>{
    if(g!==f&&g.type==='area'&&g.cat==='中低木刈込工'){
      const c=centroid(g.pts);
      if(pointInPoly(c,f.pts)){const nf=netFootprintM2(g);out.push({kind:g.kind,cat:g.cat,area:(nf==null?0:nf)});}
    }
  });
  return out;
}
function autoDeductM2(f){return autoDeductList(f).reduce((s,d)=>s+d.area,0);}
// 全featureを再計算。除草は内側の刈込・低木面積を自動控除して計上面積にする。
function recalcAll(){
  state.features.forEach(f=>recalcAreaFeature(f));            // まず各自の投影/面積
  state.features.forEach(f=>{
    if(f.type==='area'&&isWeeding(f)){const d=autoDeductM2(f);f.autoDeduct=d;const k=f.slopeK||1;
      if(f.footprint!=null)f.area=Math.max(0,(f.footprint-d)*k);}     // 除草＝（外周−穴−内側刈込）×斜面係数
    else if(f.type==='area')f.autoDeduct=0;
  });
}
// 三斜求積法：頂点0を基点に扇状に三角形分割。各三角形は最長辺を底辺、高さ=2×面積÷底辺。
function sanshaTable(pts){
  const s=state.scale||1, hasScale=!!state.scale, rows=[]; let total=0;
  for(let i=1;i<pts.length-1;i++){
    const A=pts[0],B=pts[i],C=pts[i+1];
    const areaPx=Math.abs((B.x-A.x)*(C.y-A.y)-(C.x-A.x)*(B.y-A.y))/2;
    const sides=[dist(A,B),dist(B,C),dist(C,A)];
    const basePx=Math.max(...sides);
    const heightPx=basePx>0?2*areaPx/basePx:0;
    const base=basePx*s, height=heightPx*s, dbl=base*height, area=dbl/2;
    total+=area; rows.push({no:i,base,height,dbl,area});
  }
  return {rows,total,unit:hasScale?'m':'px'};
}
// 多角形の符号付き面積×2（向き判定用）
function polyArea2(pts){let a=0;for(let i=0;i<pts.length;i++){const j=(i+1)%pts.length;a+=pts[i].x*pts[j].y-pts[j].x*pts[i].y;}return a/2;}
function pointInTri(P,A,B,C){
  const d=(B.y-C.y)*(A.x-C.x)+(C.x-B.x)*(A.y-C.y); if(Math.abs(d)<1e-12)return false;
  const a=((B.y-C.y)*(P.x-C.x)+(C.x-B.x)*(P.y-C.y))/d;
  const b=((C.y-A.y)*(P.x-C.x)+(A.x-C.x)*(P.y-C.y))/d;
  const c=1-a-b; return a>1e-9&&b>1e-9&&c>1e-9;   // 三角形の内部のみ（頂点・辺上は除外）
}
// 耳切り三角形分割：単純多角形（凹凸OK）を“内側だけ”の三角形に分割。戻り値は頂点インデックスの三角形配列。
function earClipTris(pts){
  const n=pts.length; if(n<3)return [];
  let idx=[...Array(n).keys()];
  if(polyArea2(pts)<0) idx.reverse();                // 反時計回りに正規化
  const tris=[]; let guard=0;
  while(idx.length>3 && guard++<n*n+50){
    const m=idx.length; let clipped=false;
    for(let k=0;k<m;k++){
      const i0=idx[(k-1+m)%m], i1=idx[k], i2=idx[(k+1)%m];
      const A=pts[i0],B=pts[i1],C=pts[i2];
      const cross=(B.x-A.x)*(C.y-A.y)-(B.y-A.y)*(C.x-A.x);
      if(cross<=0) continue;                           // 反射（凹）頂点はスキップ
      let ok=true;
      for(let p=0;p<m;p++){const ip=idx[p]; if(ip===i0||ip===i1||ip===i2)continue; if(pointInTri(pts[ip],A,B,C)){ok=false;break;}}
      if(!ok) continue;
      tris.push([i0,i1,i2]); idx.splice(k,1); clipped=true; break;
    }
    if(!clipped) break;
  }
  if(idx.length===3) tris.push([idx[0],idx[1],idx[2]]);
  let out = tris;
  if(out.length<n-2){ out=[]; for(let i=1;i<n-1;i++)out.push([0,i,i+1]); }  // 退化時フォールバック
  // 番号が探しやすいよう、三角形重心の読み順（上→下→左→右）に整列

      // 外周線
      ctx.beginPath();f.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();
      ctx.lineWidth=(f===selected?3:2)/view.zoom;ctx.strokeStyle=(f===selected?SEL:col);ctx.stroke();
      // 穴の輪郭（橙の破線）＋面積ラベル

        const hot=(f===selected&&hi===hlHole);
        ctx.beginPath();h.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();
        if(hot){ctx.fillStyle='#ff8c0038';ctx.fill();}
        ctx.setLineDash([6/view.zoom,4/view.zoom]);ctx.lineWidth=(hot?4:2)/view.zoom;ctx.strokeStyle=hot?'#ff5e00':'#ff8c00';ctx.stroke();ctx.setLineDash([]);
        const hc=centroid(h),ha=areaM2(h);label(hc.x,hc.y,`${hot?'▶ ':''}除外${hi+1}\n${ha!=null?'-'+ha.toFixed(2):''} ㎡`,hot?'#ff5e00':'#ff8c00');
      });
      if(f===selected)drawHandles(f);
      if(f===selected)drawEdgeLengths(f);
      const c=centroid(f.pts);const tag=(f.calc==='trim')?'（投影＋側面）':'';const stag=(f.slopeK&&f.slopeK!==1)?` ${f.slopeKind||''}×${f.slopeK}`:'';label(c.x,c.y,`${f.kind}${tag}${stag}\n${f.area?f.area.toFixed(2):'—'} ㎡`,col);
    }else{
      const isNest=(f.cat==='巣撤去'), rad=treeRadius(f)/view.zoom;
      ctx.beginPath();ctx.arc(f.pt.x,f.pt.y,rad,0,7);ctx.fillStyle=col;ctx.fill();
      ctx.lineWidth=(f===selected?3:2)/view.zoom;ctx.strokeStyle=f===selected?SEL:(isNest?'#fff':'#0008');ctx.stroke();
      if(isNest){ctx.beginPath();ctx.arc(f.pt.x,f.pt.y,rad+3/view.zoom,0,7);ctx.lineWidth=1.8/view.zoom;ctx.strokeStyle=col;ctx.stroke();}
      if(isNest) label(f.pt.x,f.pt.y-rad-10/view.zoom,f.kind,col);   // 巣は位置が重要：出力でも常に表示
      else if(!exporting && (f===selected || view.zoom>1.4)) label(f.pt.x,f.pt.y-rad-9/view.zoom,(f.rank?f.rank:f.kind),col);

    if(isCal&&draft.pts.length===1&&calDragIdx===null&&hover)ctx.lineTo(hover.x,hover.y);
    ctx.lineWidth=3/view.zoom;ctx.strokeStyle=lineCol;ctx.setLineDash([7/view.zoom,5/view.zoom]);ctx.stroke();ctx.setLineDash([]);

}
function midpoint(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2};}
// ラベル：_labels収集中は後でまとめて配置（重なり回避）。即時のときはその場に描画。
function label(x,y,txt,col){
  if(_labels){_labels.push({x,y,txt,col});return;}
  flushLabels([{x,y,txt,col}]);
}
function flushLabels(list){
  const arr=list||_labels||[]; if(!arr.length){return;}
  const fs=12/view.zoom, lh=fs*1.28, pad=4/view.zoom, gap=3/view.zoom;
  ctx.save();
  ctx.font=`700 ${fs}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  const items=arr.map(L=>{const lines=String(L.txt).split('\n');let w=0;lines.forEach(l=>{const m=ctx.measureText(l).width;if(m>w)w=m;});
    return {x:L.x,y:L.y,ox:L.x,oy:L.y,col:L.col,lines,bw:w+pad*2,bh:lines.length*lh+pad*1.4};});
  // 重なり回避：y昇順に、既配置と重なるものは下へずらす
  items.sort((a,b)=>a.y-b.y);
  const placed=[];
  items.forEach(it=>{let guard=0,moved=true;
    while(moved&&guard++<300){moved=false;
      for(const p of placed){
        if(Math.abs(it.x-p.x)*2<(it.bw+p.bw)&&Math.abs(it.y-p.y)*2<(it.bh+p.bh)+gap*2){
          it.y=p.y+p.bh/2+it.bh/2+gap; moved=true;
        }
      }
    }
    placed.push(it);
  });
  // リーダー線（ずれた分だけ）
  placed.forEach(it=>{if(Math.abs(it.y-it.oy)>1.5/view.zoom||Math.abs(it.x-it.ox)>1.5/view.zoom){
    ctx.beginPath();ctx.moveTo(it.ox,it.oy);ctx.lineTo(it.x,it.y);ctx.lineWidth=1/view.zoom;ctx.strokeStyle='rgba(20,40,60,.45)';ctx.setLineDash([3/view.zoom,2/view.zoom]);ctx.stroke();ctx.setLineDash([]);
    ctx.beginPath();ctx.arc(it.ox,it.oy,2.4/view.zoom,0,7);ctx.fillStyle='rgba(20,40,60,.55)';ctx.fill();}});
  // チップ＋文字
  placed.forEach(it=>{
    roundRect(ctx,it.x-it.bw/2,it.y-it.bh/2,it.bw,it.bh,5/view.zoom);
    ctx.fillStyle='rgba(255,255,255,.92)';ctx.fill();
    ctx.lineWidth=1/view.zoom;ctx.strokeStyle='rgba(20,40,60,.28)';ctx.stroke();
    ctx.fillStyle=it.col;
    const y0=it.y-(it.lines.length-1)*lh/2;
    it.lines.forEach((l,i)=>ctx.fillText(l,it.x,y0+i*lh));
  });
  ctx.restore();
}

/* ---------- 凡例（記号＋工種＋集計数） ---------- */
let legend={x:null,y:null,show:true,_box:null};
// 図面に置いた要素を集計（面積=cat›kind、樹木=cat›kind+規格）
function aggregate(){
  const areas={},trees={};
  state.features.forEach(f=>{
    if(f.type==='area'||f.type==='line'||f.type==='box'){const k=f.cat+' › '+f.kind;(areas[k]=areas[k]||{cat:f.cat,kind:f.kind,col:colorFor(f.cat+f.kind),m2:0,line:f.type==='line'}).m2+=f.area||0;}
    else{const k=f.cat+' › '+f.kind+(f.rank?' '+f.rank:'');(trees[k]=trees[k]||{cat:f.cat,kind:f.kind,rank:f.rank||'',col:treeColor(f),rad:treeRadius(f),unit:(MASTER[f.cat]||{}).unit||'本',n:0}).n+=1;}
  });
  return {areas,trees};
}
// 仕様書順（MASTER定義順 → 大分類→細別→規格）でソートするためのキー
function specOrder(cat,kind,rank){
  const cats=Object.keys(MASTER); let ci=cats.indexOf(cat); if(ci<0)ci=999;
  const m=MASTER[cat]; let ki=m?Object.keys(m.kinds).indexOf(kind):-1; if(ki<0)ki=999;
  let ri=rank?BANDS.indexOf(rank):-1; if(ri<0)ri=0;
  return ci*1e6+ki*1e3+ri;
}
function cmpSpec(a,b){return specOrder(a.cat,a.kind,a.rank)-specOrder(b.cat,b.kind,b.rank);}
function legendRows(){
  const {areas,trees}=aggregate(),items=[];
  Object.values(areas).forEach(a=>items.push({cat:a.cat,kind:a.kind,rank:'',type:a.line?'line':'area',col:a.col,label:a.kind,val:a.m2.toFixed(2)+' ㎡'}));
  Object.values(trees).forEach(t=>items.push({cat:t.cat,kind:t.kind,rank:t.rank,type:'tree',col:t.col,rad:t.rad,label:t.kind+(t.rank?' '+t.rank:''),val:t.n+' '+(t.unit||'本')}));
  items.sort(cmpSpec);   // 仕様書（工種）順に自動整列
  return items;
}
function roundRect2(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawLegend(){
  legend._box=null;
  if(!legend.show)return;
  const rows=legendRows(); if(!rows.length)return;
  const pad=10,rowH=21,symW=26,titleH=22;
  ctx.save();ctx.font='12px sans-serif';
  let textW=0; rows.forEach(r=>{const w=ctx.measureText(r.label).width+ctx.measureText(r.val).width;if(w>textW)textW=w;});
  const title='凡例（'+rows.length+'種）';
  const boxW=Math.max(textW+symW+pad*2+26, ctx.measureText(title).width+pad*2, 150);
  const boxH=pad*2+titleH+rows.length*rowH;
  let x=legend.x==null?cv.width-boxW-16:legend.x;
  let y=legend.y==null?cv.height-boxH-16:legend.y;
  x=Math.max(4,Math.min(x,cv.width-boxW-4));y=Math.max(4,Math.min(y,cv.height-boxH-4));
  legend._box={x,y,w:boxW,h:boxH};
  // 背景
  ctx.fillStyle='rgba(255,255,255,.93)';ctx.strokeStyle='rgba(40,52,68,.55)';ctx.lineWidth=1;
  roundRect2(x,y,boxW,boxH,8);ctx.fill();ctx.stroke();
  // タイトル
  ctx.fillStyle='#16202c';ctx.font='700 13px sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText(title,x+pad,y+pad+10);
  ctx.strokeStyle='rgba(40,52,68,.2)';ctx.beginPath();ctx.moveTo(x+pad,y+pad+titleH-2);ctx.lineTo(x+boxW-pad,y+pad+titleH-2);ctx.stroke();
  // 行
  rows.forEach((r,i)=>{
    const ry=y+pad+titleH+i*rowH+rowH/2-1, cx=x+pad+9;
    if(r.type==='area'){ctx.fillStyle=r.col+'55';ctx.fillRect(cx-7,ry-7,14,14);ctx.strokeStyle=r.col;ctx.lineWidth=2;ctx.strokeRect(cx-7,ry-7,14,14);}
    else if(r.type==='line'){ctx.strokeStyle=r.col;ctx.lineWidth=3.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx-8,ry+6);ctx.lineTo(cx+8,ry-6);ctx.stroke();ctx.lineCap='butt';}
    else{const rr=Math.max(4,Math.min(9,r.rad));ctx.beginPath();ctx.arc(cx,ry,rr,0,7);ctx.fillStyle=r.col;ctx.fill();ctx.strokeStyle='#0007';ctx.lineWidth=1;ctx.stroke();}
    ctx.fillStyle='#16202c';ctx.font='12px sans-serif';ctx.textAlign='left';ctx.fillText(r.label,x+symW+2,ry);
    ctx.textAlign='right';ctx.fillStyle='#3a4757';ctx.fillText(r.val,x+boxW-pad,ry);ctx.textAlign='left';
  });
  ctx.restore();
}
function legendHit(p){const b=legend._box;return !!(legend.show&&b&&p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h);}

/* ---------- 入力 ---------- */
let panning=false,panStart=null,dragging=null,dragLast=null,calDragIdx=null,hover=null,draggingLegend=false,legDragOff=null,spaceDown=false,dragSnap=null;
let editV=null,lastPick=null,pickIdx=0,lastVtxTap=null,prevToolForPan='area',holeMode=null,dragRing=null,hlHole=null,_labels=null,exporting=false;
function ringPts(f,ring){return ring==='outer'?f.pts:(f.holes||[])[ring];}
function nearestTree(ip){let best=null,bd=Infinity;state.features.forEach(f=>{if(f.type==='tree'){const d=dist(f.pt,ip);if(d<(treeRadius(f)+8)/view.zoom&&d<bd){bd=d;best=f;}}});return best;}
// 重なり対応：クリック地点の全ヒットを上から返す
function hitAll(ip){
  const tol=12/view.zoom,out=[];
  state.features.forEach(f=>{let h=false;
    if(f.type==='tree')h=dist(f.pt,ip)<(treeRadius(f)+6)/view.zoom;
    else if(f.type==='box'){const w=state.scale?f.L/state.scale:60,hh=state.scale?f.D/state.scale:40;h=Math.abs(ip.x-f.pt.x)<=w/2+tol&&Math.abs(ip.y-f.pt.y)<=hh/2+tol;}
    else if(f.type==='line')h=distToPoly(ip,f.pts,false)<tol+2/view.zoom;
    else if(f.type==='area')h=pointInPoly(ip,f.pts)||distToPoly(ip,f.pts,true)<tol;
    if(h)out.push(f);});
  return out.reverse();   // 上に描かれた物（後勝ち）から
}
// 同じ場所を連続クリックすると重なりを順番に選択（選択できない状態をなくす）
function pickHit(ip){
  const all=hitAll(ip);if(!all.length){lastPick=null;return null;}
  const near=lastPick&&dist(lastPick,ip)<14/view.zoom;
  if(near&&all.length>1)pickIdx=(pickIdx+1)%all.length;
  else{const si=all.indexOf(selected);pickIdx=si>=0?si:0;}
  lastPick=ip;return all[pickIdx];
}
// 選択中の面積/線の頂点・辺中点ハンドル判定（外周＝'outer'、穴＝index）
function hitHandle(ip){
  const f=selected;if(!f||!(f.type==='area'||f.type==='line'))return null;
  const r=10/view.zoom, closed=(f.type==='area');
  const rings=[['outer',f.pts]]; if(f.type==='area'&&f.holes)f.holes.forEach((h,i)=>rings.push([i,h]));
  for(const [ring,pts] of rings){for(let i=0;i<pts.length;i++)if(dist(pts[i],ip)<r)return {ring,kind:'vertex',idx:i};}
  for(const [ring,pts] of rings){const n=pts.length;for(let i=0;i<(closed?n:n-1);i++){const a=pts[i],b=pts[(i+1)%n],m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};if(dist(m,ip)<r)return {ring,kind:'edge',idx:i};}}
  return null;
}
function deleteVertex(f,ring,idx){
  const pts=ringPts(f,ring);if(!pts)return;const min=(f.type==='line')?2:3;
  if(pts.length<=min){if(ring!=='outer'){pushHistory();f.holes.splice(ring,1);recalcAll();renderAgg();renderSansha();draw();}return;}
  pushHistory();pts.splice(idx,1);recalcAll();renderAgg();renderSansha();draw();
}
// マウス/タッチ共通の押下処理。'pan'|'legend'|'vertex'|'edge'|'drag' を返したら=操作開始（タップ配置しない）／null=描画or配置
function downCommon(p,ip){
  if(spaceDown||tool==='pan'){panning=true;panStart={x:p.x-view.ox,y:p.y-view.oy};return 'pan';}
  if(legendHit(p)){startLegendDrag(p);return 'legend';}
  if(holeMode)return null;                       // 除外エリア描画中は常にポチ追加
  if(tool!=='tree'){                             // 樹木モードでは頂点編集を拾わない（面積の上に木を置けるように）
    const hnd=hitHandle(ip);
    if(hnd){
      if(hnd.kind==='vertex'){
        const now=Date.now();
        if(lastVtxTap&&lastVtxTap.f===selected&&lastVtxTap.ring===hnd.ring&&lastVtxTap.idx===hnd.idx&&now-lastVtxTap.t<360){deleteVertex(selected,hnd.ring,hnd.idx);lastVtxTap=null;return 'vertex';}
        lastVtxTap={f:selected,ring:hnd.ring,idx:hnd.idx,t:now};editV={f:selected,ring:hnd.ring,idx:hnd.idx};dragLast=ip;dragSnap=snapshot();return 'vertex';
      }else{ // 辺の中点 → 頂点を挿入してそのままドラッグ
        pushHistory();const pts=ringPts(selected,hnd.ring);pts.splice(hnd.idx+1,0,{x:ip.x,y:ip.y});recalcAreaFeature(selected);editV={f:selected,ring:hnd.ring,idx:hnd.idx+1};dragLast=ip;return 'edge';
      }
    }
  }
  if(tool==='cal')return null;
  if(tool==='area')return null;                 // 面積モードは常に描画（樹木と同様、既存図形の上でも開始可）。編集は選択中図形のハンドル or 選択モードで。
  const f=(tool==='tree')?nearestTree(ip):pickHit(ip);   // 樹木モードは既存の木だけ拾う／選択モードは全部（重なり巡回）
  if(f){
    selected=f;hlHole=null;renderSansha();dragging=f;dragLast=ip;dragSnap=snapshot();dragRing=null;
    if(f.type==='area'&&f.holes){for(let i=0;i<f.holes.length;i++){if(pointInPoly(ip,f.holes[i])){dragRing=i;break;}}}  // 穴の中なら穴だけ移動
    return 'drag';
  }
  if(tool==='select'){panning=true;panStart={x:p.x-view.ox,y:p.y-view.oy};return 'pan';}
  return null;                                   // 空クリック → 描画/配置へ
}
function startLegendDrag(p){legend.x=legend._box.x;legend.y=legend._box.y;draggingLegend=true;legDragOff={x:p.x-legend._box.x,y:p.y-legend._box.y};}
function moveFeature(f,dx,dy){
  if(f.pt){f.pt.x+=dx;f.pt.y+=dy;}
  else{f.pts.forEach(p=>{p.x+=dx;p.y+=dy;});(f.holes||[]).forEach(h=>h.forEach(p=>{p.x+=dx;p.y+=dy;}));}
}
function moveDrag(f,ring,dx,dy){ if(ring==null)moveFeature(f,dx,dy); else if(f.holes&&f.holes[ring])f.holes[ring].forEach(p=>{p.x+=dx;p.y+=dy;}); }
function refreshDraftBar(){
  const bar=$('draftbar'),active=!!(draft&&(tool==='area'||tool==='cal'));
  bar.classList.toggle('on',active);
  if(active){
    const isArea=tool==='area', need=holeMode?3:((curGeom()==='line')?2:3);
    $('dbFinish').style.display=isArea?'':'none';

    $('dbUndo').disabled=draft.pts.length===0;

}
function addAreaPoint(ip){
  if(holeMode){ // 除外エリア（穴）＝多角形固定
    if(!draft)draft={pts:[],hole:true};
    if(draft.pts.length>=3&&dist(ip,draft.pts[0])<16/view.zoom){finishArea();return;}
    draft.pts.push(ip);refreshDraftBar();draw();return;
  }
  if(curGeom()==='box'){placeBox(ip);return;}   // 刈込：寸法入力でタップ配置
  if(!draft)draft={pts:[]};
  // 多角形のみ：始点付近のタップで閉じる（線＝管理柵は閉じない）
  if(curGeom()!=='line'&&draft.pts.length>=3&&dist(ip,draft.pts[0])<16/view.zoom){finishArea();return;}
  draft.pts.push(ip);refreshDraftBar();draw();
}
function placeBox(ip){
  const L=curLenVal(),D=curDepVal(),sides=curBoxSides();

// 縮尺：押した位置に点を置き、指/マウスを離すまでドラッグで微調整。離した位置で確定。
function calDown(ip){
  if(!draft){draft={pts:[ip],cal:true};calDragIdx=0;}
  else if(draft.pts.length===1){draft.pts.push(ip);calDragIdx=1;}
  hover=null;refreshDraftBar();draw();
}
function calUp(){
  if(calDragIdx===null)return;
  if(calDragIdx===1){calDragIdx=null;finishCal();return;} // 2点目を離した→確定
  calDragIdx=null;draw();                                  // 1点目確定、2点目待ち
}
function undoDraftPoint(){
  if(!draft)return;draft.pts.pop();calDragIdx=null;hover=null;if(!draft.pts.length)draft=null;refreshDraftBar();draw();
}
function cancelDraft(){draft=null;calDragIdx=null;hover=null;holeMode=null;refreshDraftBar();updateHint();draw();}
$('dbFinish').onclick=()=>{const need=holeMode?3:((curGeom()==='line')?2:3);if(tool==='area'&&draft&&draft.pts.length>=need)finishArea();};
$('dbUndo').onclick=undoDraftPoint;
$('dbCancel').onclick=cancelDraft;
cv.addEventListener('mousedown',e=>{
  const p=evtPos(e),ip=toImg(p.x,p.y);

cv.addEventListener('mousemove',e=>{
  if(draggingLegend){const p=evtPos(e);legend.x=p.x-legDragOff.x;legend.y=p.y-legDragOff.y;draw();return;}
  if(tool==='cal'){const p=evtPos(e),ip=toImg(p.x,p.y);if(calDragIdx!==null)draft.pts[calDragIdx]=ip;else if(draft)hover=ip;draw();return;}
  if(editV){const p=evtPos(e),ip=toImg(p.x,p.y);if(dragSnap){undoStack.push(dragSnap);if(undoStack.length>100)undoStack.shift();redoStack=[];updateUndoButtons();dragSnap=null;}ringPts(editV.f,editV.ring)[editV.idx]={x:ip.x,y:ip.y};recalcAreaFeature(editV.f);draw();return;}
  if(dragging){const p=evtPos(e),ip=toImg(p.x,p.y);if(dragSnap){undoStack.push(dragSnap);if(undoStack.length>100)undoStack.shift();redoStack=[];updateUndoButtons();dragSnap=null;}moveDrag(dragging,dragRing,ip.x-dragLast.x,ip.y-dragLast.y);dragLast=ip;draw();return;}
  if(panning){const p=evtPos(e);view.ox=p.x-panStart.x;view.oy=p.y-panStart.y;draw();}
});
window.addEventListener('mouseup',()=>{
  if(draggingLegend){draggingLegend=false;cv.style.cursor=tool==='select'?'grab':'crosshair';return;}
  if(tool==='cal'&&calDragIdx!==null){calUp();return;}
  if(editV){recalcAll();editV=null;dragSnap=null;renderAgg();renderSansha();}
  if(dragging){recalcAll();dragging=null;dragSnap=null;dragRing=null;renderAgg();renderSansha();}
  if(panning)panning=false;
  cv.style.cursor=(spaceDown||tool==='pan')?'grab':(tool==='select'?'grab':'crosshair');
});
cv.addEventListener('dblclick',e=>{
  const p=evtPos(e),ip=toImg(p.x,p.y),hnd=hitHandle(ip);
  if(hnd&&hnd.kind==='vertex'){deleteVertex(selected,hnd.ring,hnd.idx);return;}
  if(tool==='area'&&draft){const need=holeMode?3:((curGeom()==='line')?2:3);if(draft.pts.length>=need)finishArea();}
});
cv.addEventListener('wheel',e=>{e.preventDefault();const p=evtPos(e);const f=e.deltaY<0?1.12:1/1.12;zoomAt(p.x,p.y,f);},{passive:false});
// touch
let lastTouch=null,pinchD=null;
cv.addEventListener('touchstart',e=>{
  if(e.touches.length===2){pinchD=touchDist(e);dragging=null;editV=null;calDragIdx=null;draggingLegend=false;lastTouch=null;return;}
  const p=evtPos(e),ip=toImg(p.x,p.y);
  const r=downCommon(p,ip);
  if(r){lastTouch=null;draw();return;}          // 操作開始（配置しない）
  if(tool==='cal'){calDown(ip);lastTouch=null;return;}
  lastTouch=p;                                   // 空タップ → touchendで配置（面積/樹木）
},{passive:false});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===2&&pinchD){const d=touchDist(e),c=touchMid(e);zoomAt(c.x,c.y,d/pinchD);pinchD=d;return;}
  if(draggingLegend){const p=evtPos(e);legend.x=p.x-legDragOff.x;legend.y=p.y-legDragOff.y;lastTouch=null;draw();return;}
  if(tool==='cal'&&calDragIdx!==null){const p=evtPos(e),ip=toImg(p.x,p.y);draft.pts[calDragIdx]=ip;lastTouch=null;draw();return;}
  if(editV){const p=evtPos(e),ip=toImg(p.x,p.y);if(dragSnap){undoStack.push(dragSnap);if(undoStack.length>100)undoStack.shift();redoStack=[];updateUndoButtons();dragSnap=null;}ringPts(editV.f,editV.ring)[editV.idx]={x:ip.x,y:ip.y};recalcAreaFeature(editV.f);lastTouch=null;draw();return;}
  if(dragging){const p=evtPos(e),ip=toImg(p.x,p.y);if(dragSnap){undoStack.push(dragSnap);if(undoStack.length>100)undoStack.shift();redoStack=[];updateUndoButtons();dragSnap=null;}moveDrag(dragging,dragRing,ip.x-dragLast.x,ip.y-dragLast.y);dragLast=ip;lastTouch=null;draw();return;}
  if(panning){const p=evtPos(e);view.ox=p.x-panStart.x;view.oy=p.y-panStart.y;lastTouch=null;draw();}
},{passive:false});
cv.addEventListener('touchend',e=>{
  if(pinchD&&e.touches.length<2){pinchD=null;return;}
  if(draggingLegend){draggingLegend=false;lastTouch=null;return;}
  if(tool==='cal'){if(calDragIdx!==null)calUp();lastTouch=null;return;}
  if(editV){recalcAll();editV=null;dragSnap=null;renderAgg();renderSansha();lastTouch=null;return;}
  if(dragging){recalcAll();dragging=null;dragSnap=null;dragRing=null;renderAgg();renderSansha();lastTouch=null;return;}
  if(panning){panning=false;return;}
  if(!lastTouch)return;const ip=toImg(lastTouch.x,lastTouch.y);
  if(tool==='area'){addAreaPoint(ip);}
  else if(tool==='tree'){placeTree(ip);}
  lastTouch=null;
});
function touchDist(e){const a=e.touches[0],b=e.touches[1];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}
function touchMid(e){const r=cv.getBoundingClientRect(),a=e.touches[0],b=e.touches[1];return{x:(a.clientX+b.clientX)/2-r.left,y:(a.clientY+b.clientY)/2-r.top};}
function zoomAt(px,py,f){const ip=toImg(px,py);view.zoom*=f;view.ox=px-ip.x*view.zoom;view.oy=py-ip.y*view.zoom;draw();}
window.addEventListener('keydown',e=>{
  const typing=/^(INPUT|SELECT|TEXTAREA)$/.test((e.target&&e.target.tagName)||'');
  if(e.code==='Space'&&!typing){if(!spaceDown){spaceDown=true;cv.style.cursor='grab';}e.preventDefault();return;}
  if((e.ctrlKey||e.metaKey)&&!typing){
    if(e.key==='z'||e.key==='Z'){e.preventDefault();if(e.shiftKey)redo();else undo();return;}
    if(e.key==='y'||e.key==='Y'){e.preventDefault();redo();return;}
  }
  if((e.key==='Delete'||e.key==='Backspace')&&selected&&!typing){e.preventDefault();removeFeature(selected);}
  if(e.key==='Enter'&&tool==='area'&&draft){const need=holeMode?3:((curGeom()==='line')?2:3);if(draft.pts.length>=need)finishArea();}
  if(e.key==="Escape"){cancelDraft();}
});
window.addEventListener('keyup',e=>{
  if(e.code==='Space'){spaceDown=false;if(panning){panning=false;}cv.style.cursor=tool==='select'?'grab':'crosshair';}
});

/* ---------- 確定処理 ---------- */
function finishCal(){
  const d=dist(draft.pts[0],draft.pts[1]);const real=parseFloat($('calDist').value)||0;
  if(real>0&&d>0){pushHistory();state.scale=real/d;updateScaleBadge();
    recalcAll();
    renderAgg();renderSansha();
    $('secCal').classList.add('collapsed');$('calSt').textContent='設定済';
    if(tool==='cal')setTool('area');}
  draft=null;calDragIdx=null;hover=null;refreshDraftBar();updateHint();draw();
}
function finishArea(){
  if(holeMode){ // 除外エリア（穴）を確定して選択中の面積に追加。モードは継続。
    if(!draft||draft.pts.length<3){return;}
    pushHistory();
    holeMode.holes=holeMode.holes||[];
    holeMode.holes.push(draft.pts.slice());
    recalcAll();
    selected=holeMode;draft=null;refreshDraftBar();renderAgg();renderSansha();updateHint();draw();
    return;
  }
  const cat=$('catSel').value,kind=$('kindSel').value;
  const geom=curGeom(), h=curHeightVal();
  if(geom==='line'){
    if(draft.pts.length<2){return;}
    pushHistory();
    const f={type:'line',cat,kind,pts:draft.pts.slice(),height:h};
    recalcAreaFeature(f);state.features.push(f);
  }else{
    if(draft.pts.length<3){return;}
    pushHistory();
    const f={type:'area',cat,kind,pts:draft.pts.slice(),calc:curCalc(),height:(curNeedsHeight()?h:0)};
    recalcAreaFeature(f);state.features.push(f);
  }
  draft=null;selected=state.features[state.features.length-1]||null;recalcAll();refreshDraftBar();renderAgg();renderSansha();draw();
}
function placeTree(ip){
  pushHistory();
  const cat=$('catSel').value,kind=$('kindSel').value;
  const f={type:'tree',cat,kind,pt:ip};
  if(curKindRanks())f.rank=$('rankSel').value;
  state.features.push(f);renderAgg();draw();
}
function updateScaleBadge(){const b=$('scaleBadge');
  if(state.scale){b.classList.remove('no');b.textContent=`縮尺：1px ≈ ${state.scale.toFixed(4)} m`;}
  else{b.classList.add('no');b.textContent='縮尺：未設定';}}

/* ---------- 選択・削除 ---------- */
function hit(ip){
  const tolPx=10, tol=tolPx/view.zoom;   // 線の近くでもつかめる許容
  for(let i=state.features.length-1;i>=0;i--){const f=state.features[i];
    if(f.type==='tree'){if(dist(f.pt,ip)<(treeRadius(f)+5)/view.zoom)return f;}
    else if(f.type==='box'){const wpx=state.scale?(f.L/state.scale):60,hpx=state.scale?(f.D/state.scale):40;if(Math.abs(ip.x-f.pt.x)<=wpx/2+tol&&Math.abs(ip.y-f.pt.y)<=hpx/2+tol)return f;}
    else if(f.type==='line'){if(distToPoly(ip,f.pts,false)<tol+2/view.zoom)return f;}
    else if(f.type==='area'){if(pointInPoly(ip,f.pts)||distToPoly(ip,f.pts,true)<tol)return f;}}
  return null;
}
function pointInPoly(p,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){
  if(((pts[i].y>p.y)!=(pts[j].y>p.y))&&(p.x<(pts[j].x-pts[i].x)*(p.y-pts[i].y)/(pts[j].y-pts[i].y)+pts[i].x))c=!c;}return c;}
function selectFeature(f){selected=f;hlHole=null;renderSansha();draw();}

    return;
  }
  // 管理柵（線×高さ）
  if(selected&&selected.type==='line'){

    el.innerHTML=`<div class="legend" style="margin-bottom:6px">${selected.kind}（つる：フェンス）</div>`+

    attachHeightEditor(selected);
    return;
  }
  if(!(selected&&selected.type==='area')){el.innerHTML='<div class="empty">面積を選択モードでクリックすると、3辺（ヘロン）の根拠表が出ます</div>';return;}
  const t=heronTable(selected.pts), u=t.unit;
  const trim=(selected.calc==='trim');

  let h=`<div class="legend" style="margin-bottom:6px">${selected.kind}${trim?'（投影＋側面）':''}${holes.length?'（除外'+holes.length+'か所）':''}${state.scale?'':'（縮尺未設定のため px 表示）'}</div>`;
  const dg=triDiagramDataURL(selected,300); if(dg)h+=`<img src="${dg.url}" style="display:block;max-width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;margin:0 0 4px">`;
  h+=`<div style="font-size:11px;color:var(--mut);margin-bottom:4px">各三角形を3辺 a・b・c からヘロンの公式で算出（辺は頂点番号で対応）</div>`;
  h+='<table><tr><th>△</th><th class="num">a('+u+')</th><th class="num">b('+u+')</th><th class="num">c('+u+')</th><th class="num">面積</th></tr>';
  t.rows.forEach(r=>{const v=r.v;h+=`<tr><td>△${r.no}<br><span style="color:var(--mut);font-size:10px">${v[0]}-${v[1]}・${v[1]}-${v[2]}・${v[2]}-${v[0]}</span></td><td class="num">${r.a.toFixed(1)}</td><td class="num">${r.b.toFixed(1)}</td><td class="num">${r.c.toFixed(1)}</td><td class="num">${r.area.toFixed(2)}</td></tr>`;});
  h+=`<tr><td colspan="4" style="text-align:right;color:var(--mut)">外周投影 ＝ 三角形の合計</td><td class="num">${t.total.toFixed(2)} ${u}²</td></tr>`;
  h+='</table>';
  h+='<table style="margin-top:6px"><tr><th>項目</th><th class="num">値</th></tr>';
  if(holes.length){const hSum=state.scale?holesAreaM2(selected):holes.reduce((a,hh)=>a+(hh.length>=3?shoelace(hh):0),0);
    h+=`<tr><td style="color:#ff8c00">除外（穴）${holes.length}か所</td><td class="num" style="color:#ff8c00">-${hSum.toFixed(2)} ${u}²</td></tr>`;}
  if(trim){const per=perimeterM(selected.pts), side=per*(selected.height||0);

}

function startHole(){ if(!selected||selected.type!=='area')return; holeMode=selected; draft=null; if(tool!=='area')setTool('area'); refreshDraftBar(); renderSansha(); updateHint(); draw(); }
function endHole(){ holeMode=null; draft=null; refreshDraftBar(); renderSansha(); updateHint(); draw(); }
function clearHoles(){ if(!selected||!selected.holes||!selected.holes.length)return; pushHistory(); selected.holes=[]; hlHole=null; recalcAll(); renderAgg(); renderSansha(); draw(); }
function deleteHole(f,i){ if(!f||!f.holes||i<0||i>=f.holes.length)return; pushHistory(); f.holes.splice(i,1); hlHole=null; recalcAll(); renderAgg(); renderSansha(); draw(); }
// 選択中の面積の形をコピーして、いま選んでいる工種の新しい面積を作る（つる性・低木内除草などで低木範囲を流用→調整）
function duplicateAsCurrent(){
  if(!selected||selected.type!=='area')return;
  const cat=$('catSel').value, kind=$('kindSel').value;
  if((MASTER[cat]||{}).mode!=='area'||curGeom()!=='poly'){alert('面積系（ポチポチ）の工種を選んでからコピーしてください。');return;}
  pushHistory();
  const f={type:'area',cat,kind,
    pts:selected.pts.map(p=>({x:p.x,y:p.y})),
    holes:(selected.holes||[]).map(h=>h.map(p=>({x:p.x,y:p.y}))),
    calc:curCalc(), height:(curNeedsHeight()?curHeightVal():0),
    slopeK:selected.slopeK||1, slopeKind:selected.slopeKind||'平坦'};
  recalcAreaFeature(f); state.features.push(f); selected=f; hlHole=null;
  recalcAll(); renderAgg(); renderSansha(); draw();
}
function removeFeature(f){pushHistory();state.features=state.features.filter(x=>x!==f);if(selected===f)selected=null;recalcAll();renderSansha();renderAgg();draw();}

/* ---------- 集計 ---------- */
function unitPrice(f){
  const m=MASTER[f.cat];if(!m)return 0;const kd=m.kinds[f.kind]||{};
  if(f.rank&&kd.prices)return kd.prices[f.rank]||0;
  return kd.price||0;
}
function renderAgg(){
  // area: by cat+kind sum m2
  const am={},tm={};let cost=0;
  state.features.forEach(f=>{
    if(f.type==='area'||f.type==='line'||f.type==='box'){const key=f.cat+' › '+f.kind;am[key]=am[key]||{m2:0,col:colorFor(f.cat+f.kind),price:unitPrice(f),cat:f.cat,kind:f.kind,rank:''};am[key].m2+=f.area||0;}
    else{const key=f.cat+(f.rank?' › '+f.kind+' '+f.rank:' › '+f.kind);tm[key]=tm[key]||{n:0,col:featColor(f),price:unitPrice(f),cat:f.cat,kind:f.kind,rank:f.rank||'',unit:(MASTER[f.cat]||{}).unit||'本'};tm[key].n+=1;}
  });
  // area table
  const ae=$('aggArea');let h='';
  const ak=Object.keys(am).sort((x,y)=>cmpSpec(am[x],am[y]));
  if(!ak.length)h='<div class="empty">面積の注記なし</div>';
  else{h='<table><tr><th>工種</th><th class="num">㎡</th></tr>';
    ak.forEach(k=>{h+=`<tr><td><span class="swatch" style="background:${am[k].col}"></span>${k}</td><td class="num">${am[k].m2.toFixed(2)}</td></tr>`;cost+=am[k].m2*am[k].price;});h+='</table>';}
  ae.innerHTML=h;
  // tree table
  const te=$('aggTree');const tk=Object.keys(tm).sort((x,y)=>cmpSpec(tm[x],tm[y]));
  if(!tk.length)te.innerHTML='<div class="empty">樹木の注記なし</div>';
  else{let t='<table><tr><th>工種・規格</th><th class="num">数量</th></tr>';
    tk.forEach(k=>{t+=`<tr><td><span class="swatch" style="background:${tm[k].col}"></span>${k}</td><td class="num">${tm[k].n} ${tm[k].unit||'本'}</td></tr>`;cost+=tm[k].n*tm[k].price;});t+='</table>';te.innerHTML=t;}
  // manual
  const me=$('manualRows');
  if(!state.manual.length)me.innerHTML='';
  else{let t='<table>';state.manual.forEach((r,i)=>{const p=(MANUAL[r.kind]||{}).price||0;cost+=r.qty*p;
    t+=`<tr><td>${r.kind}</td><td class="num">${r.qty} ${MANUAL[r.kind].unit}</td><td class="x" style="cursor:pointer;color:var(--mut)" data-mi="${i}">✕</td></tr>`;});t+='</table>';me.innerHTML=t;
    me.querySelectorAll('[data-mi]').forEach(b=>b.onclick=()=>{pushHistory();state.manual.splice(+b.dataset.mi,1);renderAgg();});}
  $('costTotal').textContent='¥'+Math.round(cost).toLocaleString();
}

function fit(){
  if(!state.img)return;
  // 表示領域の実サイズに合わせてバッファを更新（初期化状況に依存せず常に正しく全体表示）
  const r=cv.parentElement.getBoundingClientRect();
  if(r.width>1&&r.height>1){cv.width=Math.round(r.width);cv.height=Math.round(r.height);}
  const W=cv.width,H=cv.height;
  const z=Math.min(W/state.img.width,H/state.img.height)*0.95;
  view.zoom=z;view.ox=(W-state.img.width*z)/2;view.oy=(H-state.img.height*z)/2;
  draw();
}

function formatWareki(iso){if(!iso)return '';const [y,m,d]=iso.split('-').map(Number);const r=y-2018;return `令和${r===1?'元':r}年${m}月${d}日`;}
function fullImageDataURL(){
  if(!state.img)return null;
  const z=view.zoom,ox=view.ox,oy=view.oy,sw=cv.width,sh=cv.height,lx=legend.x,ly=legend.y;
  cv.width=state.img.width;cv.height=state.img.height;view.zoom=1;view.ox=0;view.oy=0;legend.x=null;legend.y=null;
  exporting=true; draw(); exporting=false; const url=cv.toDataURL('image/png');
  cv.width=sw;cv.height=sh;view.zoom=z;view.ox=ox;view.oy=oy;legend.x=lx;legend.y=ly;draw();return url;
}
function aggHtmlForPrint(){
  const {areas,trees}=aggregate();let h='';
  const ar=Object.values(areas).sort(cmpSpec);
  if(ar.length){h+='<table><tr><th>工種（面積系）</th><th class="num">数量</th></tr>';
    ar.forEach(a=>h+=`<tr><td>${a.cat} › ${a.kind}</td><td class="num">${a.m2.toFixed(2)} ㎡</td></tr>`);h+='</table>';}
  const tr=Object.values(trees).sort(cmpSpec);
  if(tr.length){h+='<table><tr><th>工種・規格（本数系）</th><th class="num">数量</th></tr>';
    tr.forEach(t=>h+=`<tr><td>${t.cat} › ${t.kind}${t.rank?' '+t.rank:''}</td><td class="num">${t.n} ${t.unit||'本'}</td></tr>`);h+='</table>';}
  if(state.manual.length){h+='<table><tr><th>その他（手入力）</th><th class="num">数量</th></tr>';
    state.manual.forEach(m=>h+=`<tr><td>${m.kind}</td><td class="num">${m.qty} ${(MANUAL[m.kind]||{}).unit||''}</td></tr>`);h+='</table>';}
  return h||'<p>記録なし</p>';
}
function buildTriSection(){
  const blocks=allAreaBlocks(); if(!blocks.length)return '';
  let h='<h2 class="trh">求積図・求積表（ヘロンの公式／3辺による算出）</h2>';
  h+='<div class="trnote">各三角形を3辺の長さ a・b・c からヘロンの公式で算出：s=(a+b+c)/2、面積=√(s(s−a)(s−b)(s−c))。図の<span style="color:#1463c7">青＝外周辺</span>・<span style="color:#0a8a6a">緑＝対角線</span>の数値が表の辺長に対応します（多角形の内側だけを三角形分割）。</div>';
  blocks.forEach((b,idx)=>{
    const u=b.t.unit, d=triDiagramDataURL(b.f,520);
    h+='<div class="tri"><div class="tl">'+(idx+1)+'. '+b.f.cat+' › '+b.f.kind+((b.f.slopeK&&b.f.slopeK!==1)?'（'+b.f.slopeKind+' ×'+b.f.slopeK+'）':'')+'</div>';
    if(d)h+='<img class="trimg" src="'+d.url+'" style="width:'+Math.min(520,d.w)+'px">';
    h+='<table class="trtab"><tr><th>三角形</th><th>辺a</th><th class="num">a('+u+')</th><th>辺b</th><th class="num">b('+u+')</th><th>辺c</th><th class="num">c('+u+')</th><th class="num">面積('+u+'²)</th></tr>';
    b.t.rows.forEach(r=>{const v=r.v;h+='<tr><td>△'+r.no+'</td><td>'+v[0]+'–'+v[1]+'</td><td class="num">'+r.a.toFixed(1)+'</td><td>'+v[1]+'–'+v[2]+'</td><td class="num">'+r.b.toFixed(1)+'</td><td>'+v[2]+'–'+v[0]+'</td><td class="num">'+r.c.toFixed(1)+'</td><td class="num">'+r.area.toFixed(2)+'</td></tr>';});
    h+='<tr><td colspan="7" style="text-align:right">三角形の合計 ＝ 外周投影</td><td class="num">'+b.t.total.toFixed(2)+' '+u+'²</td></tr>';
    const hs=blockHoleSum(b.f); if(hs>0)h+='<tr><td colspan="7" style="text-align:right">除外（穴）'+(b.f.holes||[]).length+'か所</td><td class="num">-'+hs.toFixed(2)+'</td></tr>';
    const ded=isWeeding(b.f)?autoDeductList(b.f):[]; ded.forEach(dd=>h+='<tr><td colspan="7" style="text-align:right">内側控除 − '+dd.kind+'</td><td class="num">-'+dd.area.toFixed(2)+'</td></tr>');
    if(b.f.calc==='trim'){const per=perimeterM(b.f.pts),side=per*(b.f.height||0);h+='<tr><td colspan="7" style="text-align:right">側面 ＝ 周長×高さ('+(b.f.height||0).toFixed(1)+'m)</td><td class="num">'+side.toFixed(2)+'</td></tr>';}
    if(b.f.slopeK&&b.f.slopeK!==1)h+='<tr><td colspan="7" style="text-align:right">斜面補正 ×'+b.f.slopeK+'（'+b.f.slopeKind+'）</td><td class="num">投影×係数</td></tr>';
    h+='<tr><td colspan="7" style="text-align:right"><b>計上面積</b></td><td class="num"><b>'+(b.f.area!=null?b.f.area.toFixed(2):'—')+' ㎡</b></td></tr>';
    h+='</table></div>';
  });
  return h;
}

/* ---------- 全面積の算出根拠（三斜） ---------- */
function r3(x){return Math.round(x*1000)/1000;}
function allAreaBlocks(){
  return state.features.filter(f=>f.type==='area').slice().sort((a,b)=>cmpSpec(a,b))   // 仕様書（工種）順
    .map(f=>({f,t:heronTable(f.pts)}));
}
function blockHoleSum(f){const holes=f.holes||[];return state.scale?holesAreaM2(f):holes.reduce((a,hh)=>a+(hh.length>=3?shoelace(hh):0),0);}
function buildSummary(blocks){
  const byKind={};let grand=0;
  blocks.forEach(b=>{const k=b.f.slopeK||1;const net=(b.t.total-blockHoleSum(b.f)-(b.f.autoDeduct||0))*k;byKind[b.f.kind]=(byKind[b.f.kind]||0)+net;grand+=net;});  // 穴＋内側控除を差引、斜面係数を反映
  return {byKind,grand,unit:blocks[0]?blocks[0].t.unit:'m'};
}
function showAllSansha(){
  const blocks=allAreaBlocks();
  if(!blocks.length){alert('面積の注記がありません。先に面積（㎡）を作図してください。');return;}
  const s=buildSummary(blocks),u=s.unit;
  $('modalSub').innerHTML=`${$('parkName').value||'（公園名未設定）'} ／ 面積 ${blocks.length} 件${state.scale?'':' ・縮尺未設定のためpx表示'}`;
  let h='<div style="font-size:12px;color:#5b6b78;margin-bottom:8px">各三角形を<b>3辺の長さ</b>からヘロンの公式で算出（s=(a+b+c)/2、面積=√(s(s-a)(s-b)(s-c))）。図の<span style="color:#1463c7">青＝外周辺</span>・<span style="color:#0a8a6a">緑＝対角線</span>の数値が表の辺長に対応します。</div>';
  blocks.forEach((b,idx)=>{
    const col=featColor(b.f);
    h+=`<div class="block"><div class="bh"><span class="swatch" style="background:${col};margin:0"></span>${b.f.kind} ＃${idx+1}<span class="a">${b.f.area!=null?b.f.area.toFixed(2):b.t.total.toFixed(2)} ${u}²</span></div>`;
    const dg=triDiagramDataURL(b.f,460); if(dg)h+=`<img src="${dg.url}" style="display:block;max-width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;margin:0 0 6px">`;
    h+=`<table><tr><th>三角形</th><th>辺a (頂点)</th><th class="num">a(${u})</th><th>辺b</th><th class="num">b(${u})</th><th>辺c</th><th class="num">c(${u})</th><th class="num">面積(${u}²)</th></tr>`;
    b.t.rows.forEach(r=>{const v=r.v;h+=`<tr><td>△${r.no}</td><td>${v[0]}–${v[1]}</td><td class="num">${r.a.toFixed(1)}</td><td>${v[1]}–${v[2]}</td><td class="num">${r.b.toFixed(1)}</td><td>${v[2]}–${v[0]}</td><td class="num">${r.c.toFixed(1)}</td><td class="num">${r.area.toFixed(2)}</td></tr>`;});
    h+=`<tr><td colspan="7" style="text-align:right;color:var(--mut)">三角形の合計 ＝ 外周投影面積</td><td class="num">${b.t.total.toFixed(2)} ${u}²</td></tr>`;
    const hs=blockHoleSum(b.f);
    if(hs>0)h+=`<tr><td colspan="7" style="text-align:right;color:#ff8c00">除外（穴）${(b.f.holes||[]).length}か所</td><td class="num" style="color:#ff8c00">-${hs.toFixed(2)} ${u}²</td></tr>`;
    if(b.f.calc==='trim'){const per=perimeterM(b.f.pts),side=per*(b.f.height||0);h+=`<tr><td colspan="7" style="text-align:right;color:var(--mut)">側面 ＝ 周長×高さ(${(b.f.height||0).toFixed(1)}m)</td><td class="num">${state.scale?side.toFixed(2)+' ㎡':'—'}</td></tr>`;}
    const ded=isWeeding(b.f)?autoDeductList(b.f):[];
    ded.forEach(d=>h+=`<tr><td colspan="7" style="text-align:right;color:#ff8c00">内側控除 − ${d.kind}</td><td class="num" style="color:#ff8c00">-${d.area.toFixed(2)} ㎡</td></tr>`);
    if((b.f.slopeK||1)!==1)h+=`<tr><td colspan="7" style="text-align:right;color:#2f9e57">斜面補正 ×${b.f.slopeK}（${b.f.slopeKind||''}）</td><td class="num" style="color:#2f9e57">投影×係数</td></tr>`;
    h+=`<tr><td colspan="7" style="text-align:right">計上面積</td><td class="num" style="color:var(--acc);font-weight:700">${b.f.area!=null?b.f.area.toFixed(2)+' ㎡':'—'}</td></tr></table>`;
    h+=`<button class="btn ghost imgsave" data-i="${idx}" style="margin-top:6px;width:auto;padding:6px 12px">この図＋表を画像で保存（PNG）</button></div>`;
  });
  h+='<div class="grand"><h2>工種別 面積集計</h2><table><tr><th>工種</th><th class="num">面積('+u+'²)</th></tr>';
  Object.entries(s.byKind).forEach(([k,v])=>h+=`<tr><td>${k}</td><td class="num">${v.toFixed(2)}</td></tr>`);
  h+=`<tr><td style="font-weight:700">総合計</td><td class="num" style="font-weight:700;color:var(--acc)">${s.grand.toFixed(2)} ${u}²</td></tr></table></div>`;
  $('modalBody').innerHTML=h;
  $('modalBody').querySelectorAll('.imgsave').forEach(btn=>btn.onclick=()=>{
    const b=blocks[parseInt(btn.dataset.i)]; if(!b)return;
    const url=composeTriImage(b.f,800);
    const a=document.createElement('a');a.href=url;a.download=`${($('parkName').value||'公園')}_${b.f.kind}_求積図表.png`;a.click();
  });
  $('modal').classList.add('on');
}
$('showAll').onclick=showAllSansha;
$('modalClose').onclick=()=>$('modal').classList.remove('on');
$('modal').onclick=e=>{if(e.target.id==='modal')$('modal').classList.remove('on');};

/* ---------- Excel（面積計算を別シート展開・SheetJS） ---------- */
function exportExcel(){
  const blocks=allAreaBlocks();
  const {areas,trees}=aggregate();
  const hasAny=blocks.length||Object.keys(trees).length||state.manual.length;
  if(!hasAny){alert('記録がありません。面積・樹木・手入力のいずれかを入力してください。');return;}
  if(typeof XLSX==='undefined'){alert('Excel出力ライブラリが読み込めませんでした。オンライン接続のうえ再度お試しください（CSVは利用できます）。');return;}
  const park=$('parkName').value||'公園';
  const wb=XLSX.utils.book_new();
  if(blocks.length){
    const s=buildSummary(blocks),u=s.unit;
    // シート1：求積表（ブロック展開）
    const aoa=[[park+'　求積表（ヘロンの公式・3辺による算出）'],['委託：公園緑地等定期維持管理（'+($('contractName').value||'')+'）　／　s=(a+b+c)/2、面積=√(s(s-a)(s-b)(s-c))'],[]];
    const merges=[{s:{r:0,c:0},e:{r:0,c:7}}];
    blocks.forEach((b,idx)=>{
      merges.push({s:{r:aoa.length,c:0},e:{r:aoa.length,c:7}});
      aoa.push([`${b.f.kind}　＃${idx+1}`]);
      aoa.push(['三角形',`辺a`,`a(${u})`,`辺b`,`b(${u})`,`辺c`,`c(${u})`,`面積(${u}²)`]);
      b.t.rows.forEach(r=>{const v=r.v;aoa.push(['△'+r.no,`${v[0]}-${v[1]}`,Math.round(r.a*10)/10,`${v[1]}-${v[2]}`,Math.round(r.b*10)/10,`${v[2]}-${v[0]}`,Math.round(r.c*10)/10,Math.round(r.area*100)/100]);});
      aoa.push(['合計','','','','','','',Math.round(b.t.total*100)/100]);
      aoa.push(['外周投影面積','','','','','','',Math.round(b.t.total*100)/100]);
      const hSum=blockHoleSum(b.f);
      if(hSum>0)aoa.push([`除外（穴）${(b.f.holes||[]).length}か所`,'','','','','','',-Math.round(hSum*100)/100]);
      const ded=isWeeding(b.f)?autoDeductList(b.f):[];
      ded.forEach(d=>aoa.push([`内側控除 ${d.kind}`,'','','','','','',-Math.round(d.area*100)/100]));
      const sk=b.f.slopeK||1;
      if(sk!==1)aoa.push([`斜面補正 ×${sk}（${b.f.slopeKind||''}）`,'','','','','','','']);
      if(b.f.calc==='trim'){const per=perimeterM(b.f.pts),side=per*(b.f.height||0);aoa.push([`側面（周長×高さ${(b.f.height||0).toFixed(1)}m）`,'','','','','','',Math.round(side*100)/100]);}
      aoa.push(['計上面積','','','','','','',Math.round((b.f.area!=null?b.f.area:b.t.total)*100)/100]);
      aoa.push([]);
    });
    const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:16},{wch:8},{wch:10},{wch:8},{wch:10},{wch:8},{wch:10},{wch:12}];ws['!merges']=merges;
    Object.keys(ws).forEach(k=>{if(k[0]!=='!'&&ws[k].t==='n'){const cc=XLSX.utils.decode_cell(k).c;ws[k].z=([2,4,6].indexOf(cc)>=0)?'0.0':'0.00';}});
    XLSX.utils.book_append_sheet(wb,ws,'求積表');
    // （面積の内訳は「数量集計（報告用）」シートに統合）
  }
  // シート：数量集計（報告用）— 面積㎡・樹木/点（本・個）・その他（手入力）を反映。報告書の数量根拠用。
  const rep=[[park+'　数量集計（報告用）'],['大分類','細別・規格','数量','単位','参考金額(円)']];
  let amtTotal=0;
  Object.values(areas).slice().sort(cmpSpec).forEach(a=>{const price=(((MASTER[a.cat]||{}).kinds||{})[a.kind]||{}).price||0;const amt=a.m2*price;amtTotal+=amt;rep.push([a.cat,a.kind+(a.line?'（柵）':''),Math.round(a.m2*100)/100,'㎡',Math.round(amt)]);});
  Object.values(trees).slice().sort(cmpSpec).forEach(t=>{const kd=((MASTER[t.cat]||{}).kinds||{})[t.kind]||{};const price=(t.rank&&kd.prices)?(kd.prices[t.rank]||0):(kd.price||0);const amt=t.n*price;amtTotal+=amt;rep.push([t.cat,t.kind+(t.rank?' '+t.rank:''),t.n,(t.unit||'本'),Math.round(amt)]);});
  state.manual.forEach(m=>{const price=(MANUAL[m.kind]||{}).price||0;const amt=m.qty*price;amtTotal+=amt;rep.push(['その他',m.kind,m.qty,(MANUAL[m.kind]||{}).unit||'',Math.round(amt)]);});
  rep.push([]);rep.push(['','','','参考合計(円)',Math.round(amtTotal)]);
  const wsR=XLSX.utils.aoa_to_sheet(rep);wsR['!cols']=[{wch:20},{wch:26},{wch:10},{wch:7},{wch:14}];wsR['!merges']=[{s:{r:0,c:0},e:{r:0,c:4}}];
  Object.keys(wsR).forEach(k=>{if(k[0]!=='!'&&wsR[k].t==='n'){const cc=XLSX.utils.decode_cell(k).c;if(cc===2)wsR[k].z='0.00';else if(cc===4)wsR[k].z='#,##0';}});
  XLSX.utils.book_append_sheet(wb,wsR,'数量集計（報告用）');
  // シート：凡例（地図記号の説明。※「その他＝手入力」は地図に置かないので含めない）
  const leg=[[park+'　凡例（地図記号）'],['記号','大分類','細別','規格','数量','単位']];
  const legItems=[];
  Object.values(areas).forEach(a=>legItems.push({cat:a.cat,kind:a.kind,rank:'',row:[a.line?'― 柵':'■ 面積',a.cat,a.kind,'',Number(a.m2.toFixed(2)),'㎡']}));
  Object.values(trees).forEach(t=>legItems.push({cat:t.cat,kind:t.kind,rank:t.rank||'',row:['● 点',t.cat,t.kind,t.rank||'',t.n,(t.unit||'本')]}));
  legItems.sort(cmpSpec).forEach(it=>leg.push(it.row));
  const ws3=XLSX.utils.aoa_to_sheet(leg);
  ws3['!cols']=[{wch:9},{wch:18},{wch:16},{wch:18},{wch:8},{wch:6}];
  ws3['!merges']=[{s:{r:0,c:0},e:{r:0,c:5}}];
  XLSX.utils.book_append_sheet(wb,ws3,'凡例');
  XLSX.writeFile(wb,`${park}_求積表.xlsx`);
}
$('xlsxBtn').onclick=exportExcel;$('mXlsx').onclick=exportExcel;

function allSanshaCsv(){
  const blocks=allAreaBlocks();if(!blocks.length){alert('面積の注記がありません。');return;}
  const u=blocks[0].t.unit;let c=`\uFEFF${$('parkName').value||'公園'} 求積表（ヘロンの公式・3辺）\ns=(a+b+c)/2, 面積=√(s(s-a)(s-b)(s-c))\n`;
  blocks.forEach((b,idx)=>{
    c+=`\n${b.f.kind} ＃${idx+1}\n三角形,辺a,a(${u}),辺b,b(${u}),辺c,c(${u}),面積(${u}²)\n`;
    b.t.rows.forEach(r=>{const v=r.v;c+=`△${r.no},${v[0]}-${v[1]},${r.a.toFixed(1)},${v[1]}-${v[2]},${r.b.toFixed(1)},${v[2]}-${v[0]},${r.c.toFixed(1)},${r.area.toFixed(2)}\n`;});
    c+=`外周投影,,,,,,,${b.t.total.toFixed(2)}\n`;
    const hSum=blockHoleSum(b.f);if(hSum>0)c+=`除外(穴),,,,,,,-${hSum.toFixed(2)}\n`;
    (isWeeding(b.f)?autoDeductList(b.f):[]).forEach(d=>c+=`内側控除 ${d.kind},,,,,,,-${d.area.toFixed(2)}\n`);
    if((b.f.slopeK||1)!==1)c+=`斜面補正 ×${b.f.slopeK}（${b.f.slopeKind||''}）,,,,,,,\n`;
    c+=`計上面積,,,,,,,${(b.f.area!=null?b.f.area:b.t.total).toFixed(2)}\n`;
  });
  dl(c,`${$('parkName').value||'公園'}_求積表.csv`,'text/csv');
}
$('mCsv').onclick=allSanshaCsv;
$('mCopy').onclick=()=>{
  const blocks=allAreaBlocks();if(!blocks.length)return;const u=blocks[0].t.unit;let txt='';
  blocks.forEach((b,idx)=>{
    txt+=`${b.f.kind} ＃${idx+1}\n三角形\t辺a\ta(${u})\t辺b\tb(${u})\t辺c\tc(${u})\t面積\n`;
    b.t.rows.forEach(r=>{const v=r.v;txt+=`△${r.no}\t${v[0]}-${v[1]}\t${r.a.toFixed(1)}\t${v[1]}-${v[2]}\t${r.b.toFixed(1)}\t${v[2]}-${v[0]}\t${r.c.toFixed(1)}\t${r.area.toFixed(2)}\n`;});
    txt+=`外周投影\t\t\t\t\t\t\t${b.t.total.toFixed(2)}\n計上面積\t\t\t\t\t\t\t${(b.f.area!=null?b.f.area:b.t.total).toFixed(2)}\n\n`;});
  navigator.clipboard.writeText(txt).then(()=>{$('mCopy').textContent='コピーしました';setTimeout(()=>$('mCopy').textContent='表をコピー',1500);});
};

$('hint').onclick=()=>$('hint').style.display='none';   // 邪魔なときはタップで一時的に隠す（ツール切替で再表示）
buildTreeColors();
fillCats();fillManual();renderAgg();renderSansha();setTool('area');updateHint();updateUndoButtons();
new ResizeObserver(resize).observe(cv.parentElement);resize();
