<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="取引先">
<meta name="theme-color" content="#214A37">
<title>取引先｜庭乃持田園</title>
<style>
:root{
  --paper:#F6F5F0; --card:#FFFFFF; --leaf:#214A37; --leaf-soft:#E5EDE7; --ok:#2E7D55;
  --tape:#C77C30; --bark:#5B5750; --ink:#22231F; --line:#DCD9D0; --field:#FBFAF6; --danger:#B0533F;
  --radius:10px; --shadow:0 1px 0 rgba(34,35,31,.04), 0 8px 24px -16px rgba(34,35,31,.25);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif;
  -webkit-text-size-adjust:100%;line-height:1.6}
.tnum{font-variant-numeric:tabular-nums}
header{background:var(--leaf);color:#fff;padding:12px 16px calc(12px);position:sticky;top:0;z-index:20;
  padding-top:calc(12px + env(safe-area-inset-top))}
header .row{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;letter-spacing:.04em}
header .me{font-size:13px;background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:999px;padding:5px 12px}
.demo-bar{background:var(--tape);color:#fff;font-size:12.5px;text-align:center;padding:5px 12px}
main{max-width:680px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
.error-banner{display:none;background:var(--danger);color:#fff;padding:10px 16px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:4px 0 10px;color:var(--leaf)}
.hint{font-size:12.5px;color:var(--bark);margin:4px 0 0}
label.lbl{display:block;font-size:13px;font-weight:600;color:var(--bark);margin:0 0 6px}
input[type=text],input[type=search],textarea,select{width:100%;font:inherit;font-size:16px;padding:11px 12px;
  border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--leaf);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:15px;font-weight:600;
  border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 16px;min-height:46px;cursor:pointer}
.btn.primary{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13.5px}
.row2{display:flex;gap:8px}
.row2>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;color:var(--ink);font-family:inherit}
.chip.on{background:var(--leaf-soft);border-color:var(--leaf);color:var(--leaf);font-weight:700}
.tag{display:inline-block;font-size:11.5px;border-radius:6px;padding:1px 7px;margin-left:4px;vertical-align:1px}
.tag.mis{background:#F6E7D8;color:#8A4F17}
.tag.wait{background:#EEE;color:var(--bark)}
.tag.loc{background:var(--leaf-soft);color:var(--leaf)}
.tag.out{background:#F4DED8;color:var(--danger)}
.searchbox{display:flex;gap:8px}
.searchbox input{flex:1}
.mic{width:50px;min-width:50px;padding:0;font-size:20px}
.tool{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:8px;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.tool .ph{width:60px;height:60px;border-radius:8px;background:var(--leaf-soft);flex:none;display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden}
.tool .ph img{width:100%;height:100%;object-fit:cover}
.tool .nm{font-weight:700;font-size:15.5px}
.tool .nm small{font-weight:400;color:var(--bark);font-size:13px}
.tool .sub{font-size:12.5px;color:var(--bark)}
.sec-title{font-size:13px;font-weight:700;color:var(--bark);margin:14px 2px 8px}
.maybe{border-left:4px solid var(--tape);padding-left:10px}
.empty{color:var(--bark);text-align:center;padding:22px 10px;font-size:14px}
.photo-box{border:2px dashed var(--line);border-radius:10px;min-height:150px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--field);margin-bottom:8px}
.photo-box img{max-width:100%;max-height:260px;display:block}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:52px;height:46px;font-size:22px}
.qty .n{font-size:22px;font-weight:700;min-width:40px;text-align:center}
.step{display:flex;gap:10px;margin-bottom:14px}
.step .no{flex:none;width:26px;height:26px;border-radius:50%;background:var(--tape);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.step .bd{flex:1;min-width:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:30;
  padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:680px;margin:0 auto;display:flex}
nav.tabs button{flex:1;border:0;background:none;font:inherit;font-size:11.5px;color:var(--bark);padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative}
nav.tabs button .ic{font-size:21px;line-height:1.1}
nav.tabs button.on{color:var(--leaf);font-weight:700}
nav.tabs .badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--danger);color:#fff;font-size:10.5px;border-radius:999px;padding:0 6px;min-width:18px}
.modal-bg{position:fixed;inset:0;background:rgba(34,35,31,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:var(--paper);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.modal h3{margin:0 0 12px;font-size:17px;color:var(--leaf)}
.detail-ph{width:100%;max-height:300px;object-fit:contain;border-radius:10px;background:var(--leaf-soft);display:block;margin-bottom:12px}
.big-ph{height:160px;border-radius:10px;background:var(--leaf-soft);display:flex;align-items:center;justify-content:center;font-size:60px;margin-bottom:12px}
dl.kv{display:grid;grid-template-columns:88px 1fr;gap:6px 10px;margin:0 0 12px;font-size:14px}
dl.kv dt{color:var(--bark)}
dl.kv dd{margin:0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.loading{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.btn:not(.primary):not(.ok) .loading{border-color:var(--line);border-top-color:var(--leaf)}
@keyframes spin{to{transform:rotate(360deg)}}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;border:0;background:var(--card);font:inherit;font-size:13.5px;padding:9px 4px;cursor:pointer;color:var(--bark)}
.seg button.on{background:var(--leaf);color:#fff;font-weight:700}
.miss-box{background:#FBF1E6;border:1px solid #EBCFAE;border-radius:10px;padding:12px;margin-bottom:12px;font-size:14px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.home-btn{display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;color:#fff;text-decoration:none;font-family:inherit;font-size:13px;font-weight:700;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);border-radius:999px;padding:5px 11px 5px 9px;white-space:nowrap;line-height:1.2}
.home-btn:active{background:rgba(255,255,255,.28)}
.home-btn .hb-ic{font-size:15px;line-height:1}
@media (max-width:400px){ .home-btn{padding:5px 8px} .home-btn .hb-t{display:none} }
.fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:25;background:var(--tape);color:#fff;border:0;border-radius:999px;padding:14px 20px;font:inherit;font-size:15.5px;font-weight:700;box-shadow:0 8px 20px -8px rgba(0,0,0,.4);cursor:pointer}
main{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.sup{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
.sup .nm{font-weight:700;font-size:15.5px}
.sup .sub{font-size:12.5px;color:var(--bark);margin-top:2px}
.tag.kind{background:var(--leaf-soft);color:var(--leaf)}
.acts{display:flex;gap:8px;margin:4px 0 12px}
.acts a{flex:1;text-decoration:none}
.kindchips{margin:10px 0 4px}
.kindchips .chip{font-size:13px;padding:5px 11px}
.inv-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--leaf-soft);border:1.5px dashed var(--leaf);border-radius:12px;padding:12px 14px;margin-bottom:12px;cursor:pointer}
.inv-btn .ic{font-size:26px;line-height:1}
.inv-btn b{display:block;font-size:15.5px;color:var(--leaf)}
.inv-btn small{display:block;font-size:12.5px;color:var(--bark);margin-top:2px;line-height:1.45}
.inv-btn:active{filter:brightness(.96)}
.ai-fill{background:#fff6d8!important;border-color:#e0b84a!important}
.ai-note{font-size:13px;line-height:1.5;background:#fff6d8;border-left:3px solid #e0b84a;border-radius:0 8px 8px 0;padding:8px 11px;margin:0 0 10px}
.read-wait{text-align:center;padding:18px 6px}
.read-wait .loading{width:28px;height:28px;border-width:3px;border-color:var(--line);border-top-color:var(--leaf)}
.read-wait p{margin:12px 0 0;font-size:14px;color:var(--bark)}
</style>
</head>
<body>
<div class="error-banner" id="errBanner"></div>
<header><div class="row"><a class="home-btn" href="index.html" title="アプリ一覧にもどる" aria-label="アプリ一覧（ホーム）にもどる"><span class="hb-ic">🏠</span><span class="hb-t">ホーム</span></a><h1>🏪 取引先</h1><button class="me" id="meBtn" type="button">名前を選ぶ</button></div></header>
<div class="demo-bar" id="demoBar" hidden>お試しモード：この端末の中だけに保存されます</div>
<main>
  <button type="button" class="inv-btn" id="invBtn"><span class="ic">📷</span><span><b>請求書・名刺から登録</b><small>届いた請求書や名刺の写真・スクショ・PDFを選ぶと、名前・電話・住所・扱う物などを読み取って入れます。確かめて保存するだけ。</small></span></button>
  <input type="file" id="invFile" accept="image/*,application/pdf" multiple hidden>
  <div class="card">
    <div class="searchbox"><input type="search" id="q" placeholder="店の名前・呼び方・扱っている物" autocomplete="off"><button class="btn mic" type="button" data-mic="q" aria-label="音声で入力">🎤</button></div>
    <p class="hint">「竹屋さん」「竹材店」のような呼び方や、「竹」「砂利」など扱っている物でも探せます。</p>
    <p class="hint" id="micHint" hidden>iPhone・iPad はキーボードのマイクを押して話します。</p>
    <div class="chips kindchips" id="kinds"></div>
  </div>
  <div id="list"></div>
</main>
<button class="fab" id="fab" type="button">＋ 取引先を追加</button>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ 設定 ============ */
// 現場アプリGAS（段取り・道具管理・用語集・取引先・車両で共通の1本）。空のままだと「お試しモード」
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzCkxdDCT3hnSEbtpcbQcvOcsehvX5pLUzZ8xFBIxQ40qvRmwmnixJ3q_vEr7X0v-vm7A/exec';
const MASTERS_URL = 'https://script.google.com/macros/s/AKfycbz2iP9eN-79vKTgOvfY6_Vd9rJZ9IMuz4ILkrxE79Muqq0pvTZAAhBG3cMXpZV6ZU1-/exec';
const DEMO = !GAS_URL;
const LS = { me: 'torihiki_me', demo: 'torihiki_demo_v1', cache: 'torihiki_cache' };
const NET_ERR = '電波を確認して、もう一度お試しください';
const KINDS = ['植木・生産者', '竹', '石・砂利・土', '資材・金物', '肥料・薬剤', '機械・修理', 'レンタル', '燃料', '処分場', '元請・お客さん', 'その他'];

/* ============ 小道具 ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400); }
function showError(msg) { const b = $('errBanner'); b.textContent = '⚠️ ' + msg; b.style.display = 'block'; }
window.addEventListener('error', e => showError('画面の処理でエラー：' + (e.message || '')));
function now() { const d = new Date(), p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); }
const SMALL = { 'ぁ': 'あ', 'ぃ': 'い', 'ぅ': 'う', 'ぇ': 'え', 'ぉ': 'お', 'っ': 'つ', 'ゃ': 'や', 'ゅ': 'ゆ', 'ょ': 'よ', 'ゎ': 'わ' };
function toHira(s) { return String(s || '').replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)); }
function norm(s) { return toHira(String(s || '').normalize('NFKC').toLowerCase()).replace(/[\s・･,，、。.\-－_/／（）()「」『』]/g, ''); }
function loose(s) { return norm(s).normalize('NFD').replace(/[゙゚]/g, '').normalize('NFC').replace(/[ぁぃぅぇぉっゃゅょゎ]/g, c => SMALL[c]).replace(/ー/g, ''); }
const bare = w => String(w || '').trim().replace(/(さん|様|さま|殿)$/, '');
const splitList = s => String(s || '').split(/[、,，\n]/).map(x => x.trim()).filter(Boolean);
async function getJSON(url) { return (await fetch(url, { cache: 'no-store' })).json(); }
async function postJSON(body) { return (await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ app: 'torihiki', by: me() }, body)) })).json(); }

/* ============ データ ============ */
let SUP = [], KIND = '', HIST = [], ADMINS = ['親方'];
const canDelete = () => ADMINS.includes(me());
async function load() {
  try {
    if (DEMO) {
      SUP = lsGet(LS.demo, []);
      const sv = lsGet('sharyo_demo_v1', { vehicles: [], logs: [] }) || {}, vn = {}; (sv.vehicles || []).forEach(v => { vn[v.id] = v.name; });
      HIST = (sv.logs || []).filter(l => l.shop).map(l => ({ shop: l.shop, date: l.date, what: '車両', name: vn[l.vehicleId] || '', type: l.type, content: l.content, cost: l.cost, by: l.by }))
        .concat((lsGet('dougu_repairs_demo', []) || []).filter(r => r.shop).map(r => ({ shop: r.shop, date: r.date, what: '道具', name: r.toolId, type: r.type, content: r.content, cost: r.cost, by: r.by })));
    } else {
      const r = await getJSON(GAS_URL + '?app=torihiki&action=data'); if (!r.ok) throw new Error(r.error);
      SUP = r.suppliers || []; HIST = r.history || []; ADMINS = r.admins && r.admins.length ? r.admins : ADMINS; lsSet(LS.cache, { SUP, HIST, ADMINS });
    }
  } catch (e) {
    const c = lsGet(LS.cache, null);
    if (c) { if (Array.isArray(c)) SUP = c; else ({ SUP, HIST, ADMINS } = c); toast('前回のデータを表示しています（' + NET_ERR + '）'); } else showError('取引先を読み込めませんでした。' + NET_ERR);
  }
  render();
}
async function save(item) {
  if (DEMO) {
    if (!item.id) item.id = 'S' + String(SUP.reduce((m, s) => Math.max(m, Number(String(s.id).replace(/\D/g, '')) || 0), 0) + 1).padStart(4, '0');
    item.updatedBy = me(); item.updatedAt = now();
    const i = SUP.findIndex(s => s.id === item.id); if (i >= 0) SUP[i] = Object.assign({}, SUP[i], item); else SUP.push(item);
    lsSet(LS.demo, SUP); return item.id;
  }
  const r = await postJSON({ mode: 'save', item }); if (!r.ok) throw new Error(r.error); await load(); return r.id;
}
async function remove(id) {
  if (DEMO) { SUP = SUP.filter(s => s.id !== id); lsSet(LS.demo, SUP); return; }
  const r = await postJSON({ mode: 'delete', id }); if (!r.ok) throw new Error(r.error); await load();
}

/* ============ 探す（正式名・読み・呼び方・扱う物） ============ */
function score(s, q) {
  const nq = norm(bare(q)), lq = loose(bare(q)); if (!nq) return 1;
  const names = [s.name, s.kana].concat(splitList(s.aliases)).map(bare);
  let best = 0;
  names.forEach(n => { const a = norm(n), b = loose(n); if (!a) return;
    if (a === nq || b === lq) best = Math.max(best, 100); else if (a.startsWith(nq) || b.startsWith(lq)) best = Math.max(best, 80); else if (a.includes(nq) || b.includes(lq)) best = Math.max(best, 60); });
  if (norm(s.items).includes(nq)) best = Math.max(best, 50);
  if (norm(s.kind).includes(nq)) best = Math.max(best, 40);
  if (norm([s.contact, s.address, s.memo].join(' ')).includes(nq)) best = Math.max(best, 30);
  return best;
}
function render() {
  $('kinds').innerHTML = ['すべて'].concat(KINDS.filter(k => SUP.some(s => s.kind === k))).map(k => '<button type="button" class="chip' + ((k === 'すべて' ? '' : k) === KIND ? ' on' : '') + '" data-kind="' + esc(k === 'すべて' ? '' : k) + '">' + esc(k) + '</button>').join('');
  const q = $('q').value.trim();
  let list = SUP.filter(s => !KIND || s.kind === KIND).map(s => ({ s, sc: score(s, q) })).filter(x => x.sc > 0);
  list.sort((a, b) => b.sc - a.sc || String(a.s.kana || a.s.name).localeCompare(String(b.s.kana || b.s.name), 'ja'));
  $('list').innerHTML = list.length ? list.map(({ s }) => '<button type="button" class="sup" data-id="' + esc(s.id) + '"><div class="nm">' + esc(s.name) + (s.kind ? '<span class="tag kind">' + esc(s.kind) + '</span>' : '') + '</div>' +
      (s.aliases ? '<div class="sub">呼び方：' + esc(splitList(s.aliases).join('・')) + '</div>' : '') +
      (s.items ? '<div class="sub">扱う物：' + esc(s.items) + '</div>' : '') + '</button>').join('')
    : '<div class="empty">' + (SUP.length ? '見つかりません。' + (q ? '「' + esc(q) + '」で新しく追加できます。<br><button class="btn sm" style="margin-top:8px" data-new="' + esc(q) + '">＋「' + esc(bare(q)) + '」を追加</button>' : '') : 'まだ取引先がありません。<br>右下の「＋ 取引先を追加」から登録してください。') + '</div>';
}

/* ============ 修理・点検・レンタルの履歴（道具管理・車両アプリの記録から） ============ */
const supNames = s => [s.name, s.kana].concat(splitList(s.aliases)).map(bare).filter(Boolean);
function historyOf(s) {
  const ns = supNames(s).map(norm);
  return HIST.filter(h => ns.includes(norm(bare(h.shop)))).sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
}
const yen = v => { const n = Number(String(v || '').replace(/[^\d]/g, '')); return n ? n.toLocaleString('ja-JP') + '円' : ''; };
function historyHtml(s) {
  const list = historyOf(s); if (!list.length) return '';
  const y = String(new Date().getFullYear()), sum = arr => arr.reduce((t, h) => t + (Number(String(h.cost || '').replace(/[^\d]/g, '')) || 0), 0);
  const total = sum(list), thisYear = sum(list.filter(h => String(h.date || '').startsWith(y)));
  return '<div class="sec-title">🔧 修理・点検・レンタルの履歴（' + list.length + '件）</div>' +
    (total ? '<p class="hint" style="margin:0 0 6px">費用の合計：今年 ' + (thisYear ? thisYear.toLocaleString('ja-JP') + '円' : '0円') + '／全部 ' + total.toLocaleString('ja-JP') + '円</p>' : '') +
    list.slice(0, 30).map(h => '<div style="border-top:1px solid var(--line);padding:7px 0;font-size:14px"><div style="display:flex;gap:8px"><b style="flex:1">' + (h.what === '車両' ? '🚚 ' : '🧰 ') + esc(h.name || '') + '　' + esc(h.type || '') + '</b><span class="hint" style="margin:0">' + esc(String(h.date || '').replace(/-/g, '/')) + '</span></div>' +
      (h.content ? '<div class="hint" style="margin:0;white-space:pre-wrap">' + esc(h.content) + '</div>' : '') + (yen(h.cost) || h.by ? '<div class="hint" style="margin:0">' + esc([yen(h.cost), h.by].filter(Boolean).join('・')) + '</div>' : '') + '</div>').join('');
}

/* ============ 詳細・編集 ============ */
function openSup(id) {
  const s = SUP.find(x => x.id === id); if (!s) return;
  const tel = String(s.phone || '').replace(/[^\d+]/g, '');
  openModal('<h3>' + esc(s.name) + '</h3>' +
    '<div class="acts">' + (tel ? '<a class="btn" href="tel:' + esc(tel) + '">📞 電話</a>' : '') + (s.address ? '<a class="btn" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.address) + '" target="_blank" rel="noopener">🗺 地図</a>' : '') + '</div>' +
    '<dl class="kv">' +
    (s.kana ? '<dt>読み</dt><dd>' + esc(s.kana) + '</dd>' : '') +
    '<dt>種類</dt><dd>' + esc(s.kind || '—') + '</dd>' +
    '<dt>呼び方</dt><dd>' + esc(splitList(s.aliases).join('・') || '—') + '</dd>' +
    '<dt>電話</dt><dd>' + esc(s.phone || '—') + '</dd>' +
    '<dt>住所</dt><dd>' + esc(s.address || '—') + '</dd>' +
    '<dt>担当の人</dt><dd>' + esc(s.contact || '—') + '</dd>' +
    '<dt>扱う物</dt><dd>' + esc(s.items || '—') + '</dd>' +
    '<dt>メモ</dt><dd style="white-space:pre-wrap">' + esc(s.memo || '—') + '</dd>' +
    '</dl>' + historyHtml(s) + (s.updatedBy || s.updatedAt ? '<p class="hint">最後に直した人：' + esc(s.updatedBy || '') + '　' + esc(s.updatedAt || '') + '</p>' : '') +
    '<div class="row2" style="margin-top:14px">' + (canDelete() ? '<button class="btn danger" data-act="del">削除</button>' : '') + '<button class="btn primary" data-act="edit">✏️ 直す</button></div>' +
    (canDelete() ? '' : '<p class="hint">削除は' + esc(ADMINS.join('・')) + 'だけができます。</p>') +
    '<button class="btn block" style="margin-top:8px" data-act="close">閉じる</button>',
    async e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.act === 'close') return closeModal();
      if (b.dataset.act === 'edit') return openEdit(s);
      if (b.dataset.act === 'del') { if (!confirm('「' + s.name + '」を削除しますか？')) return; try { await remove(s.id); closeModal(); render(); toast('削除しました'); } catch (err) { toast(err.message || NET_ERR); } }
    });
}
function openEdit(src, opt) {
  const s = Object.assign({ id: '', name: '', kana: '', kind: '', aliases: '', phone: '', address: '', contact: '', items: '', memo: '' }, src || {});
  opt = opt || {};
  openModal('<h3>' + (s.id ? '取引先を直す' : '取引先を追加') + '</h3>' +
    (opt.note ? '<div class="ai-note" id="aiNote">' + opt.note + '</div>' : '<div class="ai-note" id="aiNote" hidden></div>') +
    (DEMO ? '' : '<button class="btn block" style="margin-bottom:10px" data-act="read">📷 請求書・名刺から読み取る</button>') +
    '<label class="lbl">正式な名前</label><input type="text" id="fName" value="' + esc(s.name) + '" placeholder="例：〇〇竹材店">' +
    '<label class="lbl" style="margin-top:12px">読み（ひらがな・なくても可）</label><input type="text" id="fKana" value="' + esc(s.kana) + '" placeholder="例：まるまるちくざいてん">' +
    '<label class="lbl" style="margin-top:12px">種類</label><select id="fKind"><option value="">（選ぶ）</option>' + KINDS.map(k => '<option' + (k === s.kind ? ' selected' : '') + '>' + esc(k) + '</option>').join('') + '</select>' +
    '<label class="lbl" style="margin-top:12px">呼び方（社内での言い方・聞き間違いを「、」で区切って）</label><input type="text" id="fAlias" value="' + esc(splitList(s.aliases).join('、')) + '" placeholder="例：竹屋、竹屋さん、竹材店">' +
    '<p class="hint">ここに入れた呼び方で、段取りの「竹屋で竹15本」が正式名に直り、「誰？」とも聞かれなくなります。</p>' +
    '<label class="lbl" style="margin-top:12px">電話</label><input type="text" id="fPhone" inputmode="tel" value="' + esc(s.phone) + '" placeholder="044-000-0000">' +
    '<label class="lbl" style="margin-top:12px">住所</label><input type="text" id="fAddr" value="' + esc(s.address) + '">' +
    '<label class="lbl" style="margin-top:12px">担当の人</label><input type="text" id="fContact" value="' + esc(s.contact) + '">' +
    '<label class="lbl" style="margin-top:12px">扱う物</label><input type="text" id="fItems" value="' + esc(s.items) + '" placeholder="例：竹・竹垣材・シュロ縄">' +
    '<label class="lbl" style="margin-top:12px">メモ（支払い・営業時間・注意など）</label><textarea id="fMemo">' + esc(s.memo) + '</textarea>' +
    '<div class="row2" style="margin-top:16px"><button class="btn" data-act="back">' + (s.id ? '戻る' : 'やめる') + '</button><button class="btn primary" data-act="save">保存</button></div>',
    async e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.act === 'back') return s.id ? openSup(s.id) : closeModal();
      if (b.dataset.act === 'read') { READ_TO_FORM = true; $('invFile').click(); return; }
      if (b.dataset.act !== 'save') return;
      const item = { id: s.id, name: $('fName').value.trim(), kana: toHira($('fKana').value.trim()), kind: $('fKind').value, aliases: splitList($('fAlias').value).join('、'),
        phone: $('fPhone').value.trim(), address: $('fAddr').value.trim(), contact: $('fContact').value.trim(), items: $('fItems').value.trim(), memo: $('fMemo').value.trim() };
      if (!item.name) return toast('正式な名前を入れてください');
      const dup = SUP.find(x => x.id !== item.id && (norm(x.name) === norm(item.name) || splitList(x.aliases).some(a => norm(bare(a)) === norm(bare(item.name)))));
      if (dup && !confirm('「' + dup.name + '」と同じかもしれません。このまま保存しますか？')) return;
      b.disabled = true; b.innerHTML = '<span class="loading"></span> 保存中…';
      try { const id = await save(item); render(); openSup(id); toast('保存しました'); } catch (err) { toast(err.message || NET_ERR); b.disabled = false; b.textContent = '保存'; }
    });
  markFilled(opt.filled);
}

/* ============ 請求書・名刺から読み取る ============
   写真・スクショ・PDF（4枚まで）をAIで読み、取引先の欄に仮入力する。もう登録してある店なら、空いている欄だけ足す */
const F_IDS = { name: 'fName', kana: 'fKana', kind: 'fKind', aliases: 'fAlias', phone: 'fPhone', address: 'fAddr', contact: 'fContact', items: 'fItems', memo: 'fMemo' };
let READ_TO_FORM = false;
const digits = v => String(v || '').normalize('NFKC').replace(/\D/g, '');
const corpless = n => String(n || '').normalize('NFKC').replace(/(株式会社|有限会社|合同会社|合名会社|合資会社|一般社団法人|\(株\)|\(有\)|㈱|㈲)/g, '').trim();
function markFilled(keys) { (keys || []).forEach(k => { const el = $(F_IDS[k]); if (el) el.classList.add('ai-fill'); }); }
function fileB64(f) { return new Promise((ok, ng) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = ng; r.readAsDataURL(f); }); }
function loadImg(f) { return new Promise((ok, ng) => { const u = URL.createObjectURL(f), im = new Image(); im.onload = () => { URL.revokeObjectURL(u); ok(im); }; im.onerror = () => { URL.revokeObjectURL(u); ng(new Error('画像を開けませんでした')); }; im.src = u; }); }
async function filePart(f) {
  if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) {
    if (f.size > 8e6) throw new Error('PDFが大きすぎます（8MBまで）。写真かスクショで選んでください');
    return { mime: 'application/pdf', data: await fileB64(f) };
  }
  const im = await loadImg(f), max = 2000, k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
  const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(im, 0, 0, c.width, c.height);
  return { mime: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.85).split(',')[1] };
}
function formVals() { const o = {}; Object.keys(F_IDS).forEach(k => { const el = $(F_IDS[k]); o[k] = el ? el.value.trim() : ''; }); return o; }
/* 読んだ結果を今の値（cur）に足す：空いている欄だけ埋め、呼び方・扱う物・メモは足りない分を書き足す */
function mergeRead(cur, d) {
  const out = Object.assign({}, cur), filled = [];
  const fill = (k, v) => { v = String(v || '').trim(); if (v && !String(out[k] || '').trim()) { out[k] = v; filled.push(k); } };
  fill('name', d.name); fill('kana', toHira(d.kana)); fill('kind', d.kind); fill('phone', d.phone);
  fill('address', [d.zip ? '〒' + d.zip.replace(/^〒/, '') : '', d.address].filter(Boolean).join(' ')); fill('contact', d.contact);
  const al = splitList(out.aliases), base = norm(bare(out.name || d.name));
  [d.short, corpless(d.name)].map(x => String(x || '').trim()).forEach(x => { if (x && norm(x) !== base && !al.some(a => norm(a) === norm(x))) al.push(x); });
  if (al.join('、') !== splitList(out.aliases).join('、')) { out.aliases = al.join('、'); filled.push('aliases'); }
  const it = String(out.items || '').split(/[・、,，]/).map(x => x.trim()).filter(Boolean);
  String(d.items || '').split(/[・、,，]/).map(x => x.trim()).filter(Boolean).forEach(x => { if (!it.some(y => norm(y) === norm(x))) it.push(x); });
  if (it.join('・') !== String(out.items || '')) { out.items = it.join('・'); filled.push('items'); }
  const memo = String(out.memo || ''), add = [];
  [['FAX', d.fax], ['メール', d.email], ['ホームページ', d.web], ['インボイス登録番号', d.invoiceNo], ['振込先', d.bank], ['支払い', d.terms]]
    .forEach(([l, v]) => { v = String(v || '').trim(); if (v && !norm(memo).includes(norm(v))) add.push(l + '：' + v); });
  if (add.length) { out.memo = (memo ? memo + '\n' : '') + add.join('\n'); filled.push('memo'); }
  return { item: out, filled };
}
function findSame(d) {
  const n = norm(corpless(d.name)), tel = digits(d.phone);
  return SUP.find(x => (n && (norm(corpless(x.name)) === n || splitList(x.aliases).some(a => norm(bare(a)) === n))) || (tel.length >= 9 && digits(x.phone) === tel)) || null;
}
async function readInvoice(files) {
  const toForm = READ_TO_FORM; READ_TO_FORM = false;
  if (DEMO) return toast('お試しモードでは読み取れません');
  files = [...files].slice(0, 4); if (!files.length) return;
  const keep = toForm ? formVals() : null;
  const keepHtml = toForm ? $('modal').innerHTML : null, keepHandler = modalHandler;
  openModal('<div class="read-wait"><span class="loading"></span><p>読み取っています…（10〜30秒）</p></div>', null, true);
  let d;
  try {
    const parts = []; for (const f of files) parts.push(await filePart(f));
    const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 120000);
    const r = await (await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, signal: ac.signal,
      body: JSON.stringify({ app: 'torihiki', mode: 'readInvoice', by: me(), files: parts, kinds: KINDS }) })).json();
    clearTimeout(tm);
    if (!r.ok) throw new Error(r.error || '読み取れませんでした');
    d = r.data || {};
  } catch (e) {
    if (toForm) { $('modal').innerHTML = keepHtml; modalHandler = keepHandler; modalLocked = false; Object.keys(keep).forEach(k => { const el = $(F_IDS[k]); if (el) el.value = keep[k]; }); }
    else closeModal();
    return toast(e.name === 'AbortError' ? '時間がかかりすぎました。' + NET_ERR : (e.message || NET_ERR));
  }
  if (!d.name && !d.phone && !d.address) {
    if (toForm) { $('modal').innerHTML = keepHtml; modalHandler = keepHandler; modalLocked = false; Object.keys(keep).forEach(k => { const el = $(F_IDS[k]); if (el) el.value = keep[k]; }); }
    else closeModal();
    return toast('会社名・電話・住所が読めませんでした。明るく、まっすぐ撮り直してください');
  }
  const NOTE = '📷 読み取った内容を<b>黄色の欄</b>に入れました。間違いがないか確かめて「保存」を押してください。';
  if (toForm) {   // 開いている入力画面に足す（入れてある内容はそのまま）
    $('modal').innerHTML = keepHtml; modalHandler = keepHandler; modalLocked = false;
    const m = mergeRead(keep, d);
    Object.keys(F_IDS).forEach(k => { const el = $(F_IDS[k]); if (el) el.value = k === 'kind' ? (m.item[k] || '') : (m.item[k] || ''); });
    markFilled(m.filled); const n = $('aiNote'); if (n) { n.innerHTML = m.filled.length ? NOTE : '📷 読み取りましたが、足す内容はありませんでした。'; n.hidden = false; }
    $('modal').scrollTop = 0; return;
  }
  const same = findSame(d);
  if (same && confirm('「' + same.name + '」はもう登録されています。\n空いている欄だけ、読み取った内容で埋めますか？\n（「キャンセル」で別の取引先として登録）')) {
    const m = mergeRead(same, d);
    return openEdit(m.item, { filled: m.filled, note: m.filled.length ? NOTE.replace('入れました', '足しました（もとの内容はそのまま）') : '📷 読み取りましたが、足す内容はありませんでした。' });
  }
  const m = mergeRead({ id: '', name: '', kana: '', kind: '', aliases: '', phone: '', address: '', contact: '', items: '', memo: '' }, d);
  openEdit(m.item, { filled: m.filled, note: NOTE });
}
$('invFile').addEventListener('change', e => { const fs = [...e.target.files]; e.target.value = ''; readInvoice(fs); });
$('invBtn').addEventListener('click', () => chooseName(false, () => { READ_TO_FORM = false; $('invFile').click(); }));

const FALLBACK_STAFF = [];
/* 名前：①このアプリで選んだ名前 ②日報アプリで選んだ名前（同じサイトなら自動で引き継ぐ） */
function rawGet(k) { try { const v = localStorage.getItem(k); if (v == null) return ''; try { const j = JSON.parse(v); return typeof j === 'string' ? j : ''; } catch (e) { return v; } } catch (e) { return ''; } }
const me = () => lsGet(LS.me, '') || rawGet('nippou_author');
let STAFF_LIST = null, NAME_OPEN = false, AFTER_NAME = null;
function staffList() {
  if (STAFF_LIST && STAFF_LIST.length) return STAFF_LIST;
  const m = lsGet('nippou_masters', null); if (m && m.staff && m.staff.length) return m.staff;   // 日報アプリが覚えている名簿
  return lsGet(LS.me + '_staff', null) || FALLBACK_STAFF;
}
async function fetchStaff() {   // 名簿は裏で取る（10秒で打ち切り）。取れたら開いている名前画面を描き直す
  const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 10000);
  try {
    const r = await (await fetch(MASTERS_URL + '?action=masters', { cache: 'no-store', signal: ac.signal })).json();
    const s = (r.staff || []).map(x => typeof x === 'string' ? x : (x.name || x.staff || '')).filter(Boolean);
    if (s.length) { STAFF_LIST = s; lsSet(LS.me + '_staff', s); if (NAME_OPEN && $('nmIn')) drawName(); if (typeof onStaff === 'function') onStaff(); }
  } catch (e) { /* 名簿が取れなくても手入力で進める */ } finally { clearTimeout(tm); }
}
function chooseName(force, then) {
  if (me() && !force) { if (then) then(); return; }
  AFTER_NAME = then || null; NAME_OPEN = true; drawName();
}
function drawName() {
  const typed = $('nmIn') ? $('nmIn').value : me();
  openModal('<h3>あなたの名前</h3><p class="hint" style="margin:4px 0 12px">最初の1回だけ選びます。登録した人として記録されます。</p>' +
    '<div class="chips" style="margin-bottom:12px">' + staffList().map(s => '<button type="button" class="chip" data-nm="' + esc(s) + '">' + esc(s) + '</button>').join('') + '</div>' +
    '<input type="text" id="nmIn" placeholder="一覧にないときは名前を入力" value="' + esc(typed) + '">' +
    '<div class="row2" style="margin-top:12px"><button class="btn" data-act="later">あとで</button><button class="btn primary" data-act="ok">決定</button></div>',
    e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.act === 'later') { NAME_OPEN = false; AFTER_NAME = null; closeModal(); return; }
      const v = b.dataset.nm || (b.dataset.act === 'ok' ? $('nmIn').value.trim() : '');
      if (!v) { if (b.dataset.act === 'ok') toast('名前を選ぶか入力してください'); return; }
      lsSet(LS.me, v); $('meBtn').textContent = '👤 ' + v; NAME_OPEN = false; closeModal();
      const t = AFTER_NAME; AFTER_NAME = null; if (t) t();
    });
}
function onStaff() {}
let modalHandler = null, modalLocked = false;
function openModal(html, handler, locked) { $('modal').innerHTML = html; modalHandler = handler; modalLocked = !!locked; $('modalBg').classList.add('show'); $('modal').scrollTop = 0; }
function closeModal() { $('modalBg').classList.remove('show'); $('modal').innerHTML = ''; modalHandler = null; }
$('modal').addEventListener('click', e => { if (modalHandler) modalHandler(e); });
$('modalBg').addEventListener('click', e => { if (e.target === $('modalBg') && !modalLocked) closeModal(); });
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
document.querySelectorAll('[data-mic]').forEach(b => b.addEventListener('click', () => {
  const inp = $(b.dataset.mic);
  if (!SR || IOS) { inp.focus(); $('micHint').hidden = false; toast('キーボードのマイク🎤を押して話してください'); return; }
  const rec = new SR(); rec.lang = 'ja-JP'; b.textContent = '⏺'; rec.onend = () => { b.textContent = '🎤'; };
  rec.onresult = ev => { inp.value = ev.results[0][0].transcript.replace(/[。、]$/, ''); render(); };
  rec.onerror = () => toast('うまく聞き取れませんでした'); rec.start();
}));

/* ============ イベント・起動 ============ */
$('q').addEventListener('input', render);
$('kinds').addEventListener('click', e => { const b = e.target.closest('[data-kind]'); if (!b) return; KIND = b.dataset.kind; render(); });
$('list').addEventListener('click', e => {
  const n = e.target.closest('[data-new]'); if (n) return chooseName(false, () => openEdit({ name: bare(n.dataset.new) }));
  const b = e.target.closest('[data-id]'); if (b) openSup(b.dataset.id);
});
$('fab').addEventListener('click', () => chooseName(false, () => openEdit(null)));
$('meBtn').addEventListener('click', () => chooseName(true));
(function init() {
  const p = new URLSearchParams(location.search);
  $('demoBar').hidden = !DEMO;
  if (me()) $('meBtn').textContent = '👤 ' + me();
  if (p.get('q')) $('q').value = p.get('q');
  load().then(() => { if (p.get('add')) chooseName(false, () => openEdit({ name: bare(p.get('add')), aliases: p.get('add') })); });
  fetchStaff();
})();
</script>
