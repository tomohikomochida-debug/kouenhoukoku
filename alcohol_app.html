<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アルコールチェック ｜ 庭乃持田園</title>
<style>
  :root{
    --paper:#F6F5F0; --card:#FFFFFF; --leaf:#214A37; --leaf-soft:#E5EDE7;
    --bark:#5B5750; --ink:#22231F; --tape:#C77C30; --line:#DCD9D0; --line-soft:#ECEAE3;
    --ok:#2E7D55; --danger:#B0533F; --field:#FBFAF6; --radius:10px;
    --shadow:0 1px 0 rgba(34,35,31,.04), 0 8px 24px -16px rgba(34,35,31,.25);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);
    font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif;
    line-height:1.65;-webkit-text-size-adjust:100%;}
  .tnum{font-variant-numeric:tabular-nums}

  header{position:sticky;top:0;z-index:30;background:var(--leaf);color:#fff;
    padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;
    box-shadow:0 2px 12px -6px rgba(0,0,0,.4);}
  .brand{display:flex;align-items:baseline;gap:10px;min-width:0}
  .brand .mark{font-size:13px;letter-spacing:.14em;opacity:.75;white-space:nowrap}
  .brand h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.02em;white-space:nowrap}
  .hd-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .hd-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
    border-radius:999px;padding:6px 12px;color:#fff;font-size:13px;cursor:pointer;font-family:inherit}
  .hd-btn:hover{background:rgba(255,255,255,.2)}
  .whoami{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 12px 5px 14px;
    color:#fff;font-size:14px;cursor:pointer;}
  .whoami:hover{background:rgba(255,255,255,.2)}
  .whoami b{font-weight:700}
  .whoami .sw{font-size:12px;opacity:.7}

  main{max-width:680px;margin:0 auto;padding:18px 14px 130px}
  .screen{display:none}.screen.on{display:block}

  .day-meta{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:4px}
  .field{display:flex;flex-direction:column;gap:6px}
  label,.lbl{font-size:13px;color:var(--bark);font-weight:600;letter-spacing:.02em}
  .hint{font-size:12px;color:var(--bark)}
  input[type=date],input[type=time],input[type=text],textarea,select{
    font-family:inherit;font-size:16px;color:var(--ink);background:var(--field);
    border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%;}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--leaf);outline-offset:1px;border-color:var(--leaf)}
  textarea{resize:vertical;min-height:56px}
  input[type=date]{max-width:175px}
  input[type=time]{max-width:130px}

  .sec-head{display:flex;align-items:center;gap:10px;margin:24px 2px 12px}
  .sec-head .tag{font-size:12px;font-weight:700;color:var(--tape);letter-spacing:.12em}
  .sec-head h2{font-size:15px;margin:0;font-weight:700}
  .sec-head .rule{flex:1;height:1px;background:var(--line)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px;margin-bottom:16px}

  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{font-size:15px;border:1px solid var(--line);background:#fff;border-radius:999px;
    padding:9px 16px;cursor:pointer;color:var(--ink);font-family:inherit}
  .chip:hover{border-color:var(--leaf)}
  .chip.on{background:var(--leaf);border-color:var(--leaf);color:#fff;font-weight:700}
  .pick .chip.on{background:var(--tape);border-color:var(--tape)}
  .chip.danger.on{background:var(--danger);border-color:var(--danger)}

  .addable{display:flex;gap:8px;margin-top:8px}
  .addable input{flex:1}
  .mini-btn{border:1px dashed var(--leaf);background:var(--leaf-soft);color:var(--leaf);
    border-radius:8px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
  .mini-btn:hover{background:#dbe6dd}

  .warnbox{display:none;background:#fbeeea;border:1px solid #e6c4ba;color:var(--danger);
    border-radius:8px;padding:11px 13px;font-size:14px;font-weight:600;margin-top:12px}
  .warnbox.on{display:block}

  .savebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(246,245,240,.94);
    backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:12px 14px;
    display:flex;gap:12px;align-items:center;justify-content:center}
  .savebar .sum{font-size:13px;color:var(--bark);flex:1;max-width:680px}
  .savebar .sum b{color:var(--leaf);font-size:16px}
  .save{background:var(--leaf);color:#fff;border:none;border-radius:10px;padding:14px 28px;
    font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 6px 16px -8px rgba(33,74,55,.7)}
  .save:hover{background:#1a3c2d}
  .save:disabled{opacity:.5;cursor:default;box-shadow:none}

  .overlay{position:fixed;inset:0;z-index:60;background:var(--leaf);display:flex;
    align-items:center;justify-content:center;padding:24px}
  .overlay .box{max-width:440px;width:100%;text-align:center;color:#fff}
  .overlay .mark{font-size:13px;letter-spacing:.16em;opacity:.7}
  .overlay h2{font-size:24px;margin:8px 0 4px;font-weight:800}
  .overlay p{font-size:14px;opacity:.8;margin:0 0 24px}
  .name-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .name-grid button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);
    color:#fff;border-radius:12px;padding:18px;font-size:18px;font-weight:700;cursor:pointer;font-family:inherit}
  .name-grid button:hover{background:rgba(255,255,255,.22)}

  .modal{position:fixed;inset:0;z-index:70;background:rgba(34,35,31,.55);display:none;
    align-items:flex-start;justify-content:center;padding:24px;overflow:auto}
  .modal.show{display:flex}
  .modal .sheet{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:22px;
    box-shadow:0 20px 60px -20px rgba(0,0,0,.5)}
  .modal h3{margin:0 0 10px;font-size:18px}
  .pv-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
  .pv-row .pl{width:96px;flex-shrink:0;color:var(--bark);font-weight:600;font-size:13px}
  .pv-row .pv{flex:1;white-space:pre-wrap;word-break:break-word}
  .pv-row .pv.bad{color:var(--danger);font-weight:700}
  .modal .note{font-size:13px;color:var(--bark);background:var(--field);border-radius:8px;padding:10px 12px;margin:14px 0}
  .modal .note.warn{color:var(--danger);background:#fbeeea}
  .modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
  .modal .acts button{border-radius:9px;padding:11px 20px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid var(--line);background:#fff}
  .modal .acts .primary{background:var(--leaf);color:#fff;border-color:var(--leaf)}

  /* draft banner */
  .draft{display:none;align-items:center;gap:10px;background:var(--leaf-soft);border:1px solid #cfe0d4;
    border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:13px;color:var(--leaf)}
  .draft.on{display:flex}
  .draft .d-btn{margin-left:auto;border:1px solid var(--leaf);background:#fff;color:var(--leaf);
    border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  .draft .d-x{border:none;background:none;color:var(--bark);font-size:18px;cursor:pointer;line-height:1}

  /* 一覧 */
  .list-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .list-bar .ttl{font-size:16px;font-weight:800;color:var(--leaf)}
  .list-bar .csv{margin-left:auto;border:1px solid var(--leaf);background:#fff;color:var(--leaf);
    border-radius:8px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
  .list-bar .csv:hover{background:var(--leaf-soft)}
  .day-group{margin-bottom:18px}
  .day-h{font-size:13px;font-weight:800;color:var(--bark);border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:8px}
  .rec{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
  .rec-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .rec-time{font-size:13px;color:var(--bark);font-variant-numeric:tabular-nums}
  .pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px}
  .pill.timing{background:var(--leaf-soft);color:var(--leaf)}
  .pill.ok{background:#e3f0e8;color:var(--ok)}
  .pill.bad{background:#fbeeea;color:var(--danger)}
  .rec-drivers{font-size:15px;font-weight:600}
  .rec-sub{font-size:13px;color:var(--bark);margin-top:3px;white-space:pre-wrap}
  .loading{text-align:center;color:var(--bark);padding:40px;font-size:14px}
  .empty{text-align:center;color:var(--bark);padding:30px;font-size:14px}

  @media(max-width:520px){.name-grid{grid-template-columns:1fr}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- 起動：確認者を選ぶ -->
<div class="overlay" id="overlay">
  <div class="box">
    <div class="mark">庭乃持田園</div>
    <h2>アルコールチェック</h2>
    <p>はじめに、確認する人（あなた）を選んでください</p>
    <div class="name-grid" id="nameGrid"></div>
  </div>
</div>

<header>
  <div class="brand"><span class="mark">庭乃持田園</span><h1>アルコールチェック</h1></div>
  <div class="hd-right">
    <button class="hd-btn" id="toList">📋 記録</button>
    <div class="whoami" id="whoami" title="確認者を変える"><b id="whoamiName">—</b><span class="sw">変更</span></div>
  </div>
</header>

<main>
  <!-- ========== 入力画面 ========== -->
  <section class="screen on" id="screenInput">

    <div class="draft" id="draftBanner">
      <span>書きかけの記録があります。</span>
      <button class="d-btn" id="draftRestore">続きから</button>
      <button class="d-x" id="draftDiscard" title="消す">×</button>
    </div>

    <div class="card">
      <div class="day-meta">
        <div class="field">
          <label for="cdate">確認した日</label>
          <input type="date" id="cdate">
        </div>
        <div class="field">
          <label for="ctime">時刻</label>
          <input type="time" id="ctime">
        </div>
      </div>
      <div class="field" style="margin-top:14px">
        <span class="lbl">区分</span>
        <div class="chips" id="timingChips"></div>
      </div>
    </div>

    <div class="sec-head"><span class="tag">運転者</span><h2>確認した運転者</h2><span class="rule"></span></div>
    <div class="card">
      <span class="hint">運転する人を選んでください（複数えらべます）</span>
      <div class="chips pick" id="driverChips" style="margin-top:10px"></div>
      <div class="addable">
        <input type="text" id="newDriver" placeholder="一覧に無い人を追加">
        <button class="mini-btn" id="addDriver">＋追加</button>
      </div>
    </div>

    <div class="sec-head"><span class="tag">確認</span><h2>確認のしかた・結果</h2><span class="rule"></span></div>
    <div class="card">
      <div class="field">
        <span class="lbl">アルコール検知器</span>
        <div class="chips" id="detectorChips"></div>
      </div>
      <div class="field" id="methodWrap" style="margin-top:14px;display:none">
        <label for="method">検知器を使わなかったときの確認方法</label>
        <span class="hint">どう確認したかを書いてください（例：対面で顔色・受け答え・におい・声を確認）</span>
        <textarea id="method" placeholder="例）対面で顔色と受け答え、においを確認"></textarea>
      </div>

      <div class="field" style="margin-top:16px">
        <span class="lbl">酒気帯び</span>
        <div class="chips" id="resultChips"></div>
      </div>
      <div class="warnbox" id="resultWarn">
        ⚠️ 酒気帯び「あり」です。運転させないでください。下に指示した内容を必ず記録してください。
      </div>
    </div>

    <div class="sec-head"><span class="tag">記録</span><h2>指示・メモ（任意）</h2><span class="rule"></span></div>
    <div class="card">
      <div class="field">
        <label for="instruct">指示事項</label>
        <textarea id="instruct" placeholder="運転者へ指示したことがあれば書いてください"></textarea>
      </div>
      <div class="field" style="margin-top:14px">
        <label for="other">その他必要な事項</label>
        <textarea id="other" placeholder="任意"></textarea>
      </div>
    </div>
  </section>

  <!-- ========== 一覧画面 ========== -->
  <section class="screen" id="screenList">
    <div class="list-bar">
      <span class="ttl">記録一覧</span>
      <button class="csv" id="csvBtn">⬇ CSVで書き出す</button>
    </div>
    <div id="listBody"><div class="loading">読み込み中…</div></div>
  </section>
</main>

<!-- 保存バー（入力画面のみ） -->
<div class="savebar" id="savebar">
  <div class="sum">運転者 <b id="sumDrivers">0</b> 人 ／ <span id="sumResult">酒気帯び なし</span></div>
  <button class="save" id="save">保存する</button>
</div>

<!-- 保存プレビュー -->
<div class="modal" id="modal">
  <div class="sheet">
    <h3>この内容で記録します</h3>
    <div id="previewBody"></div>
    <div class="note" id="previewNote"></div>
    <div class="acts">
      <button id="cancelSave">直す</button>
      <button class="primary" id="confirmSave">記録する</button>
    </div>
  </div>
</div>

<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbz2iP9eN-79vKTgOvfY6_Vd9rJZ9IMuz4ILkrxE79Muqq0pvTZAAhBG3cMXpZV6ZU1-/exec';

/* ===== 名簿（日報と連動：?action=masters の staff を使う。親方は除外） ===== */
let ROSTER = ['樋上','山口','甲斐','澤崎','荒木']; // 通信できないときの控え
async function loadRoster(){
  try{
    const res=await fetch(GAS_URL+'?action=masters');
    const m=await res.json();
    if(m && Array.isArray(m.staff) && m.staff.length){
      ROSTER = m.staff.filter(n=>n && n!=='親方');
    }
  }catch(e){ /* 控えのまま進む */ }
  // 端末で足した運転者を後ろに足す
  try{
    const extra=JSON.parse(localStorage.getItem('alcohol_custom_drivers')||'[]');
    extra.forEach(n=>{ if(n && !ROSTER.includes(n)) ROSTER.push(n); });
  }catch(e){}
}

/* ===== 状態 ===== */
let checker = '';
const TIMINGS=['業務前','業務後'];
const state = {
  timing:'業務前',
  drivers:[],
  detector:'使った',     // '使った' / '使ってない'
  result:'無',           // '無'(なし) / '有'(あり)
};

/* ===== 起動 ===== */
(async function init(){
  await loadRoster();
  buildOverlay();
  buildTimingChips();
  buildDriverChips();
  buildDetectorChips();
  buildResultChips();
  setNow();

  const saved=localStorage.getItem('alcohol_checker');
  if(saved && ROSTER.includes(saved)) setChecker(saved);

  // 下書き
  let dr=null; try{ dr=JSON.parse(localStorage.getItem('alcohol_draft')||'null'); }catch(e){}
  if(dr && dr.drivers && dr.drivers.length){ document.getElementById('draftBanner').classList.add('on'); }
})();

/* ===== 確認者（起動オーバーレイ） ===== */
function buildOverlay(){
  const grid=document.getElementById('nameGrid'); grid.innerHTML='';
  ROSTER.forEach(n=>{ const b=document.createElement('button'); b.textContent=n;
    b.onclick=()=>setChecker(n); grid.appendChild(b); });
}
function setChecker(n){
  checker=n;
  document.getElementById('whoamiName').textContent=n;
  document.getElementById('overlay').style.display='none';
  localStorage.setItem('alcohol_checker',n);
  buildDriverChips(); // 確認者を運転者候補から外す表示用に再描画
}
document.getElementById('whoami').onclick=()=>{
  document.getElementById('overlay').style.display='flex';
};

/* ===== 日時 ===== */
function setNow(){
  const d=new Date();
  const p=x=>String(x).padStart(2,'0');
  document.getElementById('cdate').value=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  document.getElementById('ctime').value=`${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ===== チップ群 ===== */
function buildTimingChips(){
  const c=document.getElementById('timingChips'); c.innerHTML='';
  TIMINGS.forEach(t=>{ const b=document.createElement('button');
    b.className='chip'+(state.timing===t?' on':''); b.textContent=t;
    b.onclick=()=>{ state.timing=t; buildTimingChips(); saveDraft(); };
    c.appendChild(b); });
}
function buildDriverChips(){
  const c=document.getElementById('driverChips'); c.innerHTML='';
  ROSTER.forEach(n=>{ const b=document.createElement('button');
    b.className='chip'+(state.drivers.includes(n)?' on':''); b.textContent=n;
    b.onclick=()=>{ const i=state.drivers.indexOf(n); if(i<0)state.drivers.push(n); else state.drivers.splice(i,1);
      b.classList.toggle('on'); updateSummary(); saveDraft(); };
    c.appendChild(b); });
}
document.getElementById('addDriver').onclick=()=>{
  const inp=document.getElementById('newDriver'); const v=inp.value.trim(); if(!v) return;
  if(!ROSTER.includes(v)){ ROSTER.push(v);
    try{ const ex=JSON.parse(localStorage.getItem('alcohol_custom_drivers')||'[]');
      if(!ex.includes(v)){ ex.push(v); localStorage.setItem('alcohol_custom_drivers',JSON.stringify(ex)); } }catch(e){}
  }
  if(!state.drivers.includes(v)) state.drivers.push(v);
  inp.value=''; buildDriverChips(); updateSummary(); saveDraft();
};
function buildDetectorChips(){
  const c=document.getElementById('detectorChips'); c.innerHTML='';
  [['使った','使った'],['使わなかった','使ってない']].forEach(([label,val])=>{
    const b=document.createElement('button');
    b.className='chip'+(state.detector===val?' on':''); b.textContent=label;
    b.onclick=()=>{ state.detector=val; buildDetectorChips();
      document.getElementById('methodWrap').style.display = (val==='使ってない')?'flex':'none';
      saveDraft(); };
    c.appendChild(b);
  });
}
function buildResultChips(){
  const c=document.getElementById('resultChips'); c.innerHTML='';
  [['なし（問題なし）','無',false],['あり','有',true]].forEach(([label,val,danger])=>{
    const b=document.createElement('button');
    b.className='chip'+(danger?' danger':'')+(state.result===val?' on':''); b.textContent=label;
    b.onclick=()=>{ state.result=val; buildResultChips();
      document.getElementById('resultWarn').classList.toggle('on', val==='有');
      updateSummary(); saveDraft(); };
    c.appendChild(b);
  });
}

/* ===== サマリー ===== */
function updateSummary(){
  document.getElementById('sumDrivers').textContent=state.drivers.length;
  document.getElementById('sumResult').textContent = state.result==='有' ? '⚠️ 酒気帯び あり' : '酒気帯び なし';
  document.getElementById('save').disabled = state.drivers.length===0;
}

/* ===== 下書き ===== */
function collectDraft(){
  return {
    date:document.getElementById('cdate').value, time:document.getElementById('ctime').value,
    timing:state.timing, drivers:[...state.drivers], detector:state.detector,
    method:document.getElementById('method').value, result:state.result,
    instruct:document.getElementById('instruct').value, other:document.getElementById('other').value
  };
}
function saveDraft(){ try{ if(!checker) return; localStorage.setItem('alcohol_draft',JSON.stringify(collectDraft())); }catch(e){} }
function clearDraft(){ localStorage.removeItem('alcohol_draft'); document.getElementById('draftBanner').classList.remove('on'); }
['method','instruct','other','cdate','ctime'].forEach(id=>{
  document.getElementById(id).addEventListener('input',saveDraft);
});
document.getElementById('draftRestore').onclick=()=>{
  let dr=null; try{ dr=JSON.parse(localStorage.getItem('alcohol_draft')||'null'); }catch(e){} if(!dr) return;
  if(dr.date) document.getElementById('cdate').value=dr.date;
  if(dr.time) document.getElementById('ctime').value=dr.time;
  state.timing=dr.timing||'業務前';
  state.drivers=Array.isArray(dr.drivers)?dr.drivers:[];
  state.detector=dr.detector||'使った';
  state.result=dr.result||'無';
  dr.drivers.forEach(n=>{ if(!ROSTER.includes(n)) ROSTER.push(n); });
  document.getElementById('method').value=dr.method||'';
  document.getElementById('instruct').value=dr.instruct||'';
  document.getElementById('other').value=dr.other||'';
  document.getElementById('methodWrap').style.display=(state.detector==='使ってない')?'flex':'none';
  document.getElementById('resultWarn').classList.toggle('on', state.result==='有');
  buildTimingChips(); buildDriverChips(); buildDetectorChips(); buildResultChips(); updateSummary();
  document.getElementById('draftBanner').classList.remove('on');
};
document.getElementById('draftDiscard').onclick=()=>clearDraft();

/* ===== 保存プレビュー ===== */
function whenStr(){
  const d=document.getElementById('cdate').value, t=document.getElementById('ctime').value||'00:00';
  return d.replace(/-/g,'/')+' '+t; // YYYY/MM/DD HH:mm（CSVと同じ形）
}
document.getElementById('save').onclick=()=>{
  if(state.drivers.length===0){ alert('運転者を選んでください'); return; }
  const pb=document.getElementById('previewBody');
  const detLabel = state.detector==='使った' ? '使った' : '使わなかった';
  const resLabel = state.result==='有' ? '⚠️ あり' : 'なし（問題なし）';
  const rows=[
    ['確認者',checker],
    ['日時',whenStr()+'（'+state.timing+'）'],
    ['運転者',state.drivers.join('、')],
    ['検知器',detLabel],
  ];
  if(state.detector==='使ってない') rows.push(['確認方法',document.getElementById('method').value||'（未記入）']);
  rows.push(['酒気帯び',resLabel,state.result==='有']);
  const ins=document.getElementById('instruct').value.trim();
  const oth=document.getElementById('other').value.trim();
  if(ins) rows.push(['指示事項',ins]);
  if(oth) rows.push(['その他',oth]);
  pb.innerHTML=rows.map(r=>`<div class="pv-row"><span class="pl">${r[0]}</span><span class="pv${r[2]?' bad':''}">${esc(r[1])}</span></div>`).join('');

  const note=document.getElementById('previewNote');
  let msg='', warn=false;
  if(state.result==='有'){ msg='酒気帯び「あり」で記録します。運転させないでください。'; warn=true; }
  else if(state.detector==='使ってない' && !document.getElementById('method').value.trim()){ msg='検知器を使っていません。確認方法を書くことをおすすめします。'; warn=true; }
  else { msg='この内容でよければ「記録する」を押してください。'; }
  note.textContent=msg; note.className='note'+(warn?' warn':'');
  document.getElementById('modal').classList.add('show');
};
document.getElementById('cancelSave').onclick=()=>document.getElementById('modal').classList.remove('show');

document.getElementById('confirmSave').onclick=async()=>{
  const btn=document.getElementById('confirmSave'); btn.disabled=true; btn.textContent='記録中…';
  const row={
    checker, when:whenStr(), timing:state.timing,
    drivers:state.drivers.join('\n'),
    detector:state.detector,
    method:state.detector==='使ってない'?document.getElementById('method').value:'',
    result:state.result,
    instruct:document.getElementById('instruct').value,
    other:document.getElementById('other').value
  };
  try{
    const res=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({app:'alcohol',row})});
    const j=await res.json();
    if(!j.ok) throw new Error(j.error||'save failed');
    clearDraft(); resetForm();
    document.getElementById('modal').classList.remove('show');
    alert('記録しました。');
  }catch(e){
    alert('通信エラーで記録できませんでした。電波を確認して、もう一度お試しください。\n（書きかけは残っています）');
  }
  btn.disabled=false; btn.textContent='記録する';
};
function resetForm(){
  state.timing='業務前'; state.drivers=[]; state.detector='使った'; state.result='無';
  document.getElementById('method').value=''; document.getElementById('instruct').value=''; document.getElementById('other').value='';
  document.getElementById('methodWrap').style.display='none';
  document.getElementById('resultWarn').classList.remove('on');
  setNow();
  buildTimingChips(); buildDriverChips(); buildDetectorChips(); buildResultChips(); updateSummary();
}

/* ===== 一覧 ===== */
let listCache=[];
document.getElementById('toList').onclick=()=>{ showList(); };
document.getElementById('whoami').addEventListener('dblclick',()=>{}); // noop
function showInput(){
  document.getElementById('screenInput').classList.add('on');
  document.getElementById('screenList').classList.remove('on');
  document.getElementById('savebar').style.display='flex';
  document.getElementById('toList').textContent='📋 記録';
}
function showList(){
  document.getElementById('screenInput').classList.remove('on');
  document.getElementById('screenList').classList.add('on');
  document.getElementById('savebar').style.display='none';
  const btn=document.getElementById('toList'); btn.textContent='✏️ 入力にもどる';
  btn.onclick=()=>{ showInput(); btn.onclick=showList; };
  loadList();
}
async function loadList(){
  const body=document.getElementById('listBody');
  body.innerHTML='<div class="loading">読み込み中…</div>';
  try{
    const res=await fetch(GAS_URL+'?action=alcohol_list&limit=120');
    const j=await res.json();
    if(!j.ok) throw new Error(j.error||'load failed');
    listCache=j.records||[];
    renderList(listCache);
  }catch(e){
    body.innerHTML='<div class="empty">読み込みに失敗しました。<br>電波を確認して、もう一度お試しください。</div>';
  }
}
function renderList(records){
  const body=document.getElementById('listBody');
  if(!records.length){ body.innerHTML='<div class="empty">まだ記録がありません。</div>'; return; }
  // 日付でグループ（新しい順）
  const groups={};
  records.forEach(r=>{ const day=(r['作成日時']||'').split(' ')[0]||'（日付なし）';
    (groups[day]=groups[day]||[]).push(r); });
  const days=Object.keys(groups).sort((a,b)=>b.localeCompare(a));
  body.innerHTML=days.map(day=>{
    const items=groups[day].map(r=>{
      const time=((r['作成日時']||'').split(' ')[1])||'';
      const drivers=(r['運転者']||'').split('\n').filter(Boolean).join('、');
      const bad=(r['酒気帯びの有無']||'')==='有';
      const timing=r['区分']||'';
      const det=r['アルコール検知器の使用有無']||'';
      const ins=r['指示事項']||''; const oth=r['その他必要な事項']||''; const mth=r['検知器を使ってない場合の確認方法']||'';
      let sub=`確認者：${esc(r['確認者']||'')}　／　検知器：${esc(det||'—')}`;
      const extra=[ins&&('指示：'+ins), mth&&('確認方法：'+mth), oth&&('その他：'+oth)].filter(Boolean).join('\n');
      return `<div class="rec">
        <div class="rec-top">
          <span class="rec-time">${esc(time)}</span>
          ${timing?`<span class="pill timing">${esc(timing)}</span>`:''}
          <span class="pill ${bad?'bad':'ok'}">${bad?'⚠️ 酒気帯びあり':'問題なし'}</span>
        </div>
        <div class="rec-drivers">${esc(drivers||'—')}</div>
        <div class="rec-sub">${esc(sub)}${extra?('\n'+esc(extra)):''}</div>
      </div>`;
    }).join('');
    return `<div class="day-group"><div class="day-h">${esc(day)}</div>${items}</div>`;
  }).join('');
}

/* ===== CSV書き出し（Excelで開ける UTF-8 BOM） ===== */
document.getElementById('csvBtn').onclick=()=>{
  if(!listCache.length){ alert('書き出す記録がありません。'); return; }
  const cols=['作成日時','確認者','運転者','アルコール検知器の使用有無','酒気帯びの有無',
    '区分','指示事項','その他必要な事項','検知器を使ってない場合の確認方法','レコード番号'];
  const esc2=v=>{ v=(v==null?'':String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const lines=[cols.join(',')];
  listCache.forEach(r=>lines.push(cols.map(c=>esc2(r[c])).join(',')));
  const blob=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  const d=new Date(); const p=x=>String(x).padStart(2,'0');
  a.download=`アルコールチェック記録_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
};

/* ===== util ===== */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

document.getElementById('toList').onclick=showList;
updateSummary();
</script>
