<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>経費・財布 — 庭乃持田園</title>
<style>
:root{
  --paper:#F6F5F0; --card:#FFFFFF; --leaf:#214A37; --leaf-soft:#E5EDE7;
  --ok:#2E7D55; --tape:#C77C30; --bark:#5B5750; --ink:#22231F;
  --line:#DCD9D0; --field:#FBFAF6; --danger:#B0533F; --radius:10px;
  --shadow:0 1px 0 rgba(34,35,31,.04), 0 8px 24px -16px rgba(34,35,31,.25);
}
*{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink);
  font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif;}
.tnum{font-variant-numeric:tabular-nums}
.hd{background:var(--leaf); color:#fff; padding:14px 16px; position:sticky; top:0; z-index:5}
.hd-t{font-size:17px; font-weight:700}
.month{display:flex; align-items:center; justify-content:center; gap:14px; margin-top:8px}
.month button{background:rgba(255,255,255,.15); color:#fff; border:none; width:34px; height:34px; border-radius:50%; font-size:18px; cursor:pointer}
.month .lbl{font-size:16px; font-weight:700; min-width:120px; text-align:center}
.closed-tag{font-size:11px; background:var(--tape); padding:2px 7px; border-radius:6px; margin-left:6px}
.main{max-width:680px; margin:0 auto; padding:14px 12px 60px}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-bottom:14px}
.col{display:flex; flex-direction:column; gap:10px}
.btn{border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:var(--radius); padding:12px 16px; font-size:15px; font-weight:600; cursor:pointer; width:100%}
.btn.sm{padding:8px 12px; font-size:13px; width:auto}
.btn.big{padding:16px; font-size:16px}
.btn.primary{background:var(--leaf); border-color:var(--leaf); color:#fff}
.btn.ghost{background:var(--field)}
.btn:disabled{opacity:.5}
.or{text-align:center; color:var(--bark); font-size:12px}
.note{font-size:12px; color:var(--bark); margin:4px 0 0; text-align:center}
.warn{background:#fbece8; color:var(--danger); border-radius:8px; padding:10px; font-size:13px}
.video{width:100%; max-height:48vh; border-radius:10px; background:#000; aspect-ratio:3/4; object-fit:cover}
.cam-row{display:flex; align-items:center; justify-content:center; gap:16px; margin-top:8px}
.shutter{width:64px; height:64px; border-radius:50%; background:#fff; border:5px solid var(--leaf); cursor:pointer}
.shutter:active{transform:scale(.94)}
.cam-actions{display:flex; gap:8px; margin-top:10px}
.cam-actions .btn{flex:1}
.list{display:flex; flex-direction:column; gap:10px; margin-bottom:14px}
.rc{display:flex; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:10px}
.thumb{width:60px; height:80px; object-fit:cover; border-radius:6px; flex:0 0 auto; background:#eee}
.rc-body{flex:1; min-width:0}
.reading{color:var(--bark); font-size:14px; padding:14px 2px}
.err{color:var(--danger); font-size:14px; font-weight:700}
.errmsg{color:var(--bark); font-size:12px; margin:4px 0 8px; word-break:break-word}
.err-btns{display:flex; gap:8px; flex-wrap:wrap}
.store-in{width:100%; display:block; margin-bottom:8px; font-size:16px; border:none; border-bottom:1px solid var(--line); background:transparent; font-weight:700; padding:2px 0}
.amt-box{display:flex; align-items:center; gap:8px; background:var(--field); border:1px solid var(--line); border-radius:8px; padding:8px 12px; margin-bottom:8px}
.amt-lbl{font-size:12px; color:var(--bark); flex:0 0 auto}
.yen-pre{color:var(--bark); font-weight:700}
.amt-big{flex:1; min-width:0; text-align:right; border:none; background:transparent; font-size:22px; font-weight:800; color:var(--ink); padding:0}
.date-in{width:96px; border:none; border-bottom:1px solid var(--line); background:transparent; font-size:12px; color:var(--bark); padding:2px 0}
input:focus{outline:none; border-bottom-color:var(--leaf)}
.meta{display:flex; gap:8px; flex-wrap:wrap; font-size:12px; color:var(--bark); margin:4px 0 8px; align-items:center}
.items{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{border:1px solid var(--line); background:var(--field); color:var(--bark); border-radius:999px; padding:5px 10px; font-size:12.5px; cursor:pointer}
.chip.on{font-weight:700; color:#fff}
.pay-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:10px}
.pay-lbl{font-size:12px; color:var(--bark)}
.pay-chip{border:1px solid var(--line); background:#fff; color:var(--bark); border-radius:8px; padding:5px 12px; font-size:13px; cursor:pointer}
.pay-chip.on{background:var(--leaf); border-color:var(--leaf); color:#fff; font-weight:700}
.who-in{border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:13px; background:var(--field); min-width:120px}
.why-row{display:flex; align-items:center; gap:8px; margin-top:8px; font-size:12px; color:var(--bark)}
.check{background:var(--tape); color:#fff; border-radius:6px; padding:2px 7px; font-weight:700}
.settled{background:var(--leaf-soft); color:var(--ok); border-radius:6px; padding:2px 7px; font-weight:700}
.why{flex:1}
.del{margin-left:auto; background:none; border:none; color:var(--danger); font-size:12px; cursor:pointer}
.sum-h{font-weight:700; margin-bottom:10px}
.sum-row{display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px dashed var(--line)}
.dot{width:10px; height:10px; border-radius:50%; flex:0 0 auto}
.sum-cat{flex:1; font-size:14px}
.sum-amt{font-weight:600}
.sum-total{display:flex; justify-content:space-between; font-weight:700; padding:10px 0; font-size:15px}
.fl{display:block; font-size:13px; color:var(--bark); margin:10px 0 4px}
.inp{width:100%; border:1px solid var(--line); background:var(--field); border-radius:8px; padding:11px; font-size:16px; margin-top:4px}
.inj-add{display:flex; gap:8px; margin-top:10px}
.inj-add .inp{margin-top:0}
.inj-add .btn{flex:0 0 auto}
.inj-row{display:flex; align-items:center; gap:8px; padding:4px 0; font-size:12.5px; color:var(--bark)}
.inj-in{width:110px; border:none; border-bottom:1px solid var(--line); background:transparent; font-size:15px; font-weight:600; color:var(--ink); padding:2px 0}
.inj-del{margin-left:auto; background:none; border:none; color:var(--danger); font-size:12px; cursor:pointer}
.inj-sum{font-weight:600; margin-top:4px; font-size:13px; color:var(--ink)}
.bal{display:flex; justify-content:space-between; align-items:baseline; margin-top:14px; padding-top:12px; border-top:2px solid var(--leaf-soft)}
.big-amt{font-size:22px; font-weight:800; color:var(--leaf)}
.bal-note{font-size:11.5px; color:var(--bark); margin-top:2px}
.diff{margin-top:10px; padding:10px; border-radius:8px; font-weight:700; font-size:14px; text-align:center}
.diff.ok{background:var(--leaf-soft); color:var(--ok)}
.diff.ng{background:#fbece8; color:var(--danger)}
.owed{border-color:var(--tape)}
.owed-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line)}
.owed-name{flex:1; font-weight:600; font-size:14px}
.owed-amt{font-weight:700}
.owed-total{display:flex; justify-content:space-between; font-weight:700; padding:10px 0 4px}
.close-card{border-color:var(--leaf)}
.foot{font-size:12px; color:var(--bark); text-align:center; margin-top:8px; line-height:1.6}
.loading{text-align:center; color:var(--bark); padding:24px; font-size:14px}
.toast{position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .2s; z-index:20}
.toast.show{opacity:.95}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>
<header class="hd">
  <div class="hd-t">経費・財布</div>
  <div class="month">
    <button id="prevM" aria-label="前の月">‹</button>
    <span class="lbl" id="monthLbl">―</span>
    <button id="nextM" aria-label="次の月">›</button>
  </div>
</header>

<main class="main">
  <section class="card" id="captureCard">
    <div class="col" id="captureIdle">
      <button class="btn primary big" id="pickFile">📷 レシートを撮る・選ぶ（複数OK）</button>
      <input id="fileInput" type="file" accept="image/*" capture="environment" multiple hidden>
      <div id="camWarn"></div>
      <button class="btn ghost" id="manualAdd">手入力で1件追加</button>
      <p class="note">撮った写真がくっきりしているほど、よく読み取れます。何枚でもまとめて選べます。</p>
    </div>
  </section>

  <div id="loading" class="loading">読み込み中…</div>
  <section class="list" id="pendingList"></section>
  <section class="list" id="recList"></section>

  <section class="card" id="sumCard" hidden>
    <div class="sum-h">費目別の集計（すべての支払い）</div>
    <div id="sumRows"></div>
    <div class="sum-total"><span>経費合計</span><span class="tnum" id="sumTotal">¥0</span></div>
  </section>

  <section class="card" id="walletCard" hidden>
    <div class="sum-h">財布（現金・受け渡し1個）</div>
    <div class="bal-note" id="openingNote"></div>
    <div class="inj-add">
      <input class="inp tnum" id="injAmt" inputmode="numeric" placeholder="社長が入れた額">
      <button class="btn primary sm" id="addInj">＋入金</button>
    </div>
    <div class="inj-list" id="injList"></div>
    <div class="bal"><span>財布の現金残高</span><span class="tnum big-amt" id="balance">¥0</span></div>
    <div class="bal-note" id="balNote"></div>
    <label class="fl">月末に数えた現金
      <input class="inp tnum" id="counted" inputmode="numeric" placeholder="数えた額">
    </label>
    <div id="diffBox"></div>
  </section>

  <section class="card owed" id="owedCard" hidden>
    <div class="sum-h">立て替え 未清算（財布から返す）</div>
    <div id="owedRows"></div>
    <div class="owed-total"><span>未清算 合計</span><span class="tnum" id="owedTotal">¥0</span></div>
    <p class="note">「清算する」を押すと、その分が財布の現金残高から引かれます。</p>
  </section>

  <section class="card close-card" id="closeCard" hidden>
    <div class="sum-h">月締め</div>
    <p class="note" style="text-align:left">この月を締めると、いまの現金残高が翌月の「月初の残り」に繰り越されます。未清算の立て替えは翌月に残ります。</p>
    <button class="btn primary" id="closeBtn" style="margin-top:10px">この月を締めて翌月へ繰り越す</button>
    <div id="closedInfo"></div>
  </section>

  <datalist id="staffList"></datalist>
  <p class="foot">庭乃持田園 経費・財布アプリ</p>
</main>

<div class="toast" id="toast"></div>

<script>
/* ===== 設定：デプロイした GAS の URL をここに貼る ===== */
const GAS_URL = "https://script.google.com/macros/s/AKfycbyxxtzrbYhoU0JxQ3BUk3SlQWbmo0ytKt3v--i069kC0kho-u2t3amxoZZLr2ucslAGkg/exec";

const CATS = [
  {key:"車両費",c:"#214A37"},{key:"材料費",c:"#2E7D55"},{key:"消耗品費",c:"#C77C30"},
  {key:"設備費",c:"#5B5750"},{key:"処分費",c:"#7a5b3a"},{key:"交通費",c:"#3a6ea5"},
  {key:"福利厚生費",c:"#8a6d3b"},{key:"雑費",c:"#9a9a9a"}
];
const CAT_C = Object.fromEntries(CATS.map(x=>[x.key,x.c]));
const PAYS=[{key:"cash",label:"財布"},{key:"advance",label:"立て替え"},{key:"card",label:"カード"}];
const PAY_LBL={cash:"財布",advance:"立替",card:"カード"};
const yen=n=>"¥"+(Number(n)||0).toLocaleString("ja-JP");
const $=id=>document.getElementById(id);

let ym = (function(){ const d=new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2); })();
let state = {opening:0, counted:"", closed:false, records:[], injections:[]};
let pending = []; // {tempId, thumb, b64, status, errMsg}
let staff = JSON.parse(localStorage.getItem("keihi_staff")||"[]");
let stream=null, tempSeq=1;

/* こまめな自動保存（入力中も保存。月移動の直前に必ず流し込む） */
const pendingSaves={};
function scheduleSave(key, fn){
  if(pendingSaves[key]) clearTimeout(pendingSaves[key].t);
  pendingSaves[key]={fn, t:setTimeout(()=>{ delete pendingSaves[key]; fn(); }, 600)};
}
async function flushSaves(){
  for(const k of Object.keys(pendingSaves)){
    const p=pendingSaves[k]; clearTimeout(p.t); delete pendingSaves[k];
    try{ await p.fn(); }catch(e){}
  }
}
function saveRecAll(id){ const r=rec(id); if(!r) return; return saveRec(id,{store:r.store,amount:r.amount,date:r.date,who:r.who}); }

/* ===== API ===== */
async function apiGet(params){
  const url=GAS_URL+"?"+new URLSearchParams(params).toString();
  const res=await fetch(url); return res.json();
}
async function apiPost(body){
  const res=await fetch(GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
  return res.json();
}
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); }
function commErr(){ toast("電波を確認して、もう一度お試しください"); }

/* ===== 読み込み ===== */
async function load(){
  $("loading").style.display="block";
  $("monthLbl").innerHTML = ym.split("-")[0]+"年"+(+ym.split("-")[1])+"月";
  try{
    const d=await apiGet({action:"month", ym});
    if(!d.ok) throw new Error(d.error||"err");
    state={opening:d.opening, counted:d.counted, closed:d.closed, records:d.records, injections:d.injections};
    if(d.closed) $("monthLbl").innerHTML += '<span class="closed-tag">締め済</span>';
  }catch(e){ commErr(); }
  $("loading").style.display="none";
  renderAll();
}

/* ===== 集計 ===== */
function calc(){
  const t={}; CATS.forEach(c=>t[c.key]=0);
  let all=0; state.records.forEach(r=>{ if(r.category)t[r.category]+=r.amount; all+=r.amount; });
  const cash=state.records.filter(r=>r.pay==="cash").reduce((s,r)=>s+r.amount,0);
  const sAdv=state.records.filter(r=>r.pay==="advance"&&r.settled).reduce((s,r)=>s+r.amount,0);
  const inj=state.injections.reduce((s,x)=>s+x.amount,0);
  const balance=state.opening+inj-cash-sAdv;
  const owed={}; state.records.filter(r=>r.pay==="advance"&&!r.settled).forEach(r=>{const k=r.who||"（名前なし）"; owed[k]=(owed[k]||0)+r.amount;});
  return {t, all, cash, sAdv, inj, balance, owed};
}

/* ===== 描画 ===== */
function renderAll(){ renderStaff(); renderPending(); renderList(); renderSummary(); renderWallet(); renderOwed(); renderClose(); }

function renderStaff(){ $("staffList").innerHTML = staff.map(n=>`<option value="${esc(n)}">`).join(""); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function chipsHTML(r){
  return CATS.map(c=>`<button class="chip ${r.category===c.key?"on":""}" data-act="cat" data-id="${r.id}" data-v="${c.key}" style="${r.category===c.key?`background:${c.c};border-color:${c.c}`:""}">${c.key}</button>`).join("");
}
function payHTML(r){
  let h=`<span class="pay-lbl">支払い</span>`+PAYS.map(p=>`<button class="pay-chip ${r.pay===p.key?"on":""}" data-act="pay" data-id="${r.id}" data-v="${p.key}">${p.label}</button>`).join("");
  if(r.pay==="advance") h+=`<input class="who-in" list="staffList" data-act="who" data-id="${r.id}" value="${esc(r.who||"")}" placeholder="立て替えた人">`;
  return h;
}
function recCardHTML(r){
  return `<div class="rc"><div class="rc-body">
    <input class="store-in" data-act="store" data-id="${r.id}" value="${esc(r.store||"")}" placeholder="店名">
    <div class="amt-box"><span class="amt-lbl">金額</span><span class="yen-pre">¥</span>
      <input class="amt-big tnum" data-act="amt" data-id="${r.id}" inputmode="numeric" value="${r.amount||""}" placeholder="0"></div>
    <div class="meta"><input class="date-in" data-act="date" data-id="${r.id}" value="${esc(r.date||"")}" placeholder="日付 例 6/9">
      ${r.items&&r.items.length?`<span class="items">${esc(r.items.slice(0,4).join("・"))}</span>`:""}</div>
    <div class="chips">${chipsHTML(r)}</div>
    <div class="pay-row">${payHTML(r)}</div>
    <div class="why-row">${r.why?`<span class="why">${esc(r.why)}</span>`:`<span class="why"></span>`}
      ${r.pay==="advance"&&r.settled?`<span class="settled">清算済</span>`:""}
      <button class="del" data-act="delrec" data-id="${r.id}">削除</button></div>
  </div></div>`;
}
function renderList(){ $("recList").innerHTML = state.records.map(recCardHTML).join(""); }

function renderPending(){
  $("pendingList").innerHTML = pending.map(p=>{
    let inner;
    if(p.status==="reading") inner=`<div class="reading">読み取り中…</div>`;
    else inner=`<div class="err">読み取れませんでした</div><div class="errmsg">${esc(p.errMsg||"")}</div>
      <div class="err-btns">
        <button class="btn ghost sm" data-act="retry" data-tid="${p.tempId}">もう一度</button>
        <button class="btn ghost sm" data-act="pmanual" data-tid="${p.tempId}">手入力する</button>
        <button class="btn ghost sm" data-act="pdel" data-tid="${p.tempId}">消す</button>
      </div>`;
    return `<div class="rc">${p.thumb?`<img class="thumb" src="${p.thumb}">`:""}<div class="rc-body">${inner}</div></div>`;
  }).join("");
}

function renderSummary(){
  const {t,all}=calc();
  const show=CATS.filter(c=>t[c.key]>0);
  $("sumCard").hidden = state.records.length===0;
  $("sumRows").innerHTML = show.map(c=>`<div class="sum-row"><span class="dot" style="background:${c.c}"></span><span class="sum-cat">${c.key}</span><span class="sum-amt tnum">${yen(t[c.key])}</span></div>`).join("");
  $("sumTotal").textContent=yen(all);
}

function renderWallet(){
  const {cash,sAdv,inj,balance}=calc();
  $("walletCard").hidden=false;
  $("openingNote").textContent="月初の残り（繰越） "+yen(state.opening);
  $("injList").innerHTML = state.injections.map((x,i)=>`<div class="inj-row"><span>入金${i+1}</span><span class="yen-pre">¥</span>
    <input class="inj-in tnum" data-act="injedit" data-id="${x.id}" inputmode="numeric" value="${x.amount||""}">
    <button class="inj-del" data-act="injdel" data-id="${x.id}">取り消し</button></div>`).join("")
    + (state.injections.length?`<div class="inj-sum">入金 計 ${yen(inj)}</div>`:"");
  $("balance").textContent=yen(balance);
  $("balNote").textContent=`月初 ${yen(state.opening)} ＋入金 ${yen(inj)} −現金払い ${yen(cash)} −立替清算 ${yen(sAdv)}`;
  if($("counted")!==document.activeElement) $("counted").value = state.counted===""?"":state.counted;
  const cnt = state.counted===""?null:Number(state.counted);
  const diff = cnt===null?null:cnt-balance;
  $("diffBox").innerHTML = diff===null?"":
    `<div class="diff ${diff===0?"ok":"ng"}">${diff===0?"✓ 帳簿とぴったり合っています":`差額 ${yen(Math.abs(diff))}（${diff>0?"現金が多い":"現金が足りない"}）`}</div>`;
}

function renderOwed(){
  const {owed}=calc();
  const list=Object.entries(owed).filter(([,v])=>v>0);
  $("owedCard").hidden=list.length===0;
  $("owedRows").innerHTML=list.map(([n,v])=>`<div class="owed-row"><span class="owed-name">${esc(n)}</span><span class="owed-amt tnum">${yen(v)}</span><button class="btn primary sm" data-act="settle" data-who="${esc(n)}">清算する</button></div>`).join("");
  $("owedTotal").textContent=yen(list.reduce((s,[,v])=>s+v,0));
}

function renderClose(){
  $("closeCard").hidden = state.records.length===0 && state.injections.length===0;
  $("closeBtn").disabled = state.closed;
  $("closedInfo").innerHTML = state.closed?`<div class="diff ok" style="margin-top:10px">この月は締め済みです</div>`:"";
}

/* ===== 操作（イベント委譲） ===== */
document.addEventListener("click", async (e)=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act, id=b.dataset.id;
  if(act==="cat"){ await editRec(id,{category:b.dataset.v}); }
  else if(act==="pay"){ const patch={pay:b.dataset.v}; if(b.dataset.v!=="advance") patch.settled=false; await editRec(id,patch); }
  else if(act==="delrec"){ await delRec(id); }
  else if(act==="injdel"){ await injDel(id); }
  else if(act==="settle"){ await settle(b.dataset.who); }
  else if(act==="retry"){ const p=pending.find(x=>x.tempId==b.dataset.tid); if(p){p.status="reading";renderPending();analyze(p);} }
  else if(act==="pmanual"){ const p=pending.find(x=>x.tempId==b.dataset.tid); pending=pending.filter(x=>x!==p); renderPending(); await addManual(); }
  else if(act==="pdel"){ pending=pending.filter(x=>x.tempId!=b.dataset.tid); renderPending(); }
});

// テキスト系：入力中はstate更新のみ、確定(blur)でサーバ保存
document.addEventListener("input",(e)=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act, id=b.dataset.id;
  if(act==="amt"){ const r=rec(id); if(r){r.amount=Number(b.value.replace(/[^\d]/g,""))||0; renderSummary(); renderWallet(); renderOwed(); scheduleSave("rec:"+id, ()=>saveRecAll(id));} }
  else if(act==="store"){ const r=rec(id); if(r){ r.store=b.value; scheduleSave("rec:"+id, ()=>saveRecAll(id)); } }
  else if(act==="date"){ const r=rec(id); if(r){ r.date=b.value; scheduleSave("rec:"+id, ()=>saveRecAll(id)); } }
  else if(act==="who"){ const r=rec(id); if(r){r.who=b.value; renderOwed(); scheduleSave("rec:"+id, ()=>saveRecAll(id));} }
  else if(act==="injedit"){ const x=inj(id); if(x){x.amount=Number(b.value.replace(/[^\d]/g,""))||0; renderWallet(); scheduleSave("inj:"+id, ()=>apiPost({mode:"updateInjection",id,amount:inj(id).amount}).catch(commErr));} }
  else if(b.id==="counted"){ state.counted=b.value===""?"":Number(b.value.replace(/[^\d]/g,"")); renderWallet(); }
});
document.addEventListener("change", async (e)=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act, id=b.dataset.id;
  if(act==="amt"){ await saveRec(id,{amount:rec(id).amount}); }
  else if(act==="store"){ await saveRec(id,{store:rec(id).store}); }
  else if(act==="date"){ await saveRec(id,{date:rec(id).date}); }
  else if(act==="who"){ rememberStaff(rec(id).who); await saveRec(id,{who:rec(id).who}); }
  else if(act==="injedit"){ await apiPost({mode:"updateInjection",id,amount:inj(id).amount}).catch(commErr); }
},true);

function rec(id){ return state.records.find(r=>String(r.id)===String(id)); }
function inj(id){ return state.injections.find(x=>String(x.id)===String(id)); }
function rememberStaff(n){ if(n&&!staff.includes(n)){ staff.push(n); localStorage.setItem("keihi_staff",JSON.stringify(staff)); renderStaff(); } }

async function editRec(id,patch){ const r=rec(id); if(!r)return; Object.assign(r,patch); renderAll(); await saveRec(id,patch); }
async function saveRec(id,patch){ try{ const d=await apiPost({mode:"updateRecord",id,patch}); if(!d.ok) throw 0; }catch(e){ commErr(); } }
async function delRec(id){ state.records=state.records.filter(r=>String(r.id)!==String(id)); renderAll(); try{ await apiPost({mode:"deleteRecord",id}); }catch(e){ commErr(); } }

async function injDel(id){ state.injections=state.injections.filter(x=>String(x.id)!==String(id)); renderWallet(); try{ await apiPost({mode:"deleteInjection",id}); }catch(e){ commErr(); } }

$("addInj").onclick=async ()=>{
  const a=Number($("injAmt").value.replace(/[^\d]/g,"")); if(!a) return;
  $("injAmt").value="";
  try{ const d=await apiPost({mode:"addInjection",ym,amount:a}); if(!d.ok)throw 0; state.injections.push({id:d.id,amount:a}); renderWallet(); }
  catch(e){ commErr(); }
};
$("counted").addEventListener("change",async ()=>{
  // 月末の数えた現金は月締め時に保存。ここでは表示計算のみ（締めると保存される）
});

async function settle(who){
  state.records.forEach(r=>{ if(r.pay==="advance"&&!r.settled&&(r.who||"（名前なし）")===who) r.settled=true; });
  renderAll();
  try{ await apiPost({mode:"settle",ym,who:who==="（名前なし）"?"":who}); }catch(e){ commErr(); }
}

/* ===== 追加（手入力／撮影） ===== */
async function addManual(){
  try{
    const d=await apiPost({mode:"addRecord",row:{ym,pay:"cash"}});
    if(!d.ok)throw 0;
    state.records.unshift({id:d.id,ym,date:"",category:"",store:"",items:[],amount:0,pay:"cash",who:"",settled:false});
    renderAll();
  }catch(e){ commErr(); }
}
$("manualAdd").onclick=addManual;

$("pickFile").onclick=()=>$("fileInput").click();
$("fileInput").onchange=(e)=>{ Array.from(e.target.files||[]).forEach(f=>{ const r=new FileReader(); r.onload=()=>addPhoto(r.result); r.readAsDataURL(f); }); e.target.value=""; };

function compress(dataUrl,maxW=1280,q=0.82){
  return new Promise(res=>{ const img=new Image(); img.onload=()=>{ const sc=Math.min(1,maxW/img.width); const cv=document.createElement("canvas"); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); const o=cv.toDataURL("image/jpeg",q); res({thumb:o,b64:o.split(",")[1]}); }; img.src=dataUrl; });
}
async function addPhoto(dataUrl){
  const {thumb,b64}=await compress(dataUrl);
  const p={tempId:tempSeq++, thumb, b64, status:"reading", errMsg:""};
  pending.unshift(p); renderPending(); analyze(p);
}
async function analyze(p){
  try{
    const d=await apiPost({mode:"analyze",image:p.b64});
    if(!d.ok) throw new Error(d.error||"読み取り失敗");
    const j=d.data;
    const add=await apiPost({mode:"addRecord",row:{ym,date:j.date,category:j.category,store:j.store,items:j.items,amount:j.total,pay:j.pay,who:"",settled:false}});
    if(!add.ok) throw new Error("保存に失敗しました");
    pending=pending.filter(x=>x!==p); renderPending();
    state.records.unshift({id:add.id,ym,date:j.date,category:j.category,store:j.store,items:j.items,amount:j.total,pay:j.pay,who:"",settled:false});
    renderAll();
  }catch(e){ p.status="error"; p.errMsg=String(e.message||e); renderPending(); }
}

/* ===== 月締め・月移動 ===== */
$("closeBtn").onclick=async ()=>{
  if(!confirm("この月を締めますか？現金残高が翌月へ繰り越されます。")) return;
  const counted=$("counted").value===""?0:Number($("counted").value.replace(/[^\d]/g,""));
  try{ const d=await apiPost({mode:"closeMonth",ym,counted}); if(!d.ok)throw 0; toast("締めました。翌月へ "+yen(d.ending)+" を繰り越しました"); state.closed=true; state.counted=counted; renderAll(); load(); }
  catch(e){ commErr(); }
};
function shiftMonth(n){ if(document.activeElement&&document.activeElement.blur)document.activeElement.blur(); flushSaves().then(()=>{ const [y,m]=ym.split("-").map(Number); const d=new Date(y,m-1+n,1); ym=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2); pending=[]; load(); }); }
$("prevM").onclick=()=>shiftMonth(-1);
$("nextM").onclick=()=>shiftMonth(1);

/* ===== 起動 ===== */
if(GAS_URL.startsWith("http")) load();
else { $("loading").textContent="GAS_URL が未設定です。コード冒頭の GAS_URL にウェブアプリのURLを貼ってください。"; }
</script>
