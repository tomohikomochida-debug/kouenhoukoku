<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="段取り">
<meta name="theme-color" content="#214A37">
<title>段取り｜庭乃持田園</title>
<style>
:root{
  --paper:#F6F5F0; --card:#FFFFFF; --leaf:#214A37; --leaf-soft:#E5EDE7; --ok:#2E7D55;
  --tape:#C77C30; --bark:#5B5750; --ink:#22231F; --line:#DCD9D0; --field:#FBFAF6; --danger:#B0533F;
  --radius:10px; --shadow:0 1px 0 rgba(34,35,31,.04), 0 8px 24px -16px rgba(34,35,31,.25);
  --site:#B8A07A;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif;-webkit-text-size-adjust:100%;line-height:1.6}
.tnum{font-variant-numeric:tabular-nums}
header{background:var(--leaf);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:20;padding-top:calc(12px + env(safe-area-inset-top))}
header .row{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;letter-spacing:.04em}
header .me{font-size:13px;background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:999px;padding:5px 12px}
.demo-bar{background:var(--tape);color:#fff;font-size:12.5px;text-align:center;padding:5px 12px}
main{max-width:680px;margin:0 auto;padding:12px 16px calc(150px + env(safe-area-inset-bottom))}
.error-banner{display:none;background:var(--danger);color:#fff;padding:10px 16px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:2px 0 8px;color:var(--leaf)}
.hint{font-size:12.5px;color:var(--bark);margin:4px 0 0}
label.lbl{display:block;font-size:13px;font-weight:700;color:var(--bark);margin:14px 0 6px}
input[type=text],input[type=date],textarea,select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink)}
textarea{min-height:150px;resize:vertical;line-height:1.7}
input:focus,textarea:focus,select:focus{outline:2px solid var(--leaf);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:15px;font-weight:700;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;min-height:46px;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--ink);font-family:inherit}
.chip.on{background:var(--leaf-soft);border-color:var(--leaf);color:var(--leaf);font-weight:700}
.chip.off{opacity:.55;text-decoration:line-through}
.tag{display:inline-block;font-size:11.5px;border-radius:6px;padding:1px 7px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.tag.site{background:#EFE6D6;color:#6B5532}
.tag.hol{background:#F6DCDC;color:#9A3A3A}
.tag.loc{background:var(--leaf-soft);color:var(--leaf)}
.tag.new{background:#FFF3D6;color:#7A5B12}
.tag.warn{background:#F6DCDC;color:var(--danger)}
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;min-width:62px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 4px;text-align:center;cursor:pointer;font-family:inherit;color:var(--ink)}
.day .d{font-size:16px;font-weight:700}
.day .w{font-size:11.5px;color:var(--bark)}
.day .dots{font-size:10px;color:var(--tape);min-height:14px}
.day.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.day.on .w,.day.on .dots{color:#fff}
.day.sun .w{color:var(--danger)} .day.sat .w{color:#3A64A8}
.holline{background:#FBEDED;border:1px solid #EFCFCF;color:#7E2F2F;border-radius:10px;padding:8px 12px;font-size:13.5px;margin-bottom:10px}
.sitecal{border:1px dashed var(--site);background:#FBF7F0;border-radius:10px;padding:10px 12px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.sitecal .t{flex:1;font-weight:700}
.plan{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--site);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow)}
.plan .st{font-size:17px;font-weight:700}
.plan .meta{font-size:13px;color:var(--bark);margin-top:2px}
.plan .ln{font-size:13.5px;margin-top:4px}
.plan .warn{color:var(--danger);font-size:13px;margin-top:4px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom));z-index:25;background:var(--tape);color:#fff;border:0;border-radius:999px;padding:14px 26px;font:inherit;font-size:17px;font-weight:700;box-shadow:0 8px 20px -8px rgba(0,0,0,.45);cursor:pointer}
.sec{font-size:13px;font-weight:700;color:var(--bark);margin:16px 2px 8px}
.list-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row .grow{flex:1;min-width:0}
.list-row .q{display:flex;align-items:center;gap:4px}
.list-row .q button{width:32px;height:32px;border:1px solid var(--line);background:var(--field);border-radius:8px;font-size:16px;cursor:pointer}
.x{border:0;background:none;color:var(--bark);font-size:18px;cursor:pointer;padding:4px 6px}
.check{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px}
.check:last-child{border-bottom:0}
.check .box{width:28px;height:28px;border:2px solid var(--line);border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;background:var(--field)}
.check.done .box{background:var(--ok);border-color:var(--ok)}
.check.done .lab{color:var(--bark);text-decoration:line-through}
.load-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.load-row:last-child{border-bottom:0}
.load-row .grow{flex:1;min-width:0}
.tg{border:1px solid var(--line);background:var(--field);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--bark);min-width:70px}
.tg.on{background:var(--ok);border-color:var(--ok);color:#fff}
.steps{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14.5px}
.steps span.s{background:var(--leaf-soft);color:var(--leaf);border-radius:8px;padding:3px 10px;font-weight:700}
.raw{font-size:13px;color:var(--bark);white-space:pre-wrap;background:var(--field);border-radius:8px;padding:10px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:680px;margin:0 auto;display:flex}
nav.tabs button{flex:1;border:0;background:none;font:inherit;font-size:11.5px;color:var(--bark);padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button .ic{font-size:21px;line-height:1.1}
nav.tabs button.on{color:var(--leaf);font-weight:700}
.modal-bg{position:fixed;inset:0;background:rgba(34,35,31,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:var(--paper);width:100%;max-width:680px;max-height:94vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.modal h3{margin:0 0 6px;font-size:18px;color:var(--leaf)}
.pv{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--site);border-radius:10px;padding:12px;margin-bottom:12px}
.pv.skip{opacity:.45}
.pv .hd{display:flex;align-items:center;gap:8px}
.pv .hd .t{flex:1;font-weight:700;font-size:16px}
.pv dl{display:grid;grid-template-columns:76px 1fr;gap:4px 8px;margin:8px 0 0;font-size:14px}
.pv dt{color:var(--bark)} .pv dd{margin:0}
.warnbox{background:#FBEDED;border:1px solid #EFCFCF;border-radius:8px;padding:8px 10px;margin-top:8px;font-size:13.5px;color:#7E2F2F}
.askbox{background:#FFF7E6;border:1px solid #F0DDB0;border-radius:8px;padding:8px 10px;margin-top:8px;font-size:13.5px;color:#6B5212}
.toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.loading{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{color:var(--bark);text-align:center;padding:18px 10px;font-size:14px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="error-banner" id="errBanner"></div>
<header><div class="row"><h1>🗓 段取り</h1><button class="me" id="meBtn" type="button">名前を選ぶ</button></div></header>
<div class="demo-bar" id="demoBar" hidden>お試しモード：カレンダーはサンプル、整理は簡易版です（本番はAIが整理）</div>

<main>
  <div class="days" id="days"></div>
  <section id="tab-plan">
    <div id="holLine"></div>
    <div id="calSites"></div>
    <div id="plans"></div>
  </section>
  <section id="tab-shop" hidden><div id="shopList"></div></section>
  <section id="tab-load" hidden><div id="loadList"></div></section>
</main>

<button class="fab" id="fab" type="button">🎤 段取りを話す</button>

<nav class="tabs"><div class="in">
  <button type="button" data-tab="plan" class="on"><span class="ic">🗓</span>段取り</button>
  <button type="button" data-tab="shop"><span class="ic">🛒</span>買い出し</button>
  <button type="button" data-tab="load"><span class="ic">🧰</span>積み込み</button>
</div></nav>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ 設定 ============ */
// 現場アプリGAS（段取り・道具管理・用語集で共通の1本）のURL。空のままだと「お試しモード」
const GAS_URL = '';         // 段取り（app=dandori：カード・カレンダー・AI整理）

const DOUGU_URL = GAS_URL;  // 道具管理（app=dougu：保管場所・持ち出し状況）
const MASTERS_URL = 'https://script.google.com/macros/s/AKfycbz2iP9eN-79vKTgOvfY6_Vd9rJZ9IMuz4ILkrxE79Muqq0pvTZAAhBG3cMXpZV6ZU1-/exec';
const DEMO = !GAS_URL || !YOUGO_URL || !DOUGU_URL;
const LS = { me: 'dandori_me', cards: 'dandori_demo_v1', words: 'yougo_demo_v1', tools: 'dougu_demo_v3', cache: 'dandori_cache', draft: 'dandori_draft' };
const NET_ERR = '電波を確認して、もう一度お試しください';
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const DEMO_STAFF = ['持田', '樋上', '甲斐', '菱沼', '杉村', '佐藤'];

/* ============ 小道具 ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }
function showError(m) { const b = $('errBanner'); b.textContent = '⚠️ ' + m; b.style.display = 'block'; }
window.addEventListener('error', e => showError('画面の処理でエラー：' + (e.message || '')));
const p2 = n => String(n).padStart(2, '0');
function ymd(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
function parseYmd(s) { const a = String(s).split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); }
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function nowStr() { const d = new Date(); return ymd(d) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); }
function md(s) { const d = parseYmd(s); return (d.getMonth() + 1) + '/' + d.getDate() + '(' + WD[d.getDay()] + ')'; }
const TODAY = ymd(new Date());
function uid() { return 'C' + Date.now().toString(36) + Math.floor(Math.random() * 1e5).toString(36); }

/* ============ 文字のゆれ（用語集・道具管理と同じ仕組み） ============ */
const SMALL = { 'ぁ': 'あ', 'ぃ': 'い', 'ぅ': 'う', 'ぇ': 'え', 'ぉ': 'お', 'っ': 'つ', 'ゃ': 'や', 'ゅ': 'ゆ', 'ょ': 'よ', 'ゎ': 'わ' };
function toHira(s) { return String(s || '').replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)); }
function norm(s) { return toHira(String(s || '').normalize('NFKC').toLowerCase()).replace(/[\s・･,，、。.\-－_/／（）()「」『』]/g, ''); }
function loose(s) { return norm(s).normalize('NFD').replace(/[゙゚]/g, '').normalize('NFC').replace(/[ぁぃぅぇぉっゃゅょゎ]/g, c => SMALL[c]).replace(/ー/g, ''); }

function toolWords(includeMis) {   // 道具・資材の言葉の一覧（長い順）

    const items = findItems(cl);
    const isFix = /やっぱ|いや|じゃなくて|訂正|やっぱり/.test(cl);
    // 立ち寄り先：「○○屋で」「○○さんとこで」、または「○○で〜買って／もらって」
    const pm = cl.match(/([^\s、。]{1,14}?(?:屋|センター|店|さんとこ|さんち|資材|園芸))(?:で|に|へ)/) || cl.match(/([^\s、。]{1,14})(?:で|に|へ)(?=[^でにへ]*(買|もら|受け取|仕入|寄|拾))/);
    let place = pm ? pm[1].replace(/^(その前に|その後|あと|それと|で|あ|まず|最初に|帰りに|行きに|朝|ついでに|は)+/, '').trim() : '';
    if (place && STAFF.some(n => place.includes(n))) place = '';
    if (place) {
      let stop = cur.stops.find(s => s.place === place);
      if (!stop) { stop = { order: cur.stops.length + 1, place, items: [], done: false }; cur.stops.push(stop); }
      const got = cl.match(/([^\s、。でにをはがの]{1,8}?)(?:を)?(?:もらって|もらう|受け取|買って|買う|仕入)/);
      if (got && !items.some(it => got[1].includes(it.surface))) stop.items.push({ name: got[1], qty: '', unit: '', done: false });
      items.forEach(it => stop.items.push({ name: it.surface, termId: it.termId, qty: it.qty, unit: it.unit, done: false }));
    } else {
      items.forEach(it => {
        if (isFix) {   // 言い直し：前に出てきた同じ物の数を直す（別の現場の話の途中でも）
          for (const c of cards.slice().reverse()) {
            const hit = c.stops.flatMap(s => s.items).find(x => x.termId === it.termId) || c.items.find(x => x.termId === it.termId);
            if (hit) { if (it.qty) { hit.qty = it.qty; hit.unit = it.unit || hit.unit; } return; }
          }
        }
        const ex = cur.items.find(x => x.termId === it.termId);
        if (ex) { if (it.qty) { ex.qty = it.qty; ex.unit = it.unit; } }
        else cur.items.push({ name: (termById(it.termId) || {}).term || it.surface, termId: it.termId, qty: it.qty, unit: it.unit });
      });
    }
    STEP_WORDS.forEach(([re, lab]) => { if (re.test(cl) && !cur.steps.includes(lab)) cur.steps.push(lab); });
    if (/注意|気をつけ|危な|駐車|隣|近所|手配|忘れ|電線|通学/.test(cl)) {
      const s = cl.replace(/^(あ|それと|あと|で)+/, '').replace(/(明日|今日|明後日|[月火水木金土日]曜(日)?の?)/g, '').replace(curSite, '').replace(/^は/, '').trim();
      if (s && !cur.notes.includes(s)) cur.notes.push(s);
    }
  });
  return cards.filter(c => c.site || c.items.length || c.stops.length || c.steps.length || c.notes.length || c.members.length);
}

/* ============ 整理結果の仕上げ（AI・お試し共通） ============ */
const holidaysOn = date => CAL.holidays.filter(h => h.date === date);
function offNames(date) {
  const hs = holidaysOn(date);
  if (hs.some(h => h.all)) return STAFF.slice();
  return STAFF.filter(n => hs.some(h => h.title.includes(n)));
}
function finalize(raw) {
  return raw.map(c => {
    const card = { cardId: '', date: c.date || SEL, site: c.site || '', eventId: '', meetTime: c.meetTime || '', staff: (c.members || c.staff || []).slice(), vehicle: c.vehicle || '',
      stops: (c.stops || []).map((s, i) => ({ order: i + 1, place: s.place || '', done: !!s.done, items: (s.items || []).map(it => Object.assign({ done: false }, it, (() => { const m = it.termId ? { termId: it.termId } : matchWord(it.name); return m ? { termId: m.termId } : {}; })())) })),
      items: (c.items || []).map(it => { const m = it.termId ? termById(it.termId) && { termId: it.termId } : matchWord(it.name); const t = m && toolOfTerm(m.termId); return { name: m ? termById(m.termId).term : it.name, termId: m ? m.termId : '', toolId: t ? t.id : '', qty: it.qty || '', unit: it.unit || '', loaded: false, returned: false }; }),
      steps: (c.steps || []).slice(), notes: (c.notes || []).slice(), rawText: '', unresolved: (c.unresolved || []).slice() };
    // 現場名をカレンダーの予定名にそろえる
    const evs = CAL.sites.filter(e => e.date === card.date);
    const ev = evs.find(e => card.site && (norm(e.title).includes(norm(card.site)) || norm(card.site).includes(norm(e.title))));
    if (ev) { card.site = ev.title; card.eventId = ev.id; }
    else if (!card.site && evs.length === 1) { card.site = evs[0].title; card.eventId = evs[0].id; card.unresolved.push('現場が話に出なかったので、カレンダーの「' + evs[0].title + '」にしました'); }
    else if (!card.site) card.unresolved.push('どの現場の段取りですか？');
    // すでにあるカードには追記
    const ex = CARDS.find(x => x.date === card.date && x.site && x.site === card.site);
    card._merge = ex ? ex.cardId : '';
    return card;
  });
}
function mergeInto(ex, c) {
  const m = JSON.parse(JSON.stringify(ex));
  c.staff.forEach(n => { if (!m.staff.includes(n)) m.staff.push(n); });
  if (c.meetTime) m.meetTime = c.meetTime; if (c.vehicle) m.vehicle = c.vehicle;
  c.stops.forEach(s => { const e = m.stops.find(x => x.place === s.place); if (e) s.items.forEach(it => { const f = e.items.find(x => (x.termId && x.termId === it.termId) || x.name === it.name); if (f) { if (it.qty) f.qty = it.qty; } else e.items.push(it); }); else m.stops.push(Object.assign({}, s, { order: m.stops.length + 1 })); });
  c.items.forEach(it => { const f = m.items.find(x => (x.termId && x.termId === it.termId) || x.name === it.name); if (f) { if (it.qty) f.qty = it.qty; } else m.items.push(it); });
  c.steps.forEach(s => { if (!m.steps.includes(s)) m.steps.push(s); });
  c.notes.forEach(s => { if (!m.notes.includes(s)) m.notes.push(s); });
  m.rawText = (m.rawText ? m.rawText + '\n---\n' : '') + c.rawText;
  return m;
}
function warningsOf(c) {
  const w = [], off = offNames(c.date);
  c.staff.filter(n => off.includes(n)).forEach(n => w.push(n + 'さんはこの日休みです'));
  c.items.filter(it => !it.termId).forEach(it => w.push('「' + it.name + '」は用語集にない言葉です'));
  c.items.filter(it => it.termId && !it.toolId).forEach(it => w.push('「' + it.name + '」は道具管理に未登録です（保管場所が分かりません）'));
  return w;
}

    if (b.dataset.q) { const it = EDIT.items[Number(b.dataset.q)]; it.qty = Math.max(0, (Number(it.qty) || (Number(b.dataset.d) > 0 ? 0 : 1)) + Number(b.dataset.d)) || ''; return drawCard(); }
    if (b.dataset.act === 'addStop') { const v = $('addStop').value.trim(); if (!v) return; const [place, ...rest] = v.split(/[\s　]+/); EDIT.stops.push({ order: EDIT.stops.length + 1, place, done: false, items: rest.join(' ') ? findItemsLoose(rest.join(' ')) : [] }); return drawCard(); }
    if (b.dataset.act === 'addItem') { const v = $('addItem').value.trim(); if (!v) return; v.split(/[、,，]/).map(s => s.trim()).filter(Boolean).forEach(s => { const m = s.match(/^(.+?)\s*(\d+)?\s*(本|個|台|束|枚)?$/); const name = m[1], w = matchWord(name), t = w && toolOfTerm(w.termId); EDIT.items.push({ name: w ? termById(w.termId).term : name, termId: w ? w.termId : '', toolId: t ? t.id : '', qty: m[2] ? Number(m[2]) : '', unit: m[3] || '', loaded: false, returned: false }); }); return drawCard(); }
    if (b.dataset.act === 'share') return shareCard(EDIT);
    if (b.dataset.act === 'more') { await saveEdit(true); return openSpeak({ date: EDIT.date, site: EDIT.site, cardId: EDIT.cardId }); }
    if (b.dataset.act === 'del') { if (!confirm('このカードを削除しますか？')) return; try { await deleteCard(EDIT.cardId); closeModal(); render(); toast('削除しました'); } catch (err) { toast(err.message || NET_ERR); } return; }
    if (b.dataset.act === 'save') { if (await saveEdit()) { closeModal(); render(); toast('保存しました'); } return; }
    if (b.dataset.act === 'close') { closeModal(); }
  });
}
function findItemsLoose(s) { return s.split(/[、,，\s]+/).filter(Boolean).map(x => { const m = x.match(/^(.+?)(\d+)?(本|個|台|束|枚|袋)?$/); const w = matchWord(m[1]); return { name: m[1], termId: w ? w.termId : '', qty: m[2] ? Number(m[2]) : '', unit: m[3] || '', done: false }; }); }
function collect() {
  if (!$('cDate')) return;
  EDIT.date = $('cDate').value || EDIT.date; EDIT.meetTime = $('cMeet').value.trim(); EDIT.site = $('cSite').value.trim(); EDIT.vehicle = $('cVeh').value.trim();
  EDIT.steps = $('cSteps').value.split(/→|->|＞|>/).map(s => s.trim()).filter(Boolean);
  EDIT.notes = $('cNotes').value.split('\n').map(s => s.trim()).filter(Boolean);
}
async function saveEdit(silent) {
  collect();
  const ev = CAL.sites.find(e => e.date === EDIT.date && e.title === EDIT.site); EDIT.eventId = ev ? ev.id : '';
  try { await saveCards([EDIT]); return true; } catch (err) { if (!silent) toast(err.message || NET_ERR); return false; }
}
function cardText(c) {
  const L = ['【段取り】' + md(c.date) + ' ' + (c.site || '現場未定')];
  if (c.meetTime) L.push('集合 ' + c.meetTime);
  L.push('メンバー：' + (c.staff.join('・') || '未定') + (c.vehicle ? '　車両：' + c.vehicle : ''));
  if (c.stops.length) { L.push('■立ち寄り・買い出し'); c.stops.forEach((s, i) => L.push('①②③④⑤⑥⑦⑧⑨'[i] + s.place + (s.items.length ? '：' + s.items.map(it => it.name + (it.qty ? ' ' + it.qty + (it.unit || '') : '')).join('・') : ''))); }
  if (c.items.length) { L.push('■持ち物'); c.items.forEach(it => { const t = TOOLS.find(x => x.id === it.toolId); L.push('・' + it.name + (it.qty ? ' ' + it.qty + (it.unit || '') : '') + (t ? '（' + t.location + '）' : '')); }); }
  if (c.steps.length) { L.push('■作業'); L.push(c.steps.join(' → ')); }
  if (c.notes.length) { L.push('■注意'); c.notes.forEach(n => L.push('・' + n)); }
  return L.join('\n');
}
function shareCard(c) {
  const text = cardText(c);
  if (navigator.share) navigator.share({ text }).catch(() => { });
  else location.href = 'https://line.me/R/msg/text/?' + encodeURIComponent(text);
}

/* ============ 買い出し ============ */
function renderShop() {
  const cards = CARDS.filter(c => c.date === SEL && c.stops.length);
  $('shopList').innerHTML = cards.length ? cards.map(c => '<div class="card"><h2>' + esc(c.site || '現場未定') + '<span class="tag site">' + md(c.date) + '</span></h2>' +
    c.stops.map((s, si) => '<div class="sec" style="margin-top:8px">' + '①②③④⑤⑥⑦⑧⑨'[si] + ' ' + esc(s.place) + '</div>' +
      (s.items.length ? s.items.map((it, ii) => '<div class="check' + (it.done ? ' done' : '') + '" data-shop="' + esc(c.cardId) + '|' + si + '|' + ii + '"><span class="box">' + (it.done ? '✓' : '') + '</span><span class="lab">' + esc(it.name) + (it.qty ? ' <b class="tnum">' + it.qty + (it.unit || '') + '</b>' : '') + '</span></div>').join('')
        : '<div class="check' + (s.done ? ' done' : '') + '" data-shop="' + esc(c.cardId) + '|' + si + '|-1"><span class="box">' + (s.done ? '✓' : '') + '</span><span class="lab">立ち寄った</span></div>')).join('') + '</div>').join('')
    : '<div class="empty">' + md(SEL) + ' の立ち寄り・買い出しはありません</div>';
}
async function toggleShop(key) {
  const [id, si, ii] = key.split('|'), c = CARDS.find(x => x.cardId === id); if (!c) return;
  const s = c.stops[Number(si)]; if (Number(ii) < 0) s.done = !s.done; else s.items[Number(ii)].done = !s.items[Number(ii)].done;
  renderShop();
  try { await saveCards([c]); } catch (e) { toast(NET_ERR); }
}

/* ============ 積み込み／戻し ============ */
function renderLoad() {
  const cards = CARDS.filter(c => c.date === SEL && c.items.length);
  $('loadList').innerHTML = cards.length ? '<p class="hint" style="margin:0 2px 10px">積んだら「積んだ」、帰って片付けたら「戻した」。道具管理の「今どこ」に反映されます。</p>' + cards.map(c => '<div class="card"><h2>' + esc(c.site || '現場未定') + '<span class="tag site">' + md(c.date) + '</span></h2>' +
    c.items.map((it, i) => { const t = TOOLS.find(x => x.id === it.toolId); return '<div class="load-row"><div class="grow"><b>' + esc(it.name) + '</b>' + (it.qty ? ' <span class="tnum">' + it.qty + (it.unit || '') + '</span>' : '') + '<div class="hint">' + (t ? '📍 ' + esc(t.location) + (t.status && t.status !== '倉庫' ? '　<span class="tag warn">' + esc(t.statusSite || '持ち出し中') + '</span>' : '') : '道具管理に未登録') + '</div></div>' +
      '<button class="tg' + (it.loaded ? ' on' : '') + '" data-load="' + esc(c.cardId) + '|' + i + '|loaded">積んだ</button><button class="tg' + (it.returned ? ' on' : '') + '" data-load="' + esc(c.cardId) + '|' + i + '|returned">戻した</button></div>'; }).join('') + '</div>').join('')
    : '<div class="empty">' + md(SEL) + ' の持ち物はありません</div>';
}
async function toggleLoad(key) {
  const [id, i, f] = key.split('|'), c = CARDS.find(x => x.cardId === id); if (!c) return;
  const it = c.items[Number(i)]; it[f] = !it[f];
  if (f === 'returned' && it.returned) it.loaded = true;
  renderLoad();
  try {
    if (it.toolId) {
      if (f === 'loaded' && it.loaded && !it.returned) await setToolStatus(it.toolId, { status: '持ち出し', statusSite: c.site + '（' + md(c.date) + '）', statusBy: me(), statusAt: nowStr() });
      if ((f === 'returned' && it.returned) || (f === 'loaded' && !it.loaded)) await setToolStatus(it.toolId, { status: '倉庫', statusSite: '', statusBy: me(), statusAt: nowStr() });
    }
    await saveCards([c]); renderLoad();
  } catch (e) { toast(NET_ERR); }
}

/* ============ 名前・モーダル ============ */
const FALLBACK_STAFF = DEMO_STAFF;
/* 名前：①このアプリで選んだ名前 ②日報アプリで選んだ名前（同じサイトなら自動で引き継ぐ） */
function rawGet(k) { try { const v = localStorage.getItem(k); if (v == null) return ''; try { const j = JSON.parse(v); return typeof j === 'string' ? j : ''; } catch (e) { return v; } } catch (e) { return ''; } }
const me = () => lsGet(LS.me, '') || rawGet('nippou_author');
let STAFF_LIST = null, NAME_OPEN = false, AFTER_NAME = null;
function staffList() {
  if (STAFF_LIST && STAFF_LIST.length) return STAFF_LIST;
  const m = lsGet('nippou_masters', null); if (m && m.staff && m.staff.length) return m.staff;   // 日報アプリが覚えている名簿
  return lsGet(LS.me + '_staff', null) || FALLBACK_STAFF;
}
async function fetchStaff() {   // 名簿は裏で取る（10秒で打ち切り）。取れたら開いている名前画面を描き直す
  const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 10000);
  try {
    const r = await (await fetch(MASTERS_URL + '?action=masters', { cache: 'no-store', signal: ac.signal })).json();
    const s = (r.staff || []).map(x => typeof x === 'string' ? x : (x.name || x.staff || '')).filter(Boolean);
    if (s.length) { STAFF_LIST = s; lsSet(LS.me + '_staff', s); if (NAME_OPEN && $('nmIn')) drawName(); if (typeof onStaff === 'function') onStaff(); }
  } catch (e) { /* 名簿が取れなくても手入力で進める */ } finally { clearTimeout(tm); }
}
function chooseName(force, then) {
  if (me() && !force) { if (then) then(); return; }
  AFTER_NAME = then || null; NAME_OPEN = true; drawName();
}
function drawName() {
  const typed = $('nmIn') ? $('nmIn').value : me();
  openModal('<h3>あなたの名前</h3><p class="hint" style="margin:4px 0 12px">最初の1回だけ選びます。</p>' +
    '<div class="chips" style="margin-bottom:12px">' + staffList().map(s => '<button type="button" class="chip" data-nm="' + esc(s) + '">' + esc(s) + '</button>').join('') + '</div>' +
    '<input type="text" id="nmIn" placeholder="一覧にないときは名前を入力" value="' + esc(typed) + '">' +
    '<div class="row2" style="margin-top:12px"><button class="btn" data-act="later">あとで</button><button class="btn primary" data-act="ok">決定</button></div>',
    e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.act === 'later') { NAME_OPEN = false; AFTER_NAME = null; closeModal(); return; }
      const v = b.dataset.nm || (b.dataset.act === 'ok' ? $('nmIn').value.trim() : '');
      if (!v) { if (b.dataset.act === 'ok') toast('名前を選ぶか入力してください'); return; }
      lsSet(LS.me, v); $('meBtn').textContent = '👤 ' + v; NAME_OPEN = false; closeModal();
      const t = AFTER_NAME; AFTER_NAME = null; if (t) t();
    });
}
function onStaff() { STAFF = staffList(); render(); }
let modalHandler = null, modalLocked = false;
function openModal(html, handler, locked) { $('modal').innerHTML = html; modalHandler = handler; modalLocked = !!locked; $('modalBg').classList.add('show'); $('modal').scrollTop = 0; }
function closeModal() { $('modalBg').classList.remove('show'); $('modal').innerHTML = ''; modalHandler = null; EDIT = null; }
$('modal').addEventListener('click', e => { if (modalHandler) modalHandler(e); });
$('modalBg').addEventListener('click', e => { if (e.target === $('modalBg') && !modalLocked) closeModal(); });

/* ============ イベント ============ */
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => { TAB = b.dataset.tab; document.querySelectorAll('nav.tabs button').forEach(x => x.classList.toggle('on', x === b)); ['plan', 'shop', 'load'].forEach(n => { $('tab-' + n).hidden = n !== TAB; }); window.scrollTo(0, 0); render(); }));
document.body.addEventListener('click', e => {
  if (e.target.closest('#modal')) return;
  const dy = e.target.closest('[data-day]'); if (dy) { SEL = dy.dataset.day; return render(); }
  const cd = e.target.closest('[data-card]'); if (cd) return openCard(cd.dataset.card);
  const ns = e.target.closest('[data-new-site]'); if (ns) return openCard(null, { cardId: '', date: SEL, site: ns.dataset.newSite, eventId: '', meetTime: '', staff: [], vehicle: '', stops: [], items: [], steps: [], notes: [], rawText: '' });
  const sh = e.target.closest('[data-shop]'); if (sh) return toggleShop(sh.dataset.shop);
  const ld = e.target.closest('[data-load]'); if (ld) return toggleLoad(ld.dataset.load);
});
$('fab').addEventListener('click', () => chooseName(false, () => openSpeak()));
$('meBtn').addEventListener('click', () => chooseName(true));

(function init() {
  $('demoBar').hidden = !DEMO;
  if (me()) $('meBtn').textContent = '👤 ' + me();
  const p = new URLSearchParams(location.search);
  if (p.get('date')) SEL = p.get('date');
  load();
})();
</script>
