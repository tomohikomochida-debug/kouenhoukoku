<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="段取り">

<title>段取り｜庭乃持田園</title>
<style>
:root{
  --paper:#F6F5F0; --card:#FFFFFF; --leaf:#214A37; --leaf-soft:#E5EDE7; --ok:#2E7D55;
  --tape:#C77C30; --bark:#5B5750; --ink:#22231F; --line:#DCD9D0; --field:#FBFAF6; --danger:#B0533F;
  --radius:10px; --shadow:0 1px 0 rgba(34,35,31,.04), 0 8px 24px -16px rgba(34,35,31,.25);
  --site:#B8A07A;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif;-webkit-text-size-adjust:100%;line-height:1.6}
.tnum{font-variant-numeric:tabular-nums}
header{background:var(--leaf);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:20;padding-top:calc(12px + env(safe-area-inset-top))}
header .row{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;letter-spacing:.04em}
header .me{font-size:13px;background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:999px;padding:5px 12px}
.demo-bar{background:var(--tape);color:#fff;font-size:12.5px;text-align:center;padding:5px 12px}
main{max-width:680px;margin:0 auto;padding:12px 16px calc(150px + env(safe-area-inset-bottom))}
.error-banner{display:none;background:var(--danger);color:#fff;padding:10px 16px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:2px 0 8px;color:var(--leaf)}
.hint{font-size:12.5px;color:var(--bark);margin:4px 0 0}
label.lbl{display:block;font-size:13px;font-weight:700;color:var(--bark);margin:14px 0 6px}
input[type=text],input[type=date],textarea,select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink)}
textarea{min-height:150px;resize:vertical;line-height:1.7}
input:focus,textarea:focus,select:focus{outline:2px solid var(--leaf);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:15px;font-weight:700;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;min-height:46px;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--ink);font-family:inherit}
.chip.on{background:var(--leaf-soft);border-color:var(--leaf);color:var(--leaf);font-weight:700}
.chip.off{opacity:.55;text-decoration:line-through}
.tag{display:inline-block;font-size:11.5px;border-radius:6px;padding:1px 7px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.tag.site{background:#EFE6D6;color:#6B5532}
.tag.hol{background:#F6DCDC;color:#9A3A3A}
.tag.loc{background:var(--leaf-soft);color:var(--leaf)}
.tag.new{background:#FFF3D6;color:#7A5B12}
.tag.warn{background:#F6DCDC;color:var(--danger)}
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;min-width:62px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 4px;text-align:center;cursor:pointer;font-family:inherit;color:var(--ink)}
.day .d{font-size:16px;font-weight:700}
.day .w{font-size:11.5px;color:var(--bark)}
.day .dots{font-size:10px;color:var(--tape);min-height:14px}
.day.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.day.on .w,.day.on .dots{color:#fff}
.day.sun .w{color:var(--danger)} .day.sat .w{color:#3A64A8}
.holline{background:#FBEDED;border:1px solid #EFCFCF;color:#7E2F2F;border-radius:10px;padding:8px 12px;font-size:13.5px;margin-bottom:10px}
.sitecal{border:1px dashed var(--site);background:#FBF7F0;border-radius:10px;padding:10px 12px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.sitecal .t{flex:1;font-weight:700}
.sitecal.ask{border-style:dotted;background:#FFF;flex-wrap:wrap}
.sitecal.ask .q{flex-basis:100%;font-size:12.5px;color:var(--bark);margin-top:-2px}
.tag.time{background:#E8ECF4;color:#3D4B66}
.undo{background:none;border:0;color:var(--bark);text-decoration:underline;font-size:12.5px;padding:2px 0;margin-bottom:10px}
.plan{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--site);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow)}
.plan .st{font-size:17px;font-weight:700}
.plan .meta{font-size:13px;color:var(--bark);margin-top:2px}
.plan .ln{font-size:13.5px;margin-top:4px}
.plan .warn{color:var(--danger);font-size:13px;margin-top:4px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom));z-index:25;background:var(--tape);color:#fff;border:0;border-radius:999px;padding:14px 26px;font:inherit;font-size:17px;font-weight:700;box-shadow:0 8px 20px -8px rgba(0,0,0,.45);cursor:pointer}
.sec{font-size:13px;font-weight:700;color:var(--bark);margin:16px 2px 8px}
.notices{margin-bottom:12px}
.notices .nh{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 6px}
.notices .nh b{font-size:13px;color:var(--bark)}
.notice{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:#FFF8E6;border:1px solid #F0DDB0;border-left:6px solid #D9A21B;border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.notice .tx{white-space:pre-wrap;font-size:14.5px}
.notice .mt{font-size:12px;color:var(--bark);margin-top:4px}
.addnotice{background:none;border:0;color:var(--bark);font-size:12.5px;text-decoration:underline;padding:2px 0}
.chip.out{border-style:dashed}
a.notice{text-decoration:none;background:#F1F4F8;border-color:#D5DDE8;border-left-color:#4A6A8A}
.stoptel{font-size:12.5px;margin-left:6px}
.plan.done{opacity:.55}
.plan.done .st{text-decoration:line-through}
.tag.over{background:#FBEDED;color:#9A3A3A}
a.tag{text-decoration:none}
.list-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row .grow{flex:1;min-width:0}
.list-row .q{display:flex;align-items:center;gap:4px}
.list-row .q button{width:32px;height:32px;border:1px solid var(--line);background:var(--field);border-radius:8px;font-size:16px;cursor:pointer}
.x{border:0;background:none;color:var(--bark);font-size:18px;cursor:pointer;padding:4px 6px}
.check{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px}
.check:last-child{border-bottom:0}
.check .box{width:28px;height:28px;border:2px solid var(--line);border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;background:var(--field)}
.check.done .box{background:var(--ok);border-color:var(--ok)}
.check.done .lab{color:var(--bark);text-decoration:line-through}
.load-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.load-row:last-child{border-bottom:0}
.load-row .grow{flex:1;min-width:0}
.tg{border:1px solid var(--line);background:var(--field);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--bark);min-width:70px}
.tg.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tg.part{background:#FBEDED;border-color:var(--danger);color:var(--danger)}
.tg.sm{min-width:0;padding:4px 9px;font-size:12px;font-weight:600}
.outband{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font:inherit;background:var(--danger);color:#fff;border:0;border-radius:10px;padding:11px 14px;margin-bottom:12px;cursor:pointer;font-size:15px;font-weight:700}
.outband span{margin-left:auto;font-size:13px;font-weight:400;opacity:.9}
.outcard{border-left:6px solid var(--danger)}
.outcard h2{color:var(--danger)}
.vehhd{font-size:13px;font-weight:700;color:var(--bark);margin:8px 0 0;padding-top:8px;border-top:1px dashed var(--line)}
.vehhd:first-of-type{border-top:0;padding-top:0}
.tag.use{background:#EEE9DF;color:var(--bark)}
.numgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.numgrid .btn{height:48px;font-size:18px;padding:0}
.steps{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14.5px}
.steps span.s{background:var(--leaf-soft);color:var(--leaf);border-radius:8px;padding:3px 10px;font-weight:700}
.raw{font-size:13px;color:var(--bark);white-space:pre-wrap;background:var(--field);border-radius:8px;padding:10px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:680px;margin:0 auto;display:flex}
nav.tabs button{flex:1;border:0;background:none;font:inherit;font-size:11.5px;color:var(--bark);padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button .ic{font-size:21px;line-height:1.1}
nav.tabs button.on{color:var(--leaf);font-weight:700}
.modal-bg{position:fixed;inset:0;background:rgba(34,35,31,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:var(--paper);width:100%;max-width:680px;max-height:94vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.modal h3{margin:0 0 6px;font-size:18px;color:var(--leaf)}
.pv{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--site);border-radius:10px;padding:12px;margin-bottom:12px}
.pv.skip{opacity:.45}
.pv .hd{display:flex;align-items:center;gap:8px}
.pv .hd .t{flex:1;font-weight:700;font-size:16px}
.pv dl{display:grid;grid-template-columns:76px 1fr;gap:4px 8px;margin:8px 0 0;font-size:14px}
.pv dt{color:var(--bark)} .pv dd{margin:0}
.warnbox{background:#FBEDED;border:1px solid #EFCFCF;border-radius:8px;padding:8px 10px;margin-top:8px;font-size:13.5px;color:#7E2F2F}
.askbox{background:#FFF7E6;border:1px solid #F0DDB0;border-radius:8px;padding:8px 10px;margin-top:8px;font-size:13.5px;color:#6B5212}
.toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.loading{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{color:var(--bark);text-align:center;padding:18px 10px;font-size:14px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.home-btn{display:inline-flex;align-items:center;gap:4px;flex:0 0 auto;color:#fff;text-decoration:none;font-family:inherit;font-size:13px;font-weight:700;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);border-radius:999px;padding:5px 11px 5px 9px;white-space:nowrap;line-height:1.2}
.home-btn:active{background:rgba(255,255,255,.28)}
.home-btn .hb-ic{font-size:15px;line-height:1}
@media (max-width:400px){ .home-btn{padding:5px 8px} .home-btn .hb-t{display:none} }
</style>

<body>
<div class="error-banner" id="errBanner"></div>
<header><div class="row"><a class="home-btn" href="index.html" title="アプリ一覧にもどる" aria-label="アプリ一覧（ホーム）にもどる"><span class="hb-ic">🏠</span><span class="hb-t">ホーム</span></a><h1>🗓 段取り</h1><button class="me" id="meBtn" type="button">名前を選ぶ</button></div></header>

<main>
  <div class="days" id="days"></div>

    <div id="holLine"></div>
    <div id="calSites"></div>

</div></nav>

<script>
/* ============ 設定 ============ */
// 現場アプリGAS（段取り・道具管理・用語集で共通の1本）のURL。空のままだと「お試しモード」
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzCkxdDCT3hnSEbtpcbQcvOcsehvX5pLUzZ8xFBIxQ40qvRmwmnixJ3q_vEr7X0v-vm7A/exec';         // 段取り（app=dandori：カード・カレンダー・AI整理）
const YOUGO_URL = GAS_URL;  // 用語集（app=yougo：言葉のマスタ）
const DOUGU_URL = GAS_URL;  // 道具管理（app=dougu：保管場所・持ち出し状況）
const MASTERS_URL = 'https://script.google.com/macros/s/AKfycbz2iP9eN-79vKTgOvfY6_Vd9rJZ9IMuz4ILkrxE79Muqq0pvTZAAhBG3cMXpZV6ZU1-/exec';
const DEMO = !GAS_URL || !YOUGO_URL || !DOUGU_URL;
const LS = { me: 'dandori_me', cards: 'dandori_demo_v1', words: 'yougo_demo_v1', tools: 'dougu_demo_v3', cache: 'dandori_cache', draft: 'dandori_draft', timed: 'dandori_timed', outs: 'dandori_outs_demo' };
const NET_ERR = '電波を確認して、もう一度お試しください';
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const DEMO_STAFF = ['持田', '樋上', '甲斐', '菱沼', '杉村', '佐藤'];

/* ============ 小道具 ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }
function showError(m) { const b = $('errBanner'); b.textContent = '⚠️ ' + m; b.style.display = 'block'; }
window.addEventListener('error', e => showError('画面の処理でエラー：' + (e.message || '')));
const p2 = n => String(n).padStart(2, '0');
function ymd(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
function parseYmd(s) { const a = String(s).split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); }
function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function nowStr() { const d = new Date(); return ymd(d) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); }
function md(s) { const d = parseYmd(s); return (d.getMonth() + 1) + '/' + d.getDate() + '(' + WD[d.getDay()] + ')'; }
const TODAY = ymd(new Date());
function uid() { return 'C' + Date.now().toString(36) + Math.floor(Math.random() * 1e5).toString(36); }

/* ============ 文字のゆれ（用語集・道具管理と同じ仕組み） ============ */
const SMALL = { 'ぁ': 'あ', 'ぃ': 'い', 'ぅ': 'う', 'ぇ': 'え', 'ぉ': 'お', 'っ': 'つ', 'ゃ': 'や', 'ゅ': 'ゆ', 'ょ': 'よ', 'ゎ': 'わ' };
function toHira(s) { return String(s || '').replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)); }
function norm(s) { return toHira(String(s || '').normalize('NFKC').toLowerCase()).replace(/[\s・･,，、。.\-－_/／（）()「」『』]/g, ''); }
function loose(s) { return norm(s).normalize('NFD').replace(/[゙゚]/g, '').normalize('NFC').replace(/[ぁぃぅぇぉっゃゅょゎ]/g, c => SMALL[c]).replace(/ー/g, ''); }

/* ============ お試し用データ ============ */
const SEED_WORDS = {
  terms: [["Y0153","剪定鋏","せんていばさみ","道具","片手で使う小型の鋏、太めの枝も切れる。","","","T0001"],
    ["Y0154","木鋏","きばさみ","道具","輪の持ち手の鋏、細かい枝や葉の整え用。","","","T0002"],
    ["Y0155","芽切鋏","めきりばさみ","道具","刃先の細い小さな鋏、芽摘み・松の手入れ用。","","","T0003"],
    ["Y0156","刈込鋏","かりこみばさみ","道具","両手で使う刃の長い鋏、生垣・玉物の刈込み。","","","T0004"],
    ["Y0157","剪定鋸","せんていのこぎり","道具","枝を切る細身のノコギリ、腰に下げる。","","","T0005"],
    ["Y0158","両刃鋸","りょうばのこぎり","道具","刃が両側にある大工用ノコギリ、丸太や竹を切る。","","","T0006"],
    ["Y0159","高枝切鋏","たかえだきりばさみ","道具","柄の長い鋏、脚立が届かない高い枝用。","","","T0007"],
    ["Y0160","高枝鋸","たかえだのこぎり","道具","伸縮する長い柄の先にノコギリ。","","","T0008"],
    ["Y0161","草刈鎌","くさかりがま","道具","草を刈る片手の鎌。","","","T0009"],
    ["Y0162","ヘッジトリマー","へっじとりまー","道具","生垣の刈込み用、エンジン式の長い刃。","","","T0010"],
    ["Y0163","チェーンソー","ちぇーんそー","道具","エンジン式の木を切る機械、伐採・玉切り。","","","T0011"],
    ["Y0164","トップハンドルソー","とっぷはんどるそー","道具","片手で扱える小型のチェーンソー、木の上の作業用。","","","T0012"],
    ["Y0165","刈払機","かりばらいき","道具","肩に掛けて回転刃で草を刈る機械。","","","T0013"],

const termById = id => WORDS.terms.find(t => t.termId === id);
const toolOfTerm = termId => TOOLS.find(t => t.termId === termId);
function toolWords(includeMis) {   // 道具・資材の言葉の一覧（長い順）
  const out = [];
  WORDS.terms.filter(t => t.category === '道具' || t.category === '資材').forEach(t => {
    out.push({ w: t.term, termId: t.termId, type: '正式名' });
    WORDS.aliases.filter(a => a.termId === t.termId && (includeMis || a.type !== '聞き間違い')).forEach(a => out.push({ w: a.alias, termId: t.termId, type: a.type }));
  });
  return out.sort((a, b) => norm(b.w).length - norm(a.w).length);
}
function matchWord(name) {   // AIが返した品名や手入力を、用語集の言葉に合わせる
  const n = norm(name), l = loose(name);
  if (!n) return null;
  const ws = toolWords(true);
  return ws.find(x => norm(x.w) === n) || ws.find(x => loose(x.w) === l) || null;
}
function dictText() { return toolWords(true).filter(x => x.type !== '正式名').map(x => x.w + '→' + (termById(x.termId) || {}).term).join('\n'); }

  [/消毒/, '消毒'], [/草刈|草取/, '草刈り'], [/搬出|運び出/, '搬出'], [/掃除|清掃|片付/, '清掃']];
const KNUM = { 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9, 十: 10 };
function dateIn(s, base) {
  if (/明後日|あさって/.test(s)) return addDays(base, 2);
  if (/明日|あした|あす/.test(s)) return addDays(base, 1);
  if (/今日|本日|きょう/.test(s)) return base;
  let m = s.match(/来週の?([月火水木金土日])(?:曜)?/);
  if (m) { const d = parseYmd(base), mon = addDays(base, ((8 - d.getDay()) % 7) || 7); return addDays(mon, (WD.indexOf(m[1]) + 6) % 7); }
  m = s.match(/([月火水木金土日])曜/);
  if (m) { const d = parseYmd(base); return addDays(base, (WD.indexOf(m[1]) - d.getDay() + 7) % 7); }
  m = s.match(/(\d{1,2})月(\d{1,2})日/);
  if (m) { const y = parseYmd(base).getFullYear(); return y + '-' + p2(m[1]) + '-' + p2(m[2]); }
  m = s.match(/(?:^|[^\d])(\d{1,2})日/);
  if (m) { const d = parseYmd(base); let c = new Date(d.getFullYear(), d.getMonth(), Number(m[1])); if (ymd(c) < base) c = new Date(d.getFullYear(), d.getMonth() + 1, Number(m[1])); return ymd(c); }
  return null;
}

/* ---- 現場名：現場マスタ（日報アプリの現場一覧）と照らして、聞き間違いを直す ---- */
const DEMO_SITES = ['高津公園', '溝口南公園', '上作延第3公園', '久地伊屋ノ免公園', '下作延南こども公園', '○○邸', '□□公園', '中山建設 南区 須賀邸', '桜ヶ丘', '岸邸', '齋藤邸', '港北ガーデンホームズ'];
function flatSites(sg) {
  const out = [];
  const walk = v => { if (Array.isArray(v)) v.forEach(x => typeof x === 'string' ? out.push(x) : walk(x)); else if (v && typeof v === 'object') Object.values(v).forEach(walk); };
  walk(sg); return Array.from(new Set(out.filter(Boolean)));
}
function masterSites() {
  const m = lsGet('nippou_masters', null), f = lsGet(LS.me + '_sites', null);
  let list = (f && f.length) ? f : (m && m.siteGroups ? flatSites(m.siteGroups) : []);
  if (!list.length && DEMO) list = DEMO_SITES;
  return Array.from(new Set(list.concat(CAL.sites.map(s => s.title))));
}
function siteKey(s) { return norm(s).replace(/[のノヶケが]/g, ''); }   // 溝の口／溝口、桜ヶ丘／桜ケ丘 などのゆれを吸収
function bigrams(s) { const k = siteKey(s), o = []; for (let i = 0; i < k.length - 1; i++) o.push(k.slice(i, i + 2)); return o; }
const GENERIC_BG = new Set(['公園', '緑地', '小学', '学校', '中学', '保育']);
function siteScore(text, site) {   // 現場名の2文字ずつのうち、話の中に出てくる割合（「公園」だけの一致は数えない）
  const tb = new Set(bigrams(text)), sb = bigrams(site);
  if (!sb.length) return 0;
  const hit = sb.filter(b => tb.has(b)), strong = hit.filter(b => !GENERIC_BG.has(b));
  return strong.length ? hit.length / sb.length : 0;
}
function bestSite(text, list) {
  let best = null, score = 0;
  (list || masterSites()).forEach(s => {
    const sc = siteKey(text).includes(siteKey(s)) ? 1 : siteScore(text, s);
    if (sc > score || (sc === score && best && s.length > best.length)) { best = s; score = sc; }
  });
  return score >= 0.5 ? { site: best, exact: score === 1, score } : null;
}
function siteIn(s, date) {
  const near = CAL.sites.filter(x => !date || x.date === date).concat(CAL.sites);
  for (const ev of near) {
    const parts = ev.title.split(/[\s　]+/).filter(p => p.length >= 2);
    if (parts.some(p => s.includes(p))) return { site: ev.title, exact: true };
  }
  const b = bestSite(s);
  if (b) return b;
  const m = s.match(/([^\s、。はのでにをとが]{1,10}?(?:邸|公園|緑地|団地|小学校|中学校|保育園|ハイツ|マンション|霊園|寺))/);
  if (!m || /^(朝|昼|夕方|この|その|あの|次の|同じ|別の|他の|近くの|前の)/.test(m[1]) || m[1].length < 3) return null;
  return { site: m[1], exact: true };
}

/* ---- 人：名簿の名前・呼び名（あだ名）・〜くん／さん／ちゃん ---- */
let NICK = [];   // [{name, nickname}]。name が OUTSIDE のものは「スタッフではない人」（業者・お店・お客さんなど）
const OUTSIDE = '（社外）';
const bareName = w => String(w || '').trim().replace(/(さん|くん|君|ちゃん|っち|氏)$/, '');
/* 取引先（竹屋さん＝〇〇竹材店 など）：正式名・呼び方で照合。取引先の店・人はスタッフではない */
const supNames = s => [s.name, s.kana].concat(String(s.aliases || '').split(/[、,，]/)).map(x => String(x || '').trim()).filter(Boolean);
function supplierOf(word) {
  const w = bareName(String(word || '').replace(/(で|に|へ|まで|から|の)$/, '')); if (!w) return null;
  return SUP.find(s => supNames(s).some(n => norm(bareName(n)) === norm(w))) || null;
}
function supText() { return SUP.map(s => s.name + (s.aliases ? '：' + String(s.aliases).split(/[、,，]/).map(x => x.trim()).filter(Boolean).join('・') : '') + (s.kind ? '（' + s.kind + '）' : '')).join('\n'); }
/* 車両：使用中のもの（レンタルは期間中・期間未定のもの） */
function activeVehicles(date) {
  const d = date || TODAY;
  return VEH.filter(v => (!v.status || v.status === '使用中') && (v.ownership !== 'レンタル' || ((!v.rentalFrom || v.rentalFrom <= d) && (!v.rentalTo || v.rentalTo >= d))));
}
function vehText() { return activeVehicles().map(v => v.name + (v.aliases ? '：' + String(v.aliases).split(/[、,，]/).map(x => x.trim()).filter(Boolean).join('・') : '') + (v.ownership === 'レンタル' ? '（レンタル' + (v.rentalTo ? '・' + md(v.rentalTo) + '返却' : '') + '）' : '')).join('\n'); }
function vehicleOf(word) {
  const w = norm(word); if (!w) return null;
  return VEH.find(v => [v.name].concat(String(v.aliases || '').split(/[、,，]/)).some(n => n && norm(n) === w)) || null;
}
const daysTo = s => Math.round((parseYmd(s) - parseYmd(TODAY)) / 86400000);
function vehicleAlerts() {   // 車検・保険・レンタル返却が近い車（車両アプリの登録から自動で出す）
  const out = [];
  VEH.filter(v => !v.status || v.status === '使用中').forEach(v => {
    const add = (label, date, soon) => { if (!date) return; const n = daysTo(date); if (n <= soon) out.push({ v, n, text: '🚚 ' + v.name + '：' + label + ' ' + md(date) + (n < 0 ? '（' + (-n) + '日過ぎています）' : n === 0 ? '（今日）' : '（あと' + n + '日）') }); };
    if (v.ownership === 'レンタル') add('返却', v.rentalTo, 3); else { add('車検', v.shakenDate, 30); add('保険', v.insuranceDate, 30); add('年次点検', v.inspectDate, 30); }
  });
  return out.sort((a, b) => a.n - b.n);
}
function isOutside(word) {
  const w = String(word || '').trim(); if (!w) return false;
  if (supplierOf(w)) return true;
  return NICK.some(x => x.name === OUTSIDE && (norm(x.nickname) === norm(w) || norm(bareName(x.nickname)) === norm(bareName(w))));
}
function personOf(word) {
  const w = String(word || '').trim(); if (!w || isOutside(w)) return '';
  if (STAFF.includes(w)) return w;
  const staffNick = NICK.filter(x => x.name !== OUTSIDE);
  const n = staffNick.find(x => norm(x.nickname) === norm(w)); if (n) return n.name;
  const bare = bareName(w);
  if (STAFF.includes(bare)) return bare;
  const n2 = staffNick.find(x => norm(x.nickname) === norm(bare)); return n2 ? n2.name : '';
}
function rosterText() {
  const outs = NICK.filter(x => x.name === OUTSIDE).map(x => x.nickname);
  return STAFF.map(n => { const ns = NICK.filter(x => x.name === n).map(x => x.nickname); return n + (ns.length ? '（' + ns.join('・') + '）' : ''); }).join('、') +
    (outs.length ? '\nスタッフではない人（業者・お店・お客さんなど。メンバーにも unknownPeople にも入れない）：' + outs.join('、') : '');
}
function peopleIn(clause) {   // 文の中の人：名簿の名前・登録済みの呼び名・〜くん等。分からない呼び名は unknown へ
  const found = [], unknown = [];
  STAFF.forEach(n => { if (clause.includes(n)) found.push(n); });
  NICK.forEach(x => { if (x.name !== OUTSIDE && clause.includes(x.nickname) && !found.includes(x.name)) found.push(x.name); });
  // 呼び名は「漢字・カタカナ1〜3文字」か「文頭・区切りの後のひらがな2〜3文字」＋くん／ちゃん（「取りは開くん」のような取りすぎを防ぐ）
  const nickRe = /(?:([\u4e00-\u9fff\u30a1-\u30fa]{1,3})|(?:^|[\s、。])([\u3041-\u3096]{2,3}))(くん|君|ちゃん)/g;
  Array.from(clause.matchAll(nickRe)).map(m => (m[1] || m[2]) + m[3]).forEach(w => {
    if (isOutside(w)) return;
    const p = personOf(w); if (p) { if (!found.includes(p)) found.push(p); } else if (!unknown.includes(w)) unknown.push(w);
  });
  return { found, unknown };
}

function qtyAfter(text, pos) {
  const m = text.slice(pos).match(/^[^\d一二三四五六七八九十、。]{0,6}?(\d+|[一二三四五六七八九十]+)\s*(本|個|束|枚|台|袋|丁|足|株|m|メートル|つ|kg|キロ)?/);
  if (!m) return { qty: '', unit: '' };
  const q = /^\d+$/.test(m[1]) ? Number(m[1]) : (m[1].length === 1 ? KNUM[m[1]] : (m[1] === '十' ? 10 : (KNUM[m[1][0]] || 1) * 10 + (KNUM[m[1][1]] || 0)));
  return { qty: q, unit: m[2] || '' };
}
function findItems(clause) {   // 文の中の道具・資材を長い言葉から順に拾う（聞き間違いの呼び方は使わない）
  const raw = clause.normalize('NFKC'), used = new Array(raw.length).fill(false), found = [];
  toolWords(false).forEach(x => {
    const w = x.w.normalize('NFKC'); let from = 0, i;
    while ((i = raw.indexOf(w, from)) >= 0) {
      from = i + 1;
      if (used.slice(i, i + w.length).some(Boolean)) continue;
      const after = raw.slice(i + w.length);
      if (/^(屋|やさん|で|に|へ|まで|行)/.test(after) && w.length <= 2) continue;   // 「竹屋で」などは場所
      const q = qtyAfter(raw, i + w.length);
      if (w.length === 1 && !q.qty) continue;   // 1文字の言葉（竹 など）は数が続くときだけ
      for (let k = i; k < i + w.length; k++) used[k] = true;
      found.push({ pos: i, surface: x.w, termId: x.termId, qty: q.qty, unit: q.unit });
    }
  });
  return found.sort((a, b) => a.pos - b.pos);
}

/* ============ お試し用の簡易整理（本番はAI） ============ */
function demoOrganize(text, spokenAt, fixed) {
  const base = spokenAt.slice(0, 10), hour = Number(spokenAt.slice(11, 13)), speaker = me();
  const cards = [];
  const blank = (kind, date, site, title) => ({ kind, date, dateNote: '', site, title, meetTime: '', members: [], vehicle: '', stops: [], items: [], steps: [], notes: [], unresolved: [], unknownPeople: [], corrections: [] });
  const get = (date, site) => {
    let c = cards.find(x => x.kind === 'site' && x.date === date && x.site === site);
    if (!c && site) { c = cards.find(x => x.kind === 'site' && x.date === date && !x.site); if (c) c.site = site; }
    if (!c) { c = blank('site', date, site, ''); cards.push(c); }
    return c;
  };
  let curDate = fixed ? fixed.date : (hour >= 12 ? addDays(base, 1) : base), curSite = fixed ? fixed.site : '';
  let cur = get(curDate, curSite), task = null;
  const clauses = text.normalize('NFKC').split(/[、。\n,.!?！？]+/).map(s => s.trim()).filter(s => s.length > 1);
  clauses.forEach(cl => {
    if (!fixed && /お知らせ|みんなに(伝え|言っ|知らせ|周知)|周知/.test(cl)) { cards.push(blank('notice', '', '', cl.replace(/^(あと|それと|で)+/, '').replace(/(って)?(みんなに)?(お知らせ|伝えて|周知)(しておいて|して|おいて)?(ください)?$/, '').trim())); return; }
    const d = fixed ? null : dateIn(cl, base);
    // 現場のない用事（残土・処分など）は「やること」カードに
    if (!fixed && /今日/.test(cl) && /(出た|やった|終わった|行った)(?:$|けど|から|ので)/.test(cl) && !/明日|明後日/.test(cl)) return;   // 今日の報告（予定ではない）は飛ばす
    const isTask = /残土|処分|捨てに|捨て場|捨てる場所|ゴミ出し|根株|ねかぶ|抜根したもの/.test(cl);
    const aboutTask = task && /捨て|積載|軽トラ|ダンプ|厳しければ|無理なら|残土|山町/.test(cl);
    if (!fixed && (isTask || aboutTask)) {
      if (!task) { task = blank('task', d || curDate, '', /残土/.test(cl) ? '残土処分' : '処分'); cards.push(task); }
      if (d) task.date = d;
      if (/厳しければ|無理なら|どこかで|空いたら|都合/.test(cl)) task.dateNote = '都合がつかなければ別の日';
      const ppl = peopleIn(cl); ppl.unknown.forEach(u => { if (!task.unknownPeople.includes(u)) task.unknownPeople.push(u); });
      if (/軽トラ/.test(cl) && /ダンプ/.test(cl)) task.vehicle = '軽トラ（積載オーバーなら' + ((cl.match(/(\d)\s*(?:t|トン)\s*ダンプ/) || [])[1] ? cl.match(/(\d)\s*(?:t|トン)\s*ダンプ/)[1] + 't' : '') + 'ダンプ）';
      else { const vh = cl.match(/(\d\s*(?:t|トン))?\s*(ダンプ|軽トラ)/); if (vh && !task.vehicle) task.vehicle = vh[0].replace(/\s/g, '').replace('トン', 't'); }
      if (/捨てる場所|捨て場|どこに捨て|聞いて/.test(cl) || /抜根|根株|ねかぶ|振/.test(cl)) task.notes.push(cl.replace(/^(あと|それと|で|あ)+/, '').trim());
      if (/抜根|根株|ねかぶ/.test(cl)) { const sm = bestSite(cl); if (sm) task.title = sm.site + 'の残土処分'; }
      return;
    }
    if (!fixed) {
      const s = siteIn(cl, d || curDate);
      const help = cl.match(/([^\s、。はのでにを]{1,6}?)から.*応援/);
      if (d && d !== curDate) { curDate = d; curSite = ''; task = null; }
      if (s) { curSite = s.site; task = null; }
      else if (help) { curSite = help[1] + ' 応援'; task = null; }
      if (d || s || help) {
        cur = get(curDate, curSite);
        if (s && !s.exact && !cur.corrections.some(x => x.includes(s.site))) cur.corrections.push('話の中の言葉から「' + s.site + '」と読みました（聞き間違いかもしれません）');
      }
    }
    // 人：「全員」「私以外」「他の人」は名簿から（休みの人は除く）
    const off = offNames(curDate);
    if (/全員|みんなで/.test(cl) && !/聞いて/.test(cl)) {
      const except = /私以外|俺以外|自分以外/.test(cl) ? [speaker] : [];
      STAFF.filter(n => !except.includes(n) && !off.includes(n)).forEach(n => { if (!cur.members.includes(n)) cur.members.push(n); });
      off.forEach(n => { const note = n + 'さんは休み（カレンダー）'; if (!except.includes(n) && !cur.notes.includes(note)) cur.notes.push(note); });
    }
    if (/^(朝)?(私|俺)が|私が|俺が/.test(cl) && speaker && !cur.members.includes(speaker)) cur.members.push(speaker);
    const ppl = peopleIn(cl);
    ppl.found.forEach(n => { if (!cur.members.includes(n)) cur.members.push(n); });
    ppl.unknown.forEach(u => { if (!cur.unknownPeople.includes(u)) cur.unknownPeople.push(u); });
    if (/体調|戻ったら|来られたら/.test(cl)) cur.notes.push(cl.replace(/^(あと|それと|で|あ|他の人で)+/, '').trim());
    const tm = cl.match(/(\d{1,2})時(半)?/); if (tm && /集合|出発|出る|待ち合わせ|時に/.test(cl + '時に')) cur.meetTime = tm[1] + ':' + (tm[2] ? '30' : '00');
    const vh = cl.match(/(2t|4t|2トン|4トン)?(ダンプ|軽トラ|ユニック|パッカー|キャラバン|高所作業車|クレーン)/); if (vh && !/手配/.test(cl)) cur.vehicle = vh[0];
    const items = findItems(cl);
    const isFix = /やっぱ|いや|じゃなくて|訂正|やっぱり/.test(cl);
    // 立ち寄り先：「○○屋で」「○○さんとこで」、または「○○で〜買って／もらって」
    const pm = cl.match(/([^\s、。]{1,14}?(?:屋|センター|店|さんとこ|さんち|資材|園芸))(?:で|に|へ)/) || cl.match(/([^\s、。]{1,14})(?:で|に|へ)(?=[^でにへ]*(買|もら|受け取|仕入|寄|拾))/);
    let place = pm ? pm[1].replace(/^(その前に|その後|あと|それと|で|あ|まず|最初に|帰りに|行きに|朝|ついでに|は)+/, '').trim() : '';
    if (place && (STAFF.some(n => place.includes(n)) || bestSite(place))) place = '';
    if (place) {
      let stop = cur.stops.find(s => s.place === place);
      if (!stop) { stop = { order: cur.stops.length + 1, place, items: [], done: false }; cur.stops.push(stop); }
      const got = cl.match(/([^\s、。でにをはがの]{1,8}?)(?:を)?(?:もらって|もらう|受け取|買って|買う|仕入)/);
      if (got && !items.some(it => got[1].includes(it.surface))) stop.items.push({ name: got[1], qty: '', unit: '', done: false });
      items.forEach(it => stop.items.push({ name: it.surface, termId: it.termId, qty: it.qty, unit: it.unit, done: false }));
    } else {
      items.forEach(it => {
        if (isFix) {   // 言い直し：前に出てきた同じ物の数を直す（別の現場の話の途中でも）
          for (const c of cards.slice().reverse()) {
            const hit = c.stops.flatMap(s => s.items).find(x => x.termId === it.termId) || c.items.find(x => x.termId === it.termId);
            if (hit) { if (it.qty) { hit.qty = it.qty; hit.unit = it.unit || hit.unit; } return; }
          }
        }
        const ex = cur.items.find(x => x.termId === it.termId);
        if (ex) { if (it.qty) { ex.qty = it.qty; ex.unit = it.unit; } }
        else cur.items.push({ name: (termById(it.termId) || {}).term || it.surface, termId: it.termId, qty: it.qty, unit: it.unit });
      });
    }
    STEP_WORDS.forEach(([re, lab]) => { if (re.test(cl) && !cur.steps.includes(lab)) cur.steps.push(lab); });
    if (/注意|気をつけ|危な|駐車|隣|近所|手配|忘れ|電線|通学|様子|見て決め|決めて|調整|段取りは|要請/.test(cl)) {
      const s = cl.replace(/^(あ|それと|あと|で)+/, '').replace(/(明日|今日|明後日|[月火水木金土日]曜(日)?の?)/g, '').replace(curSite, '').replace(/^(は|ですが)/, '').trim();
      if (s && !cur.notes.includes(s)) cur.notes.push(s);
    }
  });
  return cards.filter(c => c.site || c.title || c.items.length || c.stops.length || c.steps.length || c.notes.length || c.members.length);
}

/* ============ 整理結果の仕上げ（AI・お試し共通） ============ */
const holidaysOn = date => CAL.holidays.filter(h => h.date === date);
function offNames(date) {
  if (!date) return [];
  const hs = holidaysOn(date);
  if (hs.some(h => h.all)) return STAFF.slice();
  return STAFF.filter(n => hs.some(h => h.title.includes(n) || NICK.some(x => x.name === n && h.title.includes(x.nickname))));
}
function finalize(raw) {
  return raw.map(c => {
    if (c.kind === 'notice') {   // みんなへのお知らせ（予定ではない）。date は「いつまで表示するか」
      const t = String(c.title || (c.notes || []).join('\n')).trim();
      return { cardId: '', kind: 'notice', date: c.date || addDays(TODAY, 7), dateNote: '', site: '', title: t, eventId: '', meetTime: '', staff: [], vehicle: '', stops: [], items: [], steps: [], notes: [], rawText: '', unresolved: [], unknownPeople: [], fixes: [], _merge: '' };

  if (act === 'back') {
    let n = b.backQty == null || b.backQty === '' ? o.qty : Math.max(0, Number(b.backQty) || 0); if (o.kind !== KIND_USE) n = Math.min(o.qty, n);
    Object.assign(o, { backQty: n, backBy: b.by, backAt: nowStr() }); o.state = st(o);
    if (it) Object.assign(it, { loaded: true, backQty: n, returned: o.kind === KIND_USE ? n > 0 : n >= o.qty });
  }
  if (act === 'unback') { if (o) { Object.assign(o, { backQty: 0, backBy: '', backAt: '' }); o.state = st(o); } if (it) Object.assign(it, { returned: false, backQty: '' }); }
  if (act === 'vehicle') { if (it) it.vehicle = b.vehicle || ''; if (o) o.vehicle = b.vehicle || ''; }
  lsSet(LS.outs, all); if (card) lsSet(LS.cards, CARDS);
  return { ok: true, card, outs: all.filter(x => x.state === '持ち出し') };
}

/* ============ 名前・モーダル ============ */
const FALLBACK_STAFF = DEMO_STAFF;
/* 名前：①このアプリで選んだ名前 ②日報アプリで選んだ名前（同じサイトなら自動で引き継ぐ） */
function rawGet(k) { try { const v = localStorage.getItem(k); if (v == null) return ''; try { const j = JSON.parse(v); return typeof j === 'string' ? j : ''; } catch (e) { return v; } } catch (e) { return ''; } }
const me = () => lsGet(LS.me, '') || rawGet('nippou_author');
let STAFF_LIST = null, NAME_OPEN = false, AFTER_NAME = null;
function staffList() {
  if (STAFF_LIST && STAFF_LIST.length) return STAFF_LIST;
  const m = lsGet('nippou_masters', null); if (m && m.staff && m.staff.length) return m.staff;   // 日報アプリが覚えている名簿
  return lsGet(LS.me + '_staff', null) || FALLBACK_STAFF;
}
async function fetchStaff() {   // 名簿は裏で取る（10秒で打ち切り）。取れたら開いている名前画面を描き直す
  const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 10000);
  try {
    const r = await (await fetch(MASTERS_URL + '?action=masters', { cache: 'no-store', signal: ac.signal })).json();
    const s = (r.staff || []).map(x => typeof x === 'string' ? x : (x.name || x.staff || '')).filter(Boolean);
    if (r.siteGroups) lsSet(LS.me + '_sites', flatSites(r.siteGroups));   // 現場マスタ（聞き間違いの補正に使う）
    if (s.length) { STAFF_LIST = s; lsSet(LS.me + '_staff', s); if (NAME_OPEN && $('nmIn')) drawName(); if (typeof onStaff === 'function') onStaff(); }
  } catch (e) { /* 名簿が取れなくても手入力で進める */ } finally { clearTimeout(tm); }
}
function chooseName(force, then) {
  if (me() && !force) { if (then) then(); return; }
  AFTER_NAME = then || null; NAME_OPEN = true; drawName();
}
function drawName() {
  const typed = $('nmIn') ? $('nmIn').value : me();
  openModal('<h3>あなたの名前</h3><p class="hint" style="margin:4px 0 12px">最初の1回だけ選びます。</p>' +
    '<div class="chips" style="margin-bottom:12px">' + staffList().map(s => '<button type="button" class="chip" data-nm="' + esc(s) + '">' + esc(s) + '</button>').join('') + '</div>' +
    '<input type="text" id="nmIn" placeholder="一覧にないときは名前を入力" value="' + esc(typed) + '">' +
    '<div class="row2" style="margin-top:12px"><button class="btn" data-act="later">あとで</button><button class="btn primary" data-act="ok">決定</button></div>' +
    (me() ? '<button type="button" class="btn sm block" data-act="nick" style="margin-top:16px">👷 名簿の呼び名（あだ名）を見る・直す</button>' : ''),
    e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.act === 'nick') { NAME_OPEN = false; AFTER_NAME = null; return openNick(); }
      if (b.dataset.act === 'later') { NAME_OPEN = false; AFTER_NAME = null; closeModal(); return; }
      const v = b.dataset.nm || (b.dataset.act === 'ok' ? $('nmIn').value.trim() : '');
      if (!v) { if (b.dataset.act === 'ok') toast('名前を選ぶか入力してください'); return; }
      lsSet(LS.me, v); $('meBtn').textContent = '👤 ' + v; NAME_OPEN = false; closeModal();
      const t = AFTER_NAME; AFTER_NAME = null; if (t) t();
    });
}
function onStaff() { STAFF = staffList(); render(); }
let modalHandler = null, modalLocked = false;
function openModal(html, handler, locked) { $('modal').innerHTML = html; modalHandler = handler; modalLocked = !!locked; $('modalBg').classList.add('show'); $('modal').scrollTop = 0; }
function closeModal() { $('modalBg').classList.remove('show'); $('modal').innerHTML = ''; modalHandler = null; EDIT = null; }
$('modal').addEventListener('click', e => { if (modalHandler) modalHandler(e); });
$('modalBg').addEventListener('click', e => { if (e.target === $('modalBg') && !modalLocked) closeModal(); });

/* ============ イベント ============ */
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => { TAB = b.dataset.tab; document.querySelectorAll('nav.tabs button').forEach(x => x.classList.toggle('on', x === b)); ['plan', 'shop', 'load'].forEach(n => { $('tab-' + n).hidden = n !== TAB; }); window.scrollTo(0, 0); render(); }));
document.body.addEventListener('click', e => {
  if (e.target.closest('#modal')) return;
  const dy = e.target.closest('[data-day]'); if (dy) { SEL = dy.dataset.day; return render(); }
  const cd = e.target.closest('[data-card]'); if (cd) return openCard(cd.dataset.card);
  if (e.target.closest('[data-new-notice]')) return chooseName(false, () => newNotice());
  const ns = e.target.closest('[data-new-site]'); if (ns) return openCard(null, { cardId: '', date: SEL, site: ns.dataset.newSite, eventId: '', meetTime: '', staff: [], vehicle: '', stops: [], items: [], steps: [], notes: [], rawText: '' });
  const tm = e.target.closest('[data-timed]'); if (tm) return decideTimed(tm.dataset.timed, tm.dataset.v);
  const tu = e.target.closest('[data-timed-undo]'); if (tu) { const dec = lsGet(LS.timed, {}); (CAL.timed || []).filter(t => t.date === tu.dataset.timedUndo && dec[timedKey(t)] === 'no').forEach(t => delete dec[timedKey(t)]); lsSet(LS.timed, dec); applyTimed(); return render(); }
  const sh = e.target.closest('[data-shop]'); if (sh) return toggleShop(sh.dataset.shop);
  const ld = e.target.closest('[data-load]'); if (ld) return tapLoad(ld.dataset.load);
  const bk = e.target.closest('[data-back]'); if (bk) return tapBack(bk.dataset.back);
  const ob = e.target.closest('[data-outback]'); if (ob) return outBack(ob.dataset.outback);
  const vm = e.target.closest('[data-vmove]'); if (vm) return moveVeh(vm.dataset.vmove);
  const ex = e.target.closest('[data-extra]'); if (ex) return addExtra(ex.dataset.extra);
  if (e.target.closest('[data-homecheck]')) return homeCheck();
  if (e.target.closest('[data-goload]')) return document.querySelector('nav.tabs button[data-tab="load"]').click();
});
$('fab').addEventListener('click', () => chooseName(false, () => openSpeak()));
$('meBtn').addEventListener('click', () => chooseName(true));

(function init() {
  $('demoBar').hidden = !DEMO;
  if (me()) $('meBtn').textContent = '👤 ' + me();
  const p = new URLSearchParams(location.search);
  if (p.get('date')) SEL = p.get('date');
  if (showCached()) syncing(true);
  load().finally(() => syncing(false));
})();
</script>
</body>
